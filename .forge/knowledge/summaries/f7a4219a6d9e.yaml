what_changed:
  description: This run added a project-extensible sandbox capability model so projects
    can declare additional grants beyond shipped presets, and wired those declarations
    through config loading, CLI transport, runner transport, sandbox construction,
    and coordinator handling. It also documented the new input shape and added tests
    covering config parsing, capability composition, transport, and fail-closed behavior.
  approach: The change introduced typed configuration for sandbox capabilities, merged
    project-defined requirements with preset handling in the sandbox capability layer,
    propagated the resulting capability data through the CLI and runner interfaces,
    and updated dev-phase coordination to audit and refuse unsupported capability
    requests rather than silently proceeding.
  files_modified: *id002
