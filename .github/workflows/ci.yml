name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single supported interpreter. Widening multi-version support is a
        # one-line edit to this list — add the matching contexts to
        # GATE_CONTEXTS in scripts/apply-branch-protection.sh and re-apply
        # protection, or the new checks are never required.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Match the story gate, which provisions worktrees with .[all,dev]
        # (forge.yaml workspace.setup_command). Installing only .[dev] here left
        # the provider SDKs absent, so config load raised on any profile naming
        # an API provider and CI rejected work the story gate had passed — the
        # extras half of #1945.
        run: pip install -e ".[all,dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test
