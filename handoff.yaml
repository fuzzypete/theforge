dev_notes: |
  summary: "Added five diagnostic log points to AgentLoopManager.run() in runner_api.py to make DeepSeek churn diagnosable. (1) Loop start logs tool schema names at verbose level so we can confirm submit_review is in the schema. (2) Per-turn logs list tool call names at verbose level after each iteration. (3) Per-turn logs the first 200 chars of text_output (reasoning) at verbose level. (4) The iteration-limit nudge is now logged at normal (_log) level instead of _log_verbose so it appears in non-verbose runs. (5) When max iterations is reached, a summary is logged at normal level showing total and per-name tool call counts and whether any submit tool was ever called. All changes are additive diagnostics; no loop logic was altered."
  commits:
    - sha: "b5eb742"
      message: "feat(runner_api): add diagnostic logging to AgentLoopManager loop"
  acceptance_criteria:
    - criterion: "Tool schema names logged at verbose level when agent loop starts"
      status: MET
      notes: "run() now logs '[label] loop start: N tools: [names]' via _log_verbose before the while loop. tool_names extracted from both OpenAI-style {function: {name}} and flat {name} schema dicts."
    - criterion: "Per-turn tool call names logged at verbose level after each iteration"
      status: MET
      notes: "After iterations += 1, if turn.tool_calls is non-empty, logs '[label] iter N: M call(s): [names]' via _log_verbose. Counts are also accumulated into _tool_call_counts for the summary."
    - criterion: "Nudge delivery logged at normal level (not just verbose)"
      status: MET
      notes: "Line 597 _log_verbose replaced with _log. Message: '⚠ {label} approaching iteration limit ({iter}/{max}) — nudge sent'."
    - criterion: "Text reasoning snippets (first 200 chars) logged at verbose level"
      status: MET
      notes: "If turn.text_output is non-empty, logs '[label] iter N reasoning: \"<first 200 chars>\"' via _log_verbose."
    - criterion: "Iteration summary logged on max-iteration failure (tool call counts by name, whether submit tool was ever called)"
      status: MET
      notes: "After the while loop exhausts, logs '⚠ {label} max iterations (N): M tool calls [name:count, ...], submit never called / submit called' via _log before calling _finalize_or_timeout."
    - criterion: "All logging uses existing _log() and _log_verbose() — no new logging infrastructure"
      status: MET
      notes: "Only _log and _log_verbose (already imported from runner) are used. No new imports or logging setup."
    - criterion: "No functional changes to the agent loop — diagnostics only"
      status: MET
      notes: "All additions are read-only observations. No branching, return paths, or tool execution logic was changed."
    - criterion: "All existing tests pass"
      status: MET
      notes: "1041 tests pass (1035 pre-existing + 6 new diagnostic tests)."
  spec_deviations: none
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
