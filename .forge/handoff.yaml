dev_notes: "summary: >\n  Implemented auto-pull before worktree creation and behind-origin\
  \ check on resume.\n  Before creating a fresh worktree, `_create_workspace` now\
  \ runs\n  `git pull --ff-only origin <base_branch>` in the project root; if it fails\n\
  \  (non-ff, offline), a warning is logged and execution continues.\n  On resume/reuse\
  \ paths, `_check_behind_origin` runs a `git rev-list --count`\n  and logs an informational\
  \ note if the local base is behind origin (silently\n  skips on error). A `--no-pull`\
  \ flag threads from both CLIs (`forge run`,\n  `forge sprint run`) through engine.py\
  \ and sprint/runner.py into\n  `_create_workspace`, suppressing both the pull and\
  \ the behind-origin check.\n  The daemon's `_execute_sprint` also passes `no_pull`\
  \ from sprint_args.\n  All changes were already committed before this session; 10\
  \ new tests in\n  tests/test_coord_workspace.py cover the four acceptance criteria\
  \ plus\n  daemon integration.\ncommits:\n  - sha: \"8b11b7a\"\n    message: \"feat(workspace):\
  \ pull base branch before creating worktree, add --no-pull flag\"\nacceptance_criteria:\n\
  \  - criterion: \"Before creating a fresh worktree, run `git pull --ff-only origin\
  \ <base_branch>` in the project root\"\n    status: MET\n    notes: >\n      `_create_workspace`\
  \ runs the pull via `_cu._run_shell` before the\n      create_command when `no_pull=False`.\
  \ Tested by\n      TestFreshWorkspacePull::test_pull_succeeds_before_create (asserts\
  \ pull\n      precedes create in call_order).\n  - criterion: \"If the pull fails\
  \ (non-fast-forward, offline, no remote), log a warning and continue — do not block\
  \ the run\"\n    status: MET\n    notes: >\n      On pull failure, `_create_workspace`\
  \ calls `_cu._log` with a warning\n      (\"pull failed (non-ff / offline): ...\"\
  ) and falls through to workspace\n      creation. Tested by test_pull_fails_workspace_still_created.\n\
  \  - criterion: \"On resume (reusing an existing worktree), skip the pull but log\
  \ a one-line note if base_branch is behind origin (informational only)\"\n    status:\
  \ MET\n    notes: >\n      `_check_behind_origin` runs `git rev-list --count base..origin/base`\
  \ and\n      logs an info note when count > 0. Called from all three resume paths\
  \ in\n      `_create_workspace` when `no_pull=False`. Silently skips on rev-list\n\
  \      failure. Tested by TestBehindOriginCheck and TestResumeNoPull.\n  - criterion:\
  \ \"A --no-pull CLI flag on `forge run` and `forge sprint run` suppresses the pull\
  \ entirely\"\n    status: MET\n    notes: >\n      `--no-pull` registered in both\
  \ `cli/run.py` and `cli/sprint.py`,\n      threaded through `engine.run_task/run_from_dev/run_from_review`\
  \ and\n      `sprint/runner.run_sprint/_run_single_story`, passed as `no_pull=True`\n\
  \      to `_create_workspace`. Also passed by daemon's `_execute_sprint`.\n    \
  \  Tested by test_no_pull_skips_pull, test_no_pull_skips_behind_origin_check_on_reuse,\n\
  \      TestDaemonNoPull.\nstory_deviations: none\ndeferred_items: none\ngate_result:\
  \ PASS\n"
gate_decision: PASS
