    Pre-scan builds dependent_slugs set (cached TaskSpec objects to avoid double I/O);
    effective_auto_merge computed per spec as auto_merge or (task.slug in dependent_slugs);
    missing-deps block uses continue instead of break+inner-loop.
    Iter 1 review fix: resume mode 'skip' triage (prior APPROVE) now adds slug to
    merged_slugs so downstream dependents are not incorrectly skipped."
