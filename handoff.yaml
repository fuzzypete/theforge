dev_notes: |
  summary: "Added --plan-model CLI flag to forge run, mirroring --dev-model. Implemented
    _apply_plan_model_override in cli.py which accepts 'model' or 'provider/model' format
    and applies dataclasses.replace on config.plan to set model_name. Wired it into cmd_run
    after the dev-model override block. Added --plan-model argument to the run_parser. Added
    TestApplyPlanModelOverride test class with four tests covering short model name, provider/model
    format, no-op when flag absent, and preservation of other plan fields."
  commits:
    - sha: "4c66b4b"
      message: "feat(cli): add --plan-model CLI override for runtime planner selection"
  acceptance_criteria:
    - criterion: "--plan-model opus overrides the plan agent model"
      status: MET
      notes: "_apply_plan_model_override sets plan.model_name='opus'; applied in cmd_run when args.plan_model is set"
    - criterion: "--plan-model provider/model works like --dev-model format"
      status: MET
      notes: "spec with '/' splits on first slash; model portion set as model_name (e.g. 'anthropic/claude-opus-4-6' → model_name='claude-opus-4-6')"
    - criterion: "Original plan config preserved when flag not used"
      status: MET
      notes: "Override only applied when getattr(args, 'plan_model', None) is truthy; tested in test_original_plan_config_preserved_when_flag_absent"
    - criterion: "Works with forge run (not needed for forge sprint)"
      status: MET
      notes: "--plan-model added only to run_parser, not sprint_parser"
    - criterion: "All existing tests pass"
      status: MET
      notes: "1376 tests pass"
    - criterion: "New test for the override application"
      status: MET
      notes: "TestApplyPlanModelOverride class with 4 tests added to tests/test_cli.py"
  story_deviations: none
  deferred_items: none
  gate_result: PASS
