what_changed:
  description: Preserved-story reporting was changed so operator-facing surfaces name
    the command that exits the state, and the controller runbook was updated to document
    the preserved outcome alongside other sprint results. The implementation also
    made the guidance source-aware so issue-backed and file-backed stories render
    different concrete recovery commands.
  approach: The run introduced shared preserved-state command rendering, threaded
    that guidance through launch-time output, runner logs, and status rendering, and
    added coverage for live, completed, grouped, issue-backed, and file-backed preserved
    cases while aligning runbook text with runtime output.
  files_modified: *id001
what_was_learned:
- claim: Preserved-state guidance has to be generated from story source context; a
    single generic command form is not executable across both issue-backed and file-backed
    stories.
  evidence:
  - type: review_finding
    finding_id: d74a367d4bc1862d
    description: This finding records that guidance using a story-file argument was
      unrunnable for GitHub issue-backed stories.
  - type: review_finding
    finding_id: 28c14704d57fa6e0
    description: This finding shows that even for file-backed stories, placeholder
      guidance was incomplete when the concrete path was already known.
  - type: file
    path: src/theforge/sprint/preserved_resume.py
    description: This module was added to centralize preserved-state resume/review
      command rendering from story context.
- claim: Preserved-state messaging must be updated on every reporting surface, because
    launch output, live status, completed status, and runner logs each have distinct
    rendering paths that can drift.
  evidence:
  - type: review_finding
    finding_id: 077aa3e9f9853fd6
    description: This finding identifies a completed-status path that still rendered
      bare PRESERVED after other paths had changed.
  - type: review_finding
    finding_id: 3385705b0fddcc8f
    description: This finding identifies runner-log output as a separate path that
      still emitted placeholder guidance.
  - type: review_finding
    finding_id: fbf8c92757467fe5
    description: This finding shows launch-triage stderr had its own reporting path
      and could diverge from runner behavior.
  - type: file
    path: src/theforge/sprint/status_reader.py
    description: Status rendering was one of the updated surfaces.
  - type: file
    path: src/theforge/sprint/runner.py
    description: Runner logging was separately updated for preserved-story guidance.
  - type: file
    path: src/theforge/sprint/launch_guard.py
    description: Launch-time preservation reporting was separately updated.
- claim: Grouped preserved output is not just formatting; when multiple preserved
    stories are collapsed into one line, the recovery command can lose required per-story
    arguments and become unusable.
  evidence:
  - type: review_finding
    finding_id: 60894dcb69ccee0b
    description: This finding records that grouped launch-time PRESERVED output emitted
      forge review without a specific story source and failed at execution.
  - type: file
    path: src/theforge/sprint/launch_guard.py
    description: Launch guard was the component responsible for grouped preservation
      reporting.
  - type: file
    path: tests/test_sprint_reexec_collision.py
    description: Test coverage was added in the area that exercised launch-time preserved-story
      output behavior.
- claim: Runtime preserved-state wording and runbook documentation can diverge during
    iteration, so documentation needs tests or explicit synchronization with the command
    text emitted by the product.
  evidence:
  - type: review_finding
    finding_id: 9c07a6e23123bdab
    description: This finding records that the runbook still documented the old resume
      command after runtime guidance changed.
  - type: review_finding
    finding_id: 77a5519a018795c5
    description: This finding records that the runbook's file-backed example still
      differed in shape from runtime output.
  - type: review_finding
    finding_id: e90e507f11b470b9
    description: This finding notes that the test pinning runbook wording lived in
      an unexpected module, highlighting the synchronization problem.
  - type: file
    path: docs/guides/controller-runbook.md
    description: The runbook was updated to describe the preserved state and its resolving
      commands.
- claim: Manifest slug overrides affect preserved-story recovery guidance, because
    commands that reconstruct a default issue workspace can point at the wrong preserved
    worktree when the preserved slug differs from the canonical issue slug.
  evidence:
  - type: review_finding
    finding_id: 388a726ef9bd09be
    description: This finding records that issue-backed preserved guidance selected
      the default issue workspace instead of the preserved custom-slug workspace.
  - type: file
    path: src/theforge/cli/sprint.py
    description: CLI launch handling was involved in manifest-mode slug and canonical-reference
      processing.
  - type: file
    path: tests/test_story_sources.py
    description: Story-source coverage was extended in the area relevant to source-specific
      preserved guidance.
learned_patterns:
- source-aware-command-rendering
- multi-surface-state-reporting
- doc-runtime-guidance-sync
- per-story-guidance-not-grouped
