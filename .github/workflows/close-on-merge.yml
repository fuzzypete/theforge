name: Close story issue on merge

# Stories merge into release/* (a non-default branch). GitHub's native
# "Closes #N" keyword only closes an issue when the PR merges into the DEFAULT
# branch (main), so story issues never auto-close. This replicates that
# behavior for release branches: on a merged PR, close the issues its body
# references. (#1651)
#
# Event-scoped, NOT a sweep: it reads only the single PR in the event payload
# (github.event.pull_request) and closes the issues that PR's body references.
# It never enumerates the repository's open issues.
#
# Decoupled from forward-port.yml by design: that triggers on `push`, this on
# `pull_request closed` — separate workflows, no shared logic. A story issue
# closes when the story merges to its base branch, NOT when its content later
# reaches main.
#
# Every referenced issue closes on merge, `bug`-labeled or not (#2067 reverted).
#
# An earlier revision held bug issues open with a `verify-symptom` label on the
# grounds that a merge is not an observation of the symptom stopping. That is
# true and it was still the wrong trade: reviewers already verify symptom
# resolution before a story merges, so the observation has happened by this
# point. Holding the issue open past it created a state with an inflow and no
# outflow — nothing removed the label or closed the issue — and the resulting
# always-open bugs silently disabled merge detection, which keyed off issue
# closure (#2111).
#
# The policy this restores: close at merge with whatever testing dev could do,
# and if the symptom is later observed to persist, that is a new regression bug
# carrying fresh evidence — which is better material than a months-old issue
# held open waiting for someone to confirm it.

on:
  pull_request:
    types: [closed]
    branches: ["release/**"]

permissions:
  contents: read
  issues: write

jobs:
  close-referenced-issues:
    # Only merged PRs; a PR closed without merging is a no-op.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Checked out so the spike closure guard runs from source rather than
      # being restated in bash: the rule has one implementation (#2600).
      - uses: actions/checkout@v4
      - name: Close issues referenced by the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONPATH: src
          # Passed via env (not inline ${{ }}) so a hostile PR body cannot
          # inject shell — it is only ever read as data, never evaluated.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract issue numbers that follow a closing keyword (the same set
          # GitHub honors on the default branch), case-insensitive.
          nums=$(printf '%s\n' "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -u)

          if [ -z "$nums" ]; then
            echo "PR #$PR_NUMBER references no closing keywords; nothing to close (by design)."
            exit 0
          fi

          for n in $nums; do
            info=$(gh issue view "$n" --repo "$REPO" --json state 2>/dev/null || echo "")
            if [ -z "$info" ]; then
              echo "#$n not found or unreadable; skipping."
              continue
            fi
            state=$(printf '%s' "$info" | jq -r .state)

            case "$state" in
              OPEN)
                # A spike has exactly two legal exits, and a merged PR is
                # neither of them. The guard passes every non-spike through
                # unchanged; for a spike it demands a recorded outcome (#2600).
                if ! refusal=$(python3 -m theforge.spike_guard "$n" 2>&1 >/dev/null); then
                  echo "Not closing #$n: $refusal"
                  note=$(printf 'Merged PR #%s did not close this issue.\n\n%s' \
                    "$PR_NUMBER" "$refusal")
                  gh issue comment "$n" --repo "$REPO" --body "$note"
                  continue
                fi
                echo "Closing #$n (referenced by merged PR #$PR_NUMBER)"
                gh issue close "$n" --repo "$REPO" \
                  --comment "Closed by merged PR #$PR_NUMBER."
                ;;
              CLOSED)
                echo "#$n already closed; skipping (idempotent with the sprint's synchronous close)."
                ;;
              *)
                echo "#$n not found or unreadable; skipping."
                ;;
            esac
          done
