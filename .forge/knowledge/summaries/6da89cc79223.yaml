what_changed:
  description: This run added a knowledge-uptake reporting path that compares injected
    prior-run claims with review findings using exposure, timing, eligibility, correspondence,
    and reporting metadata. It also extended audit records and CLI/report rendering
    so single-run missed-uptake observations can be recorded and displayed.
  approach: The change threaded claim-level exposure provenance and finding timestamps
    through coordinator and manifest/audit storage, then computed deterministic claim-to-finding
    correspondence with explicit eligibility rules and method metadata, and finally
    rendered the resulting uptake report through stored records and CLI surfaces.
  files_modified: *id002
what_was_learned:
- claim: Run-level gating for claim/finding comparison is insufficient; eligibility
    must be evaluated against each finding's author and timestamp, or post-finding
    claim exposures will be misreported as compared-but-unmatched instead of ineligible.
  evidence:
  - type: review_finding
    finding_id: 8327f10315a64f3b
    description: The review found that a dev claim rendered only after a finding was
      recorded still caused the run to count an eligible claim and classify the finding
      as unmatched, demonstrating that eligibility cannot be decided once per run
      and must account for per-finding temporal ordering.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 explicitly localized the defect to temporal eligibility being
      counted at the run level before finding times were considered, showing the failure
      mode future work must avoid.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 confirmed the fix by reporting that late-only dev claims
      now produce no correspondence rather than compared-and-unmatched output, validating
      the per-finding eligibility interpretation.
  - type: file
    path: src/theforge/knowledge_uptake.py
    description: This is the correspondence engine named by the finding; its revision
      is the mechanism by which eligibility moved from coarse run-level counting to
      logic that can suppress correspondence when only post-finding claims exist.
- claim: When introducing a derived report whose meaning depends on classifier behavior,
    the record must carry method identity, version, and validation status so later
    readers can interpret figures after the matching logic changes.
  evidence:
  - type: plan_step
    step_id: '4'
    description: The plan reserved a dedicated step for storing method metadata and
      labelled agreement data, showing that interpretability across future method
      revisions was treated as part of the feature rather than optional documentation.
  - type: file
    path: docs/knowledge-uptake-labels.yaml
    description: A stored labelled example set was added specifically to anchor agreement
      measurement for correspondences, non-correspondences, and excluded cases, demonstrating
      that report outputs are tied to an explicit validation corpus.
  - type: file
    path: src/theforge/knowledge_uptake.py
    description: The core uptake computation file is where correspondence decisions
      and method provenance are assembled together, showing that report figures are
      emitted with attached decision-method context rather than as standalone counts.
