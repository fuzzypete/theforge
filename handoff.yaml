        'story written'"
    - criterion: "Backward compatibility: old key names in forge.yaml and sprint
        manifests still work (with deprecation warning in logs)"
      status: MET
      notes: "load_sprint_manifest accepts specs: with a deprecation warning;
        validate_review_yaml and validate_dev_handoff accept both old and new
        YAML keys; hook payload emits both story and spec fields"
    - criterion: "All existing tests pass (updated to reflect new names)"
      status: MET
      notes: "1167 tests pass; test_spec_validator.py renamed to
        test_story_validator.py; all test helpers and assertions updated"
    - criterion: "CLAUDE.md conventions reference 'story' not 'spec'"
      status: MET
      notes: "story_compliance in review YAML example; stale 'rename is planned'
