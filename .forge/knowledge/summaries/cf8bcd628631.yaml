what_changed:
  description: The run unified readiness/admission decisions around a single verdict
    path so the same shape_check result no longer yields conflicting answers across
    scheduling, grooming, CLI, and queue surfaces. It also adjusted verdict precedence
    so blocking structural findings are not masked by lower-priority lifecycle-style
    outcomes.
  approach: The change centered decision-making in shape_check verdict derivation,
    then rewired downstream admission and rendering surfaces to consume that shared
    result instead of performing separate reductions over the same reasons. Review-driven
    refinement focused on precedence ordering within verdict derivation where multiple
    findings coexist.
  files_modified: *id002
what_was_learned:
- claim: When multiple findings can apply to one document, verdict derivation must
    prioritize blocking structural conditions before lifecycle or advisory-style classifications;
    otherwise a narrower code-specific outcome can hide the state that should govern
    operator and scheduler behavior.
  evidence:
  - type: review_finding
    finding_id: a5cc1de378890eb2
    description: Review reported that a document with both a blocking structural finding
      and diagnosis_cause_unknown was surfaced only as diagnosis_cause_unknown, demonstrating
      that code-based precedence alone can suppress the controlling blocking condition
      when multiple reasons coexist.
  - type: review_cycle
    cycle: '2'
    description: Approval notes explicitly cite that the P1 was fixed by consulting
      _BLOCKING_PRECEDENCE before lifecycle refusals, showing that precedence order
      among reason classes was the mechanism that determined whether the correct governing
      state emerged.
  - type: file
    path: src/theforge/shape_check/verdict.py
    description: This is the decision point where reason codes are reduced into a
      single verdict; the review discussion tied the incorrect result to ordering
      in this reducer, evidencing that future changes here must account for mixed
      blocking and non-blocking findings.
- claim: 'Collapsing distinct concerns such as readiness refusal and work-routing
    guidance into one verdict enum creates a maintenance hazard: simplifying to a
    shared readiness answer can silently erase specific operator-facing routes unless
    those semantics are preserved separately.'
  evidence:
  - type: review_finding
    finding_id: c052d308eb6d3f30
    description: Review flagged that implementation-plan content stopped producing
      the specific adr_candidate route and fell back to a generic needs_operator_action
