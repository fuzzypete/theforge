what_changed:
  description: The run changed workspace dirt precondition handling so sprint-generated
    bookkeeping artifacts no longer cause story entry or landing refusal, and refactored
    publication paths for those artifacts. It also documented the operator-visible
    behavior and troubleshooting shape for the workspace refusal case.
  approach: The change introduced a shared artifact-aware classification for story-run
    audit and knowledge outputs, applied that classification anywhere workspace cleanliness
    gates story progress, and simplified publication state handling so those artifacts
    are reconciled through the same path rather than treated as ordinary operator
    dirt.
  files_modified: *id002
what_was_learned:
- claim: When a system both writes shared run artifacts and performs early workspace-cleanliness
    refusals, the early refusal must use the same artifact-tolerant predicate as later
    landing-time checks; otherwise concurrency turns bookkeeping into a separate failure
    mode that rejects work that would otherwise succeed.
  evidence:
  - type: review_cycle
    cycle: '1'
    description: The approving review explicitly called out that entry, resume, sprint-entry,
      and merge-time landing checks now share the same artifact-tolerant blocking
      predicate, showing that the key correctness condition was consistency across
      all refusal sites rather than fixing only one code path.
  - type: file
    path: src/theforge/coordinator/workspace.py
    description: This file is where workspace dirt is classified for coordination
      decisions; its substantial change demonstrates that admission logic had to distinguish
      sprint-owned artifacts from operator dirt at the point where refusals are computed.
  - type: file
    path: tests/test_coord_landing_precondition.py
    description: 'The focused precondition tests exercise the reported collision mode
      and operator-dirt refusal separately, demonstrating the actionable boundary
      for future work: sprint-owned artifacts and true external dirt must be evaluated
      by the same gate but classified differently.'
- claim: Run-produced audit, memory, and summary artifacts need a first-class identity
    independent of publication timing, so workspace checks can recognize them even
    when publication state is stale or absent.
  evidence:
  - type: file
    path: src/theforge/story_run_artifacts.py
    description: A dedicated artifact module shows the run centered on identifying
      story-run outputs by their paths and naming rules, which is what allows other
      components to treat them consistently without relying on transient publication
      bookkeeping.
  - type: file
    path: src/theforge/sprint/audit_publish.py
    description: The reduction and reshaping in audit publication indicates that publication
      bookkeeping was not sufficient as the source of truth for whether these files
      should block progress, supporting the lesson that artifact identity must stand
      on its own.
  - type: file
    path: src/theforge/sprint/memory_publication.py
    description: 'Parallel simplification in memory publication reinforces the same
      mechanism across another publication path: recognition of sprint-owned artifacts
      cannot depend solely on whether a publisher has already recorded them.'
  - type: file
    path: tests/test_story_run_artifacts.py
    description: Tests dedicated to artifact identification show that future work
      in this area should verify path-level recognition directly, because later coordination
      behavior depends on that classification being correct before any publish-state
      update occurs.
