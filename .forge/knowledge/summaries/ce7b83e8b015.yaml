what_changed:
  description: This run closed the structural gap that let bug-labeled issues reach
    diagnosis without substantive observed-symptom and expected-behavior capture content,
    and it prevented diagnose reruns from treating forge-generated text as if it were
    the original bug report.
  approach: The change enforced bug capture-content requirements in both shape checking
    and direct diagnose flow, used placeholder-aware structural checks rather than
    heading presence alone, and remediated landing paths so coordinator-written output
    would not be blocked or misread on rerun.
  files_modified: *id002
what_was_learned:
- claim: When a structural prerequisite is meant to constrain diagnosis input, enforcing
    it only in intake or shape-gate paths is insufficient; direct invocation paths
    must apply the same prerequisite before any scope derivation or agent dispatch,
    or they will reconstruct the original bug through an alternate entry point.
  evidence:
  - type: review_finding
    finding_id: fc1c40926aad8f4f
    description: This finding shows the initial change left `forge diagnose` able
      to derive scope from the raw body and start investigation even after the shape-gate
      issue was addressed, demonstrating that equivalent preconditions must be enforced
      at every diagnose entry seam, not assumed from earlier intake.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 explicitly reported that the shape gate path was covered
      while direct diagnose still dispatched investigation first, showing the failure
      mode came from path asymmetry rather than from the content rule itself.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approved only after direct diagnose refused bug issues missing
      capture content before agent dispatch, confirming that parity across entry paths
      was the condition needed to close the bug.
  - type: file
    path: src/theforge/coordinator/diagnose_flow.py
    description: This file is where direct diagnose flow was corrected, which ties
      the lesson to coordinator-level enforcement rather than only to shape-spec parsing.
- claim: For bug capture contracts, checking only that canonical headings exist does
    not prevent malformed inputs from influencing diagnosis; placeholder and empty-section
    handling must be treated as structurally equivalent to absence when downstream
    logic would otherwise fall back to unrelated prose.
  evidence:
  - type: file
    path: src/theforge/shape_check/placeholders.py
    description: This file is evidence that the run distinguished placeholder scaffolding
      from substantive content, which is the mechanism needed because heading presence
      alone leaves scope inference in the same state as omission.
  - type: file
    path: src/theforge/shape_check/diagnosis_spec.py
    description: Changes here connect the structural requirement to diagnosis gating,
      showing that the contract being enforced is content-bearing sections rather
      than mere section labels.
  - type: file
    path: src/theforge/shape_check/heuristics.py
    description: Heuristic changes support content-sensitive structural checks, demonstrating
      the run handled mechanically decidable emptiness and placeholder cases instead
      of relying on semantic judgments about prose quality.
  - type: review_finding
    finding_id: f9768a301fdce278
    description: This finding surfaced because empty or placeholder bug sections remained
      blocking during landing, which demonstrates that those states were intentionally
      treated as missing-content cases rather than accepted by heading presence.
- claim: If diagnose writes remediation or summary text back into an issue body, future
    runs can silently change their own input contract unless generated sections are
    accounted for at the landing seam as well as at initial validation.
  evidence:
  - type: review_finding
    finding_id: f9768a301fdce278
    description: This finding shows that coordinator-written output interacted with
      the new body validation during landing, demonstrating that body mutation is
      part of the effective input pipeline and must be handled explicitly to avoid
      self-induced contract changes.
  - type: review_finding
    finding_id: 738f35896967557f
    description: This finding identified the diagnose landing seam as a distinct risk
      area lacking coverage, showing that write-back behavior can diverge from intake
      behavior and needs separate verification because it can alter what reruns read.
  - type: file
    path: src/theforge/reporting/render.py
    description: This file's involvement shows the run addressed not just validators
      but also the generated text path that becomes future rerun input, which is the
      mechanism behind false convergence in the reported bug.
  - type: file
    path: tests/test_diagnose_flow.py
    description: This file evidences that the landing seam was exercised specifically
      where body mutation occurs, reinforcing that rerun safety depends on behavior
      at write-back time, not only on parse-time checks.
