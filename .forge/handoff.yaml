dev_notes: |
  summary: "Implemented StorySource protocol with FileSource and GitHubIssueSource. Sprint manifests accept {issue: N} dict entries. GitHubIssueSource fetches bodies via gh CLI, closes issues in merge mode, comments on escalation. TaskStory story_path is now optional with story_text for inline content. Sprint runner uses unified slug_to_context mapping with source lifecycle callbacks. on_approve aliases (ask, merge-pr) normalized at config load. Overlap detection uses plan gates with a 2s polling loop: workers pause between PLAN and DEV, scheduler services plan gates to extract footprints and check overlaps before releasing. Iter 1 fixes: polling loop to prevent plan gate deadlock, empty body truthiness (is not None), depends_on type validation. Iter 2 fix: captured _current_interval before mutating _poll_interval so _total_waited accumulates the actual wait duration, preventing false timeout after last plan gate release."
  commits:
    - sha: "9fc270b"
      message: "feat(sprint): add story source abstraction for GitHub issues and local files"
    - sha: "c255447"
      message: "fix(sprint): address review findings (iter 1)"
    - sha: "eab824e"
      message: "fix(sprint): fix false timeout in polling loop after last plan gate release"
  acceptance_criteria:
    - criterion: "forge sprint accepts a manifest with issue: <number> entries and executes them"
      status: MET
      notes: "SprintManifest.stories accepts list[str | dict]. Dict entries with issue key validated at parse time. build_tasks_from_manifest resolves via GitHubIssueSource.fetch()."
    - criterion: "GitHub issue body is used as the story spec (passed to preflight, plan, dev, review)"
      status: MET
      notes: "GitHubIssueSource.fetch() calls gh issue view --json title,body and sets story_text. All three coordinator entry points use 'is not None' check (fixed in iter 1 to handle empty bodies)."
    - criterion: "on_approve: merge-pr or pr — PR body includes Closes #N; coordinator does not call gh issue close"
      status: MET
      notes: "PR body includes Closes #N via existing github_issue field. on_complete is no-op for pr mode. PR body shows GitHub Issue #N when story_path is None."
    - criterion: "on_approve: merge — coordinator calls gh issue close with a run-summary comment"
      status: MET
      notes: "GitHubIssueSource.on_complete checks on_approve==merge AND result.merge.merged==True before calling gh issue close."
    - criterion: "on_approve: ask — same as pr; human merges, GitHub closes via keyword"
      status: MET
      notes: "ask normalized to pr in _parse_workspace() at config load time. merge-pr also normalized."
    - criterion: "Issue receives a comment when the story escalates, regardless of mode"
      status: MET
      notes: "GitHubIssueSource.on_escalate posts comment via gh issue comment. Called from sprint runner after result classification for Phase.ESCALATE."
    - criterion: "Local file stories continue to work unchanged — no regression"
      status: MET
      notes: "FileSource wraps _build_task_from_story with no-op callbacks. All 1900 tests pass. Dedicated regression test."
    - criterion: "depends_on in sprint manifest entries is respected for sequencing, consistent with existing DAG behavior"
      status: MET
      notes: "Dict entries support depends_on override with type validation (str or list required, ValueError on invalid types — fixed in iter 1)."
    - criterion: "Stories with overlapping file footprints emit a warning and run sequentially by default"
      status: MET
      notes: "Plan gate mechanism with polling loop (fixed in iter 1, timeout fix in iter 2): workers pause between PLAN and DEV. Scheduler polls with 2s interval to service plan gates, extract footprints, and check overlaps before releasing."
  story_deviations:
    - description: "TaskStory field reorder: slug moved before story_path (now optional)."
      justification: "Required by dataclass rules: fields with defaults must follow fields without defaults. All constructors use keyword arguments."
    - description: "on_complete guards on result.merge.merged==True, not just result.success."
      justification: "Per P1-impl review note, prevents closing issue when merge failed even though result.success is True."
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
