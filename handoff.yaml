gate_result: PASS
dev_notes: |
  summary: >
    Implemented spec validation: a lightweight advisory pre-PLAN quality check.
    Added src/theforge/spec_validator.py with validate_spec(), SpecValidationFinding,
    and SpecValidationResult dataclasses. The coordinator calls validate_spec() after
    PREFLIGHT and before PLAN using the same guard as should_plan (plan enabled AND
    complexity medium/large AND no --plan injection). A fast profile is derived from
    config.dev_profile by substituting sonnet for any model containing 'opus'
    (case-insensitive) via dataclasses.replace(). On WARN, findings are logged to
    the console and execution always continues. Fail-safe: any exception or malformed
    output returns PASS. Results stored on CoordinatorState and written to
    forge_audit.yaml under spec_validation.findings.
  commits:
    - sha: "5d9a0ab"
      message: "feat(spec-validation): add pre-PLAN spec quality check"
  acceptance_criteria:
    - criterion: "Spec validation runs after PREFLIGHT, before PLAN"
      status: MET
      notes: "Inserted in coordinator.py at the PROCEED branch, after BLOCKED check, before should_plan block."
    - criterion: "Validation produces PASS or WARN verdict"
      status: MET
      notes: "SpecValidationResult.verdict is PASS or WARN; invalid model output coerced to PASS."
    - criterion: "On WARN, findings are logged to the console before PLAN starts"
      status: MET
      notes: "_log() called for each finding with category, description, and split suggestions before should_plan block."
    - criterion: "On WARN, the run continues — validation never blocks execution"
      status: MET
      notes: "No return or raise on WARN. validate_spec() is fully fail-safe."
    - criterion: "Validation findings are recorded in forge_audit.yaml under spec_validation.findings"
      status: MET
      notes: "coord_audit.py reads state.spec_validation_result and emits spec_validation key with verdict, cost, duration, and findings."
    - criterion: "Validation is skipped when --plan flag is used"
      status: MET
      notes: "Guard includes plan_path is None. Verified by test_spec_validation_skipped_on_plan_injection."
    - criterion: "Validation uses a fast/cheap model (sonnet or equivalent), not opus"
      status: MET
      notes: "_make_fast_profile() substitutes model='sonnet' for any model containing 'opus' (case-insensitive substring) using dataclasses.replace()."
    - criterion: "Scope findings are categorized separately from requirement findings"
      status: MET
      notes: "SpecValidationFinding.category is 'requirement' or 'scope'; preserved in audit log."
    - criterion: "When scope is flagged, the finding includes concrete split suggestions with story names and AC assignments"
      status: MET
      notes: "SpecValidationFinding.split_suggestion holds {stories: [{name, acs}]}. Prompt instructs model to populate this for scope findings."
    - criterion: "Existing tests pass"
      status: MET
      notes: "1103 tests pass after all changes."
    - criterion: "New tests cover: PASS verdict continues to PLAN, WARN verdict logs and continues, skipped on --plan injection, scope WARN with split suggestion"
      status: MET
      notes: "21 unit tests in test_spec_validator.py; 5 integration tests in TestSpecValidation class in test_coordinator.py."
  spec_deviations:
    - description: "Named SpecValidationFinding (not SpecFinding)"
      justification: "Plan reviewer P2 note explicitly suggested this to avoid confusion with the review system's Finding class."
    - description: "validation timeout forced to 120s inside validate_spec()"
      justification: "Advisory call should be fast; inheriting a dev timeout (up to 10 min) would be surprising for an advisory step."
  deferred_items: none
  gate_result: PASS
