  description: The run added runtime/checkout provenance around config-validation
    failures across CLI entrypoints, especially when a non-editable installed runtime
    differs from the checkout whose forge.yaml is being read. It also updated the
    story-config guard path so guard failures remain controlled command failures rather
    than uncaught crashes.
  approach: The change was implemented centrally in shared CLI/config-loading substrate
    code and then wired through multiple commands, with regression tests added for
