what_changed:
  description: This run made semantic readiness an operator-controlled intake policy
    via `intake.semantic_review`, with `off` as the default when the key is absent,
    while preserving the existing ratified-review contract unchanged when the mode
    is `required`. It also kept `forge review-semantic` and `forge ratify-semantic`
    available independently of the admission gate and updated the semantic-readiness
    and ADR documentation to match.
  approach: The change introduced a validated config mode at load time, routed semantic-readiness
    derivation through that policy before admission and readiness consumers act, preserved
    revision-scoped evaluation and ratification behavior for `required`, and proved
    the behavior across CLI, queue, manifest, and documentation seams.
  files_modified: *id002
what_was_learned:
- claim: When a config enum is expressed in YAML using human words like `off`, loader
    validation must account for YAML scalar coercion before enforcing string-only
    allowed values.
  evidence:
  - type: review_finding
    finding_id: e33c43e8424f82ea
    description: 'Review found that the documented unquoted `semantic_review: off`
      example was parsed by `yaml.safe_load` into boolean `False`, so naive string
      validation rejected the canonical config form and showed that YAML coercion
      has to be normalized or guarded during load.'
  - type: review_finding
    finding_id: 3ec92809ea0fb72c
    description: The follow-up finding showed that broadening the fix to accept boolean
      `False` also admitted other YAML false aliases like `no` and `false`, demonstrating
      that handling coercion requires a narrow mapping for intended spellings rather
      than treating all falsey parses as equivalent.
  - type: file
    path: src/theforge/config/load.py
    description: This is the load-time validation seam where both review findings
      landed, showing the lesson applies specifically at config parsing and normalization
      rather than later policy use sites.
- claim: For policy-gated evaluations, verification has to cover every consumer seam
    that can evaluate, spend, or withhold; proving one admission path is not enough.
  evidence:
  - type: plan_step
    step_id: '3'
    description: The plan explicitly targeted proof at the semantic and command seams,
      reflecting that correctness depended on coordinated behavior across multiple
      consumers rather than a single implementation point.
  - type: file
    path: src/theforge/cli/sprint.py
    description: This file is one consumer seam for sprint admission, showing the
      gate behavior had to be checked where stories enter sprints interactively.
  - type: file
    path: src/theforge/sprint/manifest.py
    description: This separate manifest-based admission path demonstrates that admission
      behavior exists in more than one command seam and must be verified independently.
  - type: file
    path: src/theforge/cli/status.py
    description: Status reporting is another consumer of readiness state, so the policy
      had to suppress semantic withholding effects here as well, not only at admission.
  - type: file
    path: src/theforge/ready_queue.py
    description: The ready-queue path is another readiness consumer, showing that
      policy-controlled non-evaluation had to hold wherever readiness is derived for
      dispatch and queueing.
