what_changed:
  description: This run changed gate-timeout diagnostic result handling so attempted
    invocations that do not yield positive, parseable execution evidence remain inconclusive
    instead of being reported as evidence for a concurrency-specific hang. It also
    aligned audit-schema migration so legacy records do not turn attempted-only diagnostics
    into affirmative workload-executed evidence.
  approach: The change introduced a stricter classification boundary between attempted
    invocation, executed workload, and parseable findings, then applied that classification
    both where the timeout RCA packet is built and where older audit records are migrated
    into the newer schema.
  files_modified: *id002
what_was_learned:
- claim: For diagnostics against repository-specific runners, 'workload executed'
    must be derived only from positive structured evidence of execution, not from
    the absence of an extracted culprit or from heuristic interpretation of output.
  evidence:
  - type: review_finding
    finding_id: 9869863a00d1a80c
    description: This finding shows that a zero-exit invocation with only unparseable
      runner output was previously treated as a completed serialized pass with no
      timeout finding, which manufactured a concurrency RCA without any evidence that
      test workload ran.
  - type: review_finding
    finding_id: 8156f87ea32ff1ff
    description: 'This finding demonstrates the same failure mode on another success-path
      shape: custom runner output that cannot be parsed as test results was still
      recorded as executed workload, proving that successful process exit is not sufficient
      evidence of diagnostic execution.'
  - type: review_cycle
    cycle: '2'
    description: Approval in cycle 2 explicitly hinged on the RCA staying inconclusive
      unless there was positive parsed diagnostic evidence, confirming that this evidentiary
      threshold was the key condition for correctness.
- claim: Negative classification of diagnostic execution should not depend on matching
    shell or runner error phrases, because output text can contain misleading substrings
    even when the suite actually ran.
  evidence:
  - type: review_finding
    finding_id: 0e93c9d68cf9d407
    description: This finding shows that phrase-based output matching misclassified
      a full successful run as 'did not execute' when its output happened to contain
      text resembling an error signature, demonstrating that text-pattern rejection
      is not a reliable classifier.
  - type: file
    path: src/theforge/gate_diagnostics.py
    description: This was the classification site implicated by repeated review findings,
      showing that the execution decision lived close to raw command output and therefore
      needed a rule based on structured success evidence rather than brittle phrase
      matching.
- claim: When audit schemas evolve, migration logic must preserve epistemic uncertainty
    from legacy records; otherwise historical 'attempted but not evidenced' diagnostics
    can become false affirmative evidence in downstream consumers.
  evidence:
  - type: review_finding
    finding_id: 3efe772002d875f4
    description: This finding shows that v38 records shaped like production argument-rejection
      diagnostics were migrated into v39 as workload_executed=true, proving that schema
      migration itself can create false evidence even after live-path logic is corrected.
  - type: review_cycle
    cycle: '4'
    description: Cycle 4 approval notes that the migration fix backfills workload_executed
      only from structured legacy evidence, demonstrating that preserving uncertainty
      in migrated records was necessary to resolve the remaining blocker.
learned_patterns:
- positive-evidence-only
- no-phrase-based-classification
- uncertainty-preserving-migration
