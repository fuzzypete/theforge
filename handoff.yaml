gate_result: PASS
dev_notes: |
  summary: "Hardened the existing OpenAI adapter for local model use. Added four
    model keys to MODEL_REGISTRY (openai/codestral, openai/deepseek-coder,
    openai/llama3.1, openai/qwen2.5-coder) with cost_rank=1 and dev_capable=True,
    routed through the existing OpenAI adapter via base_url. Introduced
    _is_local_endpoint() to detect localhost/127.0.0.1 URLs, then used it in
    _openai_result() to store 0.0 (not None) for single-shot calls, and in
    _run_loop_openai to zero both result.cost_usd and each ModelUsage.cost_usd
    after the loop completes. Added a BadRequestError catch in _run_loop_openai
    that falls back to PROVIDER_RUNNERS['openai'] (single-shot) when the error
    message contains 'tool', covering models that don't support tool-calling.
    Extended cmd_check_providers in cli.py to label local profiles with [local]
    and display $0.000 cost. Added docs/guides/local-models.md. Added 14 new
    tests covering the helper, cost zeroing in both paths, BadRequestError
    fallback, and MODEL_REGISTRY entries."
  commits:
    - sha: "29d6d31"
      message: "feat(local-models): validate ollama/vllm via existing OpenAI adapter"
  acceptance_criteria:
