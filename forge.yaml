# forge.yaml — TheForge developing itself
project: theforge

# v0.8 simple model list. TheForge derives preflight, plan, dev, review,
# and synthesis roles automatically from this list and the story complexity.
# See docs/guides/inputs-reference.md for the full schema reference.
# Model identity is provider + model + transport.kind. The identity string form
# is <provider>/<model>/<cli|api>; transport is never encoded in the provider
# token (no openai-api/…, no gemini-cli/…).
models:
  enabled:
    - anthropic/sonnet/cli        # CLI alias auto-tracks: Sonnet 5 as of 2026-07 ($3/$15)
    - anthropic/opus/cli          # CLI alias auto-tracks: claude-opus-5 as of 2026-08 (#2207; audit
    #                                 records show claude-opus-5, not the Opus 4.8 this line claimed)
    # - openai/gpt-5.4/cli        # REMOVED 2026-09-05: retired from Codex under ChatGPT-account
    #                               auth. `codex debug models` on this account no longer lists it,
    #                               and dev dispatch returns 400 "The 'gpt-5.4' model is not
    #                               supported when using Codex with a ChatGPT account"
    #                               (theforge#2909). API-key auth is unaffected. The earlier
    #                               "still served, no deprecation (verified 2026-07-07)" note was
    #                               true when written. Was: value strong tier ($2.50/$15).
    - openai/gpt-5.4-mini/cli     # cheap tier ($0.75/$4.50). Tried list-first 2026-07-11 to force dispatch via
    #                                 the cheap-bucket tie-break: got 4 preflights (at sonnet-equal cost, no
    #                                 savings) but zero dev runs — profile reranker starves zero-history models
    #                                 regardless of order. Reverted same day; real fix is #1617.
    - openai/gpt-5.5/cli          # OpenAI's recommended coding model (promoted to the catalog, #2252)
    # GPT-5.6 (2026-08-05, #2207). Identifiers verified against the live /v1/models list for this
    # key: gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna.
    #
    # TRANSPORT CORRECTED 2026-08-10: these were declared api on the belief that the family ships no
    # -codex variant so Codex CLI support was unconfirmed. That belief was wrong and never tested. A
    # model needs no -codex suffix to run under Codex CLI; `codex exec -m` passes the identifier
    # through. Live-probed the pinned @openai/codex@0.147.0 (which is also npm's current release):
    # `codex exec --json -m gpt-5.6-sol` completes cleanly. The api declaration was the sole cause of
    # 22 tool-call 400s ("Function tools with reasoning_effort are not supported for gpt-5.6-sol in
    # /v1/chat/completions"), which broke plan review, code review and the escalation advisor, since
    # all three need tools and the api adapter sends them on /v1/chat/completions against a model
    # carrying a server-side default reasoning_effort. Codex does its own tool calling, so cli avoids
    # the whole path. This also removes the only OpenAI api profiles from this project.
    #
    # Cost: FIXED. The note here used to say these record cost-unknown until #2335 lands. #2335 has
    # landed and closed, and the audit for run 41b3bef1268f (2026-08-11) carries a real $2.18 against
    # gpt-5.6-sol on the codex transport. Expect figures, not $?.???.
    #
    # Prices are provider-attested — re-read from OpenAI's published pricing 2026-08-11, confirming
    # the 2026-08-08 figures. They are the SHORT-CONTEXT rates; long context bills sol $10/$45 and
    # terra $4/$18, and the schema holds one rate per identity, so a long-context run is understated.
    # An earlier secondary-source seed was wrong by exactly 2x on both (sol $2.50/$15, terra $1/$6),
    # which would have ranked them cheaper than they are and biased exploration toward them.
    # #2206 supersedes these with observed cost once each has run history.
    #
    # RETIREMENT PENDING, NOT BLOCKED. These entries were promoted into the shipped catalog on
    # 2026-08-11, so the definitions below are now duplicates rather than the sole source. They
    # CANNOT be replaced with `- openai/gpt-5.6-sol/cli` shorthands yet: the orchestrator runs an
    # installed rc, and no rc carrying the catalog entries has been cut. Swapping early makes the
    # identity unresolvable and `forge check-config` fails closed with "Unknown model ... not in
    # AGENT_REGISTRY", which takes every forge command down (observed, 2026-08-11). This is the
    # sequencing #2252 recorded: promote, ship an rc, then retire the duplicate. Do the swap in the
    # first release AFTER an rc containing these catalog entries.
    - provider: openai
      model: gpt-5.6-sol
      transport: {kind: cli}
      routing: {tier: strong, capability: 9, cost_rank: 3}
      cost: {input_per_mtok: 5.00, output_per_mtok: 30.00, pricing_provenance: gpt-5.6-sol}
    - provider: openai
      model: gpt-5.6-terra
      transport: {kind: cli}
      routing: {tier: fast, capability: 8, cost_rank: 2}
      cost: {input_per_mtok: 2.00, output_per_mtok: 12.00, pricing_provenance: gpt-5.6-terra}
    # Luna was omitted on 2026-08-05 for "no published price found". A price is published: $0.20/
    # $1.20 (OpenAI cut it 80% on 2026-07-30; OpenRouter's $0.10/$0.60 is a temporary 50% promo, so
    # list price is the seed). OpenAI positions it as the nano tier — "roughly corresponds to the
    # nano model tier used in earlier GPT-5 families" — not a sol-priced strong model. Introduced
    # the same way haiku was: dev_capable false and phase_eligibility restricted until it has run
    # history of its own, because tier/capability gate eligibility and never self-correct.
    # BENCHED 2026-08-08, same day it was enabled. Its transport returned 400 on the tool-call
    # request and the run fell back to single-shot text, which cannot carry a structured result.
    # Both phases it is eligible for need tools — review calls submit_review — so it is unusable in
    # both. It was also handed the escalation-advisor role, which phase_eligibility cannot restrict
    # (#2332), and produced no advisory report, leaving that gate with six options and no
    # recommendation.
    #
    # BENCH REASON REVISED 2026-08-11. Two of the three stated reasons no longer hold, and the
    # remaining one is probably not about this model at all:
    #   - "absent from the accounting table, so its runs record cost-unknown (#2335)": #2335 landed
    #     and is closed. A declared price is now accounted for.
    #   - "the model cannot call tools on this adapter": the entry below declares transport api, and
    #     api is exactly what produced the identical tool-call 400 on gpt-5.6-sol and -terra. That
    #     was a transport defect, not a model limitation, and correcting those two to cli fixed it.
    #     This entry was never re-probed under cli, so the evidence behind this line describes the
    #     adapter it was declared on rather than anything about luna.
    # #2332 (escalation-advisor role ignores phase_eligibility) is still OPEN and is the one live
    # blocker, so this stays benched. Re-enable by declaring transport cli — not api — after #2332
    # lands and a live `codex exec --json -m gpt-5.6-luna` tool-call probe returns a structured
    # response; record the run id here. Price below is OpenAI's published short-context rate
    # (re-read 2026-08-11); long context bills $0.40/$1.80.
    # - provider: openai
    #   model: gpt-5.6-luna
    #   transport: {kind: api}
    #   routing:
    #     tier: cheap
    #     capability: 6
    #     cost_rank: 1
    #     dev_capable: false
    #     phase_eligibility: [preflight, review]
    #   cost: {input_per_mtok: 0.20, output_per_mtok: 1.20, pricing_provenance: gpt-5.6-luna}
    # Haiku — cheap tier for the Anthropic adapter (#2207, migrated #2219). This was an inline
    # declaration of anthropic/haiku/cli, which the shipped catalog also defines; the two diverged
    # on routing-effective price and every config load warned about it. Resolved by enabling the
    # catalog's *pinned* identity instead of redeclaring the shorthand.
    #
    # Not a policy change: the builtin claude-haiku-4-5 entry carries the identical tier, capability,
    # cost_rank, dev_capable and phase_eligibility this block declared, plus pricing_provenance.
    # Dropping the declaration while leaving the `haiku` shorthand enabled would NOT have been
    # behaviour-preserving — builtin shorthands deliberately carry no pricing_provenance (they are
    # indicative only and routing ignores them), so the price would have gone unattributable and
    # fallen out of selection. The pinned entry keeps it routing-effective, and is the identity
    # actually billed: claude-haiku-4-5 is what appears in cost.agents[].model_usage.
    - anthropic/claude-haiku-4-5/cli
    # google/gemini-3.5-flash/api — Google re-entry (2026-07-16, the registry story flagged below): stable/GA
    # PULLED FROM THE POOL 2026-09-05 — not merely DEV-ineligible.
    # `routing.dev_capable: false` was tried first and is honoured by static role
    # derivation but IGNORED by the adaptive candidate pool: run a0b5fc18626b routed
    # dev to gemini-3.5-flash anyway, from a sprint-pinned config that contained the
    # overlay. Removing the entry is the only lever that holds. This also gives up
    # the review role, where these were the two highest-volume reviewers.
    # RESTORE once theforge#2920 has landed and an rc carrying it is cut.
    # - provider: google
    #   model: gemini-3.5-flash
    #   transport: {kind: api}
    #   routing:
    #   dev_capable: false   # 2026-09-05: DEV-ineligible. Every dev attempt on this identity
    #   # terminated at 3 turns with submit never called; the coordinator
    #   # then retried without bound (theforge#2919, theforge#2920). Review
    #   # is unaffected — 292 recorded review runs. Overlay only: tier,
    #   # capability, cost_rank and pricing still come from the catalog.
    #   # REMOVE once theforge#2920 has landed AND an rc carrying it is cut.
    #                                 since 2026-05, Google's recommended model for agentic+coding. Beats
    #                                 3.1-pro on tool-call chaining (MCP Atlas 83.6%, Terminal-Bench 76.2 vs
    #                                 70.3) — the exact no-submit failure class that benched 3.1-pro (#1598).
    #                                 Promoted to the shipped catalog by #2252; this line is now policy only.
    # Both benches below are RETAINED as of 2026-08-05 (#2207), but their exit condition is
    # restated. The prior wording — "re-enable when adaptive routing can decide reviewer fitness
    # automatically" — was not checkable, so neither bench had a defined exit and both persisted by
    # default. Replaced with a condition that can be evaluated by looking at run history:
    #   RE-TEST TRIGGER: each bench predates the fix for the failure that caused it, and neither has
    #   been re-tested since. Re-test in a bounded exploration slot (assignment.exploration caps the
    #   blast radius); re-bench only if the SAME failure class recurs, and record the run id here.
    #   Checkable by asking: has this model run at all since the fix date recorded on its line?
    # UNBENCHED 2026-08-08 (#2207) under the RE-TEST TRIGGER above: each bench predates the fix for
    # the failure that caused it, and neither had been re-tested since. Re-bench only if the SAME
    # failure class recurs, and record the run id on the line. This takes the reviewer pool from
    # 3 of 4 provider families to 4 of 4, which is what cross-provider reviewer preference assumes.
    # - deepseek/deepseek-reasoner/api  # benched 2026-05-09: flaky + slow; cycle-3 hang on #1424 + cycle-1 crash on same story.
    #                                  Fixes landed AFTER the bench: #1574 provider-health signal (2026-05-12),
    #                                  #1434 reviewer crash retries instead of escalating (2026-07-09).
    #                                  Re-test failure class: hang / crash mid-review.
    #                                  RE-BENCHED 2026-08-09, run 040bc2e87ab4: failure class RECURRED one day
    #                                  after the #2207 unbench. Plan review (#2333): 75 iterations of recon,
    #                                  submit never called, finalization empty, excluded from merge. Code review
    #                                  cycle 3 (#2333): 22+ bash-recon iterations while both other reviewers
    #                                  finished in ~2 min. Same class as 2026-05-09 (non-delivery mid-review).
    # google/gemini-3.1-pro-preview/api — benched 2026-07-09: reviewer completed without calling submit_review
    # PULLED FROM THE POOL 2026-09-05 — not merely DEV-ineligible.
    # `routing.dev_capable: false` was tried first and is honoured by static role
    # derivation but IGNORED by the adaptive candidate pool: run a0b5fc18626b routed
    # dev to gemini-3.5-flash anyway, from a sprint-pinned config that contained the
    # overlay. Removing the entry is the only lever that holds. This also gives up
    # the review role, where these were the two highest-volume reviewers.
    # RESTORE once theforge#2920 has landed and an rc carrying it is cut.
    # - provider: google
    #   model: gemini-3.1-pro-preview
    #   transport: {kind: api}
    #   routing:
    #   dev_capable: false   # 2026-09-05: DEV-ineligible, same cause as gemini-3.5-flash above.
    #   # Its two recorded dev failures (#2711, #2832) predate the diagnosis
    #   # and are suspected coordinator-caused, not model-caused
    #   # (theforge#2921) — do not read them as capability evidence.
    #                                      (empty output, exit=1) and killed story #1576 on quorum 1/2 — see #1598.
    #                                      #1598 closed 2026-07-12 — three days AFTER this bench — and fixes
    #                                      precisely this failure (no retry, no substitute on a non-submitting
    #                                      reviewer). Re-test failure class: completes without submit_review.
    #                                      Still the only Google pro tier (never GA'd; 3.5 Pro delayed to
    #                                      mid-July 2026 over recursive tool-calling failures — bench it
    #                                      separately if it GAs). gemini-3.5-flash re-entry shipped above.
  # models.custom removed 2026-08-08 (#2219, depends_on #2204). This block held two overlays —
  # openai/gpt-5.5/cli (#1184) and google/gemini-3.5-flash/api (#1598) — in the deprecated
  # project-declared mapping. The deployed release now ships both in the unified catalog, promoted
  # from these very overlays (#2226 and #2252 respectively), each carrying the same tier, capability
  # and cost_rank they had here plus a pricing_provenance the overlay shape could not express.
  # Both remain enabled by identity in the list above; this is a format move, not a policy change.

# CLI→API transport fallback, keyed by provider family. The provider never
# changes across a fallback — only the transport does.
transport_fallback:
  openai:
    model: gpt-5.4
    timeout_seconds: 600

budget_usd: 50.0

# Inline intake remediation (intake.grooming) is intentionally left at the
# schema default (false) — see ADR-0001 "Inline intake remediation posture".
# This repo runs `forge groom` as the primary pre-sprint readiness path, so no
# dogfood override is set here; the repo behaves like any fresh consumer.

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug} {base_branch}"
  setup_command: "test -d .venv || ({forge_python} -m venv .venv && .venv/bin/pip install -e '.[all,dev]' -q)"
  # Interpreter this project develops against; {forge_python} expands to it.
  # Required whenever setup_command uses {forge_python} (#1934) — TheForge will
  # not substitute the orchestrator's own interpreter for the project's gate.
  python_interpreter: "python3.12"
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"
  on_approve: merge-pr
  merge_strategy: squash
  auto_push: true
  # Bounds queued auto-merge polling. Expiry is fail-closed: story is marked
  # failed and dependents remain blocked. Increase for slow CI environments.
  merge_wait_timeout_seconds: 3600

validation:
  # Gate pass/fail is exit-code only. v0.8 removed handoff_file and
  # gate_decision_key; do not add them back under validation:.
  # Stays bare `make gate`: tests/test_ci_gate_parity.py asserts CI invokes exactly
  # this string, so a flag here would silently diverge CI from the story gate. The
  # xdist cap for parallel sprints is passed as the GATE_WORKERS environment
  # variable instead (Makefile uses ?=, which honours the environment).
  gate_command: "make gate"
  # Canonical intermediate command dev agents should use while working.
  #
  # 2026-08-13: was the bare pytest suite, which ran no lint at all — so the dev
  # loop could not see the ruff rules the gate would reject it on. Four stories
  # in three days stalled or died on that gap (E501, I001, an unformatted
  # signature), each burning dev iterations against a violation its own
  # intermediate command never checked. `make dev-check` runs the gate's lint and
  # format checks first (0.4s) and then the gate's own pytest invocation, so a
  # pass here means the same tests passed the same way.
  #
  # Still not authoritative — `make gate` remains the only verdict that gates
  # merge, and dev-check omits the env scrubbing and forge index/config steps
  # that make the gate trustworthy rather than merely informative.
  test_command: "make dev-check"
  # 45→60 (2026-07-11): story #1243 hit identical 45s gate timeouts twice under
  # --parallel 3 load, then passed instantly when resumed solo. Modest bump to
  # absorb parallel contention; revisit if timeouts persist at 60.
  # 60→180 (2026-07-27): the suite outgrew the budget. `make gate` measured
  # 71.4s wall clock alone (6224 tests) against a 60s alone-time budget, so
  # sprints at --parallel 1 failed at the baseline gate deterministically —
  # adaptive scaling multiplies this value, so parallelism was the only thing
  # masking it. Set to ~2.5x measured alone-time; the timeout exists to catch a
  # hung gate, not to bound normal growth. Re-measure when the suite grows.
  # 180→255 (2026-09-05): re-measured per the instruction above. `make gate` is
  # 101.6s wall clock alone (10928 tests, up from 6224) — the suite grew 76% but
  # wall time only 42%, so growth is sub-linear and not the problem. 255 is ~2.5x
  # measured alone-time, the same ratio 180 encoded in July.
  #
  # What actually failed: issue-2921 escalated on `Gate timed out after 360s`
  # (180 x adaptive scaling) while a second gate ran concurrently under
  # --parallel 2. GATE_PYTEST_CMD uses `-n auto`, which assumes it owns the box;
  # on 10 logical / 4 performance cores two gates demand ~20 xdist workers and each
  # takes ~3.5x its solo time. Raising the timeout absorbs that; bounding `-n` would
  # address it directly but needs measuring against CI's different core count first.
  gate_timeout: 255

conventions:
  hard:
    max_module_lines: 600
    max_test_file_lines: 1000
    no_circular_imports: true
    test_mirrors_source: true
    no_scratch_files: true
    stack: python
  soft:
    - "Coordinator is pure Python — no LLM calls for routing or process decisions"
    - "Schema validation is the integrity boundary — do not relax cross-validation rules"
    - "Keep modules single-purpose. Extract when a responsibility separates from its neighbours — never to satisfy a line count. Putting a change in an already-large module is correct if that is where it belongs; a module carved at whatever line got the count down is worse than the large module it came from."
    - "Keep pure-data types in low-dependency modules with stdlib-only imports"
    - "Separate prompt construction, output parsing, and coordinator control flow"
    - "When adding or modifying data that flows between coordinator phases, instrument the change so the actual values are visible in the audit trail — diagnosing sprint failures requires tracing real data, not reconstructing it"
    - "Do not create files outside src/, tests/, or docs/. If you need a scratch file for exploration, delete it before committing."
    - "Changes that affect coordinator phase boundaries, state handoff between phases, or adaptive routing/config propagation must include seam-level integration tests covering the touched boundary. Unit tests alone are insufficient when correctness depends on cross-phase state flow."
  advisory:
    artifact_path: ".forge/conventions/advisory.yaml"
    summary_top_n: 10
    noteworthy_threshold_percent: 10.0
    commit_shared_artifact: false
    issue_filing:
      enabled: false

assignment:
  enabled: true
  # Mechanical plan-reviewer value signals (#1443): P1 uniqueness + latency-per-P1,
  # sample-floor gated, recency-weighted, taint-excluded. Built and tested but
  # default-off; enabled 2026-08-02 after 703-audit review showed reviewer
  # selection running on completion rate alone.
  reviewer_value_enabled: true
  # Code-review selection consumes the same signals since #2156 (closed 2026-08-04).
  # Enabled 2026-08-05 (#2207) — it shipped default-off and was never switched on here,
  # so code-review reviewers were still being selected on completion rate alone while
  # plan reviewers had moved to value signals three days earlier.
  code_review_value_enabled: true

# Neutralize the stuck-detector's no-file-modifications arm pending the redesign
# in #1215. Repeat-call and identical-error-loop arms remain at their defaults
# (repeat_threshold: 4, error_threshold: 4) — those are defensible signals.
# The no-file-modifications arm conflates legitimate codebase exploration with
# stuckness and has false-terminated multiple stories during dogfood.
# Worker timeout raised from the 3600 default (2026-08-08, #2333). Three of six
# stories in run d3f34adf1ec2 failed on this ceiling and none failed on quality:
# two large-complexity stories took the derived 5400s and were killed mid-edit
# while converging, and one was killed 18 seconds after the log recorded that its
# operator gate still had 41m54s left, because the ceiling counts time spent
# waiting on a human as worker unresponsiveness. That cost $72.63 of a $104
# sprint.
#
# 9000 is sized on what those stories actually needed, not on a principle. It is
# a holding measure: #2333 is the real fix, and once a phase allowance is derived
# against the ceiling that bounds it — the dev timeout was 4948s against a 5400s
# ceiling, 92% of the whole story's budget for one of three cycles — this should
# come back down rather than ratchet up again.
sprint:
  worker_timeout_seconds: 9000

stuck_detection:
  no_progress_iterations: 100
  post_nudge_iterations: 100

retry:
  max_dev_iterations: 3
  max_dev_transport_retries: 2
  max_review_cycles: 3
  adaptive_iterations: true
  max_dev_iterations_cap: 5
  max_review_cycles_cap: 5
  # Apply the advisory the escalate gate just paid for, instead of discarding it
  # (#2279). Two things had to be true for this to have been off, and both were:
  # the capability shipped default-off ("a project that has not opted in sees no
  # change"), AND the orchestrator this project runs on — rc24, cut 08-08 00:04 —
  # predates #2279 and has no such field. So setting this is inert until an rc
  # containing #2279 is cut and the orchestrator moves to it. Verified: rc24's
  # RetryPolicy has no escalate_timeout_policy attribute, and it accepts the key
  # silently rather than rejecting it.
  #
  # Not an auto-approve: only a valid report whose recommendation this run can
  # actually perform is applied. `elevate`, an absent recommendation, and an
  # advisor that produced nothing all still fall back to preserving the
  # checkpoint. An operator selection before expiry always wins; this decides
  # only what an expiry means.
  #
  # Turned on 2026-08-09 after issue-2309 expired at an escalate gate holding a
  # sound `land_core_defer_edges` recommendation and lost it.
  escalate_timeout_policy: apply_advice

# Post-run knowledge capture. A completed run emits an evidence-backed summary
# to .forge/knowledge/summaries/{run_id}.yaml. Turned on 2026-08-16 with
# v0.15.0rc0, the first runtime carrying the schema — rc6 ignored this block
# silently.
#
# `prior_run_context` (Layer 3 injection) turned on 2026-08-21 with v0.15.0rc11.
# It was held back first for corpus size and then, once 29 summaries had
# accumulated, for a mechanical reason that was easy to miss: nothing built the
# derived .forge/knowledge/index.yaml the selector actually reads, so turning
# this on would have injected nothing indefinitely while recording every run as
# a control — biasing knowledge-report toward concluding the loop does not help
# (#2654, #2655; #2607 had made the condition observable but deliberately did
# not fix it). rc11 rebuilds the index on every summary write and repairs a
# missing one on read, so the existing corpus is picked up with no backfill.
#
# `forge knowledge-report` is the read surface. Expect insufficient_data until
# both cohorts fill: cohorts come from audit manifests, so runs recorded before
# this line existed stay unclassified and never enter the comparison.
knowledge:
  run_summaries: true
  prior_run_context: true

plan:
  enabled: true

diagnose:
  output_destination: body_section
  budget_usd: 5.00
  timeout_seconds: 600
  autonomous_default: true

hooks:
  pre_run: .forge/hooks/pre_run.sh
  post_run: .forge/hooks/post_run.sh
  post_merge: .forge/hooks/post_merge.sh
  post_sprint: .forge/hooks/post_sprint.sh
  timeout_seconds: 30

notifications:
  backend: slack
  slack:
    webhook_url_env: SLACK_WEBHOOK_URL
  # This value trades one thing against one other: how long an operator has to
  # answer, versus how long a story sits doing nothing when nobody will. Expiry
  # preserves the worktree and never auto-rejects, so what a longer wait buys is
  # a chance to answer, and what it costs is wall clock on a story that is
  # otherwise finished deciding.
  #
  # 600→3600 (2026-08-07): 10m guaranteed an auto-escalate on anything launched
  # and left to run; three stories died that way in a week, none on merit.
  # 300→3600 (2026-08-08): back up for keyboard-attended work. At 300 a gate
  # expires before an operator has finished reading it. Drop to 300 again for
  # unattended overnight runs, where the "chance to answer" half is worth
  # nothing and the wait is pure dead time before the same preserved outcome.
  #
  # An earlier version of this comment claimed #2279 made expiry apply the
  # advisory recommendation automatically. That was wrong twice over: #2279
  # shipped default-off, and the orchestrator running this project predates it
  # entirely. Every expiry here has discarded the recommendation the gate paid
  # for. retry.escalate_timeout_policy opts in, but does nothing until an rc
  # containing #2279 is cut. Until then a longer wait costs an outcome, not just
  # wall clock — which is the trade this value should be set against today.
  human_review_timeout_seconds: 3600
