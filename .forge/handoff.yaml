dev_notes: |
  summary: "Implemented auto-pull of base_branch before fresh worktree creation.
    The pull logic detects whether the project root currently has base_branch
    checked out: if yes, uses `git pull --ff-only origin <base_branch>`; if no,
    uses `git fetch origin <base>:<base>` to update the local ref without
    disturbing the checked-out branch. Both paths warn-and-continue on failure.
    On resume/reuse, `_check_behind_origin` runs `git rev-list --count` and logs
    an informational note if local base is behind origin. A `--no-pull` flag
    threads from both CLIs (forge run, forge sprint run) through engine.py and
    sprint/runner.py into `_create_workspace`, suppressing both the pull and the
    behind-origin check."
  commits:
    - sha: "8b11b7a"
      message: "feat(workspace): pull base branch before creating worktree, add --no-pull flag"
    - sha: "c57970c"
      message: "fix(workspace): restore git pull --ff-only as specified (revert fetch refspec)"
    - sha: "902973e"
      message: "fix(workspace): two-path update: pull when on base, fetch when not"
    - sha: "d945654"
      message: "fix(workspace): update stale worktree test for two-branch pull detection"
    - sha: "f1ae336"
      message: "chore(handoff): add stale-test-fix commit, set gate_decision PASS"
  acceptance_criteria:
    - criterion: "Before creating a fresh worktree, run `git pull --ff-only origin <base_branch>` in the project root"
      status: MET
      notes: "Uses `git pull --ff-only` when root is on base_branch. Uses `git fetch origin base:base` when root is on a different branch (pull would fast-forward the wrong branch). Tests: test_pull_succeeds_before_create_on_base, test_fetch_refspec_used_when_not_on_base."
    - criterion: "If the pull fails (non-fast-forward, offline, no remote), log a warning and continue — do not block the run"
      status: MET
      notes: "On pull/fetch failure, logs 'pull failed (non-ff / offline): ...' and falls through to workspace creation. Tested by test_pull_fails_workspace_still_created."
    - criterion: "On resume (reusing an existing worktree), skip the pull but log a one-line note if base_branch is behind origin (informational only)"
      status: MET
      notes: "`_check_behind_origin` runs `git rev-list --count base..origin/base` and logs info when count > 0. Called from all resume paths when no_pull=False. Silently skips on failure. Tested by TestBehindOriginCheck and TestResumeNoPull."
    - criterion: "A --no-pull CLI flag on `forge run` and `forge sprint run` suppresses the pull entirely"
      status: MET
      notes: "`--no-pull` registered in cli/run.py and cli/sprint.py, threaded through engine.run_task/run_from_dev/run_from_review and sprint/runner.run_sprint/_run_single_story into _create_workspace. Also passed by daemon's _execute_sprint. Tested by test_no_pull_skips_pull, test_no_pull_skips_behind_origin_check_on_reuse, TestDaemonNoPull."
  story_deviations:
    - description: "When project root is not on base_branch, uses `git fetch origin base:base` instead of `git pull --ff-only`"
      justification: "`git pull --ff-only` in that context would fast-forward the currently-checked-out feature branch, not base_branch, leaving local base stale. The fetch refspec directly updates the local base ref. The spec's literal command is used when the root IS on base_branch."
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
