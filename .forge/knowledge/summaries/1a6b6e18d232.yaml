what_changed:
  description: The run changed diagnose response handling so nested fenced content
    inside the YAML envelope is preserved without misidentifying later top-level fences
    as envelope terminators, and it separated partial-result classification from budget/timeout-specific
    operator messaging. It also added tests around parsing, retry behavior, and partial-artifact
    rendering.
  approach: The work adjusted the envelope extraction and diagnose artifact typing/rendering
    paths, then validated the behavior with focused tests and review-driven fixes
    for trailing fenced blocks and partial-reason wording.
  files_modified: *id001
what_was_learned:
- claim: Envelope extraction for fenced diagnose output needs to distinguish the matching
    envelope close from unrelated later fenced blocks, because treating every same-kind
    fence as ambiguous rejects otherwise valid diagnoses.
  evidence:
  - type: review_finding
    finding_id: dc9010fb7f4d09d6
    description: This finding reports that a response with a valid fenced YAML envelope
      followed by another top-level fenced block was being rejected as having multiple
      matching closing fences.
  - type: file
    path: src/theforge/task/diagnose_prompts.py
    description: This file was the locus of the envelope parsing changes called out
      by review for nested and trailing fence handling.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 notes that the extractor was corrected to take the first
      envelope-level close so trailing fenced blocks parse again.
- claim: Partial diagnose artifacts need an explicit reason channel separate from
    budget/timeout fallback wording, or operator-visible output continues to attribute
    incompleteness to limits that were not the cause.
  evidence:
  - type: review_finding
    finding_id: 4caddf8045d22eef
    description: This finding states that artifacts marked partial for reasons other
      than budget or timeout still rendered the budget/timeout banner.
  - type: file
    path: src/theforge/diagnose_types.py
    description: This file was changed to alter diagnose artifact representation and
      rendering for partial results.
  - type: file
    path: src/theforge/coordinator/diagnose_flow.py
    description: This file was changed where the coordinator classifies and lands
      diagnose outcomes.
- claim: Preserving the full fenced envelope is not sufficient by itself; invalid
    YAML within the recovered response can still leave diagnose parsing with no artifact.
  evidence:
  - type: review_finding
    finding_id: 746cfed9ef8cd148
    description: 'This finding records that the persisted #2191 response was fully
      extracted but still failed to parse because of an invalid escape sequence in
      a quoted scalar.'
  - type: file
    path: tests/test_diagnose_parse_retry.py
    description: This added test file reflects parser/retry coverage added around
      diagnose parsing failures.
- claim: The audit artifact can diverge from operator-visible classification unless
    the selected partial reason is recorded alongside the landed artifact data.
  evidence:
  - type: review_finding
    finding_id: b453fba9d33382c5
    description: 'This finding notes that audits recorded only partial: true and omitted
      the coordinator-selected reason such as budget exceeded, timeout, or unclassified.'
  - type: file
    path: src/theforge/coordinator/diagnose_flow.py
    description: This file contains the coordinator logic responsible for selecting
      and recording diagnose outcome state.
