review_insights:
  recurring_findings: []
  resolved_findings:
  - finding_id: c249530ee9a47542
    severity: P1
    file: src/theforge/sprint/runner.py
    description: "When a worker running a batch group raises, the scheduler processes\
      \ the same shared future once per member slug and charges the group's whole\
      \ spend to the sprint total on each pass \u2014 once from the leader's in-flight\
      \ entry and once more per non-leader member from that member's mirrored live-state\
      \ cost \u2014 so a three-story group inflates recorded spend to three times\
      \ what the group actually cost."
    cycles_seen: 1
    disposition: fixed
  - finding_id: 0e2c12d05d20293f
    severity: P1
    file: src/theforge/sprint/runner.py
    description: When a story has already been cancelled for budget exhaustion but
      then reaches its worker deadline before returning, the scheduler records it
      as a failed timeout instead of a skipped budget halt.
    cycles_seen: 1
    disposition: fixed
  - finding_id: 11cb186501431f7a
    severity: P1
    file: src/theforge/sprint/runner.py
    description: In a cost-aware batch group, once one member's review pushes spend
      past the sprint budget, later member reviews in the same group can still run
      before the scheduler can see or stop them.
    cycles_seen: 1
    disposition: fixed
  observations:
  - The review loop repeatedly surfaced mismatches between live budget state and terminal
    accounting on exception, timeout, batch, and cancellation paths.
  - Concurrency and shared-future recovery paths were the main source of regressions
    after the initial runtime budget-enforcement wiring landed.
  - Status and RCA visibility mattered alongside enforcement because attribution bugs
    could make a budget halt appear as an unrelated timeout or a complete-cost run.
