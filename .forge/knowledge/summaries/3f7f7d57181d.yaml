what_was_learned:
- claim: For offline or cached report generation that joins issue records to landed
    changes, every rendered field must be sourced from the same selected issue instance;
    allowing title or SHA substitution from another cached issue can still satisfy
    superficial consistency checks while silently pairing the wrong criterion and
    commit.
  evidence:
  - type: review_finding
    finding_id: a40b8f6fc1dbdd94
    description: 'Review demonstrated a concrete false-positive path: replacing issue
      #2595''s cached title and landed SHA with #2689''s values still passed drift
      and classification checks, showing that per-field validation was insufficient
      unless all rendered facts are bound to the same chosen issue record.'
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 explicitly verified the fix by noting that the landed-change
      join now derives its title from the selected diagnose audit, confirming that
      consistent record provenance was the mechanism needed to prevent cross-issue
      pairing.
- claim: In reproducible cohort measurements, a 'refresh mechanical fields' mode must
    preserve the original time window unless the operator explicitly changes it; otherwise
    regeneration mutates the denominator and turns a rewrite into a different measurement.
  evidence:
  - type: review_finding
    finding_id: b74c86fe152845a0
    description: Review found that running --refresh-facts without --until silently
      replaced the stored upper bound with current UTC time, directly changing which
      issues were in the cohort even though the option was described as only rewriting
      mechanical fields.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval states the prior reproducibility defect was fixed
      and the measurement artifacts regenerate cleanly, showing that preserving the
      original bound was necessary to keep reruns on the same cohort.
- claim: Checked-in artifact tests for generated reports need field-specific assertions
    against the semantically important cells; loose token searches or row-count checks
    can let altered classifications and rates pass while the test suite stays green.
  evidence:
  - type: review_finding
    finding_id: f92a2e38944674e9
    description: Review showed the artifact tests still passed after editing generated
      rates, per-issue content, or named criteria, as long as the denominator matched
      row count and some decision token remained, demonstrating that broad shape checks
      do not protect report meaning.
  - type: review_finding
    finding_id: eaea988e3037f0ea
    description: 'A later finding exposed the same weakness at cell level: when the
      corpus was unavailable, a changed landed-answer cell was never asserted and
      a false admits result could pass because the test only searched for the generic
      word ''no'' somewhere in the row.'
