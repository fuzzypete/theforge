  description: The run fixed the diagnose landing mismatch where a completed investigation
    could be marked partial for metadata reasons and then be rejected at LAND because
    lifecycle evaluation no longer matched the producer's declared state. It separated
    strict diagnosis completeness checks from the fields that should actually block
    landing as needs_diagnosis.
  approach: The change traced the coordinator path that forces UNCLASSIFIED_PARTIAL,
    split the diagnosis field validation so verification-oriented omissions do not
    change lifecycle eligibility, and locked the behavior down with focused flow and
    type-level regression tests.
