gate_decision: PASS
dev_notes: |
  summary: >
    Implemented gate output tail surfacing: replaced output[:200] head-slices with
    output[-tail_chars:] tail-slices in gate failure log and dev feedback paths.
    Added gate_output_tail_chars: int = 2000 to ValidationConfig with forge.yaml
    parsing. The coordinator now includes the last 2000 chars of gate output in
    human_feedback when gate returns FAIL, giving the dev agent the actual error
    (failing test, tsc error, lint violation) instead of unrelated preamble.
    All source changes (config.py, coord_gate.py, coord_phases.py) were already
    committed on the branch; this commit adds the two required new tests.

  commits:
    - sha: "b6a972a"
      message: "feat(gate): surface gate output tail in failure logs and dev feedback"

  acceptance_criteria:
    - criterion: "output[:200] replaced with output[-{tail_chars}:] in both gate failure log sites"
      status: MET
      notes: >
        coord_gate.py _run_gate_full: computes output_tail = output[-tail_chars:] and logs
        it via _cu._log on non-zero exit. Unified into a single log path.

    - criterion: "Gate output tail included in human_feedback when gate returns FAIL and dev is retried"
      status: MET
      notes: >
        coord_phases.py _run_validate_phase: on FAIL/BLOCKED branch, human_feedback is set
        to include "Gate output (last N chars):\n{gate_output_tail}" followed by gate
        decision and current handoff content.

    - criterion: "gate_output_tail_chars config field in ValidationConfig (default 2000, backward compatible)"
      status: MET
      notes: >
        ValidationConfig dataclass has gate_output_tail_chars: int = 2000. Backward
        compatible — existing forge.yaml files without this key get 2000.

    - criterion: "forge.yaml parsing reads gate_output_tail_chars"
      status: MET
      notes: >
        load_config() val_data block parses gate_output_tail_chars via int(val_data.get(...)).

    - criterion: "Existing tests pass without modification"
      status: MET
      notes: "819 tests pass. No existing tests were modified."

    - criterion: "New test verifies gate failure log contains tail not head of output"
      status: MET
      notes: >
        test_gate_failure_log_contains_tail_not_head: 5112-char gate output with
        HEAD_SENTINEL at start and TAIL_SENTINEL at end; patches coord_util._log;
        asserts Gate command failed log contains TAIL_SENTINEL and not HEAD_SENTINEL.

    - criterion: "New test verifies dev feedback includes gate output tail on FAIL"
      status: MET
      notes: >
        test_gate_failure_includes_output_tail_in_dev_feedback: same long output, patches
        build_dev_prompt, asserts second call's human_feedback kwarg contains 'Gate output',
        TAIL_SENTINEL, and not HEAD_SENTINEL.

  spec_deviations: none

  deferred_items: none

  gate_result: PASS
