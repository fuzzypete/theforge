what_changed:
  description: The run made adaptive dev selection honor declared dev-capability constraints
    from configuration, including ordinary adaptive selection, downgrade/exploration
    paths, and explicit dev pins. It also aligned the failure mode for 'no dev-capable
    candidate' with the existing typed refusal path.
  approach: The change threaded routing.dev_capable through the model/config objects
    consumed by assignment, then applied it as a hard eligibility gate anywhere dev
    ownership could be chosen or forced, with routing-decision and seam tests used
    to lock behavior across the different selection paths.
  files_modified: *id002
what_was_learned:
- claim: Role-eligibility constraints have to be enforced at every assignment entry
    point, not just in the main adaptive chooser, because explicit pins and fallback/downgrade
    paths can otherwise re-admit a model the primary pool excluded.
  evidence:
  - type: review_finding
    finding_id: 3089ff9c84e8c50c
    description: Review found that after the initial fix, an explicit dev pin to a
      dev_capable=false model still succeeded and was recorded as an included candidate
      with reason none, demonstrating that checking only the ordinary adaptive path
      leaves other assignment entry points able to bypass the constraint.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 explicitly reported that ordinary adaptive and pinned-config
      paths honored dev_capable=false while explicit dev pins still bypassed the prohibition,
      showing the omission was per-boundary rather than a single central rule.
  - type: plan_step
    step_id: '2'
    description: The plan step framed dev-capability as a hard adaptive eligibility
      rule and included auditing the recorded reason, which reflects the need to apply
      the rule uniformly wherever dev candidacy is admitted.
  - type: file
    path: src/theforge/assignment.py
    description: Assignment logic was the locus of both the initial omission and its
      fix, evidencing that dev-role admission had multiple decision points within
      assignment that each needed the same prohibition.
- claim: When introducing a new exclusion that can empty the dev candidate set, future
    work should align its rejection path with the system's existing typed 'no capable
    candidate' handling rather than letting generic exceptions leak from later selection
    code.
  evidence:
  - type: review_finding
    finding_id: 77ebef16b649a2e4
    description: Review identified that making dev_capable=false a hard filter could
      drive the candidate set to empty, and the code then raised a plain ValueError
      instead of the typed NoCapableCandidateError already used for a structurally
      identical absence, showing the error contract must be updated alongside the
      eligibility rule.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval notes that an explicit dev pin matching a dev_capable=false
      identity now raises the typed NoCapableCandidateError, demonstrating that review
      converged on preserving the established refusal shape rather than treating this
      exclusion as a generic selection failure.
  - type: file
    path: src/theforge/assignment.py
    description: The assignment layer contains both candidate filtering and exception
      selection, which is how the run exposed that a new hard exclusion can change
      not only eligibility but also which error surface callers observe.
