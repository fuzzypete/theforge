what_changed:
  description: The run changed sprint budget refusal reporting so unmeasured-spend
    blocks surface operator-facing remedy guidance in both startup/resume and per-story
    dispatch-time paths, including when the unresolved blocker is a carried whole-generation
    marker rather than a directly named story.
  approach: It adjusted the budget and runtime reporting layers to normalize carried
    or derived unmeasured sources back to actionable story identifiers before composing
    refusal messages, then iterated through review to align the guidance emitted from
    different refusal entry points.
  files_modified: *id002
what_was_learned:
- claim: When budget state includes derived carry-forward markers, operator guidance
    must resolve those markers back to the originating story ids; naming only the
    synthetic marker leaves the actionable remediation undiscoverable.
  evidence:
  - type: review_finding
    finding_id: fd6c62cc39ea23c2
    description: Review identified that when only the derived whole-generation marker
      remained unresolved, the refusal named that marker instead of the prior generation's
      story id and therefore could not present the acceptance path tied to a real
      story, demonstrating that future work must translate synthetic sources into
      actionable ids.
  - type: review_finding
    finding_id: 02563cb3c8b765df
    description: Review compared startup and dispatch-time messaging for the same
      unresolved set and found that one path could name story sources while the other
      could not when only the derived marker remained, showing that marker-to-story
      normalization is required anywhere guidance is emitted.
- claim: Acceptance guidance for unmeasured spend must be filtered to only sources
    with a derivable ceiling; generating commands for every carried source can advertise
    remedies that cannot actually clear the condition.
  evidence:
  - type: review_finding
    finding_id: eb0977d795f8f21b
    description: Review found that resumed-sprint refusal logic offered acceptance
      commands for all prior unmeasured stories, including ones whose audit record
      had no derivable ceiling, and that those commands would not resolve the block,
      showing future runs must gate guidance on whether a bounded acceptance path
      exists.
- claim: Equivalent budget-unverifiable states need consistent operator messaging
    across startup/resume refusal and per-story skip paths, or review will reopen
    the same issue as a cross-path inconsistency.
  evidence:
  - type: review_finding
    finding_id: 02563cb3c8b765df
    description: Review flagged that the per-story SKIPPED reason omitted acceptance
      guidance for the same unresolved-source set that startup refusal could explain,
      demonstrating that future changes in this area must verify message parity across
      entry points, not just correctness in one path.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly noted that the iteration extended the
      remedy to both the whole-generation-marker startup case and the per-story runtime
      paths, showing that convergence required aligning multiple operator-facing surfaces
      for the same state.
