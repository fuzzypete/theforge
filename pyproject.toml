[project]
name = "theforge"
version = "0.1.0"
description = "Deterministic multi-LLM development orchestrator"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
forge = "theforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
