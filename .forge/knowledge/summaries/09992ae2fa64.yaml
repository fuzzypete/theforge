  - finding_id: ad903e01c041fb46
    severity: P1
    file: src/theforge/cli/eval_cmd.py
    description: When an operator repeats review-semantic with --no-cache for an input
      digest, model id, and prompt contract version that already have a record, the
      command disables the cache path and the runner invokes the agent again.
    cycles_seen: 1
    disposition: fixed
  - finding_id: 9d470b979549cf0c
    severity: P1
    file: src/theforge/eval/semantic_storage.py
    description: "The identity cache lookup returns the most recent record for a (digest,\
      \ model id, prompt contract version) triple without filtering on status, so\
      \ once a run fails to reach a model or fails to parse, every later default invocation\
      \ for that identity is served the EVALUATION_FAILED record without invoking\
      \ a model \u2014 and when a valid FINDINGS or NO_FINDINGS record was already\
      \ stored for that same identity, the later failure record shadows it and is\
      \ returned in its place."
    cycles_seen: 1
    disposition: fixed
  observations:
  - The review loop concentrated on identity semantics around reruns and on whether
    reporting/baseline flows still meant what the audit slice claimed they measured.
