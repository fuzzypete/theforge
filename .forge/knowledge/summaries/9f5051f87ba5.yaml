what_was_learned:
- claim: When a routing constraint is meant to be a hard prohibition, future work
    must verify every entry path that can bind the role, including explicit pins,
    not just the ordinary adaptive candidate-selection path.
  evidence:
  - type: review_finding
    finding_id: 3089ff9c84e8c50c
    description: Review caught that after the main adaptive path had been updated,
      an explicit dev pin still selected a model declared dev_capable=false and recorded
      it as admitted, showing that checking only the shared adaptive pool was insufficient
      because another role-binding path bypassed the prohibition.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 requested changes specifically because ordinary adaptive
      and pinned-config flows honored dev_capable=false while explicit dev pins still
      bypassed it, demonstrating that future runs need to enumerate and verify each
      role-assignment ingress separately.
  - type: plan_step
    step_id: '2'
    description: 'The plan step framed dev capability as a hard adaptive eligibility
      rule to be applied and audited, which connects the later review miss to a broader
      implementation lesson: hard constraints must be enforced at every boundary where
      eligibility can be reintroduced.'
- claim: Structurally similar refusal cases in assignment should be checked for consistent
    typed failure semantics, because review may accept the policy enforcement while
    still surfacing mismatched error behavior as a separate issue.
  evidence:
  - type: review_finding
    finding_id: 77ebef16b649a2e4
    description: Review identified that the all-dev_capable=false case raised a plain
      ValueError while a neighboring absent-capability case raised NoCapableCandidateError,
      showing that once a new exclusion path is added, future runs should compare
      it against adjacent refusal branches for semantic parity rather than only checking
      the acceptance/rejection outcome.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly notes that the prior explicit-pin issue
      now raises a typed NoCapableCandidateError, demonstrating that the review loop
      treated typed error alignment as part of completing the constraint enforcement
      rather than as incidental cleanup.
  - type: file
    path: src/theforge/assignment.py
    description: Assignment is the locus where both candidate admission and failure
      signaling converge; the review findings against this file show that future changes
      in eligibility logic here should be audited for both gating behavior and the
      exact exception path emitted when no candidate remains.
