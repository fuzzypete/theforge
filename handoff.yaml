dev_notes: |
  summary: "Added `forge check-providers` subcommand to cli.py. The command collects all
    API-mode profiles (mode == 'api', i.e. provider is set) from all config slots —
    dev_profile, preflight_profile, review_pool, synthesis_profile, and
    plan_agent_review.profiles (when enabled) — deduplicates by name, then fans out
    parallel run_api_agent calls via ThreadPoolExecutor. Each call uses
    dataclasses.replace(profile, allowed_tools=()) to force single-shot mode (no tool
    loop). A hardcoded minimal review prompt is used (~100 tokens). Results are printed
    in a table with pass/fail, latency, and cost. Exit code 1 if any profile fails.
    --profile <name> filters to a single profile. Tests mock theforge.cli.run_api_agent
    and theforge.cli.load_config to avoid SDK validation and real API calls."
  commits:
    - sha: "c988072"
      message: "feat(cli): add forge check-providers smoke-test command"
  acceptance_criteria:
    - criterion: "forge check-providers reads all API profiles from forge.yaml"
      status: MET
      notes: "Collects from dev_profile, preflight_profile, review_pool, synthesis_profile,
        and plan_agent_review.profiles; filters on profile.mode == 'api'; deduplicates
        by name."
    - criterion: "Each profile is tested in parallel with a minimal prompt"
      status: MET
      notes: "ThreadPoolExecutor fans out run_api_agent calls; hardcoded minimal prompt
        is a one-line diff review that exercises the structured output path."
    - criterion: "Pass: structured output received with valid verdict field"
      status: MET
      notes: "Checks result.structured_data is not None and 'verdict' in result.structured_data."
    - criterion: "Fail: error message shown inline, exit code 1"
      status: MET
      notes: "Exceptions caught in worker, AgentResult.success=False, and missing verdict
        all produce a row with checkmark=✗ and short error message; return 1 if any_failed."
    - criterion: "Latency and cost reported per provider"
      status: MET
      notes: "time.perf_counter() wraps each run_api_agent call; result.cost_usd rendered
        as $X.XXX in the table."
    - criterion: "--profile <name> tests a single profile"
      status: MET
      notes: "argparse --profile arg filters api_profiles list before ThreadPoolExecutor
        dispatch; unknown name returns 1 without making any API calls."
    - criterion: "No token cost beyond the minimal test prompts (~100 tokens each)"
      status: MET
      notes: "dataclasses.replace(profile, allowed_tools=()) ensures single-shot mode in
        run_api_agent (profile.allowed_tools empty → PROVIDER_RUNNERS path, no agent loop)."
    - criterion: "New tests mock the API calls — no real provider hits in CI"
      status: MET
      notes: "8 tests in TestCmdCheckProviders patch theforge.cli.run_api_agent and
        theforge.cli.load_config; no real forge.yaml is parsed with provider SDKs."
  spec_deviations: none
  deferred_items: none
  gate_result: PASS
  gate_notes: "Full suite: 883 passed, 1 flaky failure (test_already_done_publishes_ntfy,
    exit=-9/SIGKILL under load). The flaky test passes in isolation with and without my
    changes; it is a pre-existing subprocess timing issue unrelated to this story."
gate_decision: PASS
