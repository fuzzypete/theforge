# forge.yaml — TheForge developing itself
project: theforge

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug}"
  setup_command: "python -m venv .venv && .venv/bin/pip install -e . pytest -q"
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"
  on_approve: pr       # create GitHub PR on APPROVE instead of auto-merging
  pr_draft: false

validation:
  gate_command: ".venv/bin/python -m pytest tests/ -q"
  handoff_file: "handoff.yaml"
  gate_decision_key: "gate_decision"

profiles:
  dev:
    cli: claude
    model: sonnet
    budget_usd: 50.00
    timeout_seconds: 600
    timeout_medium_seconds: 900
    timeout_large_seconds: 1800
    allowed_tools:
      - Read
      - Edit
      - Write
      - Bash
      - Glob
      - Grep
  preflight:
    cli: claude
    model: sonnet
    budget_usd: 1.00
    timeout_seconds: 300
    allowed_tools:
      - Read
      - Bash
      - Glob
      - Grep
  review_pool:
    - name: claude-reviewer
      cli: claude
      model: opus
      review_role: correctness
      budget_usd: 5.00
      timeout_seconds: 300
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: codex-reviewer
      provider: openai
      model: o4-mini
      review_role: patterns
      budget_usd: 2.00
      timeout_seconds: 300
      max_iterations: 50
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: gemini-reviewer
      provider: google
      model: gemini-2.5-flash
      review_role: edge-cases
      budget_usd: 1.00
      timeout_seconds: 300
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: deepseek-reviewer
      provider: deepseek
      model: deepseek-chat
      review_role: patterns
      budget_usd: 1.00
      timeout_seconds: 300
      max_iterations: 50
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep

retry:
  max_dev_iterations: 3
  max_review_cycles: 3

plan:
  enabled: true
  model: claude      # CLI binary name
  model_name: sonnet # sonnet is sufficient; opus is overkill for focused specs
  budget_usd: 1.00
  timeout: 600
  timeout_medium: 900
  timeout_large: 1800

plan_review:
  enabled: false  # human gate disabled — agent review replaces it

plan_agent_review:
  enabled: true
  pool:
    - name: claude-plan-reviewer
      cli: claude
      model: opus
      budget_usd: 2.00
      timeout_seconds: 600
      allowed_tools:
        - Read
        - Glob
        - Grep
    - name: codex-plan-reviewer
      provider: openai
      model: o4-mini
      budget_usd: 1.00
      timeout_seconds: 300
      max_iterations: 50
      allowed_tools:
        - Read
        - Glob
        - Grep
    - name: deepseek-plan-reviewer
      provider: deepseek
      model: deepseek-chat
      budget_usd: 0.50
      timeout_seconds: 300
      max_iterations: 50
      allowed_tools:
        - Read
        - Glob
        - Grep

hooks:
  post_run: .forge/hooks/post_run.sh
  timeout_seconds: 30

notifications:
  backend: ntfy
  ntfy:
    # url omitted — resolved from NTFY_URL in .forge/.env
    priority: high
