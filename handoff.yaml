dev_notes: |
  Backward compat strategy used throughout:
  - YAML readers (schemas.py, devhandoff.py, sprint.py) accept both old and new
    key names so existing files keep working.
  - Python aliases (TaskSpec = TaskStory, load_spec = load_story, etc.) let any
    external code that imports the old names continue to work without changes.
  - Hook payload emits both "story" and "spec" keys so user hook scripts aren't
    silently broken.

  The rename was applied in 13 logical steps tracking the dependency graph:
  task.py → story_validator.py → plan_validator.py → schemas.py → review.py →
  devhandoff.py → coord_state.py → coord_hooks.py → coord_audit.py →
  coord_phases.py → coordinator.py → sprint.py → cli.py → ideate.py →
  sprint manifests → tests.
