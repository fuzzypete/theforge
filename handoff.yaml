dev_notes: |
  summary: "Implemented lean story output for forge ideate across three iterations.
    Iter 1 (234f538): added behavioral AC instructions and prohibited-content guidance
    to both single-model and multi-model prompts. Iter 2 (a8ae9a4, f594e60): added
    deterministic enforcement — a 150-line spec limit and _has_prohibited_content()
    scanner covering fenced code blocks, function/class definitions, and @dataclass
    decorators. Iter 3 (0e8a911, f3ba17a): broadened detection to catch bare typed
    signatures (e.g. 'my_func(a: int) -> bool') while narrowing the regex to avoid
    false positives on prose with parenthetical text (e.g. 'Background (current state)')
    by requiring no space between the identifier and '('."
  commits:
    - sha: "f3ba17a"
      message: "fix(lean-story-output): address review findings (iter 1)"
    - sha: "0e8a911"
      message: "fix(lean-story-output): broaden prohibited content detection to catch non-def signatures"
    - sha: "f594e60"
      message: "fix(ideate): reject specs containing prohibited implementation detail"
    - sha: "a8ae9a4"
      message: "fix(ideate): enforce 150-line spec limit deterministically"
    - sha: "234f538"
      message: "feat(ideate): lean story output — behavioral ACs, no implementation detail"
  acceptance_criteria:
    - criterion: "forge ideate output contains no function signatures or code blocks"
      status: MET
      notes: "_has_prohibited_content() scans for code fences, function/class defs,
        @dataclass, and bare typed signatures (identifier immediately followed by '(').
        run_ideation() rejects specs that fail before writing to disk. Verified by
        test_single_model_spec_with_code_block_returns_failed,
        test_synthesis_spec_with_function_def_returns_failed, and
        test_has_prohibited_content_bare_signature."
    - criterion: "Acceptance criteria in generated stories describe observable behavior not internal structure"
      status: MET
      notes: "Both single-model and multi-model prompts instruct the LLM to produce
        observable-behavior ACs and explicitly list what is prohibited."
    - criterion: "file_scope is still populated in frontmatter"
      status: MET
      notes: "Template unchanged in both prompts; file_scope remains in the frontmatter block."
    - criterion: "Phase 1 ideation prompts are unchanged"
      status: MET
      notes: "_build_phase1_prompt not touched."
    - criterion: "Single-model path produces the same lean format"
      status: MET
      notes: "Same prohibition and behavioral AC instructions in _build_single_model_prompt.
        Prohibited-content and line-limit checks apply to both paths via shared check point."
    - criterion: "Generated stories are under 150 lines"
      status: MET
      notes: "_SPEC_LINE_LIMIT = 150 enforced in run_ideation output section. Two tests
        verify rejection for single-model and multi-model paths."
    - criterion: "Existing ideate tests pass or are updated to match new output format"
      status: MET
      notes: "All 48 ideate tests pass (39 original + 9 new across all iterations)."
    - criterion: "A round-trip test: forge ideate → forge run --dry-run on the output produces a valid dev prompt"
      status: MET
      notes: "test_round_trip_ideate_to_dev_prompt calls run_ideation then
        parse_spec_frontmatter + build_dev_prompt, asserting non-empty result containing the spec title."
