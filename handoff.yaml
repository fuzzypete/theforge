gate_decision: PASS
dev_notes: |
  summary: >
    Mirrored the review_pool pattern onto plan_agent_review. PlanAgentReviewConfig
    gained a pool field (list[ModelProfile]) and a profiles property that returns the
    pool when non-empty or constructs a single-profile pool from legacy scalar fields.
    The config parser detects the pool key in plan_agent_review YAML and parses each
    entry via _parse_profile(). In review.py, merge_plan_review_results() was added
    with per-reviewer advisory downgrade applied before merging (any P0 -> REJECT, no
    P0 -> APPROVE, parse errors excluded with warning, all fail -> REJECT). The
    coordinator replaces its single run_agent() call with run_agent_pool(), tracks
    session IDs in state.plan_review_session_ids (dict, replacing the singular field),
    saves them via an updated save_sessions() signature, and merges results
    deterministically. All 828 tests pass.

  commits:
    - sha: "41e8ff1"
      message: "feat(plan-review): add multi-model plan review pool"

  acceptance_criteria:
    - criterion: "AC-1: forge.yaml supports pool format and legacy single-profile format; legacy auto-converts to pool of one"
      status: MET
      notes: >
        PlanAgentReviewConfig.pool field added; profiles property returns pool when
        non-empty, else constructs ModelProfile from legacy scalars. load_forge_yaml
        parses pool entries via _parse_profile(). 6 new test_config.py tests cover
        both paths and edge cases (empty list, duplicate names, provider entries).

    - criterion: "AC-2: Coordinator dispatches plan reviewers via run_agent_pool() concurrently"
      status: MET
      notes: >
        coordinator.py plan review block replaced: builds profiles from
        config.plan_agent_review.profiles, calls run_agent_pool() with session_ids
        from state.plan_review_session_ids.

    - criterion: "AC-3: Deterministic verdict merging — P0 from any -> REJECT, no P0 -> APPROVE, parse errors excluded, all fail -> REJECT"
      status: MET
      notes: >
        merge_plan_review_results() in review.py implements all four rules.
        Per-reviewer advisory downgrade applied before merge so only P0-bearing
        results remain as REJECT when passed to the merger.

    - criterion: "AC-4: Plan review findings from all reviewers concatenated with reviewer-name attribution"
      status: MET
      notes: >
        merge_plan_review_results() prefixes each finding description with [name].
        Coordinator stores merged findings in state.plan_agent_review_findings.
        Validated by test_plan_review_pool_advisory_p1s_concatenated.

    - criterion: "AC-5: state.plan_review_session_ids is a dict mapping reviewer name -> session_id"
      status: MET
      notes: >
        coord_state.py: plan_review_session_id (str|None) replaced with
        plan_review_session_ids (dict[str,str]). sessions.py persists it under
        plan_review_session_ids key. coordinator.py restores on load and updates
        per pool result.

    - criterion: "AC-6: Per-reviewer cost tracking and budget enforcement escalates"
      status: MET
      notes: >
        state.plan_review_results.extend(pr_results) accumulates all pool results;
        total_plan_review_cost sums them. Budget enforcement delegated to runner
        (budget_usd on each ModelProfile). Coordinator logs total pool cost.

    - criterion: "AC-7: PlanAgentReviewConfig gains pool field; existing fields become optional; profiles property returns pool regardless of format"
      status: MET
      notes: >
        pool: list[ModelProfile] field added with field(default_factory=list).
        Legacy fields retain their defaults (backward compat). profiles property
        returns pool or constructs single-profile from legacy fields.

    - criterion: "AC-8: Tests — pool format loads correctly, legacy converts to pool of one, concurrent pool, P0 merging, all-fail REJECT, advisory P1 concatenation"
      status: MET
      notes: >
        6 new tests in test_config.py; 3 new tests in test_coordinator.py
        (pool_p0_from_one_reviewer_rejects, pool_all_fail_rejects,
        pool_advisory_p1s_concatenated). All existing TestPlanAgentReview tests
        updated to route plan review through mock_pool instead of mock_agent.
        828 total tests pass.

  spec_deviations: none

  deferred_items: none

  gate_result: PASS
