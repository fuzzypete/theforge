gate_decision: PASS
dev_notes: |
  summary: "Implemented cycle-aware dev feedback by adding a CycleHistory frozen dataclass
    (cycle, verdict, summary, p1_findings truncated to 200 chars) to coord_state.py, along
    with two new fields on CoordinatorState: cycle_history (list[CycleHistory], capped at 3)
    and escalation_note (str|None, cleared after consumption). A new _append_cycle_history()
    helper in coord_phases.py is called in all four RETRY_DEV return paths of
    _run_review_phase. A _persistent_p1_descriptions() helper in coord_preflight.py returns
    matched P1 description strings using the same token-overlap logic as _has_persistent_p1.
    When persistent P1 triggers model escalation, an escalation_note is built with old/new
    model names and matched finding descriptions. Both build_fix_prompt and build_dev_prompt
    accept optional cycle_history and escalation_note params, rendering Previous Review Cycles
    and Model Escalation sections before the review findings block. Escalation note is cleared
    in _run_dev_phase after the prompt is built. Cycle numbers are monotonically increasing
    (len+1), not tied to the resettable review_cycle counter. 25 new tests added."
  commits:
    - sha: "03d4ed2"
      message: "feat(cycle-aware-feedback): accumulate cycle history and inject into dev prompts"
    - sha: "be14097"
      message: "chore(cycle-aware-feedback): write dev handoff artifact"
  acceptance_criteria:
    - criterion: "CoordinatorState accumulates review cycle summaries (not just raw ReviewResult objects — a lightweight history)"
      status: MET
      notes: "CycleHistory frozen dataclass added; cycle_history field on CoordinatorState; populated in all RETRY_DEV paths via _append_cycle_history()"
    - criterion: "build_fix_prompt includes a 'Previous Cycles' section showing what was flagged and attempted in earlier cycles"
      status: MET
      notes: "build_fix_prompt renders '## Previous Review Cycles' with per-cycle verdict, summary, and P1 findings when cycle_history is non-empty"
    - criterion: "When no previous cycles exist (first review), no history section appears"
      status: MET
      notes: "Section only rendered when cycle_history is non-empty; empty list and None both skip the section; covered by tests"
    - criterion: "When model escalation fires, the dev prompt includes an explicit note about the escalation and which finding triggered it"
      status: MET
      notes: "escalation_note built in _run_review_phase when _has_persistent_p1 fires; rendered as '## Warning Model Escalation' section; cleared after consumption"
    - criterion: "Cycle history is capped at 3 most recent cycles to bound prompt size"
      status: MET
      notes: "_append_cycle_history() trims to last 3 entries after each append; covered by test_cycle_history_capped_at_3"
    - criterion: "review_to_dev_handoff output is unchanged (reviewer->dev format stays)"
      status: MET
      notes: "review_to_dev_handoff was not modified; existing tests confirm no regression"
    - criterion: "All existing tests pass"
      status: MET
      notes: "670 tests pass including all pre-existing tests"
