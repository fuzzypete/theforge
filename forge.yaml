# forge.yaml — TheForge developing itself
project: theforge

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug}"
  setup_command: "test -d .venv || (python -m venv .venv && .venv/bin/pip install -e '.[all]' pytest -q)"
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"
  on_approve: pr
  auto_push: true

validation:
  gate_command: ".venv/bin/python -m pytest tests/ -q"
  handoff_file: "handoff.yaml"
  gate_decision_key: "gate_decision"

profiles:
  dev:
    cli: claude
    model: sonnet
    budget_usd: 50.00
    timeout_seconds: 600
    timeout_medium_seconds: 900
    timeout_large_seconds: 1800
    allowed_tools:
      - Read
      - Edit
      - Write
      - Bash
      - Glob
      - Grep
  preflight:
    cli: claude
    model: sonnet
    budget_usd: 1.00
    timeout_seconds: 300
    allowed_tools:
      - Read
      - Bash
      - Glob
      - Grep
  review_pool:
    - name: claude-reviewer
      cli: claude
      model: opus
      review_role: correctness
      budget_usd: 5.00
      timeout_seconds: 300
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: codex-reviewer
      provider: openai
      model: o4-mini
      review_role: patterns
      budget_usd: 2.00
      timeout_seconds: 300
      max_iterations: 20
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: gemini-reviewer
      provider: google
      model: gemini-2.5-flash
      review_role: edge-cases
      budget_usd: 1.00
      timeout_seconds: 300
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: deepseek-reviewer
      provider: deepseek
      model: deepseek-chat
      review_role: patterns
      budget_usd: 1.00
      timeout_seconds: 300
      max_iterations: 15
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep

retry:
  max_dev_iterations: 3
  max_review_cycles: 3

plan:
  enabled: true
  model: claude
  model_name: sonnet
  budget_usd: 1.00
  timeout: 600
  timeout_medium: 900
  timeout_large: 1800

plan_agent_review:
  enabled: true
  pool:
    - name: claude-plan-reviewer
      cli: claude
      model: opus
      budget_usd: 2.00
      timeout_seconds: 600
      allowed_tools:
        - Read
        - Glob
        - Grep
    - name: codex-plan-reviewer
      provider: openai
      model: o4-mini
      budget_usd: 1.00
      timeout_seconds: 300
      max_iterations: 20
      allowed_tools:
        - Read
        - Glob
        - Grep
    - name: deepseek-plan-reviewer
      provider: deepseek
      model: deepseek-chat
      budget_usd: 0.50
      timeout_seconds: 300
      max_iterations: 15
      allowed_tools:
        - Read
        - Glob
        - Grep

agents:
  - name: haiku
    provider: anthropic
    model: claude-haiku-4-5-20251001
    budget_usd: 1.00
    timeout_seconds: 300
    tier: cheap
    strengths: [fast, triage]
  - name: sonnet
    provider: anthropic
    model: claude-sonnet-4-6
    budget_usd: 5.00
    timeout_seconds: 900
    tier: mid
    strengths: [code, tools, general]
  - name: opus
    provider: anthropic
    model: claude-opus-4-6
    budget_usd: 8.00
    timeout_seconds: 1200
    tier: strong
    strengths: [architecture, review, complex-logic]

assignment:
  enabled: true  # M2: complexity-driven model routing
  min_reviewers: 1
  max_reviewers: 3
  prefer_cross_provider: true
  budget_per_story_usd: 15.00
  escalation_memory: true

hooks:
  post_run: .forge/hooks/post_run.sh
  timeout_seconds: 30

notifications:
  backend: ntfy
  ntfy:
    # url omitted — resolved from NTFY_URL in .forge/.env
    priority: high
