what_changed:
  description: This run added a headless triage path that stops after proposal review,
    persists the result as a pending operator decision, and exposes pending triage
    decisions through CLI status. It also added an opt-in post-sprint trigger that
    invokes triage automatically without blocking or failing the sprint on triage-stage
    errors.
  approach: The work introduced a dedicated coordinator flow for non-interactive triage,
    extended pending-decision storage and status reporting to include triage artifacts,
    and threaded new configuration and sprint-hook entry points through the CLI and
    runner so later ratification reuses the existing interactive decision path.
  files_modified: *id002
what_was_learned:
- claim: When a headless flow persists a later-ratifiable decision, persistence must
    be gated on all prerequisite durable records succeeding; otherwise the system
    can publish a decision that looks actionable but cannot be completed.
  evidence:
  - type: review_finding
    finding_id: f59b715c931767ff
    description: Review caught that headless triage wrote a pending decision even
      after the proposal stage failed to record its audit entry, proving that publishing
      the pending artifact without confirming upstream durability creates an unusable
      ratification target.
  - type: review_cycle
    cycle: '2'
    description: Approval in cycle 2 after the cycle-1 P1 fix shows this durability
      coupling was the blocking correctness issue for the headless persistence path.
  - type: file
    path: src/theforge/coordinator/triage_headless_flow.py
    description: This new coordinator flow is where proposal generation, audit recording,
      and pending-decision publication are sequenced, making it the control point
      where prerequisite writes must succeed before advertising ratifiable state.
- claim: Pending-decision lookup semantics need explicit verification for recency/ordering,
    because a simple iteration-based selector can silently return the wrong unresolved
    item and change which operator action is surfaced.
  evidence:
  - type: review_finding
    finding_id: f6430e08ddc66471
    description: The net-new P2 finding shows unresolved_triage_pending returned the
      oldest item by exiting on the first loop iteration, demonstrating that pending-selection
      logic can be wrong even when the code appears straightforward.
  - type: file
    path: src/theforge/pending.py
    description: The finding is localized to the pending-decision retrieval helper,
      showing that ordering assumptions inside shared pending utilities directly determine
      which unresolved triage artifact users see.
