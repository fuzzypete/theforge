what_changed:
  description: This run added per-phase knowledge receipt/debrief capture, verification,
    audit storage, and report surfacing for prior-run knowledge injections, including
    explicit handling for unmatched citations, unaddressed claims, undebriefed phases,
    and separate corroborated versus uncorroborated use counts.
  approach: The change introduced a dedicated receipt/verifier model, rendered stable
    claim references into injected context, required debrief output only for phases
    that received knowledge, persisted verified receipt data into the audit schema,
    and built reporting paths from audit records through the CLI knowledge report.
  files_modified: *id002
what_was_learned:
- claim: Evidence-pointer corroboration for claimed knowledge use must resolve against
    specific artifact containment, not broad category matches or token overlap, or
    unrelated artifacts will be miscounted as corroborated use.
  evidence:
  - type: review_finding
    finding_id: 232d7ffaf9cff8c6
    description: The finding shows that a use claim was incorrectly corroborated when
      the cited commit only touched a broad rebuild entry point category, demonstrating
      that loose pointer matching creates false-positive corroboration.
  - type: review_cycle
    cycle: '2'
    description: The second review cycle reports that the first fix still allowed
      corroboration from a single overlapping token, showing that partial narrowing
      is insufficient and that matching must require stronger containment to avoid
      unrelated evidence being accepted.
  - type: review_cycle
    cycle: '3'
    description: Approval in cycle 3 attributes the fix to containment matching, demonstrating
      the level of pointer resolution that prevented the repeated false-positive corroboration
      issue.
  - type: diff
    ref: ccd77626c19e4fdd687a59f8d577d3496edf8b6b
    description: This final diff is the revision accepted after repeated review on
      the same failure mode, evidencing that the durable fix was in the corroboration-matching
      logic rather than elsewhere in the feature.
