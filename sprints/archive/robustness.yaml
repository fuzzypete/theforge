name: "TheForge robustness sprint — anti-churn and right-sizing"
budget_usd: 60.00

# Fixes the root causes of forge churn observed in the trace-capture saga:
#
# Order matters:
#   1. spec-validation        — cheapest win; block bad specs before PLAN burns money.
#                               No dependencies.
#   2. lean-story-output      — fixes the source of requirement bugs in forge ideate.
#                               No dependencies on (1), but benefits from it existing.
#   3. complexity-based-timeouts — right-size agent runs using preflight complexity.
#                               No dependencies on (1) or (2).
#   4. session-resume-review-path — reviewer/dev session continuity across forge review
#                               invocations. No dependencies on above, but most complex.

stories:
  - specs/spec-validation.md
  - specs/lean-story-output.md
  - specs/complexity-based-timeouts.md
  - specs/session-resume-review-path.md
