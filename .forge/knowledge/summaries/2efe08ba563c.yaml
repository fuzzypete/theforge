    file: src/theforge/coordinator/audit_storage.py
    description: When a v38 audit record contains the production-shaped argument-rejection
      diagnostic with ran true, exit_code 4, and no hanging test, migration to v39
      records workload_executed true even though the diagnostic workload never ran.
    cycles_seen: 1
