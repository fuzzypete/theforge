what_changed:
  description: This run designed and wired a new project-memory publication path plus
    a separate landing-evidence model so shared run records can accumulate in the
    repository without relying on direct commits to the base branch or mutating run
    records after landing outcomes resolve. It also aligned sprint wrap-up, reconciliation,
    and observation flows around publishing explicit landing attempt and landing assertion
    artifacts across supported landing modes.
  approach: 'The change split substrate memory publication from landing-state reporting:
    publication logic was moved into dedicated memory-publication flows, landing evidence
    was modeled as its own artifact family, and runner/audit orchestration was revised
    so terminal outcomes are observed and published through those artifacts instead
    of by rewriting accumulated run records.'
  files_modified: *id002
what_was_learned:
- claim: When positive landing evidence is derived from pull-request reconciliation,
    matching on branch identity is insufficient; the evidence writer must bind the
    resolved PR or merge back to the current run's reviewed commit set, or an older
    merged PR on the same branch can be misattributed as proof for the current run.
  evidence:
  - type: review_finding
    finding_id: 75466cd845270e23
    description: Review found that reconciliation accepted an older merged PR for
      the same branch name and then emitted a positive landing assertion for the current
      run, demonstrating that branch-level matching alone can fabricate landing evidence
      unless commit identity is checked.
  - type: file
    path: src/theforge/sprint/landing_observation.py
    description: This is the observation/reconciliation path where review caught the
      misbinding, showing that PR-resolution logic is the point where commit-to-PR
      identity must be enforced rather than inferred from branch naming.
- claim: Negative landing outcomes must be recorded as separate attempt events, not
    by rewriting the accumulated run record, because terminal world-state changes
    after approval do not change what the run itself did.
  evidence:
  - type: review_finding
    finding_id: 09cd1c65827f5654
    description: Review flagged that failed and timed-out landing paths still rewrote
      the run's landing_status before writing a separate attempt artifact, showing
      that leaving any negative-state mutation in the run record breaks the intended
      separation between immutable run memory and external landing outcomes.
  - type: file
    path: src/theforge/sprint/runner.py
    description: The runner owns terminal wrap-up, so this finding in runner logic
      demonstrates that the invariant has to be enforced at the orchestration layer
      where outcomes are finalized, not only in storage helpers.
- claim: Landing-evidence publication has to be enforced on every terminal resolution
    path, including asynchronous queued-PR resolvers, because outcome-specific fast
    paths can otherwise mark a story complete without producing the corresponding
    evidence artifacts.
  evidence:
  - type: review_finding
    finding_id: 1f344f323e263ee1
    description: Review found a queued-PR resolution path that removed a story from
      the queue as landed or failed without writing either positive landing evidence
      or a terminal attempt artifact, demonstrating that terminal evidence requirements
      must be applied per resolution path, not assumed from the general wrap-up flow.
  - type: review_cycle
    cycle: '2'
    description: The second review cycle surfaced this omission after earlier fixes
      were already in place, showing that asynchronous/queued resolution remained
      a distinct source of drift unless checked separately.
learned_patterns:
- commit-bound-landing-evidence
- immutable-run-records
- per-path-terminal-evidence
