dev_notes: |
  summary: "Added a configurable minimum-success threshold for plan agent review and changed empty/whitespace reviewer output from a silent success into an explicit parse failure that is recorded in plan review state and surfaced in the audit reviewer_failures section. Also added coordinator tests covering both audit recording for empty reviewer output and escalation when the number of parseable reviewer results falls below the configured minimum."
  commits:
    - sha: "6c35956"
      message: "fix(plan-review): record empty reviewer failures"
  acceptance_criteria:
    - criterion: "Plan reviewer failures are recorded in the audit log"
      status: MET
      notes: "Empty or whitespace-only reviewer output is now treated as a failure path, captured in state.plan_review_failures, and emitted in the audit log reviewer_failures block instead of being silently ignored."
    - criterion: "If successful reviewers drop below a minimum, the run escalates rather than silently approving"
      status: MET
      notes: "PlanAgentReviewConfig now supports min_reviewers, config loading reads it, and plan review escalates when parseable reviewer results are fewer than the configured minimum; this is covered by a test with min_reviewers=2 and only one parseable review."
  story_deviations: none
  deferred_items:
