what_changed:
  description: Added a read-only `forge triage` backlog report that inventories all
    open finding-labeled issues, computes mechanical staleness evidence, and emits
    both CLI output and a structured artifact. The run also documented the report
    format and exercised the CLI and report generator with focused tests.
  approach: The change introduced a dedicated backlog-reporting module, wired it into
    the CLI as a deterministic reporting path, and iterated through review-driven
    fixes for citation parsing, evidence identity, and line-anchor handling so the
    emitted artifact stayed mechanically derivable and loadable.
  files_modified: *id002
what_was_learned:
- claim: Citation handling needs to normalize and evaluate repository paths and fragments
    separately; otherwise common reference forms produce false stale or unverified
    results.
  evidence:
  - type: review_finding
    finding_id: 12fdfc98274d453e
    description: This finding showed that treating a GitHub-style anchor like `src/demo.py#L1`
      as a literal path caused an existing file to be reported absent, demonstrating
      that path existence must be checked on the file portion after fragment parsing.
  - type: review_finding
    finding_id: 849b67bb896b4b3c
    description: 'This finding showed that range anchors need their own bounds check:
      collapsing `#L1-L3` to line 1 let a partially missing cited range appear active,
      so fragment semantics cannot be reduced to a single-line existence test.'
  - type: review_finding
    finding_id: 087e17a3b3c9392b
    description: This unresolved finding showed that non-line fragments on existing
      files still carry checkable path/churn evidence even when the fragment itself
      is not interpretable, so fragment parse failure should not discard file-level
      verification.
  - type: review_finding
    finding_id: 1194e7855b60c906
    description: 'This finding showed the opposite failure mode: prose mentions of
      bare filenames were over-read as repository citations and marked stale, demonstrating
      the need for stricter path recognition before any absence claim is emitted.'
- claim: Structured evidence identifiers must be unique per cited instance and evidence
    kind, or downstream artifact loading can fail even when the report text looks
    correct.
  evidence:
  - type: review_finding
    finding_id: 3e045aa830fd9ff7
    description: This finding showed that citing the same file multiple times produced
      duplicate `path:...:churn` identifiers, which broke consumer loading of the
      artifact; repeated citations therefore need disambiguated identities, not just
      repeated rows.
  - type: review_finding
    finding_id: 4b85a7a1e740fef2
    description: This finding showed that the initial regression only covered one
      duplicate shape, leaving other duplicate-id variants undetected, reinforcing
      that identifier uniqueness has to hold across absent, unattributable, and repeated-path
      evidence forms.
- claim: For machine-consumable report formats, documentation has to enumerate all
    emitted evidence shapes, not just the happy-path example, because undocumented
    variants become part of the consumer contract immediately.
  evidence:
  - type: review_finding
    finding_id: df016661ec1dc511
    description: This finding showed that the published artifact example documented
      only stale-evidence rows while the generator also emitted unverified, invalid,
      and range-scoped identifiers, demonstrating that format docs must describe the
      full emitted shape seen by downstream readers.
learned_patterns:
- separate-path-from-fragment
- unique-evidence-instance-ids
- document-all-emitted-variants
