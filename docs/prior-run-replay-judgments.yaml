corpora:
  theforge:
    replay_run_ids:
    - 73d7de156730
    claims:
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: cf857907b6ed
      claim_hash: 53a9e9a6200d
      claim: Review-only handling for batched non-leader stories must use the same
        per-story diff-grounding rules as the main review flow, or sibling findings
        can still fail the wrong story.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: cf857907b6ed
      claim_hash: 0d80165af2b7
      claim: Batch-member grounding has to be computed from the member story's own
        diff rather than a leader or shared-worktree combined diff, otherwise sibling
        stories in the same batch can be treated as relevant evidence.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: cf857907b6ed
      claim_hash: 02fdcbe691d1
      claim: Any path that resolves attributed commit SHAs for diff grounding must
        treat them as data, because shell-interpreted revision resolution can turn
        review metadata into command execution.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: cf857907b6ed
      claim_hash: 8a0d3c15250b
      claim: A finding's grounding status needs to be recomputed each review cycle
        from current story evidence, because a previously ungrounded P1 can later
        become grounded and should then participate in blocking decisions.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: cf857907b6ed
      claim_hash: af5f3090b7c0
      claim: Non-blocking dispositions for ungrounded findings must be honored consistently
        by escalation and topology analysis, not just by the immediate review verdict
        path.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: cf857907b6ed
      claim_hash: 8056a75e8c43
      claim: Making false-rejection cases recoverable required schema and audit-path
        changes, not only review logic changes, so diff-grounding outcomes are preserved
        in recorded run artifacts.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: eb45f2b9ab9f
      claim_hash: 69cb8f2b69be
      claim: When multiple durable artifact directories are published by one git-backed
        flow, tests need to exercise each directory independently as well as together,
        because combined fixtures can hide regressions in per-directory dirty-state
        handling.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: eb45f2b9ab9f
      claim_hash: a8c317ca857e
      claim: Once a publish flow handles more than one artifact tree, failure reporting
        needs to name the specific artifact being inspected, staged, or committed
        so publish-state diagnostics remain accurate.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 27bb13e86070
      claim_hash: 0f3f6dfac5f5
      claim: Optional post-completion side effects need their own persisted outcome
        state; otherwise attempted-and-succeeded, attempted-and-refused, and not-attempted
        remain indistinguishable in operator-facing reporting.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 27bb13e86070
      claim_hash: cab8debdbd40
      claim: In sprint execution, repeated writes for the same finished story must
        reuse a durable prior outcome instead of re-evaluating generation, or later
        writes can erase richer state and trigger duplicate billable work.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 27bb13e86070
      claim_hash: a4b38c83b77e
      claim: When a feature adds structured audit data, the canonical run record,
        sprint audit writer, schema fixture, and schema guard must evolve together
        or one reporting surface will lag behind the others.
      effect: plan
      rationale: Would have expanded the plan to update every persisted audit and
        schema surface together.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 27bb13e86070
      claim_hash: 2249d6c298d6
      claim: Duplicating gate logic after an eligibility decision creates drift risk;
        the outcome reason should come from the original gate evaluation rather than
        being reconstructed in a second condition chain.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 27bb13e86070
      claim_hash: 1b23ea4a2258
      claim: 'Deferring canonical audit persistence until after a post-DONE agent
        call changes failure windows: interruption during that call can leave no canonical
        record for work that had previously been recorded earlier.'
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 27bb13e86070
      claim_hash: 646efdf2d483
      claim: Short-circuiting on any durable attempted outcome before consulting current
        eligibility can make re-entered runs under the same run id permanently inherit
        an earlier skip/refusal state.
      effect: plan
      rationale: Even though this claim would have been truncated at the five-claim
        render cap, it would have pointed at the durable-state inheritance risk relevant
        to the bug.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 6b45fea7f887
      claim_hash: 1494b57d1105
      claim: When audit data attributes cache invalidation causes, fingerprint comparisons
        need to accumulate every diverged component rather than storing a single scalar
        cause based on comparison order.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 6b45fea7f887
      claim_hash: d9366b677804
      claim: For invalidated cache records, keeping one consistent audit shape avoids
        forcing consumers to branch between singular and plural cause fields.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 6b45fea7f887
      claim_hash: c65748e0ffa4
      claim: A seam test that reproduces a sibling merge moving both the worktree
        head and the base branch head is effective coverage for this cache-validation
        reporting path.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 1a6b6e18d232
      claim_hash: a638c52c19c7
      claim: Envelope extraction for fenced diagnose output needs to distinguish the
        matching envelope close from unrelated later fenced blocks, because treating
        every same-kind fence as ambiguous rejects otherwise valid diagnoses.
      effect: plan
      rationale: Would have put parser fence-matching on the initial plan instead
        of discovering it through investigation.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 1a6b6e18d232
      claim_hash: 5b9ed00e78af
      claim: Partial diagnose artifacts need an explicit reason channel separate from
        budget/timeout fallback wording, or operator-visible output continues to attribute
        incompleteness to limits that were not the cause.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 1a6b6e18d232
      claim_hash: 40ded6cc91ce
      claim: Preserving the full fenced envelope is not sufficient by itself; invalid
        YAML within the recovered response can still leave diagnose parsing with no
        artifact.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 1a6b6e18d232
      claim_hash: 577b31b8f17b
      claim: The audit artifact can diverge from operator-visible classification unless
        the selected partial reason is recorded alongside the landed artifact data.
      effect: plan
      rationale: Would have put audit-side partial-reason persistence into scope from
        the start.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 1f11fc786002
      claim_hash: 3080b56e4c34
      claim: When phase names are validated from a hand-maintained list instead of
        deriving from actual dispatch sites, the newest dispatched phase becomes unnameable
        in routing.phase_eligibility until a separate source edit adds it.
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 1f11fc786002
      claim_hash: bd3ebba99e44
      claim: 'Fixing phase-vocabulary drift exposed a second coupling in knowledge-summary
        selection: preserving the plan-derived profile matters because fallback transport,
        budget, timeout, and role identity can be lost if agent-pool selection overrides
        it.'
      effect: none
      rationale: Did not materially change the plan, implementation, or verification
        for this story.
    - replay_run_id: 73d7de156730
      phase: plan
      prior_run_id: 1f11fc786002
      claim_hash: 604396e12b9e
