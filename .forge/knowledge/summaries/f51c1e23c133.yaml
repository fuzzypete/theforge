what_was_learned:
- claim: When a resume-level blocker is represented by a derived aggregate marker,
    operator guidance must still be projected back to the underlying story sources;
    otherwise the system names a source the operator cannot act on and hides the identifiers
    needed to clear the condition.
  evidence:
  - type: review_finding
    finding_id: fd6c62cc39ea23c2
    description: The review found that when only the whole-generation marker remained
      unresolved, the refusal named that derived marker, omitted usable acceptance
      guidance, and failed to print the prior story id that the acceptance path actually
      requires, showing future work must resolve aggregate blockers back to actionable
      source ids.
  - type: review_finding
    finding_id: 02563cb3c8b765df
    description: The review also found the dispatch-time SKIPPED reason diverged from
      startup behavior in the same aggregate-marker case, reinforcing that every operator-facing
      path must map the derived blocker to the same underlying clearable sources.
- claim: Acceptance guidance for unresolved spend has to be filtered by whether a
    per-story ceiling is actually derivable; emitting commands mechanically for every
    recorded source can direct operators to a path that cannot succeed.
  evidence:
  - type: review_finding
    finding_id: eb0977d795f8f21b
    description: The review found resumed-sprint refusals were offering acceptance
      commands for all prior unmeasured stories, including ones whose audit records
      had no derivable ceiling, demonstrating that guidance generation must be constrained
      by the same feasibility checks as acceptance itself.
- claim: Budget refusal messaging needs consistency across startup/resume and per-story
    dispatch paths, because the same unresolved accounting state can surface in multiple
    phases and inconsistent remedies create different operator behavior for one underlying
    condition.
  evidence:
  - type: review_finding
    finding_id: 02563cb3c8b765df
    description: This finding compared dispatch-time SKIPPED messaging against startup
      refusal messaging for the same unresolved-source set and showed they diverged
      on whether they exposed a remedy, demonstrating the need to verify parity across
      lifecycle phases rather than validating only one entry point.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly called out that the remedy was extended
      to the whole-generation-marker case at startup and across the broader runtime
      paths, showing the run's verification focus centered on cross-path consistency
      rather than a single message site.
