review_insights:
  recurring_findings: []
  resolved_findings:
  - finding_id: b4a77236abedfee4
    severity: P1
    file: src/theforge/cli/shared.py
    description: "When a single-story run finishes and the shared story-run artifact\
      \ publish step cannot complete \u2014 for example the project root has a branch\
      \ other than the configured base branch checked out, or the base branch has\
      \ no reachable origin to push to \u2014 the publish error propagates out of\
      \ the audit write, so the command aborts with a Python traceback and exit code\
      \ 1 after the run has already completed and been paid for, and the operator\
      \ never sees the audit path, the outcome line, or the cost."
    cycles_seen: 1
    disposition: fixed
  - finding_id: 05b3f6de2e09e753
    severity: P1
    file: src/theforge/cli/shared.py
    description: When a single-story run writes its run record and the shared artifact
      publish cannot complete, the command warns and returns with the record still
      uncommitted in the project root, so the next merge-mode invocation is refused
      on Forge-owned dirt.
    cycles_seen: 1
    disposition: fixed
  - finding_id: 847d7bc271f98466
    severity: P1
    file: src/theforge/cli/shared.py
    description: When a single-story run's artifact publish fails with a branch mismatch
      or a failed commit, the per-run JSON that was already indexed into the SQLite
      audit substrate is copied to an ignored .forge path and then removed from .forge/audits/runs,
      so the substrate holds a native row whose source file no longer exists, the
      next runtime reader treats the substrate as stale and rebuilds it from the remaining
      run files, and that run disappears from both the canonical tree and the substrate.
    cycles_seen: 1
    disposition: fixed
  observations:
  - 'The review loop repeatedly exposed second-order effects of publish-failure handling:
    first uncaught errors, then blocked re-entry from leftover canonical files, then
    stale or duplicate index state after preservation, and finally visibility gaps
    around preserved artifacts.'
