    - criterion: "Handoff copied to .forge/logs/ after each dev iteration"
      status: MET
      notes: "Best-effort copy added in _coordinator_loop after handoff validation block.
        Writes to state.log_dir / handoff-iter-{state.dev_iteration}.yaml. Wrapped in
        try/except to never block pipeline."

    - criterion: "All existing tests pass (including the 5 previously skipped)"
