  description: The run classified agent invocations that are terminated by runner
    or system conditions before producing a result, distinguished those terminations
    from ordinary empty failures, and prevented those non-executed kills from consuming
    story retry budget. It also narrowed process cleanup to owned processes so cleanup
    from prior work does not reach later sequential invocations.
  approach: The change introduced explicit termination/result-state plumbing across
