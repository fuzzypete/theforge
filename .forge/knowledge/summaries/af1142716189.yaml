  - finding_id: 253bcb7769dd246e
    severity: P1
    file: src/theforge/cli/author.py
    description: When promoting an existing draft issue and the title/body edit fails
      after label changes succeed, the command can remove todo:draft from the old
      draft body and leave it looking promoted.
    cycles_seen: 1
    disposition: fixed
  - finding_id: 6a156f7403e60a6a
    severity: P1
    file: src/theforge/intake/author_flow.py
    description: "Resuming a saved incomplete draft leaves the generated banner line\
      \ 'Status: incomplete draft \u2014 do not submit yet' inside the finished body,\
      \ so a completed, gate-passing issue is written out and filed still carrying\
      \ the do-not-submit notice, and a second incomplete pass stacks another copy\
      \ of the banner on top of the first."
    cycles_seen: 1
    disposition: fixed
  - finding_id: 9c8271117505952b
    severity: P1
    file: src/theforge/cli/author.py
    description: The --type flag offers 'epic' and 'operator-action', but a fully
      answered body of either type is always classified as a draft, is stamped with
      the incomplete-draft banner and todo:draft, and is refused at --create, so choosing
      either type leaves the author in a loop with no answer that can ever finish,
      and for operator-action the reported reason list is empty so the banner says
      only that shape-gate findings remain.
    cycles_seen: 1
    disposition: fixed
