what_changed:
  description: The run corrected audit-publish commit-failure handling so terminal
    commit-step failures persist a commit_failed state before raising, and aligned
    the emitted failure messaging with whether state was actually recorded. It also
    updated the controller runbook and related tests around this failure mode.
  approach: The change followed the existing durable-state recording pattern already
    used by other publish refusal paths, applied it across each commit-step failure
    branch, then tightened surrounding documentation and verification to match the
    persisted-state contract and error reporting.
  files_modified: *id002
what_was_learned:
- claim: When a terminal log message claims a diagnostic state was recorded, verification
    needs to cover the failing paths individually; shared top-level formatting can
    make multiple distinct error branches all assert the same false durable-state
    claim.
  evidence:
  - type: file
    path: src/theforge/sprint/audit_publish.py
    description: The inspected implementation had three separate commit-failure raises
      without preceding state writes, while the top-level publish path appended the
      same '[state=...; recorded in ...]' suffix whenever an exception carried state,
      showing that per-branch checks are needed rather than trusting shared reporting.
  - type: review_cycle
    cycle: '1'
    description: Review approved only after confirming all three commit-step failure
      paths record commit_failed before raising and that the misleading recorded-in
      marker claim was removed, demonstrating that the risk existed in each branch,
      not just in one representative failure.
  - type: diff
    ref: 762bd68603f8c9708d0657790f4db42c126a9c0f
    description: The final diff applies the state-recording fix across the git-status
      inspect, git add, and git commit failure branches and adjusts failure reporting,
      evidencing that the durable-state contract had to be enforced at every terminal
      branch where the shared message could otherwise misstate reality.
- claim: Operator-facing diagnostic tables must be updated whenever a new persisted
    terminal state becomes part of failure handling, or the artifact can be present
    yet still mislead triage.
  evidence:
  - type: review_finding
    finding_id: ec2853ab8d7192f6
    description: Review flagged that the controller runbook's audit-publish state
      table omitted commit_failed even after that value was being written, directly
      showing that state persistence alone is insufficient if the documented interpretation
      map is incomplete.
  - type: file
    path: docs/guides/controller-runbook.md
    description: The runbook is the operator reference for interpreting audit-publish
      state values, so its inclusion in the change demonstrates that persisted-state
      semantics are consumed through documentation during diagnosis.
  - type: review_cycle
    cycle: '2'
    description: Second-cycle review noted the prior documentation finding was resolved,
      confirming that documenting the new terminal state was treated as necessary
      to make the recorded artifact diagnostically usable.
- claim: Regression checks for artifact-publish failures need to preserve assertions
    about which artifact path appears in the error, because broad label-only assertions
    can miss directory-specific reporting regressions.
  evidence:
  - type: review_finding
    finding_id: 6bc3a83377ba306f
    description: Review identified that a rewritten test kept only the error-label
      prefix and dropped the assertion that the failing artifact directory path appears
      in the message, showing that message specificity about the failing location
      is a distinct contract worth retaining.
  - type: file
    path: tests/test_sprint_audit_publish.py
    description: The affected test file was where the path-specific assertion was
      lost and then addressed, demonstrating that verification for these failures
      must check not just failure class but also artifact-location detail.
  - type: review_cycle
    cycle: '2'
    description: Cycle-2 approval reported the prior test-fidelity finding resolved,
      indicating that preserving directory-specific error assertions was necessary
      before review considered the verification complete.
