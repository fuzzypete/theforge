what_changed:
  description: This run added a shape-check sweep that can preview or apply reconciliations
    across all open issues when shape policy changes, and threaded a policy digest
    into bot comment reconciliation. It also wired policy-change workflows so pull
    requests show the projected delta and post-merge/manual runs can execute the sweep.
  approach: The change separated pure sweep planning from write operations, kept single-issue
    event handling in place, and used workflow triggers plus digest-based comment
    comparison to make reconciliations idempotent and scoped to actual drift.
  files_modified: *id002
what_was_learned:
- claim: When consuming GitHub pagination during repository-wide sweeps, future runs
    should treat Link-header URLs as authoritative only after validating scheme and
    host, because endpoint-shape assumptions and unchecked absolute links each caused
    distinct failure modes.
  evidence:
  - type: review_finding
    finding_id: 4841cb0cca954943
    description: Review found that rewriting a paginated /repositories URL into a
      repository-relative /repos path broke page-2 retrieval for repos with more than
      100 issues, showing that pagination code cannot assume one endpoint shape.
  - type: review_finding
    finding_id: 9d8e4a6f3687cc81
    description: Review found the helper would follow an absolute http:// Link URL
      while attaching the bearer token, demonstrating that pagination handling must
      validate scheme before reusing authenticated requests.
  - type: review_finding
    finding_id: 50f03eced166bd9d
    description: Review found that off-host or wrong-scheme pagination links caused
      a silent early stop with partial results, showing validation must be paired
      with explicit signaling so incomplete sweeps are distinguishable from complete
      ones.
- claim: For reconciler-style automation, future runs should preserve operator-owned
    labels unless policy explicitly owns them end-to-end; otherwise the automation
    can erase manual state and change its own future inputs.
  evidence:
  - type: review_finding
    finding_id: d64701d00535401a
    description: Review showed that removing the configured tracking label from issues
      whose computed shape was not tracking-only deleted an operator-applied epic
      label and altered the next evaluation's reason set, demonstrating feedback-loop
      risk when automation clears labels it does not fully own.
  - type: review_finding
    finding_id: baa8cc01e5226371
    description: Review later noted a reporting branch for '(no longer tracking)'
      had become unreachable after reconciliation stopped emitting that removal, reinforcing
      that ownership of that label path had been intentionally withdrawn.
- claim: If policy digests and workflow path filters depend on a manifest of policy
    files, future runs should treat that manifest as a checked contract rather than
    a best-effort list, because file moves can simultaneously break runtime evaluation
    and stop CI from noticing policy changes.
  evidence:
  - type: review_finding
    finding_id: 47408b58758a6330
    description: Review found the hardcoded policy-file list had no existence guard,
      so renaming or splitting a policy module would raise FileNotFoundError at runtime
      while the workflow path filter silently stopped matching the moved code, showing
      the manifest boundary itself needs protection.
  - type: plan_step
    step_id: '1'
    description: 'The plan explicitly centered the digest boundary in step 1, which
      makes the later failure mode meaningful: future work that defines such a boundary
      must also verify the referenced files remain valid.'
- claim: Repository-wide apply operations that create per-issue comments can produce
    backlog-sized notification bursts on first rollout, so future runs should account
    for side effects of initializing previously untouched issues separately from steady-state
    reconciliation.
  evidence:
  - type: review_finding
    finding_id: c78f43183c7d6407
    description: Review found that the first apply sweep would post a bot comment
      on every open issue lacking one, creating roughly one notification per issue
      across the backlog, which demonstrates a rollout-specific side effect not visible
      from idempotent steady-state behavior alone.
learned_patterns:
- validated-pagination-links
- preserve-operator-owned-labels
- guard-policy-manifest-boundary
- backlog-comment-fanout
