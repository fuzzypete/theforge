what_changed:
  description: Added a prior-run replay capability that runs completed stories through
    the existing selection path, renders the advisory output, and records per-story
    judgments plus an aggregate replay report. The run also wired the feature into
    the CLI and added tests around replay behavior, rendering, and corpus-backed validation.
  approach: The implementation introduced dedicated replay and render modules, a CLI
    entrypoint, a checked-in judgments dataset, and a generated markdown record. The
    work was refined through review to make replay inputs line up with production
    constraints, keep recorded phase inputs isolated, and make corpus/judgment drift
    fail loudly in tests instead of aborting late or skipping assertions.
  files_modified: *id002
what_was_learned:
- claim: Replay fixtures that are meant to reproduce a live corpus need complete judgment
    coverage for every replayed story, otherwise the command becomes unrunnable as
    soon as a referenced entry is missing.
  evidence:
  - type: review_finding
    finding_id: 5010a599e35c24ea
    description: The replay command aborted because a specific TheForge story lacked
      a recorded judgment in the checked-in judgments file.
  - type: file
    path: docs/prior-run-replay-judgments.yaml
    description: This file holds the replay judgments whose completeness determines
      whether the corpus replay can run.
- claim: Analysis probes used to summarize selector behavior need to execute under
    the same candidate limits as production selection, or they can report co-surfacing
    outcomes that the real budgeted assembly would never present.
  evidence:
  - type: review_finding
    finding_id: caa006ea0d2a0e8d
    description: The fence-parsing co-surface probe used a 999-candidate limit, which
      produced a positive co-surface result that disappeared under the production
      assembly budget.
  - type: file
    path: src/theforge/prior_run_replay.py
    description: The replay implementation contains the probe logic whose limits had
      to match production behavior.
- claim: Recovered phase inputs should be stored as independent values per phase;
    sharing one mutable dictionary between dev and review recordings can silently
    corrupt the replay record if either phase is later adjusted.
  evidence:
  - type: review_finding
    finding_id: fcf543d5df2417a0
    description: Review identified that dev and review phase-input entries were bound
      to the same dictionary object, making later mutation leak across phases.
  - type: file
    path: src/theforge/prior_run_replay.py
    description: This module records replay phase inputs and was the site of the shared-dictionary
      issue.
- claim: When historical stories lack structured plans, replay scoring can legitimately
    lose file-overlap evidence and fall back to weaker qualifying signals in the report.
  evidence:
  - type: review_finding
    finding_id: 8bc4cded4b60556b
    description: Review noted that most TheForge run records did not persist a structured
      plan, so many dev and review replays had no file-overlap input and instead qualified
      on story or domain signals.
  - type: file
    path: docs/prior-run-replay-record.md
    description: The generated replay record is where those rows and their qualifying
      signals were observed.
- claim: Corpus-backed tests for checked-in replay judgments need to fail explicitly
    on corpus/judgment drift; otherwise they either break for unrelated new summaries
    or pass by returning early without validating anything.
  evidence:
  - type: review_finding
    finding_id: d620d397f091d7dd
    description: One test failed as soon as an unrelated new summary entered the tracked
      corpus because the replay requires judgments for every claim.
  - type: review_finding
    finding_id: 6d98759d7ce3b30f
    description: Another test returned early once corpus run ids diverged from the
      judgment file, letting the suite pass without asserting replay correctness.
  - type: file
    path: tests/test_prior_run_replay.py
    description: This test module contained the corpus replay checks that were adjusted
      to handle drift loudly instead of silently.
learned_patterns:
- production-faithful-analysis-probes
- independent-phase-input-snapshots
- explicit-corpus-judgment-coverage
- loud-fixture-drift-failures
