what_changed:
  description: The run changed preflight handling so parse-failed classifications
    are recorded and propagated as degraded rather than appearing founded, and it
    updated knowledge summary output to carry provenance for substituted values. It
    also fixed fenced-response extraction so longer outer fences can contain inner
    triple-backtick snippets without truncating later classification fields.
  approach: The implementation reshaped preflight parsing and fallback flow around
    explicit degraded provenance, preserved that state through cache reuse and summary
    generation, and added targeted regression tests for parse errors, cached results,
    disclosure, domain routing, work type, verdict, sufficiency, and summary artifacts.
  files_modified: *id001
what_was_learned:
- claim: Structured-response extractors that recover YAML from fenced text need closing-fence
    matching that respects outer fence length, or inner shorter snippets can truncate
    later fields and force fallback values.
  evidence:
  - type: review_finding
    finding_id: a7a74def7941b1d3
    description: This finding documented that a four-backtick outer fence was truncated
      by an inner triple-backtick snippet, causing later keys such as work_type and
      domains to fall back to defaults.
  - type: review_finding
    finding_id: 967370d084eee0c1
    description: This finding recorded the mismatch between the extractor's stated
      longer-fence behavior and the implementation that discarded content after the
      first inner snippet.
  - type: file
    path: tests/test_coord_preflight_parse_error.py
    description: The added parser regression tests cover nested-fence parse behavior
      and degraded handling after parse failure.
- claim: If preflight substitutes fallback values after a parse failure, degraded
    provenance has to survive caching, reuse, and summary generation so stored artifacts
    do not later resemble founded classifier output.
  evidence:
  - type: file
    path: src/theforge/coordinator/preflight.py
    description: This file contains the coordinator-side preflight parsing and fallback
      logic where degraded provenance was made explicit.
  - type: file
