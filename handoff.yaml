        raw plan config. Coordinator adds 'planner' to _explicit_roles when not default.
        Adaptive planner replacement guarded by 'planner' not in _explicit_roles."

    - criterion: "Package installation runs even when .venv exists"
      status: MET
      notes: "_run_setup_split in coord_workspace.py detects the `test -d .venv || (python -m
