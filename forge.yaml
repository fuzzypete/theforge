# forge.yaml — TheForge developing itself
project: theforge

# v0.8 simple model list. TheForge derives preflight, plan, dev, review,
# and synthesis roles automatically from this list and the story complexity.
# See docs/guides/inputs-reference.md for the full schema reference.
# Model identity is provider + model + transport.kind. The identity string form
# is <provider>/<model>/<cli|api>; transport is never encoded in the provider
# token (no openai-api/…, no gemini-cli/…).
models:
  enabled:
    - anthropic/sonnet/cli        # CLI alias auto-tracks: Sonnet 5 as of 2026-07 ($3/$15)
    - anthropic/opus/cli          # CLI alias auto-tracks: Opus 4.8 as of 2026-07 ($5/$25)
    - openai/gpt-5.4/cli          # value strong tier ($2.50/$15); still served, no deprecation (verified 2026-07-07)
    - openai/gpt-5.4-mini/cli     # cheap tier ($0.75/$4.50). Tried list-first 2026-07-11 to force dispatch via
    #                                 the cheap-bucket tie-break: got 4 preflights (at sonnet-equal cost, no
    #                                 savings) but zero dev runs — profile reranker starves zero-history models
    #                                 regardless of order. Reverted same day; real fix is #1617.
    - openai/gpt-5.5/cli          # OpenAI's recommended coding model; overlay entry below
    # GPT-5.6 (2026-08-05, #2207). Identifiers verified against the live /v1/models list for this
    # key: gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna. Declared api rather than cli because the
    # family ships no -codex variant (5.1/5.2/5.3 do), so Codex CLI support is unconfirmed; the
    # api transport is the one the identifiers were verified on and check-providers can probe it.
    # Luna omitted — no published price found, and an unpriced entry seeds the cost band with a
    # default rather than a figure. Prices below are secondary-source seeds, not provider-attested;
    # that is exactly the provenance gap #2203 gated on and #2206 replaces with observed cost.
    # BLOCKED 2026-08-05 — cannot be enabled until the temperature bug is fixed. check-providers
    # live-probe returned 400 on both: "'temperature' does not support 0 with this model. Only the
    # default (1) value". Verified directly against /v1/chat/completions: gpt-5.6-sol succeeds with
    # no temperature and fails with temperature=0, so the model is fine and the adapter is not —
    # _is_reasoning_model in runners/schema_utils.py matches only ^o\d plus two deepseek prefixes.
    # Uncomment once that lands; identifiers and probe method are already verified.
    # - provider: openai
    #   model: gpt-5.6-sol
    #   transport: {kind: api}
    #   routing: {tier: strong, capability: 9, cost_rank: 2}
    #   cost: {input_per_mtok: 2.50, output_per_mtok: 15.00}
    # - provider: openai
    #   model: gpt-5.6-terra
    #   transport: {kind: api}
    #   routing: {tier: fast, capability: 8, cost_rank: 2}
    #   cost: {input_per_mtok: 1.00, output_per_mtok: 6.00}
    # Haiku — cheap tier for the Anthropic adapter (#2207). Already billed inside invocations as a
    # component model (claude-haiku-4-5 appears in cost.agents[].model_usage) while absent from the
    # catalog entirely. dev_capable and phase_eligibility stated explicitly rather than inherited:
    # introduced for preflight and review only until it has run history of its own.
    - provider: anthropic
      model: haiku
      transport: {kind: cli}
      routing:
        tier: cheap
        capability: 6
        cost_rank: 1
        dev_capable: false
        phase_eligibility: [preflight, review]
      cost: {input_per_mtok: 1.00, output_per_mtok: 5.00}
    - google/gemini-3.5-flash/api  # Google re-entry (2026-07-16, the registry story flagged below): stable/GA
    #                                 since 2026-05, Google's recommended model for agentic+coding. Beats
    #                                 3.1-pro on tool-call chaining (MCP Atlas 83.6%, Terminal-Bench 76.2 vs
    #                                 70.3) — the exact no-submit failure class that benched 3.1-pro (#1598).
    #                                 Overlay entry below; promote to AGENT_REGISTRY when the registry story lands.
    # Both benches below are RETAINED as of 2026-08-05 (#2207), but their exit condition is
    # restated. The prior wording — "re-enable when adaptive routing can decide reviewer fitness
    # automatically" — was not checkable, so neither bench had a defined exit and both persisted by
    # default. Replaced with a condition that can be evaluated by looking at run history:
    #   RE-TEST TRIGGER: each bench predates the fix for the failure that caused it, and neither has
    #   been re-tested since. Re-test in a bounded exploration slot (assignment.exploration caps the
    #   blast radius); re-bench only if the SAME failure class recurs, and record the run id here.
    #   Checkable by asking: has this model run at all since the fix date recorded on its line?
    # - deepseek/deepseek-reasoner/api  # benched 2026-05-09: flaky + slow; cycle-3 hang on #1424 + cycle-1 crash on same story.
    #                                  Fixes landed AFTER the bench: #1574 provider-health signal (2026-05-12),
    #                                  #1434 reviewer crash retries instead of escalating (2026-07-09).
    #                                  Not re-tested since either. See RE-TEST TRIGGER above.
    # - google/gemini-3.1-pro-preview/api  # benched 2026-07-09: reviewer completed without calling submit_review
    #                                      (empty output, exit=1) and killed story #1576 on quorum 1/2 — see #1598.
    #                                      #1598 closed 2026-07-12 — three days AFTER this bench — and fixes
    #                                      precisely this failure (no retry, no substitute on a non-submitting
    #                                      reviewer). Not re-tested since. See RE-TEST TRIGGER above.
    #                                      Still the only Google pro tier (never GA'd; 3.5 Pro delayed to
    #                                      mid-July 2026 over recursive tool-calling failures — bench it
    #                                      separately if it GAs). gemini-3.5-flash re-entry shipped above.
  custom:
    # GPT-5.5 — user-declared registry overlay (shipped #1184, v0.10.0).
    # #1355 (overlay bypassed by AGENT_REGISTRY direct-readers) fixed during the
    # v0.10 rc ladder; #1358 (P2 falsy-dict follow-up) still open but benign for
    # a non-empty custom block. GPT-5.6 launch imminent (2026-07) — expect a
    # re-pin here shortly.
    openai/gpt-5.5/cli:
      provider: openai
      model: gpt-5.5
      transport:
        kind: cli                 # Codex CLI. Set kind: api for the OpenAI API adapter.
      tier: strong
      input_cost_per_mtok: 5.00
      output_cost_per_mtok: 30.00
    # Gemini 3.5 Flash — Google re-entry via overlay; AGENT_REGISTRY has no
    # 3.5-line entry yet (registry story tracked in the enabled-list comment).
    # tier strong (capability 9): it replaces 3.1-pro-preview's reviewer slot
    # and outbenches it on the agentic axes that matter for submit_review
    # discipline. $1.50/$9 lands in cost_rank 2.
    google/gemini-3.5-flash/api:
      provider: google
      model: gemini-3.5-flash
      transport:
        kind: api                 # Google API adapter — same reviewer path 3.1-pro was benched on
      tier: strong
      input_cost_per_mtok: 1.50
      output_cost_per_mtok: 9.00

# CLI→API transport fallback, keyed by provider family. The provider never
# changes across a fallback — only the transport does.
transport_fallback:
  openai:
    model: gpt-5.4
    timeout_seconds: 600

budget_usd: 50.0

# Inline intake remediation (intake.grooming) is intentionally left at the
# schema default (false) — see ADR-0001 "Inline intake remediation posture".
# This repo runs `forge groom` as the primary pre-sprint readiness path, so no
# dogfood override is set here; the repo behaves like any fresh consumer.

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug} {base_branch}"
  setup_command: "test -d .venv || ({forge_python} -m venv .venv && .venv/bin/pip install -e '.[all,dev]' -q)"
  # Interpreter this project develops against; {forge_python} expands to it.
  # Required whenever setup_command uses {forge_python} (#1934) — TheForge will
  # not substitute the orchestrator's own interpreter for the project's gate.
  python_interpreter: "python3.12"
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"
  on_approve: merge-pr
  merge_strategy: squash
  auto_push: true
  # Bounds queued auto-merge polling. Expiry is fail-closed: story is marked
  # failed and dependents remain blocked. Increase for slow CI environments.
  merge_wait_timeout_seconds: 3600

validation:
  # Gate pass/fail is exit-code only. v0.8 removed handoff_file and
  # gate_decision_key; do not add them back under validation:.
  gate_command: "make gate"
  # Canonical intermediate test command dev agents should use while working.
  test_command: ".venv/bin/python -m pytest tests/ -v -n auto --dist worksteal"
  # 45→60 (2026-07-11): story #1243 hit identical 45s gate timeouts twice under
  # --parallel 3 load, then passed instantly when resumed solo. Modest bump to
  # absorb parallel contention; revisit if timeouts persist at 60.
  # 60→180 (2026-07-27): the suite outgrew the budget. `make gate` measured
  # 71.4s wall clock alone (6224 tests) against a 60s alone-time budget, so
  # sprints at --parallel 1 failed at the baseline gate deterministically —
  # adaptive scaling multiplies this value, so parallelism was the only thing
  # masking it. Set to ~2.5x measured alone-time; the timeout exists to catch a
  # hung gate, not to bound normal growth. Re-measure when the suite grows.
  gate_timeout: 180

conventions:
  hard:
    max_module_lines: 600
    max_test_file_lines: 1000
    no_circular_imports: true
    test_mirrors_source: true
    no_scratch_files: true
    stack: python
  soft:
    - "Coordinator is pure Python — no LLM calls for routing or process decisions"
    - "Schema validation is the integrity boundary — do not relax cross-validation rules"
    - "Keep modules single-purpose; extract instead of growing monolith files"
    - "Keep pure-data types in low-dependency modules with stdlib-only imports"
    - "Separate prompt construction, output parsing, and coordinator control flow"
    - "When adding or modifying data that flows between coordinator phases, instrument the change so the actual values are visible in the audit trail — diagnosing sprint failures requires tracing real data, not reconstructing it"
    - "Do not create files outside src/, tests/, or docs/. If you need a scratch file for exploration, delete it before committing."
    - "Changes that affect coordinator phase boundaries, state handoff between phases, or adaptive routing/config propagation must include seam-level integration tests covering the touched boundary. Unit tests alone are insufficient when correctness depends on cross-phase state flow."
  advisory:
    artifact_path: ".forge/conventions/advisory.yaml"
    summary_top_n: 10
    noteworthy_threshold_percent: 10.0
    commit_shared_artifact: false
    issue_filing:
      enabled: false

assignment:
  enabled: true
  # Mechanical plan-reviewer value signals (#1443): P1 uniqueness + latency-per-P1,
  # sample-floor gated, recency-weighted, taint-excluded. Built and tested but
  # default-off; enabled 2026-08-02 after 703-audit review showed reviewer
  # selection running on completion rate alone.
  reviewer_value_enabled: true
  # Code-review selection consumes the same signals since #2156 (closed 2026-08-04).
  # Enabled 2026-08-05 (#2207) — it shipped default-off and was never switched on here,
  # so code-review reviewers were still being selected on completion rate alone while
  # plan reviewers had moved to value signals three days earlier.
  code_review_value_enabled: true

# Neutralize the stuck-detector's no-file-modifications arm pending the redesign
# in #1215. Repeat-call and identical-error-loop arms remain at their defaults
# (repeat_threshold: 4, error_threshold: 4) — those are defensible signals.
# The no-file-modifications arm conflates legitimate codebase exploration with
# stuckness and has false-terminated multiple stories during dogfood.
stuck_detection:
  no_progress_iterations: 100
  post_nudge_iterations: 100

retry:
  max_dev_iterations: 3
  max_dev_transport_retries: 2
  max_review_cycles: 3
  adaptive_iterations: true
  max_dev_iterations_cap: 5
  max_review_cycles_cap: 5

plan:
  enabled: true

diagnose:
  output_destination: body_section
  budget_usd: 5.00
  timeout_seconds: 600
  autonomous_default: true

hooks:
  pre_run: .forge/hooks/pre_run.sh
  post_run: .forge/hooks/post_run.sh
  post_merge: .forge/hooks/post_merge.sh
  post_sprint: .forge/hooks/post_sprint.sh
  timeout_seconds: 30

notifications:
  backend: slack
  slack:
    webhook_url_env: SLACK_WEBHOOK_URL
  # This value trades one thing against one other: how long an operator has to
  # answer, versus how long a story sits doing nothing when nobody will. Expiry
  # preserves the worktree and never auto-rejects, so what a longer wait buys is
  # a chance to answer, and what it costs is wall clock on a story that is
  # otherwise finished deciding.
  #
  # 600→3600 (2026-08-07): 10m guaranteed an auto-escalate on anything launched
  # and left to run; three stories died that way in a week, none on merit.
  # 3600→300 (2026-08-08): set for unattended overnight runs, where the "chance
  # to answer" half is worth nothing and the wait is pure dead time before the
  # same preserved outcome. Raise it back to 3600 when working at the keyboard —
  # at 300 a gate expires before an operator has finished reading it.
  #
  # Revisit when #2279 lands: once expiry applies the advisory recommendation
  # instead of discarding it, expiring stops being a failure and this becomes a
  # question about how long to defer a decision rather than whether to lose one.
  human_review_timeout_seconds: 300
