what_changed:
  description: This run introduced a shared branch-landing resolver and routed both
    resume triage and worktree sweeping through it so landed branches, including squash-merged
    ones, are classified from the same evidence model. It also updated workspace reclamation
    and operator troubleshooting/reporting around landed, unlanded, and undecidable
    outcomes.
  approach: The change extracted branch-landing decisions into a dedicated coordinator
    module, preserved the richer evidence sources resume triage already distinguished,
    and then replaced duplicated call-site logic in the sprint DAG and workspace sweep
    with that resolver while tightening base-branch content checks and topology handling
    through review-driven fixes.
  files_modified: *id002
what_was_learned:
- claim: A merged-PR signal is not sufficient by itself to reclaim a branch; before
    treating a branch as landed for cleanup, the resolver must also confirm the branch's
    content reached the configured base branch.
  evidence:
  - type: review_finding
    finding_id: 1f6379cfb5c34efc
    description: Review found that trusting GitHub's merged-PR result before checking
      whether the branch's content was actually present on the configured base could
      mark still-unlanded work as landed, which would let the sweep reclaim a clean
      worktree incorrectly.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 was blocked specifically because merged-PR evidence could
      delete work that had not reached the configured base, demonstrating that landing
      decisions for cleanup must be gated by base-branch content, not merge metadata
      alone.
- claim: Topology evidence for landing must be evaluated against the configured base
    branch, not against arbitrary origin refs, or unrelated tracking branches can
    make unlanded work look safe to remove.
  evidence:
  - type: review_finding
    finding_id: a1a1204ff005df4e
    description: Review caught a case where commits appearing on an unrelated origin-tracking
      ref caused the sweep to remove a clean branch even though its content had not
      landed on the configured base branch, showing that ref-agnostic origin presence
      is the wrong predicate.
  - type: file
    path: src/theforge/coordinator/workspace.py
    description: Workspace reclamation was one of the decision points under review,
      and the finding against it shows the cleanup path must consume base-branch-aware
      landing classification rather than a generic 'present on origin somewhere' check.
- claim: When consolidating duplicate decision paths behind a shared resolver, every
    prior bypass must be removed; a single remaining direct check can preserve the
    old disagreement and negate the refactor.
  evidence:
  - type: review_finding
    finding_id: 6ac1d02a5351ffb0
    description: Review found resume triage still returning skip_merged from a direct
      prior-APPROVE audit check after the shared resolver produced no landed result,
      proving that partial migration leaves conflicting answers alive even after a
      central resolver exists.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 reported blocking gaps where the sweep and resume triage
      still made landing decisions outside the shared resolver path, showing that
      centralizing logic requires auditing all call sites for residual independent
      classification.
- claim: A shared landing resolver needs an explicit topology path for ordinary merge
    commits, because audit, PR, and closing-reference evidence may all be absent even
    when the work has genuinely landed.
  evidence:
  - type: review_finding
    finding_id: 4c06ef7fdcc08c0a
    description: Review identified that a branch merged by a normal merge commit resolved
      as undecidable when no audit, PR, or closing-reference evidence existed, demonstrating
      that merge topology itself must be a first-class landing signal.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 noted that topology evidence failed on a real merge, which
      shows a resolver that preserves only metadata-based evidence sources will under-classify
      legitimately landed branches.
