what_changed:
  description: Added a manual, audit-only semantic evaluation flow that reads an issue,
    produces structured outcomes or failure states, records run identity and metrics,
    and reports corpus-level measurement data without affecting readiness or mutating
    the document.
  approach: 'The change was built as a separate evaluator pipeline: canonicalized
    semantic input and prompt contract, parsed model output into typed result states,
    persisted records keyed by digest/model/prompt version, exposed operator CLI entrypoints,
    and generated reports from the stored audit history.'
  files_modified: *id002
what_was_learned:
- claim: When caching evaluation results by identity, failed attempts must be excluded
    from satisfying the cache; otherwise a transient transport or parse failure becomes
    a sticky terminal outcome for that identity and suppresses later successful evaluation.
  evidence:
  - type: review_finding
    finding_id: 9d470b979549cf0c
    description: The review found that identity lookup returned the most recent record
      without filtering on status, which caused later invocations for the same digest/model/prompt
      triple to reuse EVALUATION_FAILED instead of attempting evaluation again; this
      demonstrates that cache eligibility must distinguish successful outcomes from
      failed runs.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 explicitly records that the prior P1 was resolved by excluding
      failed records from identity lookup, confirming that this status filter was
      necessary to preserve correct rerun behavior.
- claim: Operator-facing cache bypasses can violate behavioral contracts even when
    storage keys are correct; repeat-run semantics need to be enforced at the command
    path as well as in persistence.
  evidence:
  - type: review_finding
    finding_id: ad903e01c041fb46
    description: The review found that --no-cache let an operator force a fresh model
      call for an already-recorded digest/model/prompt identity, directly breaking
      the contract that exact-identity repeats return the stored outcome; this shows
      contract enforcement must include CLI control flow, not just backend keying.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 notes that same-identity bypass was fixed, showing the issue
      was not with identity definition itself but with an alternate invocation path
      escaping the intended repeat-run rule.
- claim: Freezing a human baseline before reveal is not enough by itself; invocation
    paths also need explicit mismatch handling so operator-supplied baseline inputs
    cannot be silently discarded before consistency checks run.
  evidence:
  - type: review_finding
    finding_id: dc639598f7f5d121
    description: The review found that when a frozen baseline already existed, invocation-supplied
      defect ids were dropped without any message and the store-level mismatch guard
      was never reached, demonstrating that baseline integrity depends on surfacing
      disagreements at the first point they can be observed.
- claim: Metrics that rely on independent repeated live evaluations can be invalidated
    by deduplication semantics that serve same-identity repeats from storage, so report
    design must align stability measurements with the actual execution model.
  evidence:
  - type: review_finding
    finding_id: 27dd70223834a851
    description: The review found that once same-identity repeats are always served
      from the record store, two live records with the same digest/model/prompt triple
      no longer arise in normal use, leaving repeat-stability counters at zero; this
      demonstrates that measurement logic must account for how caching constrains
      observable repeats.
