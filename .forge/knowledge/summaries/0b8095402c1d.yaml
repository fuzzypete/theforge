what_changed:
  description: The run changed workspace dirtiness checks so TheForge's own per-run
    publication artifacts are treated separately from operator-owned root changes
    during entry, resume, sprint-entry, and landing preconditions. It also moved audit
    and memory publication onto a shared story-run artifact path and documented the
    resulting behavior and troubleshooting.
  approach: The change introduced a dedicated artifact classifier for run-generated
    files, then routed both publication code and workspace precondition checks through
    that shared distinction so bookkeeping artifacts could be reconciled as Forge-owned
    state while unrelated root dirt still blocks work.
  files_modified: *id002
what_was_learned:
- claim: When a workspace precondition is intended to be an early form of a later
    landing/worktree refusal, future changes need the entry, resume, sprint-entry,
    and merge-time checks to share the same blocking predicate; otherwise concurrency
    exposes mismatches where earlier checks reject work that the coordinated path
    would accept.
  evidence:
  - type: review_cycle
    cycle: '1'
    description: The approval explicitly calls out that entry, resume, sprint-entry,
      and merge-time landing checks now share one artifact-tolerant blocking predicate,
      showing the important reusable lesson was consistency across all admission points
      rather than a one-off fix in only the failing path.
  - type: file
    path: src/theforge/coordinator/workspace.py
    description: This is where workspace admissibility is decided; its centralization
      of the blocking logic demonstrates that the failure mode came from precondition
      policy living at multiple call sites and needing one shared decision rule.
  - type: diff
    ref: caca638ad7bb79f88372e02736fbbe4bb9a62b88
    description: The diff ties the same tolerance rule into multiple workspace/landing
      checks, demonstrating that preventing divergent accept/refuse behavior required
      unifying predicates across phases, not just adjusting one command.
- claim: Future work that reasons about repository cleanliness in Forge runs should
    distinguish run-owned publication artifacts from operator-owned uncommitted changes,
    because both appear as root dirt in git status but they carry different admissibility
    semantics.
  evidence:
  - type: file
    path: src/theforge/story_run_artifacts.py
    description: A dedicated artifact module was introduced specifically to identify
      the run-generated files as a separate class, demonstrating that plain git dirt
      was too coarse a signal for correct scheduling decisions.
  - type: file
    path: src/theforge/sprint/audit_publish.py
    description: Audit publication was moved onto the shared story-run artifact handling
      path, showing that these files are produced as normal Forge bookkeeping and
      therefore must be recognized differently from user edits.
  - type: file
    path: src/theforge/sprint/memory_publication.py
    description: Memory publication now participates in the same artifact treatment
      as audit publication, demonstrating that the lesson applies across multiple
      Forge-generated root artifacts rather than a single file family.
  - type: file
    path: tests/test_coord_landing_precondition.py
    description: The focused landing-precondition scenarios separate tolerated Forge
      artifacts from blocking operator dirt, demonstrating the behavioral distinction
      a future run must preserve when touching cleanliness checks.
