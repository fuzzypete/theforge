what_changed:
  description: This run added an interactive issue-authoring path that collects required
    body parts before submission, can resume from existing drafts, and validates the
    finished result through the shared shape-check path before create-time. It also
    adjusted shape-gate handling and documented the new authoring surface in the guides
    and CLI reference.
  approach: The work split the flow into reusable intake logic plus a thin CLI command,
    then aligned that flow with the shared typed/spec-driven validation path and iterated
    on edge cases uncovered in review around incomplete drafts, resumed drafts, type
    dispatch, and promotion of existing draft issues.
  files_modified: *id002
what_was_learned:
- claim: When an authoring flow can stop in an incomplete state and later resume,
    draft-state markers must be treated as derived transport metadata and stripped
    or rebuilt on every pass; otherwise incomplete markers leak into completed submissions
    or accumulate across resumptions.
  evidence:
  - type: review_finding
    finding_id: 6a156f7403e60a6a
    description: Review found that resuming an incomplete draft preserved the generated
      'incomplete draft' banner inside the body, proving the marker was being stored
      as durable content instead of recomputed transient state.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 explicitly surfaced resumed-draft mislabelling as a blocking
      issue, showing that resumable flows need a dedicated normalization step for
      persisted draft adornments before further prompting or submission.
  - type: diff
    ref: f1f981b300101a7631e1e3f4cf544af76ca31970
    description: The later fix revision is evidence that the implementation had to
      change after review to normalize resumed content at runtime, reinforcing the
      lesson that persisted draft markers cannot be blindly carried forward.
- claim: If a CLI can both edit issue metadata and promote or create issues, it must
    order side effects so that reversible body/title writes happen before label mutations;
    otherwise partial failure can leave a draft appearing promoted without a valid
    promoted body.
  evidence:
  - type: review_finding
    finding_id: 253bcb7769dd246e
    description: Review demonstrated a concrete failure mode where label changes succeeded
      before the title/body edit failed, leaving the old draft stripped of todo:draft
      and therefore semantically inconsistent.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 grouped existing-issue promotion among the blocking persistence
      issues, showing that transaction ordering across external mutations was a central
      correctness concern rather than an incidental bug.
  - type: file
    path: src/theforge/cli/author.py
    description: The issue was localized to the promotion command path in the CLI
      layer, indicating that future runs touching multi-step issue mutations should
      inspect and sequence side effects in that orchestration code.
- claim: Type options offered by an authoring surface must be filtered against types
    that can actually complete the end-to-end flow, and the same dispatchability check
    must run for explicit flags and inferred labels; otherwise users can be routed
    into unwinnable authoring loops.
  evidence:
  - type: review_finding
    finding_id: 9c8271117505952b
    description: Review found that explicitly choosing 'epic' or 'operator-action'
      always ended in draft classification and refusal, showing that exposing unsupported
      types at selection time creates a flow with no successful terminal state.
  - type: review_finding
    finding_id: f9982f2fdf28b3dd
    description: A second finding showed the same problem through the inferred-label
      path when resuming an issue, demonstrating that validation must be applied consistently
      to both user-selected and automatically inferred types.
  - type: review_cycle
    cycle: '3'
    description: 'Cycle 3 verified the resumed epic path is now refused before prompting,
      which demonstrates the needed behavioral pattern: reject undispatchable types
      at the earliest entry point rather than after collecting answers.'
- claim: "When translating shape-gate failures back into author prompts, the mapping\
    \ must preserve gate semantics\u2014especially blocking vs advisory status\u2014\
    because generic catch-all conversion can invent missing required parts that the\
    \ schema does not actually require."
  evidence:
  - type: review_finding
    finding_id: 1e6b730dc187eefc
    description: Review found that an unmapped implementation-plan refusal was turned
      into 'Missing Example', proving that a catch-all missing-part mapper can misstate
      what the author must supply if it ignores the underlying gate category.
  - type: review_finding
    finding_id: 47ea038c43cf5681
    description: 'Another finding showed that an unmapped refusal reason produced
      only a vague ''shape-gate findings remain'' banner, demonstrating the opposite
      failure mode: losing actionable structure when the refusal cannot be translated
      precisely.'
  - type: plan_step
    step_id: '4'
    description: The planned work explicitly included keeping the shape gate aligned
      with the no-closed-vocabulary contract, which is the same integration point
      where preserving refusal semantics matters for accurate author guidance.
- claim: Resuming from partially completed structured sections requires merge logic
    that preserves earlier answered subfields even when the user later declines another
    subfield in the same section; otherwise the resume path destroys progress and
    misreports what is still missing.
  evidence:
  - type: review_finding
    finding_id: ee3a5ec1435b4fdb
    description: Review showed that within a bug Diagnosis section, supplying some
      missing fields and then declining a later field caused earlier supplied values
      to be dropped, revealing that per-section state was being replaced instead of
      merged.
  - type: file
    path: src/theforge/intake/author_flow.py
    description: 'Because the failure occurred in the reusable intake logic, it demonstrates
      a general planning lesson for future structured author flows: section updates
      must merge incrementally at the model layer, not rely on all-or-nothing rewrites.'
learned_patterns:
