dev_notes: |
  summary: "Added plan_validator.py with four advisory checks (AC coverage, step
    completeness, file validity, dependency ordering). The validator is wired into
    coordinator.py immediately before _coordinator_loop() (i.e., after PLAN_REVIEW
    finalizes and before DEV starts). Findings are logged at WARNING level via Python
    logging and also printed to the coordinator console with a ⚠ prefix. Results are
    stored on CoordinatorState.plan_validation_findings and emitted to the audit log
    under the plan_validation key. A helper extract_spec_criteria() parses acceptance
    criteria from the spec markdown body (- [ ] lines under ## Acceptance Criteria).
    Validation is skipped entirely when state.plan_structured is None (freeform
    markdown fallback). 15 new tests cover all four checks and the criteria extractor.
    All 1167 tests pass."
  commits:
    - sha: "700eb5e"
      message: "feat(plan-validation): add mechanical plan structure validation before DEV"
  acceptance_criteria:
    - criterion: "Mechanical plan validation runs after PLAN, before DEV"
      status: MET
      notes: "validate_plan() is called immediately before _coordinator_loop() in
        run_task(), guarded by state.plan_structured is not None."
    - criterion: "AC coverage check: warns on unmapped acceptance criteria"
      status: MET
      notes: "Check 1 in validate_plan() iterates spec_criteria and warns on any
        criterion not found in plan criteria_mapping entries."
    - criterion: "Step completeness check: warns on steps missing description/files/action"
      status: MET
      notes: "Check 2 warns when description is falsy, files list is empty, or action
        is falsy for any plan step."
    - criterion: "File validity check: warns on modify/delete for nonexistent files"
      status: MET
      notes: "Check 3 warns for action=modify or action=delete when the file path
        does not exist under workspace_path. Skips action=create."
    - criterion: "Dependency check: warns on invalid step refs or circular deps"
      status: MET
      notes: "Check 4 validates all depends_on IDs exist in the step set, then runs
        DFS cycle detection, emitting one warning if a cycle is found."
    - criterion: "Validation is advisory — never blocks DEV"
      status: MET
      notes: "No exception raised. Findings are logged and stored; execution always
        proceeds to _coordinator_loop()."
    - criterion: "Skipped for freeform markdown plans (no structured data)"
      status: MET
      notes: "Guard 'if state.plan_structured is not None' in coordinator.py ensures
        the validator is never called when plan_structured is None."
    - criterion: "Findings logged to console and recorded in audit log"
      status: MET
      notes: "Each finding is logged via logging.getLogger(__name__).warning() and a
        summary line is printed via _log(). Findings stored in
        state.plan_validation_findings and emitted under plan_validation in
        generate_audit_log()."
    - criterion: "All existing tests pass"
      status: MET
      notes: "1167 tests pass (1152 pre-existing + 15 new)."
    - criterion: "New tests for each validation check"
      status: MET
      notes: "tests/test_plan_validator.py has 15 tests covering all four checks,
        the clean-plan baseline, and extract_spec_criteria()."
  spec_deviations:
    - description: "task.acceptance_criteria attribute does not exist on TaskSpec"
      justification: "The plan assumed this attribute existed. Added extract_spec_criteria()
        helper in plan_validator.py that parses - [ ] lines from the spec markdown body
        under ## Acceptance Criteria. Called in coordinator.py from spec_content (already
        loaded). Equivalent to the spec intent."
    - description: "File validity for delete action"
      justification: "Plan notes called it ambiguous. Spec AC says 'warns on modify/delete
        for nonexistent files'. Implemented as warning for both modify and delete,
        consistent with the spec."
  deferred_items: none
  gate_result: PASS
