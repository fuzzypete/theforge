what_changed:
  description: This run added a knowledge-uptake comparison that links injected prior-run
    claims to later review findings only when eligibility can be determined from recorded
    phase, role, iteration, and timing data. It also records comparison provenance,
    validation status, and renders per-run reports that distinguish correspondence,
    non-correspondence, and no-comparison cases.
  approach: The implementation extended audit and prior-run context records with claim
    exposure metadata and finding timestamps, then computed deterministic claim-to-finding
    correspondences under phase/author/time eligibility rules and rendered the results
    with method metadata and agreement information.
  files_modified: *id002
what_was_learned:
- claim: Run-level eligibility for claim-to-finding comparison must be computed against
    each finding's timestamp, not from the mere presence of development-phase claims
    somewhere in the run, or late-arriving claims will incorrectly make a run appear
    compared.
  evidence:
  - type: review_finding
    finding_id: 8327f10315a64f3b
    description: The finding reports a concrete failure mode where a development claim
      rendered only after the review finding was recorded still caused the report
      to count an eligible claim and classify the finding as unmatched, showing that
      eligibility must be evaluated relative to finding time.
  - type: review_cycle
    cycle: '1'
    description: The first review explicitly states that temporal eligibility was
      counted at the run level before finding times were considered, identifying the
      mechanism by which post-finding claims produced a false compared state.
  - type: review_cycle
    cycle: '2'
    description: The approval confirms that after checking claim eligibility against
      finding times, late-only development claims produced no correspondence, demonstrating
      the corrected per-finding temporal rule.
  - type: diff
    ref: dbf363dce14e76b73bccb40b2d7516f4c3f16b02
    description: This revision is the one the second review approved as fixing the
      defect, tying the lesson to the change that removed false compared-and-unmatched
      outcomes caused by late-only claims.
- claim: When comparing injected knowledge with review findings, authorship and exposure
    provenance must be recorded at claim level, because a reviewer can repeat a claim
    from their own prompt and that must not be attributed as missed uptake by development.
  evidence:
  - type: plan_step
    step_id: '1'
    description: The plan begins by extending records to capture claim-level exposure,
      reflecting that eligibility depends on knowing exactly which phase, role, and
      iteration received each claim.
  - type: file
    path: src/theforge/task/prior_run_manifest.py
    description: Changes in the prior-run manifest are evidence for preserving per-claim
      exposure details in persisted records, which is the information needed to determine
      whether the finding author actually saw the claim.
  - type: file
    path: src/theforge/task/prior_run_selector.py
    description: Selector changes demonstrate that rendered claims are tracked with
      enough provenance to distinguish delivery to development from delivery to review,
      which is required to exclude reviewer-self-primed findings from missed-uptake
      correspondence.
  - type: file
    path: tests/test_coord_claim_exposure_seam.py
    description: The seam-level exposure tests show that claim provenance is treated
      as a boundary condition worth verifying, supporting the lesson that authorship/exposure
      data is essential rather than incidental.
- claim: Outputs for this kind of correspondence analysis need an explicit 'no correspondence
    because comparison was ineligible or absent' state separate from 'compared and
    unmatched', or reports will collapse different mechanisms into the same result.
  evidence:
  - type: plan_step
    step_id: '2'
    description: The plan step to persist finding time and expose old runs as uncomparable
      shows that some runs cannot legitimately be compared, so reporting must distinguish
      absence of comparison from a completed comparison with no matches.
  - type: plan_step
    step_id: '5'
    description: The reporting step demonstrates that the artifact was designed to
      surface comparison outcomes, including none-versus-unmatched distinctions, not
      just raw matches.
  - type: review_finding
    finding_id: 8327f10315a64f3b
    description: The flagged bug arose because a run with no temporally eligible claims
      was reported as compared and unmatched, directly illustrating why 'none' and
      'unmatched' must remain distinct states.
  - type: file
    path: src/theforge/knowledge_uptake_render.py
    description: Rendering changes are evidence that these distinct comparison states
      are surfaced in the run report itself, which is where conflation would otherwise
      hide the mechanism.
