what_changed:
  description: This run added a punt-only adversarial second-review stage to triage
    proposals, requiring each punt proposal to receive an independent concur/challenge
    verdict with cited evidence before operator presentation, while leaving non-punt
    proposals unchanged and making zero-punt runs render as an explicit no-op.
  approach: The change was implemented by extending the proposal flow, prompt layer,
    proposal/audit models, and CLI rendering together so review routing, verdict validation,
    safe fallback handling, persistence, and operator-visible output all moved in
    lockstep.
  files_modified: *id002
what_was_learned:
- claim: When a workflow introduces a second agent leg, verification must preserve
    cost-provenance checks separately for each leg; reusing an existing missing-cost
    test for the new leg can silently drop coverage for the original proposer path.
  evidence:
  - type: review_finding
    finding_id: 0be2848ed80e3499
    description: Review found that the only test covering an unmeasured proposer attempt
      had been repurposed to script an unmeasured reviewer result after cost summation
      was refactored, demonstrating that multi-leg cost handling needs leg-specific
      verification rather than a single shared scenario.
  - type: file
    path: tests/test_triage_proposal_flow.py
    description: This is the test file named in the finding; the issue arose specifically
      because provenance assertions in flow-level tests were shifted from proposer
      coverage to reviewer coverage, showing where future runs should keep distinct
      checks.
- claim: If fallback-generated coordinator text is stored or rendered under the same
    'evidence' field used for verbatim packet citations, consumers will misread authored
    fallback rationale as source-backed evidence; fallback reason data needs a distinct
    representation.
  evidence:
  - type: review_finding
    finding_id: 857f86fd2fa5d6eb
    description: Review identified that persisted audit events serialized coordinator-authored
      fallback basis text under the normal evidence key, showing that downstream readers
      of the audit record could infer source citation where none existed.
  - type: review_finding
    finding_id: eb3c466b13746ac2
    description: A separate review finding caught the same conflation in rendered
      output, where the fallback basis sentence appeared on the review evidence line
      normally reserved for mechanically verified packet quotes, confirming the representation
      problem across both persistence and display surfaces.
  - type: file
    path: src/theforge/triage_proposal.py
    description: Both findings point to proposal rendering/serialization behavior
      in this file, showing that the ambiguity originated in shared proposal presentation
      logic rather than in the reviewer prompt itself.
- claim: Operator-facing documentation for staged pipelines must be updated to reflect
    added stages, per-item annotations, and total-cost semantics at the same time
    as the implementation, or the docs will describe a different workflow than the
    one operators actually see.
  evidence:
  - type: review_finding
    finding_id: 79163134b8c9a08d
    description: Review found that CLI guidance and sample output still described
      a single-agent stage and omitted the new review line items and reviewer cost,
      demonstrating that stage additions change not just internals but the meaning
      of displayed totals and output structure.
  - type: file
    path: docs/guides/cli-reference.md
    description: The finding landed in the CLI reference specifically because operator-facing
      examples had to reflect review-stage presence, per-punt verdicts, and spend
      accounting together, showing the documentation surface most sensitive to staged-flow
      changes.
