what_was_learned:
- claim: When a CLI falls back to scanning shared on-disk audit locations, lookup
    must confirm record identity before surfacing parse/read errors; otherwise unrelated
    corrupt files can be misreported as evidence for the requested target.
  evidence:
  - type: review_finding
    finding_id: 68146b2162902405
    description: Review found that `forge explain --run missing-run` could encounter
      a malformed audit file for another story and incorrectly report that the requested
      run's routing record existed but was unreadable, demonstrating that fallback
      readers must verify the requested run/story match before converting unrelated
      file corruption into a target-specific result.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 requested changes specifically because targetless lookup
      paths could misattribute malformed live audits from other stories to the requested
      run, showing this is a real failure mode in broad filesystem searches rather
      than a hypothetical edge case.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approved only after the fix ensured run-id lookups no longer
      claimed another story's corrupt audit as the requested record, confirming identity-gating
      was the condition needed for correct behavior.
