  \ parsing of the\n  sprint.max_parallel key in load_config() with int >= 1 validation.\
  \ In sprint.py,\n  changed SprintManifest.max_parallel default from 1 to None (sentinel\
  \ for 'not set'),\n  updated load_sprint_manifest() to only validate the value when\
