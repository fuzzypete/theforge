what_was_learned:
- claim: When a read-only diagnostic and a mutating cleanup operate on the same persisted
    process record, they need to share the same per-record identity classification;
    otherwise one path can describe a record as a live leak while the other treats
    it as stale bookkeeping and deletes it unsignalled.
  evidence:
  - type: review_finding
    finding_id: b56b023eee8edfdf
    description: This finding showed that when listing did not apply the same identity
      logic as reaping, status and cleanup diverged on records whose ownership was
      dead but whose surviving processes still needed classification, demonstrating
      that shared per-record verdicts are necessary to keep the two surfaces consistent.
  - type: file
    path: src/theforge/process_group.py
    description: This file contains both the orphan-listing and orphan-reaping logic,
      so its coordinated changes demonstrate that the run resolved the disagreement
      by making both paths depend on the same underlying process-group verification
      mechanism rather than separate heuristics.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 approved the state where stale sidecars were no longer reported
      as live process groups, confirming that reviewer focus remained on agreement
      between status classification and reaper behavior until the two matched.
- claim: "Orphan-process reporting has multiple distinct record classes that must\
    \ be preserved during classification\u2014verified live groups, unverifiable retained\
    \ sidecars, and special-origin records\u2014because collapsing them into a single\
    \ dead-owner check causes different kinds of false positives or false negatives."
  evidence:
  - type: review_finding
    finding_id: 5717ef9b049165b1
    description: This finding showed that even after adding identity filtering, discarding
      the reason string erased the distinction between a retained-but-unverifiable
      record and no record at all, demonstrating that classification must keep separate
      states rather than reducing everything to present/absent.
  - type: review_finding
    finding_id: 0dcd59afc7e5b585
    description: This finding identified test-origin sidecars as another separate
      class whose treatment differed between listing and sweeping, showing that dead-owner
      records are not a single homogeneous category and must be classified with origin-aware
      logic.
  - type: file
    path: src/theforge/cli/status.py
    description: Changes in the status reporting layer demonstrate that the output
      surface had to reflect the underlying record class instead of mapping every
      returned item to the same 'orphaned process group' message.
