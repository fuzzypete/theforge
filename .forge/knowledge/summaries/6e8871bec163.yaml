what_changed:
  description: The run fixed the diagnose landing mismatch where a completed investigation
    could be marked partial for metadata reasons and then rejected because the landing
    gate re-evaluated the issue as runnable. It also aligned the lifecycle decision
    path so diagnosis artifacts that are still valid to land are not discarded by
    that mismatch.
  approach: The change separated strict diagnosis completeness checks from the smaller
    set of conditions that should block lifecycle landing, then updated coordinator
    and type-level handling so partial classification and write gating use the appropriate
    category of missing data.
  files_modified: *id002
what_was_learned:
- claim: When a workflow both grades artifact completeness and re-checks issue lifecycle
    before writing, those two decisions need distinct criteria; reusing a stricter
    'missing required fields' check for lifecycle gating can cause valid artifacts
    to be discarded even though the issue still occupies the producer's declared state.
  evidence:
  - type: diff
    ref: d780f845f1f1c57519ee82d5fd33b381655b7080
    description: This diff separates the handling of diagnosis-field completeness
      from lifecycle-blocking conditions, showing that the bug came from conflating
      'partial investigation metadata' with 'state that forbids landing' and that
      future work in similar flows should keep those checks independent.
  - type: file
    path: src/theforge/diagnose_types.py
    description: This file contains the diagnosis completeness logic, and its role
      in the fix demonstrates that some missing or verification-related fields affect
      artifact quality without necessarily meaning the issue has left needs_diagnosis.
  - type: file
    path: src/theforge/coordinator/diagnose_flow.py
    description: This file owns the coordinator's phase and landing decisions; its
      participation in the fix shows the failure was caused by coordinator-level reuse
      of completeness results when deciding whether the producer may write.
- claim: For stateful producer flows, regression verification needs to cover the end-to-end
    combination of final phase classification and landing behavior, because bugs can
    arise from their interaction even when the investigation content itself is correct.
  evidence:
  - type: diff
    ref: 07c84a6b121373476dc9bdbfb6955df0dfcfc46f
    description: This diff includes focused regression updates around the diagnose
      flow, demonstrating that the defect manifested at the integration point between
      artifact status and LAND rather than in the investigative reasoning alone.
  - type: file
    path: tests/test_diagnose_flow.py
    description: This test file was part of the change set for the coordinator path,
      showing that reproducing and guarding the bug required exercising the write-decision
      flow, not just isolated data validators.
  - type: file
    path: tests/test_diagnose_types.py
    description: This test file complements the flow-level coverage by pinning the
      type-level classification behavior, showing that both layers must agree to prevent
      future state/evaluation mismatches.
