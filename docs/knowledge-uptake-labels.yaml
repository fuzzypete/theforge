# Labelled examples for the prior-run uptake matcher (#2684).
#
# Each example is a human judgment about ONE review finding against the claims
# that were injected before it. The matcher is scored by running each example
# through the full production path in theforge.knowledge_uptake — eligibility
# filtering included — so this set covers what the matcher can get wrong, not
# just how it compares two strings.
#
# `method` / `method_version` name the matcher these labels were made against.
# When the matcher's version moves ahead of this file, agreement is reported as
# UNVALIDATED rather than carried over: labels made against a different decision
# procedure are not evidence about this one. Re-label, then bump.
#
# Categories present, as the acceptance criteria require:
#   correspondence        — the finding restates a claim the author was shown
#   non_correspondence    — the finding is about something else
#   eligibility_excluded  — a claim exists on the subject, but never reached the
#                           author (review-only, or rendered after the finding)
#
# A label is a judgment about the CORRESPONDENCE, never about whether the
# knowledge loop helped. "matched" means the texts are about the same thing and
# the author had been shown it; it does not mean guidance was ignored.

version: 1
method: rendered-claim-overlap
method_version: v1

examples:
  # ── correspondences ──────────────────────────────────────────────────────
  - id: gate-result-derivable
    category: correspondence
    label: matched
    finding:
      finding_id: f-gate
      description: >-
        A coordinator-owned gate result is not derivable from the agent's own
        handoff report; the coordinator must record the gate result itself.
      recorded_at: "2026-08-01T12:00:00+00:00"
    claims:
      - claim_ref: "run-a:aaaaaaaaaaaa"
        index: 1
        claim: >-
          A coordinator-owned gate result is not derivable from an agent's
          handoff report, so the coordinator has to record the gate result.
        run_id: run-a
        phase: dev
        agent_role: dev
        phase_iteration: 1
        rendered_at: "2026-08-01T10:00:00+00:00"

  - id: migration-helper-required
    category: correspondence
    label: matched
    finding:
      finding_id: f-migration
      description: >-
        Bumping the record schema version without adding a reader-side
        migration helper leaves older stored records unreadable.
      recorded_at: "2026-08-02T12:00:00+00:00"
    claims:
      - claim_ref: "run-b:bbbbbbbbbbbb"
        index: 1
        claim: >-
          Bumping the record schema version requires a reader-side migration
          helper in the same change, or older stored records become unreadable.
        run_id: run-b
        phase: dev
        agent_role: dev
        phase_iteration: 2
        rendered_at: "2026-08-02T09:30:00+00:00"

  - id: batch-diff-grounding
    category: correspondence
    label: matched
    finding:
      finding_id: f-batch
      description: >-
        Batch member grounding is computed from a shared combined worktree diff
        rather than the member story's own diff, so sibling stories count as
        evidence.
      recorded_at: "2026-08-03T15:00:00+00:00"
    claims:
      - claim_ref: "run-c:cccccccccccc"
        index: 2
        claim: >-
          Batch-member grounding has to be computed from the member story's own
          diff rather than a shared combined worktree diff, otherwise sibling
          stories count as relevant evidence.
        run_id: run-c
        phase: dev
        agent_role: dev
        phase_iteration: 1
        rendered_at: "2026-08-03T11:00:00+00:00"

  # ── non-correspondences ──────────────────────────────────────────────────
  - id: unrelated-subject
