what_changed:
  description: This run added a specification-gap pause path so a dev agent can raise
    an underspecified acceptance criterion, wait for an operator decision, and continue
    with the answer or a recorded assumption. It also extended audit, pending/resume,
    status, config, and prompt plumbing so the pause outcome is persisted and visible
    across run lifecycle events.
  approach: The change introduced a dedicated spec-gap flow through coordinator and
    task layers, then threaded its state through pending-decision handling, audit
    storage, resume persistence, CLI/status surfaces, and operator-facing documentation
    so the same resolution path works for answers, allowance exhaustion, and no-answer
    cases.
  files_modified: *id002
what_was_learned:
- claim: When a human-response gate accepts free-form operator input, timeout/no-answer
    handling must be derived from explicit decision state rather than sentinel text
    matching, or valid answers can be misclassified as absent.
  evidence:
  - type: review_finding
    finding_id: d0e48e966e51e326
    description: Review found that the literal free-form answer 'timeout' was treated
      as no answer even though the pending record had a real decision timestamp, showing
      that content-based sentinel checks can overwrite actual operator responses.
  - type: review_finding
    finding_id: 149e37b9e77feea2
    description: A second review finding showed the same failure mode for YAML-native
      scalar answers such as yes or 42, where a real observed decision still resolved
      as no_answer, reinforcing that the gate must key off normalized decision presence
      rather than answer shape or text.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 reported that fixing the literal-timeout collision still
      regressed hand-edited scalar decisions, demonstrating that decision detection
      logic must be unified across all accepted input forms, not patched for one special
      case.
- claim: Decision parsing for pending human gates needs a single shared predicate
    used by polling, resolution, and cleanup paths; duplicating the check in one path
    leaves behavior inconsistent under edge cases.
  evidence:
  - type: review_finding
    finding_id: e4e55d297ee54649
    description: Review flagged cleanup_stale for reading entry.get('decision') directly
      instead of using the shared decision_of helper, showing that even a non-primary
      path can diverge from the normalized decision semantics and produce inconsistent
      gate handling.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 explicitly noted that the shared pending-decision predicate
      was wired into both polling and SPEC_GAP resolution, indicating the review loop
      was converging on one canonical decision test across paths.
  - type: file
    path: src/theforge/pending.py
    description: This file is where stale pending cleanup lived; the review finding
      against it demonstrates that pending-entry interpretation occurs in multiple
      lifecycle stages and must reuse the same decision normalization logic.
