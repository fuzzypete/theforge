dev_notes: |
  summary: "The bug was a missing stop_phase guard in run_task() (engine.py). After
  _run_plan_phase() returns None, the code went directly into _coordinator_loop()
  without checking stop_phase. The fix adds a single guard: if stop_phase is not
  None and stop_phase.value <= Phase.PLAN_REVIEW.value, return a successful
  CoordinatorResult before _coordinator_loop is entered. Two unit tests were added
  to TestUntilPhaseStop. In the review cycle, codex-reviewer flagged that
  test_until_plan_stops_before_dev was not hermetic: PREFLIGHT_PROCEED_MEDIUM
  triggers story validation in _run_plan_phase before the plan agent, but the test
  did not patch theforge.story_validator.validate_story, so it could reach the real
  runner and hang. Fixed by adding @patch('theforge.story_validator.validate_story')
  returning StoryValidationResult(verdict='PASS'). Test now completes in 0.06s."
  commits:
    - sha: "62e589c"
      message: "fix(coordinator): stop pipeline before DEV when --until plan/plan-review is passed"
    - sha: "2b3ca0b"
      message: "fix(tests): patch story_validator in test_until_plan_stops_before_dev"
  acceptance_criteria:
    - criterion: "forge run <story> --until plan exits after PLAN_REVIEW completes and before DEV starts. Exit code is 0."
      status: MET
      notes: "Guard added in engine.py after _run_plan_phase returns None. DEV is never entered. Returns success=True."
    - criterion: "forge run <story> --until plan-review behaves identically to --until plan."
      status: MET
      notes: "Both Phase.PLAN (value 4) and Phase.PLAN_REVIEW (value 5) satisfy stop_phase.value <= Phase.PLAN_REVIEW.value. Same code path."
    - criterion: "forge run <story> --until dev still enters DEV and stops before VALIDATE, as before."
      status: MET
      notes: "The existing stop_phase gate in _coordinator_loop fires for Phase.DEV (6 <= 7). DEV runs, REVIEW does not. Regression test confirms."
    - criterion: "forge run <story> --until validate still enters VALIDATE and stops before REVIEW, as before."
      status: MET
      notes: "No change to _coordinator_loop. Existing test test_until_validate_stops_after_validate still passes."
    - criterion: "Unit test covers --until plan case: coordinator returns before DEV is invoked, with phase == Phase.PLAN_REVIEW (or Phase.PLAN when plan review is disabled) and success == True."
      status: MET
      notes: "test_until_plan_stops_before_dev now patches theforge.story_validator.validate_story to return PASS, making the test fully hermetic. Asserts phase==Phase.PLAN, success==True, dev_iteration==0, mock_dev_agent not called. Runs in 0.06s."
    - criterion: "Unit test covers --until dev to guard against regression."
      status: MET
      notes: "test_until_dev_stops_before_review asserts dev_trace_count==1 and mock_pool not called."
    - criterion: "All existing tests pass."
      status: MET
      notes: "1425 passed in 86.85s (iter 1 gate will re-verify)."
  story_deviations: none
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
