gate_decision: PASS
dev_notes: |
  summary: "Added complexity-based timeouts for dev and plan phases. ModelProfile gains
    timeout_medium_seconds / timeout_large_seconds; PlanConfig gains timeout_medium /
    timeout_large. resolve_timeout() in coord_util.py selects the right timeout by
    complexity. coord_phases.py uses dataclasses.replace() before run_agent for DEV;
    coordinator.py inlines the resolved value when constructing plan_profile for PLAN.
    forge.yaml resets dev base timeout from 1800 to 600 with medium=900/large=1800
    overrides for both dev and plan. Iter 1 fix (cycle 1): override-active detection for
    log lines now checks field non-None rather than comparing resolved vs base values,
    so the complexity suffix appears even when override == base. Iter 1 fix (cycle 2):
    PlanConfig.timeout default and load_config fallback corrected from 300 to 600."
  commits:
    - sha: "43e4e5d"
      message: "feat(timeouts): complexity-based timeouts for dev and plan phases"
