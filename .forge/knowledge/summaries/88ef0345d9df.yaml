what_changed:
  description: The run corrected diagnose LAND-state declaration so confirmed-cause
    results are classified from the gate-visible diagnosis content instead of being
    discarded when separately tracked incompleteness marks the artifact partial. It
    also updated diagnose typing and seam behavior around strict gaps versus lifecycle
    blockers.
  approach: The change aligned lifecycle-state derivation with the rendered Diagnosis
    section that LAND actually evaluates, removed stale assumptions that partial results
    must declare a blocked state, and tightened contract and flow checks around which
    incompleteness affects landing versus remaining audit-only.
  files_modified: *id002
what_was_learned:
- claim: When a write is validated against rendered issue content, the producer state
    must be derived from that same rendered, gate-visible content; deriving it from
    broader internal completeness metadata can create self-contradictory writes that
    discard valid completed work.
  evidence:
  - type: plan_step
    step_id: '1'
    description: The first plan step explicitly targeted aligning lifecycle blockers
      with gate-visible diagnosis content, showing the failure came from using a different
      basis for declaration than for LAND evaluation.
  - type: review_cycle
    cycle: '1'
    description: Review approved the fix specifically because declaration was derived
      from the rendered Diagnosis section the gate evaluates, demonstrating that shared
      derivation source was the mechanism that resolved the refusal.
  - type: file
    path: src/theforge/coordinator/diagnose_flow.py
    description: This flow file is where diagnose decides what state to declare at
      LAND time, so its inclusion as a changed file supports that the resolution centered
      on changing state derivation at the write boundary.
- claim: 'Not every investigation gap should block lifecycle advancement: gaps that
    are invisible to the issue-body gate but preserved in audit metadata need separate
    handling from gaps that change the user-visible diagnosis state.'
  evidence:
  - type: plan_step
    step_id: '3'
    description: The type-level contract step was framed around strict gaps versus
      lifecycle blockers, showing that the run distinguished between incompleteness
      that should remain metadata and incompleteness that should change landing state.
  - type: review_cycle
    cycle: '2'
    description: The second review approved the result because confirmed-cause diagnoses
      with gate-invisible strict gaps still land while those gaps remain audit-visible,
      directly demonstrating the separation future runs should preserve.
  - type: file
    path: src/theforge/diagnose_types.py
    description: The diagnose type contract file was part of the fix and the review
      findings both point at it, indicating that the classification boundary between
      partiality metadata and lifecycle blockers lives in the type semantics.
- claim: Changes that relax partial-result blocking need explicit verification for
    symptom-scope classification, because loosening one partiality path can silently
    drop operator-visible warnings for other incomplete diagnoses.
  evidence:
  - type: review_finding
    finding_id: a4925884574e8005
    description: Review found that a categorical-symptom diagnosis could newly land
      as full success without the previous partial warning when symptom_scope_coverage
      was absent, showing that adjacent partiality rules can regress when the main
      blocker logic is loosened.
  - type: diff
    ref: ea83f93f21146a7d17fa9dd5589a9a22c79dc2ab
    description: This later iteration was the reviewed follow-up after the finding,
      indicating the run had to correct behavior beyond the initial state-alignment
      fix to preserve intended warning semantics.
