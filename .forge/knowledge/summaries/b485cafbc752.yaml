what_changed:
  description: The run separated intake remediation failures that survive their triggering
    gate from confirmed drop outcomes, routing them into a distinct intake operator-review
    terminal state instead of treating them as DROPPED_AFTER_FIX. It also updated
    RCA, status-reading, audit, runner, and CLI surfaces so that this new intake outcome
    is represented consistently across sprint reporting.
  approach: The change introduced a new canonical story outcome for intake operator
    review, threaded it through the intake/remediation and sprint state pipeline,
    and then aligned downstream presentation and summary paths so the outcome is carried
    end-to-end rather than collapsing back into generic failure handling.
  files_modified: *id002
what_was_learned:
- claim: When introducing a new canonical story outcome, future runs should verify
    both per-story rendering and aggregate summary paths, because this codebase has
    multiple fallback routes that can silently reclassify the new state differently
    across surfaces.
  evidence:
  - type: review_finding
    finding_id: 665ab0e000c4a707
    description: Review found that when sprint summary generation lacked canonical
      story_state, an INTAKE_OPERATOR_REVIEW row was still counted as failed even
      though the story row showed a non-failed operator-review outcome, demonstrating
      that aggregate fallback logic can diverge from row-level state handling.
  - type: file
    path: src/theforge/sprint/audit.py
    description: This file was part of the fix because summary-writing logic is one
      of the places that derives status totals, showing that adding a new outcome
      requires checking not only canonical state definitions but also audit-time aggregation
      behavior.
  - type: file
    path: src/theforge/sprint/status_reader.py
    description: This file was updated alongside audit and story state, showing that
      status interpretation is distributed and that downstream readers may need explicit
      handling to avoid collapsing a new outcome back into existing buckets.
- claim: Future runs adding user-visible status labels should check fixed-width CLI
    tables explicitly, because a semantically correct new state can still break operational
    readability by overflowing established column widths.
  evidence:
  - type: review_finding
    finding_id: 370873fe213bfbc5
    description: Review caught that the status label for intake-operator-review exceeded
      the STATUS column width and shifted every subsequent column, showing that adding
      a longer outcome name can create presentation regressions even when the state
      plumbing is otherwise correct.
  - type: file
    path: src/theforge/cli/sprint_status.py
    description: This file was the surface where the overflow occurred, demonstrating
      that CLI status rendering uses fixed-width formatting that must be validated
      whenever a new status string is introduced.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 specifically notes that the prior status-column overflow
      was resolved by rendering the new outcome with a fixed-width label, confirming
      that display-width compatibility was a required verification dimension for this
      kind of change.
