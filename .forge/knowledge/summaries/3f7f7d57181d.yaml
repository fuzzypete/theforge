what_changed:
  description: Produced a reproducible measurement artifact for diagnosed issues that
    classifies whether recorded fix-success criteria admit symptom-removing changes
    and whether the landed change was such a case, along with the adjudication data
    and documentation needed to regenerate the report.
  approach: The run paired a scripted extraction/rendering pipeline with a checked-in
    adjudication file and generated report, then iterated through review to harden
    cohort selection, issue-to-landed-change joining, and artifact verification behavior.
  files_modified: *id002
what_was_learned:
- claim: For offline measurements that join cached issue facts to landed commits,
    identity must be derived from the selected issue record itself rather than from
    separately substituted cached fields, or one issue's criterion can be silently
    paired with another issue's landed change while all superficial consistency checks
    still pass.
  evidence:
  - type: review_finding
    finding_id: a40b8f6fc1dbdd94
    description: 'Review demonstrated a concrete false-positive path: swapping in
      issue #2689''s cached title and landed SHA for issue #2595 still passed drift
      and classification checks, which shows that validating substituted fields is
      insufficient unless the join is anchored to the chosen diagnose record.'
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly notes that the landed-change join was
      corrected to derive title data from the selected diagnose audit, confirming
      that the defect's cause was the join strategy rather than the surrounding renderer.
- claim: A refresh mode described as rewriting mechanical fields must preserve the
    original cohort boundary unless the operator explicitly changes it, because recomputing
    an implicit upper bound mutates the measured population and invalidates reproducibility.
  evidence:
  - type: review_finding
    finding_id: b74c86fe152845a0
    description: Review found that running --refresh-facts without --until replaced
      the stored upper bound with current UTC time, directly showing how a nominally
      mechanical refresh can silently change which issues are included in the measurement.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval records that this P1 reproducibility defect was
      fixed and verified, reinforcing that cohort-bound preservation was necessary
      to keep regenerated artifacts measuring the same window.
- claim: Checked-in artifact tests for generated reports need cell-level assertions
    on the substantive outputs, because loose string-presence checks can stay green
    after edits to rates, per-issue classifications, or named criteria and therefore
    do not protect the measurement result.
  evidence:
  - type: review_finding
    finding_id: f92a2e38944674e9
    description: Review showed that artifact tests still passed when generated rates,
      per-issue content, or named criteria were edited so long as only row count and
      a generic decision token remained consistent, demonstrating that high-level
      shape checks do not verify report substance.
  - type: review_finding
    finding_id: eaea988e3037f0ea
    description: 'A later review finding exposed the same weakness more specifically:
      with the diagnose corpus unavailable, a landed-answer cell could be altered
      without failure and a false admits result was ''verified'' only by finding the
      generic word no somewhere in the row, showing the need for exact assertions
      on each output field.'
learned_patterns:
