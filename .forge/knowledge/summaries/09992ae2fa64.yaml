what_changed:
  description: Added a manual, audit-only semantic evaluation path that reads a story
    issue, produces structured findings or terminal audit outcomes, and records run
    identity, outcome, timing, and cost without affecting readiness or mutating the
    source document. The run also added corpus reporting and baseline-freezing support
    so evaluator output can be measured against a human baseline.
  approach: The change was split into CLI entrypoints, input/prompt/parser/type plumbing,
    a runner and storage layer keyed by serialized input digest plus model and prompt
    version, and reporting logic that aggregates recorded runs into measurement metrics
    while preserving the evaluator's non-blocking, non-authoritative role.
  files_modified: *id002
what_was_learned:
- claim: When reusing prior evaluation results by identity, cache hits must exclude
    failure records and must not be bypassable through normal repeat-run controls,
    or the audit record stops meaning 'same identity, same outcome' and starts mixing
    retry policy into correctness.
  evidence:
  - type: review_finding
    finding_id: 9d470b979549cf0c
    description: Review found that serving the most recent record without filtering
      status let an EVALUATION_FAILED result permanently shadow later default invocations
      for the same identity, showing that failure records cannot participate in outcome
      reuse the same way successful parsed outcomes do.
  - type: review_finding
    finding_id: ad903e01c041fb46
    description: Review found that --no-cache forced a fresh model call even when
      digest, model id, and prompt version matched an existing record, demonstrating
      that allowing operators to bypass same-identity reuse breaks the required 'recorded
      identity returns recorded outcome' invariant.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly called out both cache P1s as resolved,
      confirming that identity-reuse semantics were a central correctness constraint
      rather than an incidental implementation detail.
- claim: If a workflow freezes a human baseline before revealing machine output, operator-supplied
    baseline data must either be reconciled visibly or rejected explicitly; silently
    preferring stored state hides disagreements that matter to the audit.
  evidence:
  - type: review_finding
    finding_id: dc639598f7f5d121
    description: Review found that invocation-supplied defect ids were discarded when
      a frozen baseline already existed, which prevented operators from seeing that
      their provided baseline disagreed with the stored one and bypassed the intended
      mismatch guard.
- claim: Metrics design can invalidate itself if normal operator flow eliminates the
    repeated live cases a report expects to count, so reporting logic has to be aligned
    with the actual execution model rather than with pre-cache assumptions.
  evidence:
  - type: review_finding
    finding_id: 27dd70223834a851
    description: Review found that once same-identity repeats were always served from
      storage, normal use could no longer produce multiple live records for the same
      identity, causing the independent repeat-stability counters to remain zero and
      exposing a mismatch between metric definition and system behavior.
learned_patterns:
- identity-cache-excludes-failures
- baseline-mismatch-must-surface
- metrics-must-match-execution-model
