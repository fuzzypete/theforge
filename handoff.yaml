gate_decision: PASS
dev_notes: |
  summary: >
    Extended `_create_workspace` in `coord_workspace.py` to recover gracefully when
    `git worktree add -b <branch>` fails because the branch already exists. Added a
    new helper `_find_worktree_for_branch` that parses `git worktree list --porcelain`
    to detect registered-but-possibly-stale worktrees. The failure-recovery block
    checks four cases in order: (1) registered worktree dir exists → reuse; (2)
    registered worktree dir missing → prune then fall through; (3) branch has commits
    ahead of base → reattach with `git worktree add` (no -b); (4) branch has 0 commits
    ahead → delete stale branch and re-run the original create_command. Each path emits
    a distinct ↻ or ⚠ WORKSPACE log prefix. Four new tests in
    `TestWorkspaceBranchCollision` cover each scenario.
  commits:
    - sha: "f7ee1d1"
      message: "feat(workspace): handle branch-collision in _create_workspace"
  acceptance_criteria:
    - criterion: "forge run succeeds when feat/<slug> branch already exists"
      status: MET
      notes: >
        All four collision scenarios now succeed instead of escalating. The
        create_command failure is intercepted, branch existence is confirmed via
        `git branch --list`, and the appropriate recovery path runs.
    - criterion: "Existing worktree with commits: reused (resume behavior)"
      status: MET
      notes: >
        When `_find_worktree_for_branch` returns a path whose directory exists, the
        function returns that path immediately with the log "↻ WORKSPACE reusing
        existing worktree (registered)". Covered by test_existing_worktree_directory_reused.
    - criterion: "Existing worktree directory missing: pruned and recreated"
      status: MET
      notes: >
        When the registered path does not exist, `git worktree prune` runs before
        falling through to the commits-ahead check. With 0 commits the branch is
        deleted and the create_command is retried. Covered by
        test_missing_directory_pruned_and_recreated.
    - criterion: "Branch exists with unmerged commits, no worktree: reattach worktree"
      status: MET
      notes: >
        When no worktree is registered and `git log base..branch` has entries,
        `git worktree add <path> <branch>` (without -b) is run. Covered by
        test_branch_with_commits_reattached.
    - criterion: "Branch exists with 0 commits ahead: delete branch, create fresh"
      status: MET
      notes: >
        When no worktree is registered and commits_ahead is empty, `git branch -D`
        runs followed by a retry of the original create_command. Covered by
        test_stale_branch_deleted_and_recreated.
    - criterion: "Log messages clearly indicate which path was taken"
      status: MET
      notes: >
        Each recovery path emits a distinct prefix: "↻ WORKSPACE reusing existing
        worktree (registered)", "⚠ WORKSPACE linked worktree directory missing —
        pruning", "↻ WORKSPACE branch has commits, reattaching worktree", or
        "⚠ WORKSPACE stale branch with 0 commits — deleting and recreating".
    - criterion: "All existing tests pass"
      status: MET
      notes: >
        1193 tests pass. The existing test_workspace_creation_fails test continues to
        pass because its mock returns (False, ...) for all shell calls including
        `git branch --list`, which triggers `not ok_branch` and falls through to the
        original error return.
    - criterion: "New tests for each collision scenario"
      status: MET
      notes: >
        TestWorkspaceBranchCollision adds four tests, one per scenario.
  story_deviations: none
  deferred_items: none
  gate_result: PASS
