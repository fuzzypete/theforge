what_changed:
  description: The run changed symbol-search handling so a single unresolvable cited
    candidate no longer aborts the entire lookup, preserving evidence from resolvable
    candidates while keeping fully unexecutable searches distinct as unverified. It
    also refined the evidence text to describe narrowed search scope.
  approach: The change narrowed mixed candidate sets to executable inputs before running
    the search, then carried the executed scope through into evidence reporting so
    partial execution and total execution failure remain distinguishable.
  files_modified: *id002
what_was_learned:
- claim: When evidence generation narrows a check to executable inputs, the reported
    evidence must describe the actual executed subset rather than the original broader
    citation set, or future readers cannot tell what absence results mean.
  evidence:
  - type: review_finding
    finding_id: 66b2ce41c832993f
    description: This review finding reported that absence evidence still read as
      if the whole cited symbol space had been checked even after narrowing to resolvable
      paths, demonstrating that partial execution needs explicit scope reporting to
      keep evidence interpretable.
  - type: review_cycle
    cycle: '2'
    description: The second review cycle approved only after narrowed-scope detail
      was added, showing that preserving successful partial searches was not sufficient
      by itself; the evidence also had to state the reduced scope.
  - type: diff
    ref: a210dcf89ba975620bfeea04ab6966354a0d7948
    description: This follow-up diff addressed the review concern by refining symbol-evidence
      scope detail, evidencing that executed-scope reporting was treated as part of
      the correctness of the fix rather than incidental wording.
- claim: If execution scope is computed during a search, later evidence rendering
    should reuse that recorded scope instead of re-deriving it independently, because
    duplicated resolution logic can let the reported scope drift from the scope actually
    searched.
  evidence:
  - type: review_finding
    finding_id: 4243a6b61afbab4f
    description: This review finding identified that evidence scope was being recomputed
      by fresh path-existence checks rather than read back from the search inputs
      that actually ran, demonstrating the risk of divergence between execution and
      reporting.
  - type: diff
    ref: a210dcf89ba975620bfeea04ab6966354a0d7948
    description: The follow-up diff resolved the issue surfaced in review, showing
      that the run treated execution metadata as something to preserve and reuse for
      reporting rather than something safe to reconstruct later.
