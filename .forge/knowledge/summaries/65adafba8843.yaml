what_changed:
  description: The diagnosis artifact contract and rendering path were updated to
    separate speculative repair advice from confirmed diagnosis content by giving
    advisory repair proposals their own typed field and distinct rendering behavior.
    The issue-body output preserves confirmed localization content as before, while
    optional unverified repair suggestions are only surfaced as explicitly advisory
    and omitted when empty.
  approach: 'The change was made end-to-end: the diagnosis schema and shape checks
    were extended with a typed advisory field, diagnose prompts were updated to direct
    investigators into that field, and the coordinator/rendering flow was threaded
    to carry and conditionally emit the advisory content distinctly from confirmed
    diagnosis material.'
  files_modified: *id002
what_was_learned:
- claim: Optional free-text YAML fields need explicit null normalization before rendering,
    because a present-but-empty key can otherwise survive parsing as a literal placeholder
    string and leak into user-facing output.
  evidence:
  - type: review_finding
    finding_id: c36b020adedb5d93
    description: The review reproduced a bare 'advisory_repair_proposal:' YAML key
      loading as null, then being stored as the literal string 'None' and rendered
      into the landed issue body, showing that optional text fields cannot rely on
      generic parsing if empty values must emit nothing.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 records that the null optional-field bug was fixed by normalising
      YAML nulls to empty, confirming that the corrective mechanism was explicit optional-text
      normalization rather than a rendering-only change.
  - type: file
    path: src/theforge/task/diagnose_prompts.py
    description: The prompt/parsing layer is where the fix was applied, demonstrating
      that this class of bug arises at the boundary where YAML output is converted
      into typed text fields and should be handled there for future optional prose
      fields.
