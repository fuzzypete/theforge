  spec_deviations:
    - "The malformed .env detection raises ValueError when dotenv_values() returns any key
      mapping to None. In practice this fires on bare keys (e.g. 'BARE_KEY_NO_EQUALS') but
      not on comment-only or empty files. This matches the spec intent and the P2 reviewer
      clarification (check raw.values() for None, not raw itself)."

