what_changed:
  description: This run added the proposal stage for `forge triage`, producing one
    schema-constrained advisory disposition per backlog finding from a fixed taxonomy,
    with evidence citations, audit-history input, and spend reporting. It also wired
    the stage into the CLI and audit substrate without applying any tracker changes.
  approach: 'The change was structured as a separate proposal flow: build an evidence
    packet from report data and audit history, invoke a fresh-context advisory agent
    under constrained output rules, validate both schema and grounding, fall back
    to `needs_verification` on invalid outputs, and record proposal and cost data
    through the audit layer.'
  files_modified: *id002
what_was_learned:
- claim: For evidence-grounded advisory output, validating only citation identifiers
    is insufficient; acceptance needs to verify that the quoted evidence text itself
    matches the packet, or grounded-looking but unsupported claims can pass.
  evidence:
  - type: review_finding
    finding_id: 47af97ad2b5b7ebc
    description: Review found that a proposal could reference a real packet evidence
      id while asserting unrelated text, which shows id-level grounding checks alone
      do not enforce that the agent's rationale is actually sourced from the supplied
      packet.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly notes verbatim quote validation as the
      fix, demonstrating that stricter text-level grounding was the mechanism required
      to satisfy the acceptance criterion.
- claim: Advisory-only stages still need mechanical execution isolation before validation,
    because schema checks happen too late to mitigate risk if the agent is launched
    with normal checkout access and secrets.
  evidence:
  - type: review_finding
    finding_id: 1df1731161b08a1c
    description: Review showed the proposer was dispatched with the normal agent runner
      in the project checkout with configured secrets, proving that an advisory flow
      can still expose mutation-capable tooling before any output validation occurs.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval cites profile sealing and secrets filtering as the
      resolution, showing that preventing write-capable execution had to be enforced
      mechanically at launch time rather than inferred from the advisory contract.
learned_patterns:
