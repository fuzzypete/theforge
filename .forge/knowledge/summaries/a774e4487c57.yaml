what_changed:
  description: This run made workspace setup timeouts configurable, propagated the
    resolved timeout through baseline, batch preflight, and dispatch workspace creation,
    and recorded the resolved policy in audit/provenance output. It also aligned sprint
    startup handling so host-load scaling that already affected gate timing also fed
    the setup-timeout resolution used for workspace setup.
  approach: The change was threaded through configuration loading, coordinator workspace
    execution, sprint-time timeout resolution, and audit schema/provenance surfaces,
    with a second review-driven iteration to separate guarded workspace rebinding
    from gate-timeout rebinding when the workspace config object is not a dataclass.
  files_modified: *id002
what_was_learned:
- claim: When timeout policy is recomputed at sprint start, any later config-context
    rebinding has to guard each replacement independently; a single upfront 'can replace'
    check is not enough if gate and workspace config objects can differ in type.
  evidence:
  - type: review_finding
    finding_id: f56ab5928a2dff28
    description: The review found that sprint startup correctly guarded setup-timeout
      resolution for a non-dataclass workspace config but still unconditionally called
      dataclasses.replace() in the later context-rebind path when gate timeout changed,
      demonstrating that rebinding safety must be enforced at each individual replacement
      site rather than assumed from an earlier check.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 notes that the fix 'split the rebind so the workspace replace()
      is guarded by the dataclass check,' confirming that the durable lesson from
      the first review issue was about per-instance guarding of rebinding logic, not
      the timeout feature itself.
  - type: file
    path: src/theforge/sprint/runner.py
    description: The sprint runner was the locus of both timeout resolution and context
      rebinding, and the review issue referenced this file specifically, showing that
      startup policy scaling and later config replacement interact in one control
      path and must be checked together.
