# forge.yaml — TheForge developing itself
project: theforge

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug}"
  setup_command: "test -d .venv || (python -m venv .venv && .venv/bin/pip install -e '.[all]' pytest pytest-xdist -q)"
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"
  on_approve: merge-pr
  merge_strategy: squash
  auto_push: true

validation:
  gate_command: ".venv/bin/python -m pytest tests/ -q -n auto --dist worksteal"
  handoff_file: ".forge/handoff.yaml"
  gate_decision_key: "gate_decision"

conventions:
  hard:
    max_module_lines: 500
    max_test_file_lines: 1000
    no_circular_imports: true
    test_mirrors_source: true
  soft:
    - "Coordinator is pure Python — no LLM calls for routing or process decisions"
    - "Schema validation is the integrity boundary — do not relax cross-validation rules"
    - "Keep modules single-purpose; extract instead of growing monolith files"
    - "Keep pure-data types in low-dependency modules with stdlib-only imports"
    - "Separate prompt construction, output parsing, and coordinator control flow"

retry:
  max_dev_iterations: 3
  max_review_cycles: 3

# Explicit profiles until adaptive assignment is stable
profiles:
  dev:
    cli: codex
    model: gpt-5.4
    budget_usd: 50.00
    timeout_seconds: 600
    timeout_medium_seconds: 900
    timeout_large_seconds: 1800
  preflight:
    provider: deepseek
    model: deepseek-reasoner
    budget_usd: 1.00
    timeout_seconds: 300
  review_pool:
    - name: codex-reviewer
      cli: codex
      model: gpt-5.4
      review_role: correctness
      budget_usd: 5.00
      timeout_seconds: 300
      reasoning_effort: high
      max_iterations: 20
    - name: claude-reviewer
      cli: claude
      model: claude-sonnet-4-6
      review_role: edge-cases
      budget_usd: 2.00
      timeout_seconds: 300
      max_iterations: 10
    - name: gemini-reviewer
      provider: google
      model: gemini-3.1-pro-preview-customtools
      review_role: architecture
      budget_usd: 2.00
      timeout_seconds: 300
      thinking_budget: 8192
      max_iterations: 10

# Plan uses DeepSeek reasoner — good structured thinking, cheap
plan:
  enabled: true
  provider: deepseek
  model: deepseek-reasoner
  budget_usd: 3.00
  timeout: 600
  timeout_medium: 900
  timeout_large: 1800

plan_agent_review:
  enabled: true
  pool:
    - name: gemini-plan-reviewer-solo
      provider: google
      model: gemini-3.1-pro-preview-customtools
      budget_usd: 0.50
      timeout_seconds: 300
      thinking_budget: 4096
      max_iterations: 10
    - name: gemini-plan-reviewer
      provider: google
      model: gemini-3.1-pro-preview-customtools
      budget_usd: 0.50
      timeout_seconds: 300
      thinking_budget: 4096
      max_iterations: 10

smart_config_models:
  - deepseek/deepseek-reasoner
  - openai/gpt-5.4
  - google/gemini-3.1-pro-preview-customtools

hooks:
  pre_run: .forge/hooks/pre_run.sh
  post_run: .forge/hooks/post_run.sh
  post_merge: .forge/hooks/post_merge.sh
  post_sprint: .forge/hooks/post_sprint.sh
  timeout_seconds: 30

notifications:
  backend: slack
  slack:
    webhook_url_env: SLACK_WEBHOOK_URL
  human_review_timeout_seconds: 600
