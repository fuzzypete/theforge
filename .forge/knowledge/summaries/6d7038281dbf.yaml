what_changed:
  description: This run added a `forge report` command that files a bug from the observing
    project into a target repository while packaging run evidence, captured runtime/config
    context, and explicit missing-artifact reporting into the created issue body.
    It also made filing conditional on evaluating the created body against the target
    repository's shape gate so the report is only submitted when its gate state is
    known.
  approach: The change was split into a CLI entrypoint plus reporting support modules
    for evidence collection, issue-body rendering, and target-repository gate evaluation,
    with documentation and focused tests around capture, rendering, CLI behavior,
    and cross-repository gate checks.
  files_modified: *id002
what_was_learned:
- claim: For cross-repository filing flows, gate validation has to be executed against
    the target repository's pinned gate revision, not the observing checkout's local
    gate, because a local pass does not establish the filed issue's actual gate state.
  evidence:
  - type: review_finding
    finding_id: efe7cd5e209c5ef4
    description: The review flagged as a P1 that the command was checking the observing
      checkout's shape gate and still filing even while acknowledging the target repository
      could use a different release, directly showing that local validation is insufficient
      for cross-repository reporting.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 requested changes specifically because the implementation
      evaluated only the observing checkout's gate before filing, demonstrating that
      future work of this kind must treat target-side gate resolution as a correctness
      requirement rather than an optional check.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approved only after the command was changed to gate the body
      with the target repository's pinned shape-gate revision, confirming that matching
      the target's gate identity is the condition that makes the flow acceptable.
  - type: file
    path: src/theforge/reporting/target_gate.py
    description: A dedicated target-gate module was introduced, which is evidence
      that cross-repository reporting required separate target-aware gate resolution
      and evaluation logic rather than reusing whatever gate context existed in the
      observing checkout.
