what_changed:
  description: This run removed triage disposition proposing from user-facing and
    automated `forge triage` paths, preserving only backlog reporting in interactive
    no-flag mode and pending-decision ratify/discard flows. It also updated terminal/help
    messaging and documentation to present proposals as shelved under ADR-0010.
  approach: The change centralized the shelved-proposal decision behind shared rejection
    handling, then applied that guard across CLI entrypoints, headless/proposal flows,
    and post-sprint triage so all proposing routes fail before agent dispatch while
    preserved paths continue unchanged.
  files_modified: *id002
what_was_learned:
- claim: When behavior is being shelved across multiple entrypoints, documentation
    of unchanged adjacent workflows must be checked explicitly; broad rewrites around
    the shelved path can silently delete the only operator-facing description of surviving
    behaviors.
  evidence:
  - type: review_finding
    finding_id: 31ba9dd313d8f7bc
    description: Review found that the CLI reference rewrite removed the only explanation
      of how operators discover and handle existing pending triage decisions even
      though that behavior still exists, showing that shelving one mode can accidentally
      erase documentation for neighboring preserved flows unless those are verified
      separately.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval notes that the documentation fix was verified after
      review, confirming that preserved pending-decision behavior needed explicit
      restoration in docs rather than falling out automatically from the shelved-path
      rewrite.
- claim: When replacing an automated flow with an immediate shelved outcome, narrative
    comments and module docstrings need the same per-entrypoint audit as executable
    logic; otherwise they retain the old multi-step story and mislead future readers
    about what still runs.
  evidence:
  - type: review_finding
    finding_id: df1a014c81dafeac
    description: Review flagged that post-sprint triage's docstring still described
      report collection, proposal, adversarial review, persistence, and supersession
      after the function had been changed to return the ADR-0010 shelved result immediately,
      demonstrating that code-path replacement does not update explanatory text unless
      audited directly.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 specifically verified the docstring correction, showing this
      mismatch mattered enough to block completion until the explanatory surface matched
      the new shelved behavior.
