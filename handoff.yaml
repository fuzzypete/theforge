gate_decision: PASS
dev_notes: |
  summary: "Added src/theforge/traces.py with write_trace(path, content) — creates parent dirs,
    writes UTF-8, catches all exceptions as warnings. Wired traces at all pipeline integration
    points: dev prompt/output in coord_phases._run_dev_phase_impl; gate output in
    coord_gate._run_gate_full (iter_num param); reviewer outputs and synthesis in
    coordinator._run_review_pool (pool_attempt param); plan.txt at every PLAN agent invocation
    in coordinator.py (both success and failure paths, including all regen paths). Iter 1 fix:
    moved plan.txt write_trace to immediately after each run_agent() call, before the success
    check, so failed PLAN invocations also capture their raw output."
  commits:
    - sha: "0f05d53"
      message: "feat(traces): add best-effort trace artifact capture for post-mortem debugging"
    - sha: "e204827"
      message: "chore(handoff): write dev_notes for trace-capture implementation"
    - sha: "4112ff1"
      message: "fix(trace-capture): rewrite dev handoff to match schema"
  acceptance_criteria:
    - criterion: "Dev prompt written to .forge/traces/{iter}-dev-prompt.txt before each dev invocation"
      status: MET
      notes: "write_trace called in coord_phases._run_dev_phase_impl before run_agent(), using state.dev_iteration"
    - criterion: "Dev agent output written to .forge/traces/{iter}-dev-output.txt after each dev invocation"
      status: MET
      notes: "write_trace called immediately after run_agent() returns, before state.dev_results.append()"
    - criterion: "Each reviewer's raw output written to .forge/traces/{cycle}-review-{profile}.txt per review cycle"
      status: MET
      notes: "Written in _run_review_pool loop using state.review_cycle+1 (matching log output) and pool_attempt. Filename is {cycle}-{attempt}-review-{profile}.txt — see spec_deviations."
    - criterion: "Synthesis output written to .forge/traces/{cycle}-synthesis.txt per review cycle"
      status: MET
      notes: "Written as {cycle}-{attempt}-synthesis.txt. Single-reviewer: raw output. Multi-reviewer: YAML-serialized merged ReviewResult via dataclasses.asdict+yaml.dump."
    - criterion: "Plan output written to .forge/traces/plan.txt when PLAN phase runs"
      status: MET
      notes: "write_trace called immediately after every run_agent() for PLAN (before success check), covering initial call, agent-review regen, and human-review regen — including failure paths."
    - criterion: "Gate output written to .forge/traces/{iter}-gate.txt after each gate run"
      status: MET
      notes: "Written in coord_gate._run_gate_full before output_tail truncation, when iter_num is not None. Workspace-setup and sprint gate calls pass iter_num=None (default) so no trace written there."
    - criterion: "Trace write failures are caught and logged as warnings"
      status: MET
      notes: "traces.write_trace wraps all I/O in except Exception and calls _cu._log() with 'Warning: trace write failed' prefix."
    - criterion: ".forge/traces/ is gitignored (or traces are written outside the git tree)"
      status: MET
      notes: ".gitignore already contains .forge/ (line 26). No change required."
    - criterion: "All existing tests pass"
      status: MET
      notes: "673 tests pass (672 pre-existing + 5 new)."
    - criterion: "No new CLI commands, no forge.yaml schema changes"
      status: MET
      notes: "No CLI or schema changes made."
  spec_deviations:
    - description: "Reviewer trace filename uses {cycle}-{attempt}-review-{profile}.txt instead of spec's {cycle}-review-{profile}.txt"
      justification: "The codebase has parse retries that re-invoke _run_review_pool within the same cycle; without the attempt suffix, consecutive retries would overwrite each other. The no-overwrite requirement (spec req 4) takes precedence over the literal filename in the AC."
  deferred_items: none
  gate_result: PASS
