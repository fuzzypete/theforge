what_was_learned:
- claim: When a reproducibility test compares against a checked-in report, the generator
    must derive its cohort from stable historical inputs rather than whatever audit
    files happen to exist locally during the run.
  evidence:
  - type: review_finding
    finding_id: c3bd0e24e6812372
    description: The review found that counting every diagnose audit under the live
      .forge/audits corpus made today's newly written audits alter the regenerated
      report, which demonstrates that local ambient audit state can break byte-for-byte
      reproducibility unless cohort selection excludes those transient records.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 recorded that the report was corrected to exclude only pre-window
      audits from the dated historical count and that the reproduction target then
      passed, showing that stabilizing the audit cohort was the mechanism that restored
      reproducibility.
- claim: Measurement/report pipelines that scan historical audits need to treat malformed
    or empty timestamps as non-fatal and classify those records out of scope instead
    of aborting the whole run.
  evidence:
  - type: review_finding
    finding_id: 76986613e8d10e7c
    description: The review identified that unguarded ISO-8601 parsing raised ValueError
      and stopped the measurement run, while the prior behavior classified such records
      as out-of-window, showing that tolerant timestamp handling is necessary for
      robust corpus scans.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 notes that unreadable timestamps were again treated as out-of-window
      and the earlier issue stayed fixed, confirming that graceful exclusion rather
      than hard failure was the effective handling strategy.
- claim: Reports intended to be reproducible from checked-in data should not re-derive
    comparison fields from live git state when those fields can drift as unrelated
    commits land later.
  evidence:
  - type: review_finding
    finding_id: aec32b54345bdcb3
    description: The review found that landed_commit facts were recomputed from a
      live integration-ref git log and then compared as drift fields, so later matching
      commits changed the output for issues already recorded, demonstrating that live
      repository history is an unstable source for reproducible report fields.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 states that the cycle-2 drift issue was resolved while the
      reproducibility path remained fixed, showing that removing dependence on live
      commit-history drift was part of restoring stable regeneration.
