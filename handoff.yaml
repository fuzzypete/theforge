dev_notes: |
  summary: "Added SprintConfig frozen dataclass (max_parallel: int = 1) to config.py,
    wired it into ForgeConfig as sprint: SprintConfig, and added parsing of the
    sprint.max_parallel key in load_config() with int >= 1 validation. In sprint.py,
    changed SprintManifest.max_parallel default from 1 to None (sentinel for 'not set'),
    updated load_sprint_manifest() to only validate the value when present, and added
    a resolution step in run_sprint() that sets manifest.max_parallel = config.sprint.max_parallel
    when the manifest omits it. All downstream code inside run_sprint() continues to read
    manifest.max_parallel as an int without changes."
  commits:
    - sha: "0a2e97f"
      message: "feat(config): add sprint.max_parallel default to forge.yaml"
  acceptance_criteria:
    - criterion: "forge.yaml accepts sprint.max_parallel as an integer >= 1"
      status: MET
      notes: "SprintConfig parsed in load_config() with ValueError on < 1 or non-int."
    - criterion: "Sprint manifests that omit max_parallel inherit the forge.yaml default"
      status: MET
      notes: "manifest.max_parallel is None after load; run_sprint() fills it from config.sprint.max_parallel."
    - criterion: "Sprint manifests that specify max_parallel override the forge.yaml default"
      status: MET
      notes: "When manifest provides max_parallel, it is never None so the resolution branch is skipped."
    - criterion: "When neither is set, default is 1"
      status: MET
      notes: "SprintConfig.max_parallel defaults to 1; manifest None resolves to that value."
    - criterion: "ForgeConfig exposes the sprint default (new field or nested config)"
      status: MET
      notes: "ForgeConfig.sprint: SprintConfig = field(default_factory=SprintConfig) added."
    - criterion: "run_sprint() reads the config default when manifest value is absent"
      status: MET
      notes: "Resolution block in run_sprint() sets manifest.max_parallel from config.sprint.max_parallel when None."
    - criterion: "All existing tests pass"
      status: MET
      notes: "1359 tests pass. Fixed test_daemon.py MagicMock to set sprint.max_parallel=1 and updated TestMaxParallelManifest to reflect the new None sentinel."
    - criterion: "New tests for config parsing and precedence logic"
      status: MET
      notes: "TestSprintConfig in test_config.py (4 tests) and TestMaxParallelPrecedence in test_sprint.py (4 tests) cover config parsing and precedence cases."
  story_deviations: none
  deferred_items: none
  gate_result: PASS
