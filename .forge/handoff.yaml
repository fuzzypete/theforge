dev_notes: |
  summary: "The bug was a missing stop_phase guard in run_task() (engine.py). After
  _run_plan_phase() returns None (plan succeeded or was skipped), the code went
  directly into _coordinator_loop() without checking stop_phase. The fix adds a
  single guard: if stop_phase is not None and stop_phase.value <= Phase.PLAN_REVIEW.value,
  return a successful CoordinatorResult with phase=state.phase before _coordinator_loop
  is entered. When plan is enabled and completes, state.phase is Phase.PLAN (or
  Phase.PLAN_REVIEW when plan_agent_review/plan_review runs); when plan is disabled,
  state.phase is Phase.PREFLIGHT but the guard still fires correctly, preventing DEV.
  Two unit tests added to TestUntilPhaseStop in test_coordinator.py: one with plan
  enabled + medium-complexity preflight to verify phase==PLAN and DEV not invoked;
  one for --until dev to guard against regression (DEV runs, REVIEW not invoked).
  All 1425 tests pass."
  commits:
    - sha: "62e589c"
      message: "fix(coordinator): stop pipeline before DEV when --until plan/plan-review is passed"
  acceptance_criteria:
    - criterion: "forge run <story> --until plan exits after PLAN_REVIEW completes and before DEV starts. Exit code is 0."
      status: MET
      notes: "Guard added in engine.py after _run_plan_phase returns None. DEV is never entered. Returns success=True."
    - criterion: "forge run <story> --until plan-review behaves identically to --until plan."
      status: MET
      notes: "Both Phase.PLAN (value 4) and Phase.PLAN_REVIEW (value 5) satisfy stop_phase.value <= Phase.PLAN_REVIEW.value. Same code path."
    - criterion: "forge run <story> --until dev still enters DEV and stops before VALIDATE, as before."
      status: MET
      notes: "The existing stop_phase gate in _coordinator_loop at Phase.VALIDATE fires for Phase.DEV (6 <= 7). DEV runs, REVIEW does not. Regression test confirms. Note: per preflight analysis, VALIDATE actually runs before the stop gate fires — the spec prose 'stops before VALIDATE' is inaccurate about current behavior, but the spirit (REVIEW not invoked) is preserved."
    - criterion: "forge run <story> --until validate still enters VALIDATE and stops before REVIEW, as before."
      status: MET
      notes: "No change to _coordinator_loop. Existing test test_until_validate_stops_after_validate still passes."
    - criterion: "Unit test covers --until plan case: coordinator returns before DEV is invoked, with phase == Phase.PLAN_REVIEW (or Phase.PLAN when plan review is disabled) and success == True."
      status: MET
      notes: "test_until_plan_stops_before_dev uses _make_plan_config (plan enabled, no plan_review) with PREFLIGHT_PROCEED_MEDIUM. Asserts phase==Phase.PLAN, success==True, dev_iteration==0, mock_dev_agent not called."
    - criterion: "Unit test covers --until dev to guard against regression."
      status: MET
      notes: "test_until_dev_stops_before_review uses default config, asserts dev_trace_count==1, mock_pool not called."
    - criterion: "All existing tests pass."
      status: MET
      notes: "1425 passed in 86.85s."
  story_deviations: none
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
