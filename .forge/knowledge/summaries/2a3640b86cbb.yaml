what_changed:
  description: This run extended prior-run context manifest records to carry a descriptive
    rendered-size payload for injected summaries, including method identity and unavailable
    states, and updated audit/report reading so legacy entries are treated as unmeasured
    rather than zero-sized.
  approach: The change was made by measuring rendered summary text at selection/assembly
    time, threading that metadata through manifest and audit storage layers, and shaping
    read-model/schema behavior so absent, unavailable, and legacy-unmeasured cases
    remain distinct.
  files_modified: *id002
what_was_learned:
- claim: Prompt-size telemetry on the context-assembly path has to use a deterministic
    local counting method or a fast degradation path; relying on optional packages
    or first-use network fetches turns descriptive measurement into a source of assembly
    stalls or universal unmeasured results.
  evidence:
  - type: review_finding
    finding_id: 5aba9b2da1802c69
    description: Review found that delegating counting to tiktoken without a declared
      dependency caused every non-empty summary in this checkout to record value None
      with tiktoken_not_installed, showing that size capture can silently collapse
      to unavailable everywhere if the method depends on undeclared tooling.
  - type: review_finding
    finding_id: 99c8bd898210dd3a
    description: Review also found the tokenizer lookup could trigger an inline first-use
      vocabulary download with no timeout on the context-assembly path, demonstrating
      that a counting method with network dependence can block prompt assembly instead
      of behaving as lightweight telemetry.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval notes that the P1 was resolved by switching to a
      deterministic stdlib estimate, showing the run's stable path came from removing
      optional dependency and network behavior from measurement.
- claim: When introducing a new provenance field, legacy backfill must advertise the
    same method semantics as newly written entries, or historical and current records
    become incomparable even if they share the same shape.
  evidence:
  - type: review_finding
    finding_id: d986138951e2d81a
    description: Review found that reader migration backfilled legacy entries with
      method cl100k_base while the writer emitted word_punctuation_estimate_v1, which
      would split one conceptual cohort across two methods and mislead any grouping
      or trend analysis by counting method.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 approval explicitly references resolution of the legacy backfill
      method mismatch, showing this consistency requirement mattered at the read/write
      boundary rather than only in writer logic.
- claim: For derived manifest telemetry, verification needs to assert the measured
    value is actually computed from source text, not just that metadata fields are
    present, because fixture-only checks can let the core derivation drift unnoticed.
  evidence:
  - type: review_finding
    finding_id: 85f7d38f6145f042
    description: Review noted that available-case coverage asserted unit, method,
      and kind but not that the integer size was derived from summary text, while
      a hand-written audit fixture supplied the value elsewhere; this shows metadata-shape
      tests alone do not verify the measurement computation.
learned_patterns:
- local-measurement-only
- legacy-method-consistency
- assert-derived-values
