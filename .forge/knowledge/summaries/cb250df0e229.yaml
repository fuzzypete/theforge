    severity: P1
    file: src/theforge/sprint/runner.py
    description: When a daemon-queued sprint's pinned configuration no longer validates,
      sprint establishment raises SystemExit, which passes straight through the daemon's
      SprintConflictError and Exception handlers and out of its queue loop, so the
      sprint is recorded with no completed entry and no crash log while the remaining
      queued sprints are stranded.
    cycles_seen: 1
    disposition: fixed
