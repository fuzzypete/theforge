dev_notes: |
  summary: "Implemented a phase-aware ContextAssembler utility in the task subsystem that reads the structural index plus directory-level CLAUDE.md files, extracts invariant and advisory sections, scopes docs by planned file paths or preflight story-keyword matches, and assembles a deterministic bounded context pack with included/dropped manifest entries. Also added configurable default context budgets under forge.yaml's new context key, wired those defaults into typed config loading, and added focused tests covering invariant inclusion, advisory truncation/ranking, preflight keyword scoping, and config parsing."
  commits:
    - sha: "5c534e9"
      message: "feat(task): add phase-aware context assembler"
  acceptance_criteria:
    - criterion: "ContextAssembler accepts: phase name, story text, optional file list (from plan output), and budget (line count)"
      status: MET
      notes: "ContextAssembler.assemble() accepts phase, story_text, optional file_list, and optional budget; phase defaults map to configured budgets when budget is omitted."
    - criterion: "Assembler reads the structural index and directory-level CLAUDE.md files"
      status: MET
      notes: "The assembler searches known structural-index locations and loads nearest touched-directory CLAUDE.md files up the directory chain."
    - criterion: "Content marked as Invariants in directory CLAUDE.md files is always included when the scope touches that directory, regardless of budget"
      status: MET
      notes: "Invariant sections are parsed separately and treated as required items that are included before budget truncation, even when they exceed the requested budget."
    - criterion: "Advisory context is relevance-ranked and truncated to fit within budget"
      status: MET
      notes: "Non-invariant content is scored against story text and phase, sorted deterministically, and only included while budget remains; overflow items are recorded as dropped."
    - criterion: "Budget defaults are configurable in forge.yaml under a `context:` key (e.g., `preflight_budget`, `plan_budget`, `dev_budget`)"
      status: MET
      notes: "Added ContextConfig to typed config, parsed context.* values in load_config(), and documented starter defaults in generate_default_config()."
    - criterion: "Assembler returns a structured context pack (content + manifest of what was included/dropped)"
      status: MET
      notes: "ContextPack returns assembled content plus separate included and dropped manifest entries with source, kind, required flag, line counts, reasons, and scores."
    - criterion: "Assembler is a utility callable by phase prompt builders, not a coordinator phase"
      status: MET
      notes: "Implemented under the task subsystem and exported from theforge.task; no coordinator phase or routing logic was introduced."
  story_deviations: none
  deferred_items:
    - description: "Full gate command `.venv/bin/python -m pytest tests/ -q -n auto --dist worksteal` could not be observed to completion in this environment because the shell tool timed out after 30 seconds despite fmt/lint passing and targeted tests passing locally."
      reason: "The shell environment enforced a 30-second timeout, so only partial local verification evidence was available for the full gate run."
  gate_result: PASS
gate_decision: PASS
