# TheForge shipped model catalog.
#
# This file *is* the default model set. Every entry is written in the canonical
# model-definition schema — the same schema a project uses under `models.custom`
# / `models.enabled` in forge.yaml — and is read by the same parser
# (config/model_catalog.py). Nothing here is behaviour: an entry is a canonical
# identity (provider + model + transport kind) plus routing policy, endpoint
# metadata and cost seeds.
#
# Adding or re-pinning a model that runs on an already-supported adapter is an
# edit to this file (or to a project's forge.yaml) — no code change, no release.
# Adding a *provider* still requires code, because a provider needs a runner
# module; declaring one that has no adapter fails at load time with a message
# naming the adapters that do exist.
#
# Schema (see docs/guides/inputs-reference.md § Model definitions):
#   provider:   adapter family — anthropic | openai | google | deepseek
#   model:      model identifier passed to that adapter
#   transport:  {kind: cli|api, runner: <optional explicit runner>}
#   routing:    tier, capability, cost_rank, dev_capable, phase_eligibility,
#               cost_rank_basis
#   base_url:   endpoint metadata (locally served OpenAI-compatible servers)
#   cost:       input_per_mtok, output_per_mtok, cached_input_per_mtok,
#               pricing_provenance, rate_basis
#   identity:   status (served|retired), verified_against, verified_on,
#               retired_reason
#   invocation: reasoning_mode (enabled|disabled)
#
# `identity` is what the entry claims about its *upstream* identifier, and when
# that claim was last checked. A `status: retired` entry is not routable at all:
# it exists so a configuration still naming the identifier is told what the
# provider did with it, instead of being told the name was never known. A served
# entry whose `verified_on` is absent or older than the window in
# config/model_identity.py is *unconfirmed* — still routable, but reported by
# `forge check-config` so an operator sees it before a run does (#2352).
#
# `cost.cached_input_per_mtok` is for providers that bill a prompt-cache hit at
# their own published rate rather than as a fixed fraction of the uncached rate.
# Omitting it keeps the generic discount in runners/schema_utils.
#
# `invocation.reasoning_mode` states a behavioural mode the provider expresses as
# a *request parameter* rather than as a distinct model name. An entry banded for
# reasoning on a provider that works that way has to declare it, or the band
# describes a mode no invocation ever asks for.
#
# `cost.pricing_provenance` names the concrete billed identity the figures were
# recorded for. Omitting it marks them *unattributed*: routing ignores them.
# `routing.cost_rank_basis` must be stated whenever the band is not this entry's
# own attributable price band — an unstated, underivable band is a load error.
#
# `cost.rate_basis` states whether spend on the entry is established from a rate
# card at all. It defaults to `token_rates`. `provider_reported` says the
# transport returns the figure it was billed, so the entry declares no rates and
# none can be *missing* — the distinction an absent `cost:` block cannot make
# (#2388). An entry declaring it may not also declare per-MTok figures.
#
# This file is the ONLY place a rate is declared. There is no packaged fallback
# table behind it: since #2388 a per-MTok figure reaches accounting from a
# catalog entry here or from a project's forge.yaml, and from nowhere else.

version: 1

models:
  # ── Anthropic ────────────────────────────────────────────────────────
  #
  # `sonnet`/`opus` are Claude-CLI shorthands, not billed identities: the CLI
  # resolves each to whichever concrete version it currently ships (the vendor
  # bills `claude-sonnet-4-6` / `claude-opus-4-6`-style names, which are pinned
  # entries of their own below). The entry identity can therefore move
  # while the literal below does not, so these figures carry no
  # pricing_provenance: they are indicative only and routing ignores them.
  # Re-attributing them requires pinning the entry to the concrete version the
  # price is true of.
  #
  # Their cost bands are not derived from those literals either — they restate
  # the vendor's own tier naming, which is what the shorthand *means* and stays
  # true when it resolves to a new version: `opus` is whatever Anthropic
  # currently sells as its flagship (strong band), `sonnet` whatever it sells as
  # the mid-priced workhorse (cheap band, as the fleet's baseline). Note the
  # bands already disagree with the literals — 3.00/15.00 would band sonnet at
  # 2 — so the figures could move to any value without moving either band.
  - provider: anthropic
    model: sonnet
    transport: {kind: cli}
    routing:
      tier: fast
      capability: 7
      cost_rank: 1
      cost_rank_basis: vendor-tier
    cost:
      input_per_mtok: 3.00
      output_per_mtok: 15.00

  - provider: anthropic
    model: opus
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 10
      cost_rank: 3
      cost_rank_basis: vendor-tier
    cost:
      input_per_mtok: 15.00
      output_per_mtok: 75.00

  # Cheap tier for the Anthropic adapter (#2252, promoted from a forge.yaml
  # project declaration where it has run since #2207). Already billed inside
  # invocations as a component model before this promotion. dev_capable and
  # phase_eligibility are stated explicitly, as they were at the project
  # layer, rather than left to the (permissive) built-in default — it has run
  # history for preflight/review only.
  - provider: anthropic
    model: haiku
    transport: {kind: cli}
    routing:
      tier: cheap
      capability: 6
      cost_rank: 1
      cost_rank_basis: vendor-tier
      dev_capable: false
      phase_eligibility: [preflight, review, advisor]
    cost:
      input_per_mtok: 1.00
      output_per_mtok: 5.00

  # ── Anthropic (pinned concrete versions) ─────────────────────────────
  #
  # #2226. The shorthands above are moving targets: the version they name is
  # whatever the CLI currently ships, so evidence gathered under one describes a
  # subject that can change underneath the key, and an *earlier* generation is
  # not expressible as a candidate at all — even when it is cheaper and
  # sufficient for the work being routed.
  #
  # These entries name concrete served versions *alongside* — not instead of —
  # the shorthands. Both stay valid, and they are separate registry identities:
  # `anthropic/opus/cli` is "whatever Anthropic currently sells as its flagship"
  # and keeps tracking releases, while `anthropic/claude-opus-4-6/cli` is one
  # specific model that does not move. A configuration naming only shorthands is
  # unaffected by their presence.
  #
  # Unlike the shorthands, a pinned model string IS the identity the vendor
  # bills under, so where a price has been observed for one it carries
  # pricing_provenance and its band derives from that price — no cost_rank_basis
  # needed. Where no price has been attributed yet, the band restates the
  # vendor's tier naming exactly as the shorthand's does, and says so.
  #
  # The rates the priced entries below carry are not for routing alone: the
  # Claude CLI reports the *billed* name in each stream event, so a run killed
  # before its result event is repriced from these figures by the kill-path
  # reconstruction in runners/runner_claude.py.

  # Current flagship. Declares no rates and needs none: the Claude CLI reports
  # what it was billed, so nothing here is ever multiplied by a token count.
  # `rate_basis` says that outright — an empty cost block would be
  # indistinguishable from a rate somebody forgot to record.
  - provider: anthropic
    model: claude-opus-5
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 10
      cost_rank: 3
      cost_rank_basis: vendor-tier
    cost:
      rate_basis: provider_reported

  # Current mid-priced workhorse. Same attribution position as claude-opus-5.
  - provider: anthropic
    model: claude-sonnet-5
    transport: {kind: cli}
    routing:
      tier: fast
      capability: 7
      cost_rank: 1
      cost_rank_basis: vendor-tier
    cost:
      rate_basis: provider_reported

  # Prior flagship generation — the candidate the shorthand cannot name. Priced
  # under its own billed identity, so its band (3) is derived, and it is
  # visibly *not* the cheap alternative its successor is.
  - provider: anthropic
    model: claude-opus-4-6
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 9
      cost_rank: 3
    cost:
      input_per_mtok: 15.00
      output_per_mtok: 75.00
      pricing_provenance: claude-opus-4-6

  # Prior mid generation. Note the band (2) disagrees with the `sonnet`
  # shorthand's (1): the shorthand bands on vendor tier, this one on its own
  # attributable price. Both are correct about different subjects.
  - provider: anthropic
    model: claude-sonnet-4-6
    transport: {kind: cli}
    routing:
      tier: fast
      capability: 7
      cost_rank: 2
    cost:
      input_per_mtok: 3.00
      output_per_mtok: 15.00
      pricing_provenance: claude-sonnet-4-6

  # Cheap tier, pinned. dev_capable/phase_eligibility mirror the `haiku`
  # shorthand: the run history those restrictions were derived from is this
  # model's.
  - provider: anthropic
    model: claude-haiku-4-5
    transport: {kind: cli}
    routing:
      tier: cheap
      capability: 6
      cost_rank: 1
      dev_capable: false
      phase_eligibility: [preflight, review, advisor]
    cost:
      input_per_mtok: 1.00
      output_per_mtok: 5.00
      pricing_provenance: claude-haiku-4-5

  # ── OpenAI (Codex CLI) ───────────────────────────────────────────────
  #
  # Unlike the Claude-CLI shorthands above, these model strings are the identity
  # the vendor bills under — they are passed through verbatim and priced under
  # the same name — so the figures are attributable to the entry. The Codex CLI
  # reports token counts and no price, so these rates are what makes a run on
  # them accountable at all.
  - provider: openai
    model: gpt-5.4
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 9
      cost_rank: 2
    cost:
      input_per_mtok: 1.25
      output_per_mtok: 10.00
      pricing_provenance: gpt-5.4

  - provider: openai
    model: gpt-5.4-mini
    transport: {kind: cli}
    routing:
      tier: cheap
      capability: 7
      cost_rank: 1
    cost:
      input_per_mtok: 0.25
      output_per_mtok: 2.00
      pricing_provenance: gpt-5.4-mini

  - provider: openai
    model: gpt-5.4-pro
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 10
      cost_rank: 3
    cost:
      input_per_mtok: 15.00
      output_per_mtok: 120.00
      pricing_provenance: gpt-5.4-pro

  # OpenAI's recommended coding model (#2252, promoted from a forge.yaml
  # `models.custom` overlay it has run under since #1184). Identifier verified
  # live against the model's own served identity; billed under this same name.
  - provider: openai
    model: gpt-5.5
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 9
      cost_rank: 3
    cost:
      input_per_mtok: 5.00
      output_per_mtok: 30.00
      pricing_provenance: gpt-5.5

  # GPT-5.6 family (promoted 2026-08-11 from the inline `models.enabled`
  # declarations this repo carried since #2207; those were the sole definition of
  # these identities, so nothing could select them by shorthand until now).
  #
  # CLI only, and deliberately so. They were first declared `api` on the belief
  # that a family shipping no `-codex` variant had no Codex CLI support. That
  # belief was never tested and was wrong — `codex exec -m` passes the identifier
  # through unchanged. The `api` declaration was the sole cause of 22 tool-call
  # 400s ("Function tools with reasoning_effort are not supported ... in
  # /v1/chat/completions"), which broke plan review, code review and the
  # escalation advisor together, since all three need tools and the API adapter
  # sends them against a model carrying a server-side default reasoning_effort.
  # Codex does its own tool calling, so the CLI path avoids it entirely. Do not
  # add API entries for this family without a live tool-call probe.
  #
  # Prices are OpenAI's published short-context rates, re-read from the pricing
  # page 2026-08-11. Long-context requests bill higher — sol $10/$45, terra
  # $4/$18 — and the schema records a single rate per identity, so cost on a
  # long-context run is understated rather than wrong-by-typo. #2206 supersedes
  # these with observed cost once each has run history.
  - provider: openai
    model: gpt-5.6-sol
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 9
      cost_rank: 3
    cost:
      input_per_mtok: 5.00
      output_per_mtok: 30.00
      pricing_provenance: gpt-5.6-sol

  - provider: openai
    model: gpt-5.6-terra
    transport: {kind: cli}
    routing:
      tier: fast
      capability: 8
      cost_rank: 2
    cost:
      input_per_mtok: 2.00
      output_per_mtok: 12.00
      pricing_provenance: gpt-5.6-terra

  # ── OpenAI (API) ─────────────────────────────────────────────────────
  - provider: openai
    model: gpt-5.4
    transport: {kind: api}
    routing:
      tier: strong
      capability: 9
      cost_rank: 2
    cost:
      input_per_mtok: 1.25
      output_per_mtok: 10.00
      pricing_provenance: gpt-5.4

  - provider: openai
    model: gpt-5.4-mini
    transport: {kind: api}
    routing:
      tier: cheap
      capability: 7
      cost_rank: 1
    cost:
      input_per_mtok: 0.25
      output_per_mtok: 2.00
      pricing_provenance: gpt-5.4-mini

  - provider: openai
    model: gpt-5.4-pro
    transport: {kind: api}
    routing:
      tier: strong
      capability: 10
      cost_rank: 3
      # Reasoning-heavy — intentionally excluded from the preflight role.
      phase_eligibility: [dev, plan, review, advisor]
    cost:
      input_per_mtok: 15.00
      output_per_mtok: 120.00
      pricing_provenance: gpt-5.4-pro

  # ── DeepSeek (API) ───────────────────────────────────────────────────
  #
  # #2352. `deepseek-chat` and `deepseek-reasoner` were retired upstream and are
  # declared as such below rather than deleted. Deleting them would have made a
  # configuration that still names one fail with "unknown model", which reads as
  # a typo; the retirement is the thing the operator needs told.
  #
  # These two entries are checked against DeepSeek's published model list and
  # pricing page, and carry the date that check was made — see `identity:`. That
  # is what the previous entries could not say: they resolved upstream, returned
  # token counts and exited 0 long after the names they used stopped designating
  # the models their capability, tier and price were recorded against.
  #
  # DeepSeek bills a prompt-cache hit at its own published rate (~2% of the
  # uncached rate), not at the flat 10%-of-input discount other providers use, so
  # the rate is stated explicitly via `cached_input_per_mtok` rather than derived.
  #
  # Reasoning is now a *request* parameter (`thinking: {type, reasoning_effort}`),
  # not a distinct model name. `invocation.reasoning_mode` is what makes the
  # reasoning band below a claim about an invocation forge actually makes.
  - provider: deepseek
    model: deepseek-v4-pro
    transport: {kind: api}
    identity:
      status: served
      verified_against: api-docs.deepseek.com model list + pricing page
      verified_on: 2026-08-10
    invocation:
      reasoning_mode: enabled
    routing:
      tier: strong
      capability: 9
      cost_rank: 2
      # Banded a step above its per-MTok rate on purpose: a reasoning model
      # spends far more output tokens per task, so the rate alone (band 1)
      # understates what filling a role with it costs.
      cost_rank_basis: declared-policy
    cost:
      input_per_mtok: 0.435
      output_per_mtok: 0.87
      cached_input_per_mtok: 0.003625
      pricing_provenance: deepseek-v4-pro

  - provider: deepseek
    model: deepseek-v4-flash
    transport: {kind: api}
    identity:
      status: served
      verified_against: api-docs.deepseek.com model list + pricing page
      verified_on: 2026-08-10
    invocation:
      reasoning_mode: enabled
    routing:
      tier: fast
      capability: 7
      cost_rank: 1
    cost:
      input_per_mtok: 0.14
      output_per_mtok: 0.28
      cached_input_per_mtok: 0.0028
      pricing_provenance: deepseek-v4-flash

  # Retired upstream. Not routable, carries no price: an identifier that no
  # longer designates what was recorded about it must not be able to price
  # anything, and the rates these entries used to carry were from a rate card
  # DeepSeek has replaced.
  - provider: deepseek
    model: deepseek-reasoner
    transport: {kind: api}
    identity:
      status: retired
      verified_against: api-docs.deepseek.com model list
      verified_on: 2026-08-10
      retired_reason: >-
        Removed from DeepSeek's published model list; superseded by
        deepseek-v4-pro. The name still resolves upstream, so calls through it
        succeed while designating a different model than the one whose
        capability, tier and price were recorded here (#2352).

  - provider: deepseek
    model: deepseek-chat
    transport: {kind: api}
    identity:
      status: retired
      verified_against: api-docs.deepseek.com model list
      verified_on: 2026-08-10
      retired_reason: >-
        Removed from DeepSeek's published model list; superseded by
        deepseek-v4-flash. The name still resolves upstream, so calls through it
        succeed while designating a different model than the one whose
        capability, tier and price were recorded here (#2352).

  # ── Google (API) ─────────────────────────────────────────────────────
  # Priced 2026-08-11 from Google's published API pricing (standard tier, text
  # input; the output figure includes thinking tokens). These were the only
  # pool-reachable entries in this catalog carrying no rate card, so every load
  # of an untouched config warned twice and any run routed here recorded its
  # spend as unknown. Audio input is billed separately at $1.00/MTok and is not
  # represented — no phase sends audio.
  - provider: google
    model: gemini-3-flash-preview
    transport: {kind: api}
    routing:
      tier: cheap
      capability: 7
      cost_rank: 1
    cost:
      input_per_mtok: 0.50
      output_per_mtok: 3.00
      pricing_provenance: gemini-3-flash-preview

  - provider: google
    model: gemini-3.1-pro-preview
    transport: {kind: api}
    routing:
      tier: strong
      capability: 9
      cost_rank: 2
    cost:
      input_per_mtok: 2.00
      output_per_mtok: 12.00
      pricing_provenance: gemini-3.1-pro-preview

  - provider: google
    model: gemini-2.5-pro
    transport: {kind: api}
    routing:
      tier: strong
      capability: 8
      cost_rank: 2
    cost:
      input_per_mtok: 1.25
      output_per_mtok: 10.00
      pricing_provenance: gemini-2.5-pro

  # Google re-entry (#2252, promoted from a forge.yaml `models.custom` overlay
  # it has run under since #1598). Adopted after gemini-3.1-pro-preview was
  # benched for a reviewer that completed without calling submit_review;
  # 3.5-flash beats it on the agentic/tool-call-chaining axes that mattered.
  - provider: google
    model: gemini-3.5-flash
    transport: {kind: api}
    routing:
      tier: strong
      capability: 9
      cost_rank: 2
    cost:
      input_per_mtok: 1.50
      output_per_mtok: 9.00
      pricing_provenance: gemini-3.5-flash

  # ── Google (Gemini CLI — explicit opt-in) ────────────────────────────
  - provider: google
    model: gemini-2.5-pro
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 8
      cost_rank: 2
      dev_capable: false
    cost:
      input_per_mtok: 1.25
      output_per_mtok: 10.00
      pricing_provenance: gemini-2.5-pro

  - provider: google
    model: gemini-3-flash-preview
    transport: {kind: cli}
    routing:
      tier: cheap
      capability: 7
      cost_rank: 1
      dev_capable: false
    cost:
      input_per_mtok: 0.50
      output_per_mtok: 3.00
      pricing_provenance: gemini-3-flash-preview

  - provider: google
    model: gemini-3.1-pro-preview
    transport: {kind: cli}
    routing:
      tier: strong
      capability: 9
      cost_rank: 2
      dev_capable: false
    cost:
      input_per_mtok: 2.00
      output_per_mtok: 12.00
      pricing_provenance: gemini-3.1-pro-preview

  # ── Local OpenAI-compatible models ───────────────────────────────────
  # API transport + a localhost base_url. Not a provider prefix, not a
  # transport kind — just an endpoint.
  - provider: openai
    model: codestral
    transport: {kind: api}
    base_url: http://localhost:11434/v1
    routing:
      tier: fast
      capability: 7
      cost_rank: 1
    cost:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      pricing_provenance: local-endpoint

  - provider: openai
    model: deepseek-coder
    transport: {kind: api}
    base_url: http://localhost:11434/v1
    routing:
      tier: fast
      capability: 7
      cost_rank: 1
    cost:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      pricing_provenance: local-endpoint

  - provider: openai
    model: llama3.1
    transport: {kind: api}
    base_url: http://localhost:11434/v1
    routing:
      tier: fast
      capability: 6
      cost_rank: 1
    cost:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      pricing_provenance: local-endpoint

  - provider: openai
    model: qwen2.5-coder
    transport: {kind: api}
    base_url: http://localhost:11434/v1
    routing:
      tier: fast
      capability: 7
      cost_rank: 1
    cost:
      input_per_mtok: 0.0
      output_per_mtok: 0.0
      pricing_provenance: local-endpoint
