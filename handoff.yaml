dev_notes: |
  summary: "Fixed the P1 line-number cross-validation rule in schemas.py and added three new tests. The old code unconditionally required a non-null line on all P1 findings, even when file was null (an architectural finding with no specific location). The fix narrows the line check: it only fires when file is explicitly set (non-null, non-empty). A P1 with file: null is treated as an architectural finding and is valid without a line. A P1 with file set to a non-empty string still requires a line. Empty-string file (file: '') still triggers the file-must-be-non-empty error, preserving the existing test. Three new tests were added: P1+file+null-line→error, P1+null-file+null-line→valid, P2+file+null-line→valid."
  commits:
    - sha: "40e7a55"
      message: "fix(schemas): enforce line numbers on P1 findings only when file is set"
  acceptance_criteria:
    - criterion: "P1 finding with `file` set and `line: null` → schema validation error"
      status: MET
      notes: "schemas.py: when file_val is truthy and line is falsy, error is appended. Covered by test_p1_with_file_and_null_line_is_error."
    - criterion: "P1 finding with `file: null` and `line: null` → valid (architectural finding)"
      status: MET
      notes: "schemas.py: when file_val is None, both the file check and line check are skipped. Covered by test_p1_with_null_file_and_null_line_is_valid."
    - criterion: "P1 finding with `file` set and `line` set → valid (normal case)"
      status: MET
      notes: "Pre-existing behavior; test_valid_request_changes confirms this case."
    - criterion: "P2 findings are NOT affected by this rule (line remains optional)"
      status: MET
      notes: "Line and file checks are inside `if severity == 'P1':` block; P2s are never checked. Covered by test_p2_with_file_and_null_line_is_valid."
    - criterion: "New test: P1 + file + null line → error"
      status: MET
      notes: "test_p1_with_file_and_null_line_is_error added to test_schemas.py."
    - criterion: "New test: P1 + null file + null line → no error"
      status: MET
      notes: "test_p1_with_null_file_and_null_line_is_valid added to test_schemas.py."
    - criterion: "New test: P2 + file + null line → no error"
      status: MET
      notes: "test_p2_with_file_and_null_line_is_valid added to test_schemas.py."
    - criterion: "Existing tests pass unchanged"
      status: MET
      notes: "986 passed in 10.98s — zero failures. test_finding_missing_file (file='') still errors as before."
  spec_deviations: none
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
