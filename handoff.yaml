      notes: "CLI argparse help strings updated (forge run/review/sprint/ideate);
        error messages say 'Story file not found'; log output says 'story written';
        forge.yaml TEMPLATE.md uses story terminology; CLAUDE.md updated"
    - criterion: "The directory for story files is named to reflect the new terminology"
      status: PARTIAL
      notes: "forge init now creates stories/ directory. The existing specs/ directory
