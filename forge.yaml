# forge.yaml — TheForge developing itself
project: theforge

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug}"
  setup_command: "python -m venv .venv && .venv/bin/pip install -e . pytest -q"
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"

validation:
  gate_command: ".venv/bin/python -m pytest tests/ -q"
  handoff_file: "handoff.yaml"
  gate_decision_key: "gate_decision"

profiles:
  dev:
    cli: claude
    model: sonnet
    budget_usd: 50.00
    timeout_seconds: 1800  # bumped from 600 — large specs need headroom; replace with complexity-based timeouts spec
    allowed_tools:
      - Read
      - Edit
      - Write
      - Bash
      - Glob
      - Grep
  preflight:
    cli: claude
    model: sonnet
    budget_usd: 1.00
    timeout_seconds: 300
    allowed_tools:
      - Read
      - Bash
      - Glob
      - Grep
  review_pool:
    - name: codex
      cli: codex
      model: gpt-5.4
      reasoning_effort: medium
      review_role: correctness
      budget_usd: 1.00
      timeout_seconds: 600
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: gemini
      cli: gemini
      model: gemini-2.5-pro
      reasoning_effort: high
      review_role: patterns
      budget_usd: 1.00
      timeout_seconds: 600
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep


smart_config_models:
  - sonnet
  - codex
  - opus

retry:
  max_dev_iterations: 3
  max_review_cycles: 3

plan:
  enabled: true
  model: claude      # CLI binary name
  model_name: sonnet # sonnet is sufficient; opus is overkill for focused specs
  budget_usd: 1.00
  timeout: 600

plan_review:
  enabled: false  # human gate disabled — agent review replaces it

plan_agent_review:
  enabled: true
  cli: codex
  model: gpt-5.4
  budget_usd: 0.50
  timeout: 300

notifications:
  backend: ntfy
  ntfy:
    url: https://ntfy.sh/theforge-pwickersham
    priority: high
