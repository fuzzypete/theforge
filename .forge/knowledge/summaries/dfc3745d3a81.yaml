what_changed:
  description: 'This run made spike closure conditional on a recorded outcome: either
    a decision not to proceed or a linked follow-on work item that carries any conditional
    trigger. It also propagated that rule into authoring guidance, issue-shape validation,
    operator flows, CLI surfaces, and GitHub close paths.'
  approach: The change combined a dedicated spike-outcome guard with schema and workflow
    integration, so the same closure rule is checked both in repository automation
    and in TheForge's own intake, completion, and story-sourcing paths.
  files_modified: *id002
what_was_learned:
- claim: When a governance rule is about whether work may close, enforcing it only
    in human-facing guidance is insufficient; the close path itself has to reject
    invalid terminal states across every automation route that can mark work complete.
  evidence:
  - type: file
    path: .github/workflows/enforce-spike-outcome.yml
    description: This workflow adds an explicit repository-side gate on spike closure,
      showing the rule was enforced where closure happens rather than left as advisory
      prose.
  - type: file
    path: .github/workflows/close-on-merge.yml
    description: This close path was updated alongside the dedicated enforcement workflow,
      demonstrating that merge-driven closure is one of the concrete routes that must
      participate in the same terminal-state check.
  - type: file
    path: .github/workflows/close-epic-on-last-subissue.yml
    description: This second automated close path was also changed, showing that closure
      enforcement has to be applied per closing mechanism rather than assumed from
      a single centralized rule.
  - type: file
    path: src/theforge/coordinator/completion.py
    description: Coordinator completion logic was updated too, indicating that repository
      workflows alone do not cover all closure entry points inside TheForge's own
      execution paths.
- claim: For spikes with conditional answers, the durable artifact has to encode the
    trigger and how it becomes observable; leaving the condition only in narrative
    text on the closed spike does not preserve an actionable next step.
  evidence:
  - type: file
    path: src/theforge/spike_guard/outcome.py
    description: The outcome logic was substantial and separate from basic closure
      checks, showing that conditional outcomes required structured parsing/validation
      rather than relying on freeform closing prose.
  - type: file
    path: docs/reference/issue-shape.md
    description: Issue-shape reference changes show the condition was modeled as part
      of the follow-on artifact's required shape, making it machine-visible instead
      of merely descriptive.
  - type: file
    path: src/theforge/sprint/sources.py
    description: Story sourcing was updated so follow-on artifacts remain visible
      in normal pipeline views, demonstrating that preserving a conditional spike
      result depends on representing it as pipeline work rather than archival text.
