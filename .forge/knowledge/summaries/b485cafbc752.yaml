what_changed:
  description: The run separated intake remediation failures that survive rerun from
    true dropped stories by routing them into a distinct intake operator-review outcome
    and carrying that outcome through runner, state, RCA, audit, status-reading, and
    CLI surfaces. It also corrected reporting so the new outcome is represented consistently
    in summaries and status displays.
  approach: The change introduced a dedicated terminal lane for surviving gate failures
    in intake remediation, then threaded that state through canonical/legacy story
    status handling and operator-facing outputs so downstream tooling treated it as
    a separate non-failed review path rather than another drop variant.
  files_modified: *id002
what_was_learned:
- claim: When adding a new terminal story outcome, future runs need to verify every
    presentation layer's width, label, and totals logic individually; canonical state
    changes do not automatically keep CLI tables and fallback summary aggregation
    consistent.
  evidence:
  - type: review_finding
    finding_id: 370873fe213bfbc5
    description: Review found that after introducing the new intake-operator-review
      status, one CLI row emitted a value longer than the fixed STATUS column, shifting
      every later column; this shows that adding an outcome requires explicit per-surface
      formatting checks, not just state wiring.
  - type: review_finding
    finding_id: 665ab0e000c4a707
    description: Review also found that when summary writing lacked canonical story_state,
      an INTAKE_OPERATOR_REVIEW row was still counted as failed even though the row
      itself showed a non-failed outcome; this demonstrates that fallback aggregation
      paths can silently diverge from the primary state model unless checked separately.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 specifically called out that the prior status-column overflow
      had been resolved with a fixed-width label, confirming that presentation-layer
      conformance was a distinct problem discovered only through review.
