gate_decision: PASS
dev_notes: |
  summary: "Implemented forge init-hooks command. Added cmd_init_hooks to cli.py
    which scaffolds .forge/hooks/post_run.sh and .forge/hooks/README.md into a
    project. The reference shell script reads the post_run JSON payload from
    stdin, guards against missing gh/jq CLIs (warn + exit 0), filters to
    ESCALATE/APPROVE verdicts only, skips zero-findings runs, and calls
    gh issue create for each P1/P2 finding with title '[P1] slug: description'
    (72-char truncated), body including file/line/description/suggestion, and
    labels forge-finding plus the severity label. Command is idempotent —
    existing files are skipped with a stderr warning. Added init-hooks to the
    main() subparser registry and dispatch table. Updated getting-started.md
    with a Lifecycle hooks section. Updated examples/hello-forge/forge.yaml
    with a commented-out hooks: block. Added 10 unit tests in TestCmdInitHooks
    using tmp_path + monkeypatch.chdir, matching the pattern of TestSecretsInit."
  commits:
    - sha: "a4af017"
      message: "feat(cli): add forge init-hooks command with reference post_run.sh"
  acceptance_criteria:
    - criterion: "forge init-hooks creates .forge/hooks/post_run.sh with executable permissions"
      status: MET
      notes: "cmd_init_hooks writes the file and calls chmod(0o755). test_post_run_sh_is_executable verifies S_IXUSR bit."
    - criterion: "forge init-hooks creates .forge/hooks/README.md documenting the payload schema"
      status: MET
      notes: "cmd_init_hooks writes _HOOKS_README including full JSON payload schema. test_creates_readme verifies existence."
    - criterion: "forge init-hooks prints guidance for adding hooks config to forge.yaml"
      status: MET
      notes: "Prints 'hooks:\\n  post_run: ...' block to stdout after scaffolding. test_prints_hooks_guidance verifies."
    - criterion: "forge init-hooks is idempotent (doesn't overwrite existing hooks)"
      status: MET
      notes: "Checks path.exists() before writing each file; skips and prints to stderr if already present. Two idempotency tests verify no overwrite."
    - criterion: "Reference script parses the post_run JSON payload correctly"
      status: MET
      notes: "Script reads stdin via jq -r for all fields: verdict, slug, branch, summary, findings[].severity/file/line/description/suggestion."
    - criterion: "Reference script creates GitHub Issues with title, body, and labels"
      status: MET
      notes: "Calls gh issue create --title --body --label forge-finding --label sev,,. Title format: '[P1] slug: description' truncated to 72 chars. Body includes all fields."
    - criterion: "Reference script handles missing gh CLI gracefully (warn + exit 0)"
      status: MET
      notes: "command -v gh guard at top; warns to stderr and exits 0. test_script_contains_gh_guard verifies."
    - criterion: "Reference script handles zero findings gracefully (exit 0)"
      status: MET
      notes: "findings_count=0 → exit 0 before the loop. test_script_contains_zero_findings_guard verifies."
    - criterion: "Unit tests for cmd_init_hooks (mocks filesystem)"
      status: MET
      notes: "TestCmdInitHooks (10 tests) uses tmp_path + monkeypatch.chdir. No mocking of open/Path; real filesystem writes in isolated tmp dirs."
    - criterion: "All existing tests pass"
      status: MET
      notes: "956 tests pass. make lint clean."
  spec_deviations:
    - description: "jq guard added in addition to gh guard"
      justification: "Both gh and jq are required; failing silently on missing jq (set -euo pipefail + missing binary = non-zero exit) would violate the 'warn don't crash' contract. Added parallel guard."
    - description: "Script also filters out REQUEST_CHANGES verdict (not just zero-findings)"
      justification: "Spec says 'escalate or approve with findings'. REQUEST_CHANGES verdict means the story is still in review — filing issues at that point is premature. Explicit verdict filter avoids spurious issues."
  deferred_items: none
  gate_result: PASS
