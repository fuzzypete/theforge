what_changed:
  description: The run changed the structural-decay observer so its reported run-coverage
    readiness is computed and explained against the same bounded population that can
    actually join changed-file sets, rather than against the entire recorded archive.
    It also updated the CLI/reporting path to describe the active denominator bound
    and to distinguish invocation-bounded shortfalls from accumulation shortfalls.
  approach: The change pushed the coverage-bound calculation into the ranking/read-model
    path, threaded the resulting bound and excluded-population metadata into report
    rendering, and iterated once more after review to correct the edge case where
    a supplied --since existed but no joinable runs established a changed-file capture
    era.
  files_modified: *id002
what_was_learned:
- claim: When a readiness metric is limited by both invocation bounds and data-admissibility
    bounds, future work should verify the rendering logic against their degenerate
    combinations, especially the case where a user-supplied lower bound exists but
    the admissibility-era bound does not.
  evidence:
  - type: review_finding
    finding_id: 5754ab6fc8419ec4
    description: Review found that the report treated 'coverage_floor equals since'
      as if that automatically meant a changed-file capture era existed, which demonstrates
      that combining multiple bounds by value alone can mislabel the active constraint
      when one source bound is absent.
  - type: review_finding
    finding_id: b404387fcce23cb2
    description: Review identified the exact untested path where coverage_floor was
      non-None while capture_start_at was None, showing that this mixed-boundary state
      is easy to miss unless explicitly exercised in verification.
  - type: review_cycle
    cycle: '2'
    description: The second review approved only after the report logic distinguished
      a tighter since-bound from a capture-era bound, confirming that the subtle part
      of this work was not the denominator math itself but correctly classifying and
      describing which bound was actually in force.
learned_patterns:
