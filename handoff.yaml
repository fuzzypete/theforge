deferred_items: none
dev_notes: 'summary: "Implemented Slack webhook notification backend. Added SlackConfig
  dataclass

  (webhook_url_env, channel, mention_on_escalate) to config.py; extended BackendConfig

  with the same fields; added slack parsing in load_forge_yaml(); synthesize

  BackendConfig(type=''slack'') for backend: slack; fixed backend: none to produce

  empty backends list (was incorrectly returning [terminal]). Added _send_slack()
  to

  notify_backends.py using Slack Block Kit format (header + section blocks); reads

  webhook URL from env var, skips with warning if unset; prepends mention_on_escalate

  to body text when is_escalation=True. Added is_escalation kwarg to

  send_notifications() to thread mention through. Updated _escalate_notify(),

  _ntfy_crash_notify(), _ntfy_done_notify() in coord_notify.py to call

  send_notifications() when backend is not ntfy/none (ntfy path unchanged, no double

  notification). Added sprint-started, budget-exceeded, and sprint-complete

  send_notifications() calls in sprint.py for non-ntfy backends. Added 12 new Slack

  tests in test_notify_backends.py covering: Block Kit format, env var reading, missing

  env var skip, channel field, mention prepend, failure propagation, dispatch routing,

  escalation mention, non-escalation suppression."

  '
gate_decision: PASS
gate_result: PASS
story_deviations:
- description: _slack_publish() placed in notify_backends.py rather than coord_notify.py
    as suggested in the spec's Implementation section.
  justification: coord_notify.py already imports from notify_backends.py; co-locating
    Slack with the other backend send functions (ntfy, webhook, terminal) avoids a
    circular import and is consistent with the existing pluggable backend architecture.
