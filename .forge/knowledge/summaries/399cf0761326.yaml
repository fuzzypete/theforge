what_changed:
  description: The run separated coordinator-imposed dev cutoffs with `max_iterations_no_submit`
    from model capability outcomes so those terminal no-submit terminations no longer
    enter model success/failure history as model failures. It also updated profile-listing
    documentation and CLI behavior around how these outcomes are represented.
  approach: The change carried the coordinator's internal termination classification
    through the state/profile bridge into profile storage, with targeted handling
    at the seam where dev-run outcomes are converted into capability records, then
    verified the behavior with seam and regression tests plus review-driven correction
    of a retry edge case.
  files_modified: *id002
what_was_learned:
- claim: When excluding coordinator-caused terminations from capability history, apply
    the exclusion only to the terminal attempt that actually ended for that reason;
    a sticky or run-global suppression flag can incorrectly erase later successful
    retries.
  evidence:
  - type: review_finding
    finding_id: 5671be2137ec25d9
    description: Review found that after an internal-iteration no-submit failure,
      a later retry could finish successfully yet still be recorded as harness_terminated,
      demonstrating that segregation logic attached too broadly will drop legitimate
      model success evidence.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 requested changes specifically because the no-submit segregation
      persisted across a later successful retry, showing the implementation risk is
      not the classification itself but letting it outlive the terminal branch where
      it was earned.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approved only after the flag was limited to the terminal
      branch where the coordinator actually ended the run, confirming that per-attempt
      scoping was the condition needed to preserve successful capability records.
  - type: file
    path: src/theforge/coordinator/model_profiles_bridge.py
    description: This seam is where run outcomes are translated into profile records;
      the review issue and its fix both centered here, demonstrating that coordinator-vs-model
      attribution must be decided at outcome-conversion time with retry-aware scope.
learned_patterns:
- terminal-outcome-not-sticky
