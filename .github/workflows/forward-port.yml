name: Forward-port release to main

# Every merge to a release/* branch is immediately forward-ported to main so
# main stays a strict superset of every release line (doctrine established
# 2026-07-11; replaces big-bang ports like #1604).
#
# Design notes (GitHub App flow — no PAT, no protection changes; #1646):
# - Main's protection requires PRs, so the port lands as an auto-MERGE-merged
#   PR from a bot branch, never a direct push. It is a real merge commit (NOT a
#   squash): a squash gives main's commit no ancestry link to release, so the
#   merge-base never advances and every subsequent port re-conflicts on any file
#   touched across cycles (this caused repeated manual syncs #1657/#1666/#1679).
#   A merge commit records release's tip as a parent, so the next port's
#   merge-base IS release's last-ported tip and already-ported files never
#   re-conflict. Main's linear-history requirement was dropped to allow this.
# - PRs created with the default Actions token do NOT trigger pull_request CI
#   (GitHub's recursion guard). A PR's required status checks are evaluated by
#   check runs *associated with the PR*, not by check runs merely sharing the
#   head SHA — so dispatching CI out-of-band never satisfies them. The fix:
#   open the PR with a GitHub App installation token (a non-Actions-token
#   identity), which makes pull_request CI fire normally; those check runs are
#   PR-associated, satisfy the required checks, and auto-merge fires on green.
# - The App (operator-action #1652) holds only Contents:RW + PullRequests:RW —
#   no admin, no protection bypass. The forward-port PR merges through the
#   front door with main's protection fully enforced, so no automation identity
#   can push to a release branch outside a checked PR.
# - pyproject.toml and CHANGELOG.md always keep main's version: release-line
#   commits bump the RC/release version and roll the changelog, and those
#   must never overwrite main's dev version or its [Unreleased] section. That
#   guard is scoped to the CONTENT, not the files (#2016): reverting the whole
#   of pyproject.toml also reverted requires-python and the ruff target-version,
#   silently, while still reporting success. scripts/forward_port_guard.py
#   restores only [project] version and main's [Unreleased] section, drops the
#   versioned sections the roll created, and fails the port if anything else
#   would be discarded.
# - Any conflict outside those two files aborts the port and files an issue
#   instead of guessing. Conflicts *inside* them are three-way merged with the
#   release side's version/roll content normalised back to the merge base, so
#   only genuine conflicts remain — and those abort the port too, rather than
#   resolving to --ours and dropping the release-line change with it.
# - "Already ported?" stays a content check (merged tree == main tree) — cheap
#   and correct regardless of strategy; a merge commit additionally keeps the
#   ancestry so conflicts don't recur.
# - Force-pushing the bot branch clears any armed auto-merge, so auto-merge
#   is (re-)armed on every run after the push.
# - This file must exist on each release/* branch as well as main: push
#   events execute the workflow definition from the pushed ref.

on:
  push:
    branches: ["release/**"]

concurrency:
  group: forward-port-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  forward-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge ${{ github.ref_name }} into main
        id: merge
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RELEASE_REF"

          set +e
          git merge --no-ff --no-edit "origin/$RELEASE_REF" \
            -m "Forward-port $RELEASE_REF into main"
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            others=$(printf '%s\n' "$conflicts" | grep -v -E '^(pyproject\.toml|CHANGELOG\.md)$' || true)
            if [ -n "$others" ]; then
              echo "Unresolvable conflicts outside version files:"
              printf '%s\n' "$others"
              git merge --abort
              echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$others" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            # Version files conflict on every rc cut / release bump. Resolving
            # them with --ours would also revert whatever else the release line
            # changed in them (#2016), so instead three-way merge each file with
            # the release side's version/roll content normalised back to the
            # merge base. Only genuine conflicts survive that, and they abort.
            for vf in $conflicts; do
              case "$vf" in
                pyproject.toml) kind=pyproject ;;
                CHANGELOG.md) kind=changelog ;;
                *) continue ;;
              esac
              ok=true
              git show ":1:$vf" > "$RUNNER_TEMP/fp-base" 2>/dev/null || ok=false
              git show ":2:$vf" > "$RUNNER_TEMP/fp-ours" 2>/dev/null || ok=false
              git show ":3:$vf" > "$RUNNER_TEMP/fp-theirs" 2>/dev/null || ok=false
              if [ "$ok" = true ]; then
                python3 scripts/forward_port_guard.py resolve --kind "$kind" \
                  --base "$RUNNER_TEMP/fp-base" \
                  --ours "$RUNNER_TEMP/fp-ours" \
                  --theirs "$RUNNER_TEMP/fp-theirs" \
                  --output "$vf" || ok=false
              else
                echo "::error::$vf conflicted with no merge-base stage; cannot resolve safely."
              fi
              if [ "$ok" != true ]; then
                git merge --abort
                echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
                echo "$vf (unresolvable version-file conflict)" >> "$GITHUB_OUTPUT"
                echo "EOF" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              git add "$vf"
            done
            git commit --no-edit
          fi

          # Even when the merge is clean, never let release-line version bumps
          # or changelog rolls land on main — but drop ONLY that content. Every
          # other release-branch change to these files ports normally, and the
          # guard fails the port if it would discard anything else (#2016).
          git show ORIG_HEAD:pyproject.toml > "$RUNNER_TEMP/fp-main-pyproject"
          git show ORIG_HEAD:CHANGELOG.md > "$RUNNER_TEMP/fp-main-changelog"
          python3 scripts/forward_port_guard.py protect --kind pyproject \
            --main "$RUNNER_TEMP/fp-main-pyproject" --merged pyproject.toml \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          python3 scripts/forward_port_guard.py protect --kind changelog \
            --main "$RUNNER_TEMP/fp-main-changelog" --merged CHANGELOG.md \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

          if ! git diff --cached --quiet -- pyproject.toml CHANGELOG.md || ! git diff --quiet -- pyproject.toml CHANGELOG.md; then
            git add pyproject.toml CHANGELOG.md
            git commit --amend --no-edit
          fi

          # Squash-ported history shares no ancestry, so "nothing to port" is
          # a tree comparison: if the merged result is content-identical to
          # main, every release change is already on main.
          if git diff --quiet ORIG_HEAD HEAD; then
            echo "Release content already on main; nothing to port."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Verify forward-port App secrets are present
        if: steps.merge.outputs.skip != 'true'
        env:
          APP_ID: ${{ secrets.FORWARD_PORT_APP_ID }}
          APP_KEY: ${{ secrets.FORWARD_PORT_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Forward-port requires the FORWARD_PORT_APP_ID and FORWARD_PORT_APP_PRIVATE_KEY repository secrets so the PR is opened by a GitHub App (not the Actions token) and pull_request CI fires. Create the App and secrets per operator-action #1652."
            exit 1
          fi

      - name: Mint GitHub App token
        id: app-token
        if: steps.merge.outputs.skip != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FORWARD_PORT_APP_ID }}
          private-key: ${{ secrets.FORWARD_PORT_APP_PRIVATE_KEY }}

      - name: Open forward-port PR and arm auto-merge
        if: steps.merge.outputs.skip != 'true'
        env:
          # App token so the PR is authored by the App, not the Actions token —
          # this is what makes pull_request CI fire with PR-associated checks.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          branch="forward-port/${RELEASE_REF//\//-}"
          # Push the bot branch as the App identity.
          git push --force \
            "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/$branch"

          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$branch" \
              --title "Forward-port $RELEASE_REF into main" \
              --body "Automated forward-port of \`$RELEASE_REF\` (@ ${{ github.sha }}) into main. main keeps its own \`[project] version\` and its \`[Unreleased]\` changelog section; every other release-line change to those files is carried, and anything else the guard would drop fails the port instead (#2016). See the run summary for exactly what was excluded. Opened by forward-port.yml via the forward-port GitHub App so pull_request CI runs with PR-associated checks (#1646)."
            existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          fi

          # Force-push clears auto-merge; re-arm every run. Merges through main's
          # normal protection once the App PR's pull_request CI is green. A real
          # merge commit (NOT squash) so main keeps release's ancestry and future
          # ports don't re-conflict on already-ported files.
          gh pr merge "$existing" --auto --merge

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          title="forward-port: $RELEASE_REF -> main failed"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf '%s\n' \
            "Automatic forward-port of \`$RELEASE_REF\` into main failed for ${{ github.sha }} (run: $run_url)." \
            "" \
            "Conflicting files outside the version-file allowlist (empty means a later step failed instead):" \
            '```' \
            "$CONFLICT_FILES" \
            '```' \
            "Until this is resolved and merged manually, main is missing release-line commits and every subsequent port will keep failing.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            existing=$(gh issue create --title "$title" --body "$body" --label bug | grep -oE '[0-9]+$')
          fi
          # Assign the operator so GitHub notifies them directly (email/mobile/
          # web) — the reliable, zero-config alert path. A silent auto-filed
          # issue is what let a forward-port failure sit unnoticed for a day
          # (#1662/#1674). Assignment is idempotent; the Slack step below is an
          # optional bonus when SLACK_WEBHOOK_URL is configured. (#1669)
          [ -n "$existing" ] && gh issue edit "$existing" --add-assignee fuzzypete || true

      - name: Notify operator on failure (Slack)
        if: failure()
        env:
          # Same webhook forge uses for sprint notifications. Add it as a repo
          # Actions secret named SLACK_WEBHOOK_URL to enable this. (#1669)
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          # No-op (never fail) if the webhook secret isn't configured — a
          # missing Slack wire must not break the forward-port itself.
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="forward-port: $RELEASE_REF -> main failed"
          issue_url=$(gh issue list --state open --search "in:title \"$title\"" --json url --jq '.[0].url // empty')
          if [ -n "$CONFLICT_FILES" ]; then
            reason="conflicting files outside the allowlist: $(printf '%s' "$CONFLICT_FILES" | tr '\n' ' ')"
          else
            reason="a workflow step failed (not a merge conflict)"
          fi
          text=$(printf '%s\n' \
            ":rotating_light: *Forward-port failed* — \`$RELEASE_REF\` -> main is not syncing; main is missing release commits." \
            "Reason: $reason" \
            "Run: $run_url" \
            ${issue_url:+"Issue: $issue_url"})
          payload=$(jq -n --arg t "$text" '{text: $t}')
          # Best-effort: a failed Slack POST must not fail the workflow.
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null \
            && echo "Slack notified." \
            || echo "Slack POST failed (non-fatal)."
