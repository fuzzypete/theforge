dev_notes: |
  summary: "Implemented all six hardening fixes: startup_failure sentinel on AgentResult with
    immediate ESCALATE in coordinator; review_pool_is_default and plan_model_is_default flags
    in ForgeConfig to prevent default values from being mistaken as explicit overrides; stale
    venv fix via _run_setup_split in coord_workspace.py that always runs pip install; start_phase
    and stop_phase wired through run_task and _coordinator_loop with the five previously-skipped
    tests now passing; and best-effort handoff.yaml copy to .forge/logs after each gate pass."

  commits:
    - sha: "cf65fc8"
      message: "fix(hardening): six release-readiness fixes"

