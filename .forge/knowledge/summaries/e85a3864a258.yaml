what_changed:
  description: This run added a plan-advisory analysis/reporting capability that measures
    whether advisory plan-review findings were resolved in shipped work, with class
    breakouts, enumerated resolved/unresolved findings, and plan-review cost context.
    It also documented the method and wired the capability into the CLI/audit surface.
  approach: The implementation is a read-only analysis flow over recorded run provenance,
    review state, and a curated judgment corpus, producing a report from joined historical
    data rather than changing execution behavior. The work was structured as analysis
    and report modules, a corpus JSON, CLI entrypoints, documentation, and focused
    tests for corpus handling and resolution judgments.
