what_changed:
  description: The run added per-story diff grounding for review findings so batched
    stories are evaluated against their own changed files, while keeping ungrounded
    findings visible in audit data instead of letting them block outcomes by default.
    It also extended audit/state plumbing and tests to cover review-only paths, shared-worktree
    batch members, fallback attribution, and escalation behavior.
  approach: The implementation introduced dedicated diff-grounding and changed-file
    resolution components, threaded their outputs through review and coordination
    paths, added a non-blocking diff_ungrounded disposition, and then iterated on
    edge cases surfaced by review until blocking decisions consistently depended on
    story-specific grounding.
  files_modified: *id001
what_was_learned:
- claim: Review-only handling for batched non-leader stories must use the same per-story
    diff-grounding rules as the main review flow, or sibling findings can still fail
    the wrong story.
  evidence:
  - type: review_finding
    finding_id: 731d615b7711fb81
    description: This finding identified that the review-only path still escalated
      from reviewer verdict alone, allowing out-of-diff P1s to fail a batched member
      story.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 reported that diff grounding was missing from the review-only
      path used for batched member stories.
  - type: file
    path: src/theforge/coordinator/review_phase.py
    description: Review-phase logic was one of the primary files changed to apply
      grounding behavior across blocking paths.
- claim: Batch-member grounding has to be computed from the member story's own diff
    rather than a leader or shared-worktree combined diff, otherwise sibling stories
    in the same batch can be treated as relevant evidence.
  evidence:
  - type: review_finding
    finding_id: 58be848e6eb2a0cb
    description: This finding showed that grounding against the leader worktree's
      combined diff let another member's changed file block an unrelated story.
  - type: review_finding
    finding_id: aff4b83b2617e806
    description: This finding showed the same sibling-grounding problem reappearing
      when review fell back to the leader branch diff after a missing structured handoff.
  - type: file
    path: src/theforge/coordinator/batch_diff.py
    description: A new batch-diff component was added as part of establishing per-story
      diff attribution in batched runs.
  - type: file
    path: tests/test_coord_batch_diff.py
    description: Batch diff behavior received dedicated test coverage, supporting
      the per-member grounding model.
- claim: Any path that resolves attributed commit SHAs for diff grounding must treat
    them as data, because shell-interpreted revision resolution can turn review metadata
    into command execution.
  evidence:
  - type: review_finding
    finding_id: d81425b4bd3b2ccd
    description: This finding documented shell execution through handoff-attributed
      commit SHAs containing metacharacters during diff resolution.
  - type: file
    path: src/theforge/coordinator/changed_files.py
    description: Changed-file resolution was updated after the shell-metacharacter
      issue was found in revision handling.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 paired the remaining grounding gap with the newly surfaced
      shell-execution issue in commit attribution.
- claim: A finding's grounding status needs to be recomputed each review cycle from
    current story evidence, because a previously ungrounded P1 can later become grounded
    and should then participate in blocking decisions.
  evidence:
  - type: review_finding
    finding_id: e5ec11b793e51cf0
    description: This finding showed that a P1 once marked diff_ungrounded stayed
      non-blocking even after its cited file entered the story diff.
  - type: review_cycle
    cycle: '4'
    description: Cycle 4 reported the stale non-blocking behavior for a recurring
      P1 after earlier grounding fixes were in place.
  - type: file
    path: src/theforge/coordinator/diff_grounding.py
    description: The dedicated diff-grounding module was added and revised to support
      current-cycle grounding decisions.
- claim: Non-blocking dispositions for ungrounded findings must be honored consistently
    by escalation and topology analysis, not just by the immediate review verdict
    path.
  evidence:
  - type: review_finding
    finding_id: ddc5d21c5c44ac41
    description: This finding showed diff_ungrounded P1 families still being treated
      as blocking evidence during topology-walk escalation.
  - type: plan_step
    step_id: '3'
    description: The plan explicitly called for applying diff-grounding consistently
      to every blocking path in review_phase.
  - type: plan_step
    step_id: '4'
    description: The plan separated visibility of ungrounded findings from routing
      them back as actionable blocking work.
  - type: file
    path: tests/test_coord_review_topology_seam.py
    description: Topology-related seam coverage was added to exercise how review escalation
      treats grounded versus ungrounded findings.
- claim: Making false-rejection cases recoverable required schema and audit-path changes,
    not only review logic changes, so diff-grounding outcomes are preserved in recorded
    run artifacts.
  evidence:
  - type: plan_step
    step_id: '1'
    description: The first plan step introduced a non-blocking disposition for findings
      that cannot be tied to the story diff.
  - type: file
    path: src/theforge/coordinator/audit.py
    description: Audit handling was changed as part of recording the new review disposition
      behavior.
  - type: file
    path: src/theforge/coordinator/audit_storage.py
    description: Audit storage was updated alongside audit logic to persist the new
      review outcome details.
  - type: file
    path: tests/fixtures/audit_record_schema_v31.json
    description: The audit schema fixture was expanded, indicating persisted record
      changes for the new disposition and review metadata.
