dev_notes: "summary: \"Implemented full process detachment for forge run/sprint. Created\
  \ a new detach.py module with double-fork daemonization (reusing the UNIX double-fork\
  \ pattern from daemon.py), macOS App Nap suppression via NSProcessInfo (PyObjC)\
  \ with ctypes IOPMAssertionCreateWithName fallback, per-run PID file management\
  \ (.forge/runs/<run-id>.pid, line 1: PID, line 2: slug), and stale PID cleanup.\
  \ Wired daemonization into cmd_run and cmd_sprint with a --fg escape hatch. The\
  \ daemon queue routing in cmd_sprint now requires explicit --detach flag (the new\
  \ model replaces daemon-based execution). Rewrote forge status to scan .forge/runs/*.pid\
  \ for live runs with phase/cost/elapsed table. Added forge logs <run-id> (tail -f\
  \ wrapper) and forge stop <run-id> (SIGTERM). forge daemon now emits DeprecationWarning\
  \ but is otherwise unchanged. Updated test_daemon.py to add fg=True to existing\
  \ sprint tests and updated the daemon-routing test to use detach=True. Added 17\
  \ new tests in test_detach.py and 11 new tests in test_cli.py.\"\n\ncommits:\n \
  \ - sha: \"4fcab1a\"\n    message: \"feat(detach): process detachment — every forge\
  \ run survives terminal close\"\n  - sha: \"0a3bf35\"\n    message: \"chore(handoff):\
  \ write dev_notes for process-detachment story\"\n\nacceptance_criteria:\n  - criterion:\
  \ \"forge run daemonizes by default, prints run ID and log path\"\n    status: MET\n\
  \    notes: \"cmd_run calls detach.daemonize_run() unless --fg is set. Parent prints\
  \ run ID, log path, and forge status/logs hints before exiting 0.\"\n\n  - criterion:\
  \ \"--fg flag preserves current foreground behavior\"\n    status: MET\n    notes:\
  \ \"--fg added to both run and sprint subparsers. When set, daemonize_run is skipped\
  \ entirely.\"\n\n  - criterion: \"Process survives terminal close (setsid)\"\n \
  \   status: MET\n    notes: \"daemonize_run performs double-fork + os.setsid() in\
  \ the intermediate child, matching the pattern in daemon.py.\"\n\n  - criterion:\
  \ \"App Nap disabled on macOS\"\n    status: MET\n    notes: \"suppress_app_nap()\
  \ calls NSProcessInfo.beginActivityWithOptions_reason_ via PyObjC, falls back to\
  \ IOPMAssertionCreateWithName via ctypes. No-op on non-macOS and when frameworks\
  \ are unavailable.\"\n\n  - criterion: \".forge/runs/<run-id>.pid written on start,\
  \ removed on completion\"\n    status: MET\n    notes: \"write_pid() called in grandchild\
  \ after double-fork. remove_pid() called at the end of cmd_run and cmd_sprint. install_cleanup_handler()\
  \ also removes PID on SIGTERM.\"\n\n  - criterion: \"forge status lists active runs\
  \ with phase, cost, elapsed\"\n    status: MET\n    notes: \"cmd_status rewritten\
  \ to call detach.list_active_runs() and read_run_status(). Prints table with RUN\
  \ ID / STORY / PHASE / COST / ELAPSED columns. Phase extracted from [forge] ▸ <PHASE>\
  \ log markers. Elapsed from log file creation time. Still shows pending decisions\
  \ section.\"\n\n  - criterion: \"forge logs <run-id> tails the run log\"\n    status:\
  \ MET\n    notes: \"cmd_logs added. Finds log via PID file slug (new-style: .forge/logs/<slug>/run.log)\
  \ or falls back to rglob for legacy run-<run_id>.log. Calls subprocess.run(['tail',\
  \ '-f', log_path]).\"\n\n  - criterion: \"forge stop <run-id> sends SIGTERM for\
  \ clean shutdown\"\n    status: MET\n    notes: \"cmd_stop added. Reads PID from\
  \ .forge/runs/<run-id>.pid, calls os.kill(pid, SIGTERM).\"\n\n  - criterion: \"\
  Stale PID files cleaned up by forge status\"\n    status: MET\n    notes: \"list_active_runs()\
  \ uses os.kill(pid, 0) to check liveness and unlinks stale PID files. Called on\
  \ every forge status invocation.\"\n\n  - criterion: \"All existing tests pass\"\
  \n    status: MET\n    notes: \"1351 tests pass. Fixed test_daemon.py tests that\
  \ called cmd_sprint without fg=True (would trigger actual fork). Updated test_submit_routes_to_daemon\
  \ to use detach=True since daemon queue routing now requires explicit --detach.\"\
  \n\n  - criterion: \"forge daemon start/stop still works (not removed, just deprecated)\"\
  \n    status: MET\n    notes: \"cmd_daemon is unchanged functionally. Added warnings.warn(DeprecationWarning)\
  \ at the top. All 12 daemon tests pass.\"\n\nstory_deviations:\n  - description:\
  \ \"Daemon queue routing in cmd_sprint now requires --detach flag (previously triggered\
  \ by is_daemon_running() alone).\"\n    justification: \"Daemonization happens before\
  \ the daemon check, and the two execution models are incompatible. --detach is now\
  \ the explicit opt-in for the legacy daemon queue path.\"\n\ndeferred_items: none\n\
  \ngate_result: PASS\n"
gate_decision: PASS
