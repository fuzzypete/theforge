dev_notes: |
  summary: "Replaced freeform markdown plan output with structured YAML. Added PlanStep
    and PlanData TypedDicts to task.py, plus parse_plan_output() which validates the
    plan: YAML schema and returns None on failure (fallback). build_plan_prompt() now
    requests YAML output. build_dev_prompt() detects PlanData dict and renders a numbered
    step checklist; raw string path preserved as fallback. build_plan_review_prompt()
    accepts str|PlanData and appends a Criteria Mapping section when criteria_mapping
    is present. CoordinatorState gains plan_structured: PlanData|None alongside the
    existing plan_output raw string (for audit). coordinator.py calls parse_plan_output()
    at all 5 plan assignment sites. coord_phases.py passes plan_structured (preferred)
    or plan_output (fallback) to build_dev_prompt(). Fenced code blocks (```yaml) are
    handled transparently in the parser. 101 new tests added; 1075 total pass."
  commits:
    - sha: "5f19085"
      message: "feat(plan): structured YAML plan output with step-by-step checklist"
  acceptance_criteria:
    - criterion: "Plan agent prompt updated to request YAML output format"
      status: MET
      notes: "build_plan_prompt() Output Format section now requests YAML starting with
        'plan:' key, with full schema example including steps, criteria_mapping, risks."
    - criterion: "Plan output parsed as YAML in coordinator; stored as structured dict"
      status: MET
      notes: "parse_plan_output() in task.py validates and returns PlanData dict.
        coordinator.py stores result in state.plan_structured at all plan assignment sites."
    - criterion: "Fallback: freeform markdown still accepted (no crash on non-YAML output)"
      status: MET
      notes: "parse_plan_output() returns None when text does not start with 'plan:' or
        '---'. Coordinator uses plan_structured when not None, falls back to plan_output
        string otherwise. No crash path exists."
    - criterion: "build_dev_prompt() renders structured plan as step-by-step checklist"
      status: MET
      notes: "When plan_output is a PlanData dict, renders numbered steps with Action,
        Depends on, and Details lines. String input renders verbatim as before."
    - criterion: "build_plan_review_prompt() includes criteria_mapping for reviewers"
      status: MET
      notes: "When plan_content is a PlanData dict with criteria_mapping, a 'Criteria
        Mapping' section is appended showing each criterion mapped to step IDs."
    - criterion: "Plan dataclass or TypedDict defined for type safety"
      status: MET
      notes: "PlanStep (with required _PlanStepRequired base and optional depends_on) and
        PlanData (with optional criteria_mapping and risks) TypedDicts in task.py."
    - criterion: "Steps have: id, description, files, action, details, optional depends_on"
      status: MET
      notes: "PlanStep TypedDict enforces all required fields. parse_plan_output()
        validates each step has id, description, files, action, details."
    - criterion: "criteria_mapping traces ACs to step IDs"
      status: MET
      notes: "criteria_mapping is preserved in PlanData when present. Validated as list.
        Treated as optional — plans without it still parse successfully."
    - criterion: "Plan stored in coordinator state for audit trail"
      status: MET
      notes: "state.plan_output (raw string) unchanged — forge_plan.md still written.
        state.plan_structured added as separate field for structured data."
    - criterion: "All existing tests pass"
      status: MET
      notes: "1075 tests pass. Updated one existing test (test_output_starts_with_
        implementation_plan → test_output_requests_yaml_format) that correctly reflects
        the new YAML output format."
    - criterion: "New tests for YAML plan parsing, fallback to markdown, dev prompt rendering"
      status: MET
      notes: "Added TestParsePlanOutput (14 tests), TestBuildDevPromptStructuredPlan (8
        tests), TestBuildPlanReviewPromptStructured (5 tests). Covers valid YAML, invalid
        YAML fallback, fenced blocks, missing fields, optional fields, and both prompt
        rendering paths."
  spec_deviations: none
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
