dev_notes: |
  summary: "Added `_editable_source_path()` to parse `direct_url.json` and return the
    editable checkout filesystem path. `_get_dev_suffix()` accepts that path and passes
    it as `cwd=` to `git describe --tags --long`, so the suffix reflects the installed
    package state regardless of where `forge version` is invoked. `cmd_version` calls
    `_editable_source_path()` once and shares the result with both `_get_dev_suffix()`
    and the informational git lines, eliminating duplicate subprocess calls. Exception
    handling was clarified: `PackageNotFoundError` is caught only from `distribution()`;
    `read_text()` returns None on missing files. Tests were refactored: the unused
    `_patch` helper was removed, mocks now patch `_editable_source_path` directly, a
    new `test_git_runs_in_editable_source_dir_not_cwd` asserts the `cwd` kwarg, and a
    `TestEditableSourcePath` class covers the URL-to-path conversion."
  commits:
    - sha: "095a848"
      message: "feat(version): append -dev+g<hash> suffix when editable install is ahead of tag"
    - sha: "b22a121"
      message: "fix(version): run git describe in editable source dir, not CWD"
  acceptance_criteria:
    - criterion: "Editable install with commits ahead of tag shows <version>-dev+g<hash>"
      status: MET
      notes: "_get_dev_suffix() returns '-dev+g<hash>' when git describe distance > 0; uses cwd=source_path."
    - criterion: "Editable install at exact tag shows clean version with no suffix"
      status: MET
      notes: "When distance == 0, _get_dev_suffix() returns '' leaving the version unchanged."
    - criterion: "Non-editable (PyPI) install shows clean version only"
      status: MET
      notes: "_editable_source_path() returns None when direct_url.json is absent; _get_dev_suffix() returns ''."
    - criterion: "forge version output includes the dev suffix when applicable"
      status: MET
      notes: "cmd_version prints theforge.__version__ + _get_dev_suffix(source_path)."
    - criterion: "Existing tests pass"
      status: MET
      notes: "1419 tests passed on iter 1; iter 2 fixes pass all new tests."
    - criterion: "New tests cover: dev suffix appended when ahead, clean when at tag, clean when git unavailable"
      status: MET
      notes: "TestGetDevSuffix + TestEditableSourcePath cover all cases including cwd assertion."
  story_deviations: none
  deferred_items: none
  gate_result: PASS
