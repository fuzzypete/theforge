what_changed:
  description: The run reconciled run identity handling across canonical and preserved
    audit trees, knowledge indexing, and summary-flow record lookup so the same run
    is treated as one logical record even when artifacts exist in multiple locations
    or under multiple identifiers. It also tightened canonical audit-record rewriting
    to merge newer payloads without discarding richer existing data or leaving stale
    summary metadata behind.
  approach: The change established deterministic identity and record-selection rules
    at read/rebuild time, then paired them with preservation-oriented merge logic
    for canonical rewrites and summary outcomes so later thinner or partial writes
    no longer win merely because they are newer.
  files_modified: *id002
what_was_learned:
- claim: When a workflow can re-encounter the same logical run from multiple storage
    trees or identifier forms, future work should define reconciliation rules at the
    key level up front; otherwise rebuilds and indexes drift based on traversal order
    or duplicate the run.
  evidence:
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 states that the run-identity reconciliation now matches the
      spec only after earlier issues were addressed, showing that the hard part was
      not reading both trees but enforcing one deterministic identity across them.
  - type: file
    path: src/theforge/knowledge_index.py
    description: This file was part of the identity-focused change surface because
      the index had to stop treating separate tree copies as separate rows, demonstrating
      that reconciliation belongs in the indexing key logic rather than in later consumers.
  - type: file
    path: src/theforge/coordinator/audit_storage.py
    description: Audit storage was changed alongside the index, showing that identity
      consistency had to be enforced where records are discovered and selected, not
      only where they are displayed.
- claim: For append-over-time audit records, a rewrite path must merge semantically
    and preserve richer prior facts; replacing nested structures wholesale lets later
    thinner payloads erase valid detail even when the update looks superficially equivalent.
  evidence:
  - type: review_finding
    finding_id: 8aaf99f47dafe1d8
    description: The finding shows that even when a later payload had the same number
      of review entries, replacing the list removed fields inside an entry, demonstrating
      that shape-level equality is not sufficient for safe overwrite.
  - type: review_finding
    finding_id: f5ae85af6a82d117
    description: 'This finding shows a second failure mode of forced rewrite logic:
      reviewer-specific failure metadata could be copied onto the wrong reviewer and
      later shorter payloads could discard attempts, confirming that merges must preserve
      per-entity identity and accumulated detail.'
  - type: file
    path: src/theforge/sprint/audit.py
    description: The repeated review findings both pointed at sprint audit rewriting,
      showing that canonical record persistence is a merge problem over nested per-run
      state rather than a simple last-write-wins replacement.
- claim: Terminal outcome caching for generated artifacts must be keyed by the exact
    generation input state, and missing provenance fields are not benign defaults;
    otherwise reruns either suppress needed regeneration or repeatedly re-dispatch
    billed work.
  evidence:
  - type: review_finding
    finding_id: 47e9b9b374adcf3d
    description: The finding shows that a written summary without a generation-input
      digest caused changed input to reuse an old terminal outcome, demonstrating
      that outcome reuse is unsafe when provenance is incomplete.
  - type: review_finding
    finding_id: a2a46203350583b3
    description: 'This finding shows the opposite failure mode: when artifact existence
      and mirrored outcome state diverged, retries alternated between already-exists
      recording and fresh dispatch, proving that cache correctness depends on reconciling
      provenance and persisted outcome together.'
  - type: review_finding
    finding_id: 3c3511d243251148
    description: The net-new finding shows that even after core fixes, a failed or
      rejected changed re-entry could keep dispatching on unchanged terminal rewrites
      when an older artifact remained, reinforcing that retry suppression must consider
      both prior artifact state and current input identity.
- claim: If production distinguishes multiple run identifiers, fixtures that collapse
    them into one will hide identity bugs; future verification should preserve the
    real identifier split whenever ownership or lookup behavior is under test.
  evidence:
  - type: file
    path: tests/fixtures/audit_record_schema_v49.json
    description: A new fixture schema was introduced as part of this run's verification
      surface, reflecting that the test substrate had to represent production audit
      identity more faithfully for the bug class to be exercisable.
  - type: file
    path: tests/test_sprint_rca.py
    description: Sprint RCA verification was updated in the same run because classifier
      behavior depends on which identifier is available, showing that tests around
      ownership and lookup must model the production distinction between run ids.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 did not stop at code-path fixes and continued to surface
      record-shape issues, which is consistent with identity regressions surviving
      when the test world does not preserve the same identifier relationships as production.
