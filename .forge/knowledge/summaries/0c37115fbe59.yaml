what_was_learned:
- claim: When provenance is surfaced through multiple reporting views, each renderer
    needs its own output-level verification because a shared data-path can still produce
    misleading presentation in one consumer.
  evidence:
  - type: review_finding
    finding_id: eaf9793d114e595d
    description: The review found that the same post-gate sweep detail was present
      but mis-indented in the audit renderer, showing that carrying correct metadata
      end-to-end was not sufficient; each presentation layer required its own formatting
      check to keep the provenance legible.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approved after the audit-indentation issue was fixed, demonstrating
      that the remaining work was not data capture but per-renderer presentation correctness
      for the surfaced provenance.
  - type: file
    path: src/theforge/cli/audit.py
    description: This renderer was the location of the indentation defect, demonstrating
      that one consumer of the shared sweep metadata could misrepresent the information
      even when upstream capture was correct.
  - type: file
    path: src/theforge/cli/sprint_digest.py
    description: A separate CLI consumer was updated alongside audit output, showing
      that the same provenance had to be validated independently in more than one
      rendered view.
- claim: Review and gate provenance must be tied to the exact reviewed HEAD, because
    approval on one commit and validation evidence from another leaves post-gate sweep
    behavior needing explicit re-verification.
  evidence:
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 explicitly notes that the supplied PASS was for 10d4da52
      while the reviewed HEAD was 339deb12, and that focused verification was performed
      on the changed sweep paths, showing that commit mismatches force re-checking
