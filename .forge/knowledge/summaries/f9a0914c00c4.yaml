what_changed:
  description: The run extended `forge explain` so it can surface routing explanations
    for live and stopped stories by reading durable unfinished-run records, and updated
    the CLI documentation to describe the reachable explanation paths and their behavior.
  approach: It split unfinished-run lookup into a dedicated live/stopped audit-reading
    path wired into the existing explain command, then hardened run-id resolution
    and operator-facing messaging around malformed or absent records while documenting
    the resulting command surface.
  files_modified: *id002
what_was_learned:
- claim: When adding fallback discovery across many on-disk audit files, lookup must
    verify record identity before surfacing parse or presence results; otherwise unrelated
    corrupt files can be misattributed to the requested run.
  evidence:
  - type: review_finding
    finding_id: 68146b2162902405
    description: The review found that `forge explain --run missing-run` could report
      a record for the requested run merely because some other story's live audit
      file was malformed, demonstrating that broad fallback scans need per-record
      identity checks before turning errors into user-visible conclusions.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 requested changes specifically because targetless run lookups
      could convert malformed unrelated live audits into false positives for the requested
      run, showing this verification requirement was a blocking correctness issue
      rather than an edge-case nicety.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval notes that run-id lookups no longer claim another
      story's corrupt audit as the requested record, confirming that identity-gated
      error handling was the condition needed to make the fallback path trustworthy.
  - type: file
    path: tests/test_cli_explain_live.py
    description: 'The dedicated tests for malformed unrelated-record paths demonstrate
      that verification was enforced at the lookup boundary: unrelated bad files are
      exercised specifically to ensure they do not satisfy or poison the requested
      run-id query.'
