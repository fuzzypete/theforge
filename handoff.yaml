dev_notes: |
  summary: >
    Implemented all four coordinated changes for review convergence: (1) wired
    cycle_history into build_review_prompt() with tri-part framing for cycle 2+;
    (2) added FindingRecord dataclass and finding_registry to CoordinatorState;
    (3) created finding_classifier.py with pure-Python fingerprinting (sha256 of
    severity+file+normalized tokens), Jaccard similarity matching (threshold 0.5),
    changed-file correlation via git diff --name-only, corroboration detection, and
    disposition assignment; (4) replaced flat any-P1-blocks with disposition-gated
    exit criteria (unresolved/regression/corroborated_new block; net_new doesn't);
    (5) fixed parse-retry loop to resume CLI sessions via session_id and embed
    original output in API corrective prompts. Cycle 1 uses traditional blocking
    (any P1 blocks) since there's no prior baseline; cycle 2+ uses dispositions.
    A fallback ensures synthetic P1s (injected when all reviewers fail to parse)
    still block even when individual reviewer tracking has no data.

  commits:
    - sha: "52afc74"
      message: "feat(review): cycle-aware prompts, finding classification, and disposition-gated exit criteria"

  acceptance_criteria:
    - criterion: "build_review_prompt() accepts cycle_history parameter"
      status: MET
      notes: "Added cycle_history: list[CycleHistory] | None = None to signature in task.py:892"

    - criterion: "Cycle 2+ review prompts include previous cycle findings and tri-part framing"
      status: MET
      notes: >
        When cycle_history is non-empty, renders Cycle-Aware Review Framing section with
        Part 1 (Verify Fixes), Part 2 (Scan Regressions), Part 3 (Additional Findings).
        Prior P1s from all cycles listed explicitly.

    - criterion: "Cycle 1 review prompts unchanged (full independent review)"
      status: MET
      notes: "Empty/None cycle_history produces no framing section. Existing tests confirm no regression."

    - criterion: "FindingRecord dataclass in coord_state.py with all specified fields"
      status: MET
      notes: >
        FindingRecord has finding_id, cycle_first_seen, cycle_last_seen, file, line,
        severity, description, reporter, disposition — all spec-required fields present.

    - criterion: "CoordinatorState has finding_registry field"
      status: MET
      notes: >
        finding_registry: list[FindingRecord] = field(default_factory=list) added to
        CoordinatorState. Also added last_dev_start_commit for git diff correlation.

    - criterion: "Finding registry updated after each review cycle"
      status: MET
      notes: >
        update_finding_registry() called in coord_phases.py after every cycle (including
        cycle 1). Cycle 1 findings all receive disposition=net_new as baseline.

    - criterion: "Deterministic fingerprint matching: file + normalized description tokens"
      status: MET
      notes: >
        sha256(severity|file|sorted_normalized_tokens)[:16]. Jaccard similarity >= 0.5
        threshold. Both documented with calibration note in finding_classifier.py.

    - criterion: "Changed-file correlation via git diff from previous dev iteration"
      status: MET
      notes: >
        _get_changed_files() runs git diff --name-only <prev_commit>..HEAD.
        last_dev_start_commit captured before each dev agent run via git rev-parse HEAD.
        Interpreted as same-file-only (not line-level) with comment explaining rationale.

    - criterion: "Corroboration detection: 2+ reviewers raising same net-new finding"
      status: MET
      notes: >
        fingerprint_to_reports tracks {fingerprint -> [(reviewer, finding)]}.
        If 2+ unique reviewers and finding not previously raised -> corroborated_new.

    - criterion: "Disposition assignment is pure Python, no LLM"
      status: MET
      notes: "finding_classifier.py is stdlib-only. No LLM calls anywhere in the classification path."

    - criterion: "Exit criteria: unresolved/regression/corroborated_new P1s block; single-reviewer net_new P1s don't block"
      status: MET
      notes: >
        Applies to cycle 2+. Cycle 1 retains traditional any-P1-blocks behavior (no prior
        baseline). Fallback ensures synthetic P1s (from all-reviewers-fail injection) still
        block even when _classified is empty.

    - criterion: "Net-new non-blocking P1s recorded in audit trail with explicit labeling"
      status: MET
      notes: >
        coord_audit.py emits finding_registry (all findings) and non_blocking_p1s
        (P1s with disposition=net_new) as dedicated keys in the audit YAML.

    - criterion: "Parse retry for CLI agents passes session_id for session continuity"
      status: MET
      notes: >
        coordinator.py retry loop captures _original_result = successful[i] and passes
        session_id=_original_result.session_id to run_agent() for CLI agents.

    - criterion: "Parse retry for API agents includes original output in corrective prompt"
      status: MET
      notes: >
        API agents: _original_result.output embedded in corrective prompt. Built via string
        concatenation (not str.format) to avoid brace collision with original output.

    - criterion: "Corrective prompt says 'reformat, do NOT re-review'"
      status: MET
      notes: "Both CLI and API corrective prompts say 'Reformat your output as valid YAML. Do NOT re-review the code.'"

    - criterion: "All existing tests pass"
      status: MET
      notes: >
        1035 tests pass. Key edge cases handled: subprocess mock interception
        (caught with broad except), synthetic P1 injection fallback.

    - criterion: "New tests for finding fingerprinting, classification logic, and exit criteria"
      status: MET
      notes: >
        tests/test_finding_classifier.py: 30 tests covering normalize_tokens, jaccard,
        fingerprint, matches_prior, update_finding_registry (cycle 1 and 2+),
        has_blocking_p1, net_new_p1s, get_changed_files.
        tests/test_task.py: 8 new tests in TestBuildReviewPromptCycleHistory.

  spec_deviations:
    - >
      Cycle 1 uses traditional any-P1-blocks exit rule (not disposition-gated). The spec
      says "after parsing cycle 2+ review results" for classification context. Applying
      net_new=non-blocking to cycle 1 would make first-cycle REQUEST_CHANGES non-blocking,
      which is clearly wrong. Cycle 1 findings are still recorded in registry as net_new
      for cycle 2 baseline.
    - >
      The corrective prompt template was replaced with mode-specific string building
      (not str.format) to avoid {original_output} brace collision with reviewer output.
      Behavior is equivalent, implementation is safer.
    - >
      _effective_approve: the coordinator now overrides synthesized verdict when all P1s
      are net_new (cycle 2+). The synthesized verdict is preserved in ReviewResult for audit,
      but blocking decision is computed independently as specified.

  deferred_items: none

  gate_result: PASS
