what_changed:
  description: The run changed DEV failure handling so model-output classification
    is driven by invocation evidence instead of output-text markers, and retry/session-resume
    decisions stop treating a failing attempt as authoritative about what should be
    resumed. It also changed no-submit retry-note handling so the same guidance text
    is not appended twice with different framing.
  approach: The change centralized retry gating around the model-output classifier
    and session-state invalidation paths, then exercised the behavior with seam-focused
    coordinator tests covering immediate transport retries, persisted-session reuse,
    and duplicate retry-guidance rendering.
  files_modified: *id002
what_was_learned:
- claim: When retry eligibility depends on whether a model actually ran, future fixes
    should treat invocation telemetry as the primary source of truth and treat output
    text only as secondary evidence; text-only classification collapses materially
    different failures into the same bucket and misdrives retry/session decisions.
  evidence:
  - type: plan_step
    step_id: '1'
    description: The first planned step explicitly redirected classification so telemetry
      outranks empty text and no-output markers, showing that the root planning adjustment
      was to base the decision on what the invocation recorded doing rather than on
      rendered output.
  - type: file
    path: src/theforge/coordinator/agent_failure.py
    description: This is the classifier file inspected and changed for the bug, so
      it is where the run encoded the rule that consumed tokens or model-execution
      failure data must influence 'produced output' before downstream retry logic
      consults text markers.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 approval remarks explicitly called out telemetry-first classification
      as one of the criteria satisfied, confirming that review treated this ordering
      as essential to correcting the failure mode rather than as an incidental implementation
      detail.
- claim: Session invalidation has to be applied at every handoff point in a retry
    chain, not just when the first failure is recorded; otherwise a stale stored session
    can survive through a mixed retry sequence and be resumed again later.
  evidence:
  - type: review_finding
    finding_id: 326afd477e77d04d
    description: 'The finding describes a specific escape path: an iteration starts
      from stored session state, a no-output failure occurs, an in-place retry succeeds
      without issuing a replacement session id, and the old stored session remains
      available for the next iteration. That demonstrates that one-time invalidation
      is insufficient unless every retry handoff clears or replaces stale session
      state.'
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval states the prior P1 was resolved via the session-state
      fix for the mixed retry case, showing the review loop only closed once invalidation
      covered the full retry lifecycle rather than the initial failure in isolation.
  - type: plan_step
    step_id: '5'
    description: The plan reserved dedicated seam coverage for retry resume and stale-session
      invalidation, reflecting that this behavior spans transitions between attempts
      and must be verified across those transitions rather than at a single decision
      point.
- claim: Deduplicating retry guidance by substring or containment is too broad for
    accumulated agent feedback; future runs should expect echoed or quoted prior guidance
    inside unrelated feedback and distinguish exact guidance instances from incidental
    inclusion.
  evidence:
  - type: review_finding
    finding_id: 6bf0292b738be5be
    description: The finding explains that whitespace-normalized containment suppressed
      a guidance append when the same text appeared only because another source quoted
      it, demonstrating that naive containment mistakes echoed context for an already-recorded
      instruction.
  - type: plan_step
    step_id: '3'
    description: The plan targeted deduplication by the guidance text itself, and
      the later review finding on containment shows that even text-based dedup still
      needs a narrow notion of identity to avoid suppressing legitimate guidance.
  - type: file
    path: src/theforge/coordinator/dev_phase.py
    description: This file holds the feedback accumulation path where quoted gate
      output and retry-note rendering meet, making it the locus of the review-discovered
      distinction between a true duplicate instruction and unrelated feedback that
      merely contains the same words.
