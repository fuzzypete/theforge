what_changed:
  description: The run revised knowledge-report effectiveness calculations so cost
    metrics account for failed-run spend and so comparative verdicts are suppressed
    for prior-summary cohorts whose membership is determined by selector outcomes
    rather than assignment. It also updated reporting text and tests around those
    semantics.
  approach: 'The change adjusted the effectiveness and rendering pipeline together:
    cohort and cost aggregation rules were tightened in the analysis layer, report
    output was aligned to the new interpretation, and targeted tests and CLI documentation
    were updated to lock the behavior in place.'
  files_modified: *id002
what_was_learned:
- claim: When a report compares cohorts, future work needs to verify that cohort membership
    comes from a system decision or assignment rather than from the selector outcome
    itself; otherwise any 'improvement' verdict is compositional and should be treated
    as non-causal.
  evidence:
  - type: review_finding
    finding_id: 5c0ac59ab4b7855a
    description: The review found the same verdict bug still present for invariant-context
      cohorts because membership was based on whether the selector matched, demonstrating
      that this is a reusable validation rule for every cohorted comparison, not a
      one-off fix for prior-summary logic.
  - type: review_cycle
    cycle: '1'
    description: Review accepted the prior-summary verdict suppression but simultaneously
      flagged the parallel omission elsewhere, showing that future runs should inspect
      each cohort source for outcome-defined grouping before considering any comparative
      signal valid.
  - type: file
    path: src/theforge/knowledge_effectiveness_signals.py
    description: This file was introduced in the fix path for emitting or suppressing
      effectiveness signals, indicating that verdict eligibility is centralized enough
      that future runs should enforce the 'assignment-based cohorts only' rule at
      the signal layer across cohort types.
- claim: 'Cost-per-outcome metrics need numerator and denominator rules that separate
    ''failed'' from ''unmeasured'': failed runs with recorded spend belong in spend
    totals, while runs without cost records must be excluded explicitly rather than
    being allowed to appear free.'
  evidence:
  - type: review_cycle
    cycle: '1'
    description: The review summary explicitly called out that the fix correctly counts
      failed-run spend in cost metrics, showing that the key planning constraint is
      not merely summing costs but handling failure and measurement status as different
      cases in the aggregation rule.
  - type: file
    path: src/theforge/knowledge_effectiveness.py
    description: 'The main effectiveness logic was the locus of the cost correction,
      which demonstrates that this lesson applies at the metric-construction stage:
      cost accounting semantics must be encoded where cohorts and spend totals are
      assembled, not deferred to presentation.'
  - type: file
    path: src/theforge/knowledge_effectiveness_render.py
    description: Rendering changes accompanied the aggregation fix, showing that whenever
      unmeasured runs are excluded from cost statistics, report text must surface
      that exclusion so readers do not misread missing spend as zero-cost work.
