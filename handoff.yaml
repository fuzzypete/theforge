dev_notes: |
  summary: "Implemented plan-finding identity via structural anchor extraction and
    anchor-first matching. `extract_anchors()` pulls snake_case identifiers, camelCase
    identifiers, dotted paths, and file paths from finding descriptions after stripping
    reviewer prefixes. `match_plan_findings()` uses anchor overlap (non-file anchors
    required) to match current findings to prior records, with Jaccard tie-breaking.
    Iter 1 fixed: one-to-one matching enforced — each prior can only be claimed by one
    current finding. `used_prior_indices` is tracked during the loop so a second current
    finding sharing the same anchor as an already-matched prior is left unmatched
    (prior_index=None) and preserved as a new PlanFindingRecord instead of being
    silently dropped. Regression test added to cover this case."
  commits:
    - sha: "f078ae3"
      message: "feat(plan-review): add structural anchor extraction and plan finding identity"
    - sha: "5b0b231"
      message: "fix(plan-finding-identity): address review findings (iter 1)"
    - sha: "83645a8"
      message: "fix(plan-finding-identity): address review findings (iter 1)"
    - sha: "e5a8263"
      message: "fix(plan-finding-identity): enforce one-to-one prior matching in match_plan_findings"
  acceptance_criteria:
    - criterion: "Findings about the same issue across cycles are matched by structural anchor"
      status: MET
      notes: "match_plan_findings returns prior_index for findings sharing non-file anchors."
    - criterion: "File-path-only overlap does not constitute a match"
      status: MET
      notes: "file-path-only overlap sets prior_index=None with 'file-path-only' abstain reason."
    - criterion: "Each prior finding is matched to at most one current finding per cycle"
      status: MET
      notes: "used_prior_indices set ensures one-to-one matching; second current sharing same anchor is left unmatched."
    - criterion: "Unmatched current findings are preserved as new PlanFindingRecord entries"
      status: MET
      notes: "plan_flow.py appends new records for findings with prior_index=None."
    - criterion: "Match decisions include provenance (which anchors matched, prose-similarity used)"
      status: MET
      notes: "format_provenance() renders one line per finding with anchor list and prose note."
    - criterion: "Existing tests pass"
      status: MET
      notes: "59 tests pass in test_plan_finding_classifier.py."
  story_deviations: none
  deferred_items: none
  gate_result: PASS
