what_was_learned:
- claim: When a diagnostic artifact is used to distinguish terminal failure modes,
    review and verification need to treat operator documentation as part of the behavior
    surface, not as ancillary text; otherwise a newly persisted state can still leave
    readers without the mapping needed to interpret it.
  evidence:
  - type: review_finding
    finding_id: ec2853ab8d7192f6
    description: Review flagged that the runbook's audit-publish state table lacked
      a commit_failed row even after the code began writing that value, showing that
      persisting a state is insufficient if the operator-facing interpretation table
      is not updated in parallel.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 explicitly notes that the prior documentation finding was
      resolved, demonstrating that the review considered the runbook update necessary
      to complete the behavioral fix rather than optional polish.
  - type: file
    path: docs/guides/controller-runbook.md
    description: This was the documented source operators consult to infer publish
      failure mode, so its inclusion in the final change set shows the failure contract
      spans both persisted state and its documented interpretation.
- claim: Regression checks for multi-part failure messages should preserve assertions
    about the specific contextual payloads, not just the coarse error category, because
    broad prefix-only checks can miss a loss of the location detail operators use
    to diagnose which artifact operation failed.
  evidence:
  - type: review_finding
    finding_id: 6bc3a83377ba306f
    description: Review identified that rewriting the commit-failure test to assert
      only an error-label prefix dropped verification of the artifact-directory path,
      demonstrating that category-level assertions alone were too weak to protect
      the diagnostic detail contract.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 records that the prior test-related finding was resolved,
      showing the review loop treated restoration of message-detail verification as
      required for confidence in the failure-path diagnostics.
  - type: file
    path: tests/test_sprint_audit_publish.py
    description: The test file was where the weakened assertion surfaced, making it
      the direct evidence that failure-path verification in this area depends on checking
      both the state label and the path-specific context.
