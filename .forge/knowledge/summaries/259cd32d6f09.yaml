what_changed:
  description: The run changed sprint RCA so failure classification uses attempt-scoped
    evidence instead of any artifact found in a shared per-story log directory, and
    added regression coverage for stale-artifact misclassification and evidence ownership
    behavior. It also added coordinator logging support used to record ownership information
    for per-story artifacts.
  approach: The change combined time-window filtering with run-ownership metadata
    so RCA could distinguish artifacts produced by the current story attempt from
    leftovers of earlier attempts, then exercised that behavior with focused tests
    and a second review cycle refinement.
  files_modified: *id002
what_was_learned:
- claim: Filesystem modification time alone is not a reliable boundary for deciding
    which per-story artifacts belong to the current attempt.
  evidence:
  - type: review_finding
    finding_id: df9ce42bb16c54c3
    description: Review identified that copied, archived, or re-extracted log trees
      can make prior-attempt artifacts appear current when scoping is based only on
      mtime.
  - type: file
    path: src/theforge/sprint/rca.py
    description: This file contains the RCA logic that was updated after review to
      avoid relying solely on timestamp-based scoping.
- claim: Run identity used for artifact ownership must match the per-story coordinator
    run, not the sprint-level identifier from summary rows.
  evidence:
  - type: review_finding
    finding_id: 8e116706b67cb6f5
    description: Review noted that using only the sprint-level identifier prevents
      matching manifest-owned artifacts to the current attempt when audit data is
      unavailable.
  - type: review_finding
    finding_id: a341ac097e2f0a0b
    description: Review also found the tests had conflated sprint and per-story run
      identifiers, masking the distinction that real records require.
  - type: file
    path: tests/test_sprint_rca.py
    description: The regression tests were expanded in the RCA test suite to cover
      attempt ownership and identifier handling.
- claim: When terminal outcome records exist for a story attempt, RCA should prioritize
    those attempt-owned records over incidental errors found in other artifacts.
  evidence:
  - type: file
    path: src/theforge/sprint/rca.py
    description: The RCA implementation was revised to classify from attempt-scoped
      evidence rather than arbitrary stale artifacts in the story log tree.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 review verified the added run-id ownership manifest and confirmed
      stale per-story artifacts were scoped out.
  - type: diff
    ref: cf4f3baf5b63bc4f5708f47cd812e57c8065c178
    description: This diff reference captures the RCA-side refinement that introduced
      ownership-aware scoping after review feedback.
