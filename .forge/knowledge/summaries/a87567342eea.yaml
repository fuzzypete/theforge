what_changed:
  description: This run introduced a declarative per-type issue specification as the
    structural contract for issue bodies, together with typed parse/render support,
    checker retargeting to that contract, and generated reference documentation derived
    from the same source. It also updated intake rendering and related docs so canonical
    Markdown, parsing aliases, structural validation, and published shape documentation
    all flow through the specification.
  approach: 'The change was done by defining the issue shape as data, then wiring
    each consumer around that data: parsing existing bodies into typed documents,
    rendering typed documents back to canonical Markdown, deriving checker behavior
    from specification rules instead of duplicated logic, and generating reference
    docs from the contract with drift checks in tests/CI.'
  files_modified: *id002
what_was_learned:
- claim: When structural rules are moved into a declarative contract, forbidden-section
    enforcement must be driven entirely from the parsed section-rule data path; leaving
    any contradiction list or type-specific fallback as a second source of truth causes
    drift that review will expose through admissible-but-forbidden shapes.
  evidence:
  - type: review_finding
    finding_id: 3aeb8146ce3c71f7
    description: This finding showed that a section marked forbidden in a type's section
      rules was still admitted unless it also appeared in a separate contradiction
      block, demonstrating that partial migration to the declarative spec leaves an
      old authority behind.
  - type: review_finding
    finding_id: e65b1f932c3e942e
    description: 'This follow-on finding showed the same problem surviving in a concrete
      enhancement shape: Diagnosis was documented as forbidden by the specification
      yet still treated as runnable, confirming enforcement must come from the per-type
      rules themselves rather than a parallel mechanism.'
  - type: review_cycle
    cycle: '1'
    description: The first review explicitly called out forbidden-section enforcement
      as still having a second source of truth, showing that future runs should look
      for hidden duplicated rule paths whenever a checker is retargeted to a declarative
      contract.
- claim: Alias spellings have to participate in prohibition checks the same way they
    participate in parsing; otherwise legacy headings become a bypass around declarative
    forbidden-section rules.
  evidence:
  - type: review_finding
    finding_id: 32bbf9b67e4d401d
    description: This finding showed that top-level Reproduction was admitted for
      feature-shaped types because it parsed as the modeled Steps to reproduce section
      but the forbidden check did not normalize through that alias, demonstrating
      a concrete escape hatch through legacy spellings.
  - type: review_cycle
    cycle: '3'
    description: The third review stated that canonical forbidden headings were fixed
      but a declared legacy spelling was still admitted, showing that future verification
      must test both canonical and legacy heading spellings against the same rule
      outcomes.
  - type: file
    path: src/theforge/shape_check/heuristics.py
    description: The repeated findings were anchored in the checker heuristics path,
      indicating that alias normalization and forbidden-section evaluation meet there
      and must be unified there for the contract to hold.
