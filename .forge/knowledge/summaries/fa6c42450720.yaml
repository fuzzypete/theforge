what_changed:
  description: The diagnosis pipeline was updated to record and render provenance
    for claim verification, distinguish unverifiable claims from refuted ones, and
    surface premises that could not be checked instead of rendering checked and unchecked
    premises identically. The flow also preserves this information in landed diagnosis
    artifacts and related lifecycle outputs.
  approach: The change introduced stricter diagnosis typing and completeness rules
    for claim-verification metadata, adjusted prompt/output expectations, and threaded
    premise-verification status through the diagnose flow so both normal and attached-evidence
    paths emit explicit operator-facing status rather than relying on omission.
  files_modified: *id002
what_was_learned:
- claim: When a report becomes 'complete' based on structured subfields, completeness
    checks must validate both presence and recognized values; otherwise a diagnosis
    can land while silently dropping provenance in the rendered output.
  evidence:
  - type: review_finding
    finding_id: 25372f10999a31fb
    description: Review found that omitted claim_verification fields still allowed
      a diagnosis to be treated as complete and rendered without verification lines,
      showing that mere structural acceptance can erase required provenance at landing
      time.
  - type: review_finding
    finding_id: ff017e9ab438efd7
    description: Review later found that even with free-text detail present, an unrecognized
      verification type normalized to unknown still counted as complete, demonstrating
      that completeness must reject invalid enum-like values as well as missing fields.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 recorded resolution of the earlier completeness gap after
      missing claim-verification fields were surfaced through required-field handling,
      confirming that gating completeness on valid verification data was the mechanism
      that closed the issue.
- claim: A skipped verification path needs its own explicit artifact-shaping logic;
    otherwise the absence of a check is rendered the same as a successful check that
    found nothing.
  evidence:
  - type: review_finding
    finding_id: 62bc8c3508040ae3
    description: Review found that attached cross-project evidence caused premise
      verification to be skipped entirely and omitted the whole premise-verification
      section, directly demonstrating that skip paths can collapse into indistinguishable
      output if not rendered explicitly.
  - type: review_finding
    finding_id: 81f24eb45f46816c
    description: Review also found that an already-resolved path rendered only absent
      premises and dropped unable-to-check premises, showing that even when skip state
      exists in memory and audit data it can still disappear from operator-facing
      output unless each path is shaped deliberately.
  - type: review_finding
    finding_id: e42ad08ce3450cc8
    description: Review identified that the attached-evidence skipped-premise report
      depended on anchors and file-like tokens, so prose-only affected code produced
      no indication that checks were skipped, demonstrating how path-specific extraction
      heuristics can hide unverifiable premises.
- claim: Fallback representations for missing structured evidence must not reuse fields
    whose semantics imply stronger provenance, because operator-facing rendering will
    treat them as if the stronger structure existed.
  evidence:
  - type: review_finding
    finding_id: 5291b9a9771891f6
    description: Review found that when no premise anchors or file-shaped references
      existed, free-text affected-code prose was inserted into the repository-path
      field and rendered in code formatting, showing that semantic fallback into a
      path slot misrepresents what kind of evidence was actually available.
