[project]
name = "theforge"
version = "0.16.0rc17"
description = "Deterministic multi-LLM development orchestrator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "python-dotenv>=1.0"]
authors = [{name = "Peter Wickersham"}]
urls = {Homepage = "https://github.com/fuzzypete/theforge", Repository = "https://github.com/fuzzypete/theforge"}

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
google = ["google-genai>=1.0"]
all = ["openai>=1.0", "anthropic>=0.30", "google-genai>=1.0"]
# hatchling is the build backend below; it is also a test dependency because the
# packaging guard in tests/test_model_catalog.py builds a real wheel and looks
# inside it. Nothing importable can stand in for that — the source tree always
# has the catalog whether or not the build would ship it.
dev = ["pytest", "pytest-xdist", "pytest-timeout", "ruff", "hatchling"]

[project.scripts]
forge = "theforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The shipped model catalog (src/theforge/config/data/models.yaml) is data, not
# code, and must travel in the wheel: without it there is no default model set.
# Naming the package directory explicitly is what states that non-Python package
# data is part of the distribution rather than relying on auto-detection.
[tool.hatch.build.targets.wheel]
packages = ["src/theforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".forge"]
pythonpath = ["src", "tests"]
addopts = "-n auto --dist worksteal"
# The concurrent gate's per-test bound, enforced (not advisory): pytest-timeout kills
# any test that runs past it and reports its name plus a stack trace of where it was
# stuck. One shared bound applies to every test and there is no category or marker that
# raises it. Sixty seconds is deliberately far above anything this suite's own
# `-n auto --dist worksteal` contention produces — measured inflation reaches ~9x on
# tests of a few seconds — because under that parallelism a tight wall-clock threshold
# measures the machine, not the test (#2833). The tight per-test judgement is made by
# the post-stall serial diagnostic pass, where load is controlled. CONVENTIONS.md's
# five-second rule remains the convention for an isolated test.
#
# A test may only shorten this via @pytest.mark.timeout(n) — tests/timeout_enforcement.py
# rejects overrides that widen the bound or change how it is enforced.
#
# The method must be "thread". Measured against the `-n auto --dist worksteal` addopts
# above, the signal method parks every xdist worker at 0% CPU and the run never
# finishes (92s green on base vs. still running past 600s). Thread-method dumps from a
# dying worker are recovered by tests/timeout_enforcement.py.
timeout = 60
timeout_method = "thread"
markers = [
    "network_integration: marks tests that make real external network calls (requires THEFORGE_RUN_INTEGRATION=1)",
    "cli_contract: marks tests that invoke real provider CLIs to validate argv contracts (requires THEFORGE_RUN_CLI_CONTRACT=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
