  description: Adaptive dev-role assignment was updated so declared dev capability
    participates in model eligibility, and the same prohibition is enforced when dev
    is explicitly pinned. The routing decision path also distinguishes capability
    refusal in the same typed way across these dev-selection branches.
  approach: The run threaded routing.dev_capable through the config/model objects
    used by assignment, applied it as a hard gate at each dev-selection boundary in
    adaptive assignment, and aligned the error/reporting behavior and seam-level checks
    around those boundaries.
