# forge.yaml — TheForge developing itself
project: theforge

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug}"
  setup_command: "pip install -e ."
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"

validation:
  gate_command: "PYTHONPATH=src python -m pytest tests/ -q && echo 'gate_decision: PASS' > handoff.yaml"
  handoff_file: "handoff.yaml"
  gate_decision_key: "gate_decision"

profiles:
  dev:
    cli: claude
    model: sonnet
    budget_usd: 50.00
    timeout_seconds: 600
    allowed_tools:
      - Read
      - Edit
      - Write
      - Bash
      - Glob
      - Grep
  preflight:
    cli: claude
    model: sonnet
    budget_usd: 1.00
    timeout_seconds: 300
    allowed_tools:
      - Read
      - Bash
      - Glob
      - Grep
  review_pool:
    - name: opus
      cli: claude
      model: opus
      budget_usd: 3.00
      timeout_seconds: 600
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: codex
      cli: codex
      model: gpt-5.4
      reasoning_effort: medium
      budget_usd: 1.00
      timeout_seconds: 600
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep
    - name: gemini
      cli: gemini
      model: gemini-2.5-pro
      budget_usd: 1.00
      timeout_seconds: 600
      allowed_tools:
        - Read
        - Bash
        - Glob
        - Grep

  synthesis:
    cli: claude
    model: opus
    budget_usd: 1.00
    timeout_seconds: 300
    allowed_tools:
      - Read

retry:
  max_dev_iterations: 5
  max_review_cycles: 5

notifications:
  backend: ntfy
  ntfy:
    url: https://ntfy.sh/theforge-pwickersham
    priority: high
