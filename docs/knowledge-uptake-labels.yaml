        run_id: run-e
        phase: dev
        agent_role: dev
        phase_iteration: 1
        rendered_at: "2026-08-05T08:00:00+00:00"

  - id: no-claims-at-all
    category: non_correspondence
    label: not_matched_to_eligible_claim
    finding:
      finding_id: f-noclaims
      description: >-
        The retry budget decrements the cycle counter twice on an escalated
        path, so the cap is reached one iteration early.
      recorded_at: "2026-08-06T12:00:00+00:00"
    claims: []

  # ── eligibility exclusions ───────────────────────────────────────────────
  - id: review-only-claim
    category: eligibility_excluded
    label: not_matched_to_eligible_claim
    finding:
      finding_id: f-staleness
      description: >-
