dev_notes: |
  Implemented exactly per spec and plan. No deviations.

  The validation check lives in run_task() (coordinator.py), not in cmd_run()
  (cli.py), keeping validation responsibility in the coordinator per the
  single-responsibility principle already established in the codebase.
  cmd_run() only resolves the path.

  The injection block runs after WORKSPACE succeeds but before PREFLIGHT,
  so forge_plan.md is in the worktree for the dev agent to read regardless
  of preflight outcome. This matches the position of the PLAN agent's own
  write_text call.

  should_plan is now a multi-line condition: plan_path is None AND
  config.plan.enabled AND complexity in (medium, large). When plan_path is
  set, should_plan is always False — injected plan takes precedence over
  config and complexity.

  state.plan_result remains None for injected plans. total_plan_cost returns
  0.0 (the existing property handles None correctly).

  511/511 tests pass.
