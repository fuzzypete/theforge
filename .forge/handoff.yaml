dev_notes: |
  summary: "Added an exclude_model parameter to _select_reviewers() in assignment.py.
  When called for plan reviewers, the planner's model is passed as exclude_model so
  any agent using the same model is removed from the candidate pool before selection.
  If exclusion would leave no candidates (single-model pool), the full pool is used
  as a fallback. The call site at lines 446-451 extracts planner_profile.model and
  passes it. Three unit tests were added covering: normal exclusion, cross-provider
  exclusion, and the single-model fallback case."
  commits:
    - sha: "9181bf5"
      message: "feat(assignment): exclude planner model from plan reviewer pool"
  acceptance_criteria:
    - criterion: "The plan review pool excludes or deprioritizes the same model that produced the plan."
      status: MET
      notes: "Candidates with model == planner_profile.model are filtered out before selection. Falls back to full pool only when no other candidates exist."
  story_deviations: none
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
