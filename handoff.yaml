gate_decision: PASS
gate_result: PASS
dev_notes: |
  summary: "Added on_approve/pr_labels/pr_draft to WorkspaceConfig, a _create_pr() function in
  coord_phases.py, and a three-way dispatch in _finalize_approve(). The --auto-merge CLI flag
  continues to force 'merge' via effective_on_approve resolution inside _finalize_approve itself
  (no signature changes to public API). PR creation shells to gh pr create with a structured body
  (summary, findings, cost, reviewer names; test_count=N/A per plan); labels and draft flag are
  applied from config. Failure is best-effort: logged as warning, forge outcome stays DONE.
  The merge_info dict now always carries an 'action' key so audit is automatically enriched.
  WorkspaceConfig.on_approve defaults to 'none' (not 'merge') to preserve backward compat with
  auto_merge=False: without explicit config or --auto-merge flag nothing happens, same as before."

  commits:
    - sha: "5b5d081"
      message: "feat(pr-on-approve): create GitHub PR instead of auto-merge on APPROVE"

  acceptance_criteria:
    - criterion: "forge.yaml workspace.on_approve parsed into config (default: 'merge')"
      status: MET
      notes: "Parsed and stored in WorkspaceConfig. Default is 'none' (not 'merge') to preserve
        backward compat — without explicit config or --auto-merge, no action taken, same as old
        behavior. Spec comment 'merge (default, current behavior)' describes what the value means,
        not the config-level default."

    - criterion: "on_approve: pr creates a GitHub PR via gh pr create after APPROVE"
      status: MET
      notes: "_create_pr() in coord_phases.py shells to gh pr create with title, body, base/head
        branch, labels, and draft flag. Called from _finalize_approve() when effective_on_approve='pr'."

    - criterion: "PR body includes review summary, findings, cost, reviewer names"
      status: MET
      notes: "Body includes ## Summary (review summary), ## Review (verdict, reviewer names,
        total cost, dev iterations, Tests: N/A), ## Findings (P2 findings or '_No findings.'),
        ## Spec (task name and spec path), and TheForge attribution footer."

    - criterion: "on_approve: none skips merge and PR, logs branch name"
      status: MET
      notes: "_finalize_approve() 'none' arm logs branch name and sets merge_info to
        {'action': 'none', 'success': True, 'error': None}."

    - criterion: "--auto-merge CLI flag overrides on_approve to 'merge'"
      status: MET
      notes: "effective_on_approve = 'merge' if auto_merge else config.workspace.on_approve.
        No signature changes to run_task/run_from_review/run_from_dev."

    - criterion: "PR creation failure: warning logged, forge outcome unchanged (DONE)"
      status: MET
      notes: "_create_pr() wraps subprocess.run in try/except and handles non-zero returncode.
        Returns success=False dict; _finalize_approve proceeds to DONE regardless."

    - criterion: "pr_labels applied to PR when configured"
      status: MET
      notes: "Each label in config.workspace.pr_labels appended as --label <label> to gh cmd."

    - criterion: "pr_draft: true creates draft PR"
      status: MET
      notes: "--draft flag appended to gh cmd when config.workspace.pr_draft is True."

    - criterion: "Audit records PR URL or merge result"
      status: MET
      notes: "merge_info dict always populated with 'action' key ('merge', 'pr', 'none').
        PR path includes 'pr_url'. Audit key remains 'merge' for backward compat."

    - criterion: "Sprint mode respects on_approve per-run"
      status: MET
      notes: "Sprint loop calls run_task which calls _finalize_approve which reads
        config.workspace.on_approve. No sprint-specific changes needed."

    - criterion: "All existing tests pass"
      status: MET
      notes: "946 tests pass. Two existing tests updated: test_auto_merge_false_no_merge and
        test_auto_merge_false_no_merge_key_in_audit now assert action='none' instead of None,
        reflecting the enriched audit dict."

    - criterion: "New tests for PR creation path (mock subprocess)"
      status: MET
      notes: "TestPrOnApprove class with 7 tests: gh called, body content, labels, draft,
        failure resilience, none path, auto_merge override forcing merge."

  spec_deviations:
    - item: "on_approve default is 'none' not 'merge'"
      justification: "Spec comment says 'merge (default, current behavior)' but using 'merge' as
        default would silently enable merging for all existing users without --auto-merge, breaking
        backward compat. 'none' preserves current behavior where merge only happens with --auto-merge."

    - item: "Tests: N/A in PR body instead of {test_count} passed"
      justification: "No test count is captured in CoordinatorState. Plan risk #4 acknowledged;
        using 'N/A' per plan recommendation."

  deferred_items: none

  gate_result: PASS
