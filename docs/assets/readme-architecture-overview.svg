<svg width="960" height="920" viewBox="0 0 960 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TheForge architecture overview</title>
  <desc id="desc">A high-level diagram showing the coordinator controlling the workflow, models producing plans code and reviews, and the repository runtime providing source tests and artifacts. Validation and review results flow back to the coordinator.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="56" x2="900" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F4EC"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="920" fill="#FBFCFD"/>
  <rect x="28" y="28" width="904" height="864" rx="30" fill="url(#bg)"/>

  <text x="72" y="88" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">TheForge keeps control deterministic</text>
  <text x="72" y="124" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Python owns orchestration. Models stay inside bounded artifact roles. The repository stays gated, inspectable, and merge-safe.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="168" width="760" height="174" rx="28" fill="#FFFFFF"/>
    <rect x="100" y="168" width="760" height="64" rx="28" fill="url(#dark)"/>
    <text x="134" y="208" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Coordinator</text>
    <text x="134" y="268" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Controls</text>
    <text x="134" y="300" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">State machine, phase transitions, worktree creation, retries, resume points,</text>
    <text x="134" y="326" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">audit output, and escalation decisions.</text>
    <rect x="134" y="248" width="112" height="34" rx="17" fill="#E5EEF7"/>
    <text x="154" y="271" fill="#1D4ED8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Deterministic</text>
  </g>

  <path d="M480 342V390" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="506" y="375" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">invokes</text>

  <g filter="url(#shadow)">
    <rect x="100" y="406" width="760" height="174" rx="28" fill="#FFFFFF"/>
    <rect x="100" y="406" width="760" height="64" rx="28" fill="#7C2D12"/>
    <text x="134" y="446" fill="#FFF7ED" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Models</text>
    <text x="134" y="506" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Produce</text>
    <text x="134" y="538" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Plans for medium and large stories, code and tests inside the worktree,</text>
    <text x="134" y="564" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">and structured review findings and verdicts. They do not control the process.</text>
    <rect x="134" y="486" width="132" height="34" rx="17" fill="#FDEAD7"/>
    <text x="154" y="509" fill="#C2410C" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Artifact roles</text>
  </g>

  <path d="M480 580V628" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="506" y="613" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">writes into</text>

  <g filter="url(#shadow)">
    <rect x="100" y="644" width="760" height="174" rx="28" fill="#FFFFFF"/>
    <rect x="100" y="644" width="760" height="64" rx="28" fill="#14532D"/>
    <text x="134" y="684" fill="#F0FDF4" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Repo / Runtime</text>
    <text x="134" y="744" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Provides</text>
    <text x="134" y="776" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Source files, git history, test and lint gates, handoff output, logs, and audit</text>
    <text x="134" y="802" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">artifacts. Main stays untouched until you explicitly merge.</text>
    <rect x="134" y="724" width="154" height="34" rx="17" fill="#DCFCE7"/>
    <text x="156" y="747" fill="#15803D" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Inspectable output</text>
  </g>

  <rect x="262" y="844" width="436" height="40" rx="20" fill="#0F172A"/>
  <text x="302" y="869" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Validation outcomes and review verdicts flow back to the coordinator</text>
</svg>
