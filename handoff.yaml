      status: MET
      notes: "Already satisfied pre-implementation; _run_loop_openai passes base_url to openai.OpenAI() via _openai_client(). No change needed here."
    - criterion: "Graceful fallback when model doesn't support tool calling"
      status: MET
      notes: "BadRequestError with 'tool' in the message triggers single-shot retry via PROVIDER_RUNNERS['openai'] with a JSON instruction appended to the prompt. Errors without 'tool' re-raise normally."
    - criterion: "Cost reported as $0.00 for local endpoints"
      status: MET
      notes: "_is_local_endpoint() checks for localhost/127.0.0.1. _openai_result() stores 0.0 for single-shot; _run_loop_openai zeros both result.cost_usd and model_usage cost entries after manager.run() returns."
    - criterion: "Common local models added to MODEL_REGISTRY"
      status: MET
      notes: "Four entries added: openai/codestral, openai/deepseek-coder, openai/llama3.1, openai/qwen2.5-coder. All have cost_rank=1 and dev_capable=True."
    - criterion: "forge check-providers tests local endpoints when configured"
      status: MET
      notes: "cmd_check_providers detects local profiles via base_url and annotates output with [local] tag and $0.000 cost display."
    - criterion: "Documentation for local model setup with ollama/vllm"
      status: MET
      notes: "docs/guides/local-models.md added covering forge.yaml config, ollama/vllm setup, registry keys, cost tracking behavior, and tool-calling fallback."
    - criterion: "All existing tests pass"
      status: MET
      notes: "1092 tests pass (1078 pre-existing + 14 new)."
    - criterion: "New tests for local endpoint detection and cost zeroing"
      status: MET
      notes: "14 new tests added across TestIsLocalEndpoint, TestLocalEndpointCostZeroing, TestToolCallingFallback (test_runner_api.py), and TestLocalModelRegistry (test_config.py)."
