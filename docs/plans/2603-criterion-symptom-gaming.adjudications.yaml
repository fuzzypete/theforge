  2926:
    admits_rationale: 'The criterion requires the dev-role `candidate_pool` to list the model as `included:
      false` under a canonical reason distinct from `tier_mismatch`, and requires `assign_models()` never
      to select it, on both a fresh and a resumed-from-snapshot story. Filtering the model out before
      the pool is built would satisfy the selection half but not the visibility half. Any change meeting
