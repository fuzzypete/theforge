    severity: P1
    file: src/theforge/gate_diagnostics.py
    description: "A diagnostic invocation that exits zero with output the code cannot\
      \ parse as a test result \u2014 for example an operator-configured runner printing\
      \ 'custom runner: all green' \u2014 is recorded as having executed test workload,\
      \ and the timeout RCA packet then tells DEV that no single test exceeded the\
      \ per-test timeout under serialized execution and that this suggests a concurrency-specific\
      \ bug."
    cycles_seen: 1
    disposition: fixed
  - finding_id: 0e93c9d68cf9d407
    severity: P1
    file: src/theforge/gate_diagnostics.py
    description: "Whether the diagnostic workload executed is decided by matching\
      \ the command's output against shell and runner error phrases, so a serialized\
      \ pass that ran the whole suite and printed '500 passed in 30.2s' is reported\
      \ to DEV as an invocation that did not execute test workload whenever any line\
      \ of that output resembles a launcher failure \u2014 for example a subprocess\
      \ test capturing 'sh: 1: helper-tool: not found' or a traceback line ending\
      \ in 'No such file or directory'."
    cycles_seen: 1
    disposition: fixed
  - finding_id: 3efe772002d875f4
