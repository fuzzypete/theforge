what_changed:
  description: "The run changed challenger-failure handling in the coordinator so\
    \ a VALIDATE-phase escalation from an exploration challenger flows through the\
    \ recovery seam and the story is retried through the recorded winner instead of\
    \ ending on the challenger\u2019s terminal failure. It also corrected recovered-run\
    \ state so winner retries do not inherit the challenger\u2019s terminal error\
    \ or session identity."
  approach: The change centralized this escalation path onto the existing failed-challenger
    recovery mechanism, then tightened the surrounding coordinator state transitions
    for recovered retries and exercised the seam against both immediate recovery and
    post-recovery validation paths.
  files_modified: *id002
what_was_learned:
- claim: When reusing a recovery seam to swap execution from one agent attempt to
    another, future work should verify that all story-level terminal state from the
    abandoned attempt is cleared before the replacement attempt runs, or the final
    record can still reflect the abandoned failure even if the replacement succeeds.
  evidence:
  - type: review_finding
    finding_id: fab6151f9b6ee348
    description: "Review found that after VALIDATE escalation recovered into a winner\
      \ retry, a successful winner run could still leave the sprint and audit record\
      \ carrying the challenger\u2019s terminal gate error, showing that recovery\
      \ must reset story-level failure state rather than only redirect control flow."
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly verified that recovery now retries through
      the winner with clean story state, confirming that stale terminal state was
      a real integration hazard the run had to resolve.
- claim: When recovery switches a run from a failed challenger to a winner, future
    work should treat agent session identity as part of the handoff boundary in both
    in-memory and persisted state; otherwise resumed execution can accidentally continue
    the challenger session under the winner model.
  evidence:
  - type: review_finding
    finding_id: 4312f93ee4b864ac
    description: "Review identified that leaving the challenger\u2019s session id\
      \ in coordinator state caused the winner\u2019s dev invocation to resume the\
      \ challenger model\u2019s session, demonstrating that session handles must be\
      \ cleared during cross-agent recovery."
  - type: review_finding
    finding_id: 84668d6311601546
    description: A later review found the same class of leak persisted in the worktree
      sessions file across interruption and resume, showing that the session-boundary
      check must cover persisted recovery state, not just live process memory.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 approval references the persistence fix for the cleared session
      handle, confirming that durable session state was part of the recovered-attempt
      correctness boundary.
- claim: For one-shot recovery paths, future verification should cover the first failure
    where recovery pre-empts downstream handling and the later failure where recovery
    has already been spent, because the reachable coordinator path changes after the
    first handoff.
  evidence:
  - type: review_finding
    finding_id: 8a90acc0aaded635
    description: Review flagged that the seam test only exercised the first VALIDATE
      escalation, where recovery short-circuits gate-green salvage, and missed the
      second escalation after the winner retry, where salvage becomes reachable again
      because recovery is no longer available.
  - type: file
