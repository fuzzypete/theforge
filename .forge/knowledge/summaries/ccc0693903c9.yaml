what_was_learned:
- claim: When a citation includes a fragment the checker cannot interpret, future
    triage work should treat that case as unresolved rather than letting the raw fragment
    collapse into a broader absence check, because parse failure can otherwise masquerade
    as evidence that the artifact is gone.
  evidence:
  - type: review_finding
    finding_id: 9689280e58d9b41f
    description: Review explicitly called out that an unsupported colon fragment such
      as `:L469-L480` can remain embedded in the path string and make the final verdict
      depend on attribute lookup against the malformed path, demonstrating the mechanism
      by which unparsed specificity turns into a false absence.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 notes that the added regression pins unsupported colon fragments
      as unverified rather than stale, showing that the review loop treated 'cannot
      interpret fragment' versus 'artifact absent' as the decision boundary that future
      runs must preserve.
- claim: For stale detection, absence claims need proof at the same scope the checker
    actually supports; future work on citation resolution should degrade unsupported
    precision to a supported broader check or to unverified, rather than inferring
    total absence from a failed precise lookup.
