what_changed:
  description: This run changed diagnosis handling so intake readers and writers agree
    on a single authoritative diagnosis artifact even when multiple diagnosis-like
    headings or stale scaffolds exist in the issue body. It also changed diagnose
    landing to reconcile an existing diagnosis-shaped section instead of leaving contradictory
    duplicate sections behind.
  approach: The work introduced shared section-selection logic in the parsing/heuristics
    layer, routed diagnosis-state readers through that authority rule, and adjusted
    diagnosis upsert/render paths to update the intended diagnosis section in place
    rather than appending beside shadowing or placeholder content.
  files_modified: *id002
what_was_learned:
- claim: When issue bodies can contain multiple matching headings, authority cannot
    be decided by first match or by simple 'longest section' scoring; selection has
    to evaluate each candidate section for artifact completeness and placeholder signals,
    otherwise stale scaffolds can outrank real landed artifacts in both directions.
  evidence:
  - type: review_finding
    finding_id: ef272e23d539845d
    description: This finding showed that even after the initial shadowing fix, a
      later stale canonical Diagnosis section could still cause shape/groom to report
      no-diagnosis, demonstrating that naive candidate selection still misidentified
      authority.
  - type: review_finding
    finding_id: 74598cd93637aebd
    description: 'This finding showed the opposite failure mode: authoritative scoring
      promoted an unfilled stale scaffold over an earlier complete cause-unknown diagnosis,
      proving that section choice must account for placeholder content, not just canonical
      heading strength or amount of text.'
  - type: review_finding
    finding_id: 76f3bd81ac1ff5d1
    description: This finding showed that a blanket penalty for placeholder-marker
      text misclassified a genuine diagnosis whose evidence quoted the marker literally,
      demonstrating that placeholder detection must be field-aware rather than simple
      substring matching.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 explicitly reported that the new authoritative scoring could
      promote an unfilled stale scaffold over an earlier inconclusive diagnosis, confirming
      that authority selection remained the central correctness problem after the
      first implementation.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 reported a regression caused by the iter-2 placeholder-marker
      penalty, showing that the fix space required discriminating between actual unfilled
      fields and incidental quoted text.
- claim: Shared read-side interpretation is required across shape, groom, and gate
    codepaths; if diagnosis headings or states are recognized differently in different
    readers, the same issue body can be classified into incompatible states.
  evidence:
  - type: review_finding
    finding_id: fef84ed95cc5af97
    description: This finding showed that shape_classify accepted a 'Root cause' heading
      as canonical while the gate matched only 'diagnosis', so one body was simultaneously
      treated as confirmed-cause by one reader and incomplete by another.
  - type: plan_step
    step_id: '2'
    description: The plan explicitly routed all diagnosis-state readers through shared
      authoritative selection, reflecting that the bug was not isolated to one caller
      but to divergent readers across intake paths.
  - type: file
    path: src/theforge/intake/shape_classify.py
    description: This file was one of the diagnosis-state readers implicated in the
      mismatch; its inclusion alongside shared parsing/heuristics changes shows the
      run addressed cross-reader consistency rather than a single local check.
  - type: file
    path: src/theforge/shape_check/heuristics.py
    description: This gate-side file was revised in the same run, which demonstrates
      that the authoritative diagnosis interpretation had to be aligned across independent
      read paths.
- claim: Write-side reconciliation must target the authoritative diagnosis section
    without overwriting unrelated prose headings that happen to mention diagnosis
    concepts, or the fix for duplicate sections will regress operator-authored narrative
    content.
  evidence:
  - type: review_finding
    finding_id: d3f4f02e0611c21a
    description: This finding showed that landing a diagnosis on a body with an operator-written
      'Root cause' section deleted that section and its prose entirely, demonstrating
      that reconciliation logic can be too aggressive if it treats all diagnosis-like
      headings as replaceable artifacts.
  - type: review_finding
    finding_id: a914556ef63fc3ce
    description: 'This finding showed the complementary write-path error: shape appended
      scaffold bullets into an ordinary prose heading that mentioned diagnosis, proving
      writers also need authoritative targeting and not just regex heading matches.'
  - type: plan_step
    step_id: '3'
    description: The plan called for diagnose landing to reconcile an existing diagnosis-shaped
      section instead of appending beside it, showing that write-path section targeting
      was a first-class part of the bug rather than only a read-side issue.
