acceptance_criteria:
- criterion: 'backend: slack sends notifications via Slack webhook'
  notes: 'BackendConfig(type=''slack'') synthesized from backend: slack + slack: block.
    send_notifications() dispatches to _send_slack() which POSTs Block Kit JSON to
    the webhook URL read from the configured env var.'
  status: MET
- criterion: All 6 event types produce Slack messages
  notes: 'Sprint started: added send_notifications() call in sprint.py run_sprint()
    after started_at assignment. Story APPROVE: _ntfy_done_notify() now calls send_notifications()
    for non-ntfy backends. Story ESCALATE: _escalate_notify() now calls send_notifications(is_escalation=True)
    for non-ntfy backends. Sprint complete: send_notifications() added alongside ntfy
    block in run_sprint(). Budget exceeded: send_notifications() fires on first budget-exhausted
    skip. Agent startup failure: _ntfy_crash_notify() now calls send_notifications()
    for non-ntfy backends.'
  status: MET
- criterion: Webhook URL read from environment variable
  notes: _send_slack() calls os.environ.get(webhook_url_env) at send time. webhook_url_env
    defaults to 'SLACK_WEBHOOK_URL'. URL never appears in forge.yaml or BackendConfig.
  status: MET
- criterion: Notification failure logs warning and continues
  notes: _send_slack() raises on network errors; the except Exception catch in send_notifications()
    logs a WARNING and continues to the next backend. Missing env var is handled inside
    _send_slack() itself (logs warning, returns early).
  status: MET
- criterion: Existing ntfy backend still works when selected
  notes: ntfy path in coord_notify.py functions is unchanged. The send_notifications()
    call is gated on backend not in ('ntfy', 'none') to prevent double-notification.
  status: MET
- criterion: 'backend: none disables all notifications'
  notes: load_forge_yaml() now sets backends=[] when notif_backend == 'none'. Previously
    it incorrectly defaulted to [BackendConfig(type='terminal')]. send_notifications()
    loops over an empty tuple and does nothing.
  status: MET
- criterion: All existing tests pass
  notes: 1361 tests pass (up from 1349 before this story).
  status: MET
- criterion: New tests mock webhook POST and verify message format
  notes: '12 new tests in test_notify_backends.py: Block Kit JSON structure verified,
    channel field present/absent, mention_on_escalate prepend, env var routing, missing
    env skip, failure propagation, dispatch via send_notifications() with is_escalation
    flag.'
  status: MET
