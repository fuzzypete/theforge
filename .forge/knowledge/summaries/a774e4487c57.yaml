what_changed:
  description: This run made workspace setup timeout a configurable, operator-visible
    policy and threaded the resolved timeout through baseline setup, batch preflight,
    and dispatch-time workspace creation. It also recorded the resolved policy in
    audit/provenance data and documented the new configuration surface.
  approach: The change was applied by extending config types/default loading, resolving
    setup timeout alongside sprint timeout scaling, passing that resolved value into
    all workspace setup call sites, and updating audit/schema plumbing so the effective
    policy is preserved consistently.
  files_modified: *id002
what_was_learned:
- claim: When timeout policy is resolved conditionally from config objects, any later
    context rebinding must be guarded independently at the exact mutation site; an
    earlier capability check is not enough if subsequent code can still call dataclass-only
    helpers on non-dataclass config.
  evidence:
  - type: review_finding
    finding_id: f56ab5928a2dff28
    description: The review found that sprint startup correctly computed a guard for
      whether workspace config could be rebound, but a later rebind path still called
      dataclasses.replace() when gate timeout changed. That demonstrates the practical
      lesson that each rebind site must enforce the same compatibility check, not
      rely on a prior one.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 notes that the fix 'split the rebind so the workspace replace()
      is guarded by the dataclass check', showing the accepted resolution was to move
      the guard to the actual mutation path rather than treating the earlier check
      as sufficient.
  - type: file
    path: src/theforge/sprint/runner.py
    description: This is the file where timeout resolution and subsequent sprint-context
      rebinding both occur, so its involvement shows the hazard arises specifically
      when policy resolution and config-object replacement are interleaved in one
      control flow.
learned_patterns:
- guard-rebind-at-use-site
