[project]
name = "theforge"
version = "0.12.0rc3"
description = "Deterministic multi-LLM development orchestrator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "python-dotenv>=1.0"]
authors = [{name = "Peter Wickersham"}]
urls = {Homepage = "https://github.com/fuzzypete/theforge", Repository = "https://github.com/fuzzypete/theforge"}

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
google = ["google-genai>=1.0"]
all = ["openai>=1.0", "anthropic>=0.30", "google-genai>=1.0"]
dev = ["pytest", "pytest-xdist", "ruff"]

[project.scripts]
forge = "theforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".forge"]
pythonpath = ["src", "tests"]
addopts = "-n auto --dist worksteal"
markers = [
    "network_integration: marks tests that make real external network calls (requires THEFORGE_RUN_INTEGRATION=1)",
    "cli_contract: marks tests that invoke real provider CLIs to validate argv contracts (requires THEFORGE_RUN_CLI_CONTRACT=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
