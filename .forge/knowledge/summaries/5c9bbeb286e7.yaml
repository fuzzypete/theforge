what_changed:
  description: Sprint story state was updated to carry issue titles through bootstrap,
    persistence, and resumed-run reconstruction so digest rows can render a real title
    instead of repeating the issue reference. The run also corrected carried-story
    audit reconstruction paths that could still drop or blank the title for resumed
    stories.
  approach: The change threaded title-bearing story metadata through the sprint state
    pipeline and then made digest/audit consumers derive display and issue identity
    from structured story state rather than from the older path/reference string alone.
  files_modified: *id002
what_was_learned:
- claim: For issue-backed sprint stories, any operator-facing field needed after bootstrap
    must be preserved as structured story state rather than reconstructed later from
    the display path string.
  evidence:
  - type: review_finding
    finding_id: b079c3d423dafe4e
    description: Review found that resumed-story synthesis recovered issue identity
      only from an entry shape tied to the old path/reference convention, which broke
      once path started carrying the human title; this shows downstream logic cannot
      safely infer durable metadata from a display-oriented path field.
  - type: review_finding
    finding_id: abc8239bb52b24f6
    description: Review also found a separate reconstruction path that rebuilt path
      as the literal issue reference, causing the digest title column to come back
      empty for carried stories even though the real title had been known earlier;
      the repeated failure mode shows that deferred reconstruction from path loses
      information across codepaths.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly notes the P1 was fixed by deriving issue
      identity via story_state.issue_number_for, demonstrating that centralized structured
      accessors were the durable mechanism that resolved the reconstruction bug.
  - type: file
    path: src/theforge/sprint/story_state.py
    description: This file was introduced as the place for story-state helpers, and
      review later referenced those helpers as the fix mechanism, showing the run
      consolidated metadata access away from ad hoc path parsing.
- claim: When sprint state is consumed both live and via carried/resumed audit summaries,
    verification must exercise both creation-time and reconstruction-time paths because
    display regressions can survive in only one of them.
  evidence:
  - type: review_finding
    finding_id: abc8239bb52b24f6
    description: The net-new review finding appeared after the main digest symptom
      was fixed, but only for carried stories reconstructed from per-story audit data,
      showing that live-path fixes did not automatically cover resume-path rendering.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 approved the core digest fix yet still surfaced resumed-story
      defects, demonstrating that this area has multiple state-entry paths that require
      separate verification.
  - type: file
    path: tests/test_sprint_story_title.py
    description: The dedicated title-focused test file reflects that verification
      had to cover title behavior across story states and reconstruction modes rather
      than only a single happy-path render.
