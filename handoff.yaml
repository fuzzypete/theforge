gate_decision: PASS
dev_notes: |
  summary: >
    Implemented project-local log directory with per-story trace artifacts.
    All log and trace artifacts now land under <project_root>/.forge/logs/
    with a per-story directory structure that survives worktree cleanup.
    forge.log moves from ~/.forge/logs/<project>/ to <project>/.forge/logs/.
    A story log dir is created early in run_task before the tee is installed.
    Per-run tee writes run-<id>.log, dev iterations write
    dev-iter-N-<profile>.log, review cycles write review-cycle-N/<profile>.yaml
    + synthesized.yaml, preflight writes preflight.yaml, approved plan
    snapshots are copied as plan.md, plan-review/<profile>.yaml per reviewer,
    and the final audit is copied as audit.yaml. Sprint runs nest under the
    sprint name: .forge/logs/<sprint-name>/<slug>/. Sprint completion writes
    sprint-summary.yaml alongside the existing sprint-audit.yaml.

  commits:
    - sha: "f9d470b"
      message: "feat(logs): project-local log directory with per-story trace artifacts"

  acceptance_criteria:
    - criterion: "All log and trace artifacts land under <project_root>/.forge/logs/"
      status: MET
      notes: >
        forge.log goes to .forge/logs/forge.log (config.py default changed).
        Per-run tee, dev iteration logs, review cycle artifacts, preflight.yaml,
        plan.md, plan-review/, and audit.yaml all go to .forge/logs/<slug>/.

    - criterion: "forge.log moves from ~/.forge/logs/<project>/ to <project>/.forge/logs/"
      status: MET
      notes: >
        config.py default changed from ~/.forge/logs/{project}/forge.log to
        .forge/logs/forge.log. coord_logging.py resolves relative paths against
        project_root. Best-effort migration: if old path exists and new doesn't,
        moves it and creates a symlink from old to new.

    - criterion: "Per-story directory created with slug name (or sprint/slug for sprint runs)"
      status: MET
      notes: >
        _make_story_log_dir() creates .forge/logs/<slug>/ for standalone runs
        and .forge/logs/<sprint-name>/<slug>/ for sprint runs. Created early
        in run_task before the tee is installed.

    - criterion: "Raw reviewer YAML outputs stored per cycle, per reviewer profile"
      status: MET
      notes: >
        _run_review_pool() writes review-cycle-N/<profile>.yaml per reviewer
        using _write_log_artifact(). Existing .forge/traces/ writes preserved.

    - criterion: "Plan reviewer outputs stored in plan-review/ subdirectory"
      status: MET
      notes: >
        After agent plan review approval, per-reviewer outputs written to
        plan-review/<profile>.yaml in story log dir.

    - criterion: "Approved plan snapshot stored as plan.md"
      status: MET
      notes: >
        After each plan review approval (both agent and human paths), the
        approved plan text is written to plan.md in story log dir.

    - criterion: "Preflight verdict stored as preflight.yaml"
      status: MET
      notes: >
        After PREFLIGHT completes, writes preflight.yaml with verdict, reason,
        complexity, cost_usd, and duration_s.

    - criterion: "audit.yaml copied to per-story log dir at run completion"
      status: MET
      notes: >
        cli.py _write_audit() copies audit to result.state.log_dir/audit.yaml.
        sprint.py also copies per-spec audit to story log dir.

    - criterion: "Dev agent stdout/stderr captured per iteration"
      status: MET
      notes: >
        coord_phases.py _run_dev_phase() writes dev-iter-N-<profile>.log
        using write_trace() to state.log_dir after each dev invocation.

    - criterion: "Sprint runs nest stories under sprint name directory"
      status: MET
      notes: >
        sprint_name parameter added to run_task, run_from_review, run_from_dev.
        sprint.py passes manifest.name as sprint_name to all three entry points.

    - criterion: "sprint-summary.yaml written at sprint completion"
      status: MET
      notes: >
        _write_sprint_summary() added to sprint.py; writes to
        .forge/logs/<sprint-name>/sprint-summary.yaml. Existing sprint-audit.yaml
        in .forge/audits/ is preserved for backward compatibility.

    - criterion: "Worktree cleanup does NOT remove .forge/logs/ artifacts"
      status: MET
      notes: >
        .forge/logs/ is at project root, not inside .forge/worktrees/.
        Worktree cleanup touches only the worktree directory.

    - criterion: "All existing tests pass"
      status: MET
      notes: "943 tests pass (939 original + 4 new). make lint clean."

    - criterion: ".gitignore updated: .forge/logs/ ignored"
      status: MET
      notes: >
        .gitignore already ignores .forge/ entirely (line 26), covering
        .forge/logs/. No change needed.

  spec_deviations:
    - deviation: >
        Plan suggested plan-review artifacts in coord_phases.py but plan review
        logic is in coordinator.py. Wrote artifacts in coordinator.py instead
        (confirmed by plan reviewer P2 note).
    - deviation: >
        For the human plan review path, only plan.md is saved (no plan-review/
        subdirectory artifacts since there are no agent results to capture for
        human review decisions).

  deferred_items: none
  gate_result: PASS
