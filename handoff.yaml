dev_notes: |
  summary: "Extended _make_sigterm_handler to capture full crash context and emit it
    in the run_end:crashed structured log event. Added a last_event property to
    StructuredLogger (updated on every emit() call) so the handler can report the
    final event without I/O. Added _ntfy_crash_notify to coord_notify.py which fires
    a crash notification when ntfy is configured. All three _make_sigterm_handler
    call sites in coordinator.py were updated to pass state, task_start, task, and
    config as closure variables. The handler reads state.phase, state.dev_iteration,
    and state.total_cost at signal time via the mutable state reference."
  commits:
    - sha: "65a365f"
      message: "feat(crash-diagnostics): log context and ntfy notification on SIGTERM"
  acceptance_criteria:
    - criterion: "SIGTERM handler logs signal number and name"
      status: MET
      notes: "Handler emits signal=signum and signal_name=signal.Signals(signum).name
        (with ValueError fallback to str(signum)) in the run_end:crashed event."
    - criterion: "SIGTERM handler logs phase and iteration at time of crash"
      status: MET
      notes: "Handler reads state.phase.name and state.dev_iteration via the mutable
        state closure variable at signal time."
    - criterion: "SIGTERM handler logs accumulated cost at time of crash"
      status: MET
      notes: "Handler reads state.total_cost (the computed property) at signal time
        and emits cost_at_crash=round(state.total_cost, 6)."
    - criterion: "SIGTERM handler logs uptime (seconds since run_start)"
      status: MET
      notes: "uptime = time.monotonic() - task_start is computed in the handler;
        emitted as uptime_seconds=round(uptime, 1)."
    - criterion: "ntfy notification sent on crash (if configured)"
      status: MET
      notes: "_ntfy_crash_notify() is called from the handler when state, task, and
        config are all non-None. It guards internally on config.notifications.ntfy
        being set."
    - criterion: "All fields added to the run_end structured log event"
      status: MET
      notes: "signal, signal_name, phase_at_crash, iteration_at_crash, cost_at_crash,
        last_event, and uptime_seconds are all emitted via _safe_emit."
    - criterion: "All existing tests pass"
      status: MET
      notes: "1049 tests pass after changes."
    - criterion: "New test for crash handler context capture"
      status: MET
      notes: "TestSigtermHandler class adds three tests: field capture, ntfy-configured
        path, and ntfy-absent path."
  spec_deviations: none
  deferred_items: none
  gate_result: PASS
gate_decision: PASS
