what_changed:
  description: The run changed the structural-decay observer so its coverage readiness
    calculation and refusal text are derived from the same bounded population as the
    analysis window, rather than from the whole recorded archive. It also adjusted
    reporting around the bound so the output explains when the denominator is limited
    by changed-file capture or by a supplied since date.
  approach: The change was made by pushing the admissible-run bound through the ranking
    and report path, using audit-read-model data to determine the changed-file capture
    era, and then rendering the resulting denominator bound and excluded population
    in the CLI report. The work was completed iteratively, with a follow-up pass to
    correct an edge case where a supplied since date existed but no runs joined a
    changed-file set.
  files_modified: *id002
what_was_learned:
- claim: When readiness is computed over an admissible subset rather than the full
    archive, report generation needs to model the denominator bound as first-class
    data and carry it end-to-end; otherwise later rendering will recreate archive-wide
    assumptions and misstate what population the gate actually measured.
  evidence:
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 approval explicitly notes that the bounded coverage denominator
      is implemented and consumed by the report path, showing that fixing the bug
      required the bound to travel from calculation into presentation rather than
      being inferred separately at render time.
  - type: file
    path: src/theforge/structural_decay_observer/ranking.py
    description: This file was part of the core change, demonstrating that the admissible-population
      logic was established where coverage is computed, which is the source of truth
      future runs must expose instead of reconstructing from unrelated totals.
  - type: file
    path: src/theforge/structural_decay_observer/report.py
    description: This file was changed alongside ranking, showing that reporting depends
      on explicit bound metadata from the computation layer; the need to touch both
      files is evidence that archive-wide assumptions in output are a separate failure
      mode unless the bound is propagated.
- claim: Edge cases at the boundary between 'analysis is bounded' and 'no admissible
    runs exist' need dedicated verification, because the same metadata field can mean
    different things when capture-era evidence is absent and naive rendering will
    label the bound incorrectly.
  evidence:
  - type: review_finding
    finding_id: 5754ab6fc8419ec4
    description: The finding isolates a concrete branch where a supplied since value
      caused the report to claim the denominator was bounded to the changed-file-capture
      era even though no capture era existed, demonstrating that boundary states can
      invalidate otherwise-correct bound messaging.
  - type: review_finding
    finding_id: b404387fcce23cb2
    description: "The finding identifies the missing test shape\u2014supplied since\
      \ plus zero joinable runs\u2014as the specific path that allowed the mislabel\
      \ to survive, showing that future runs should treat this combination as a distinct\
      \ verification case rather than assuming generic coverage tests are enough."
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval states that the prior P2s were fixed by distinguishing
      capture-era bounds from since-tighter cases, confirming that the important lesson
      is not just to compute a bound but to preserve which mechanism created it.
