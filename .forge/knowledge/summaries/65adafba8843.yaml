what_was_learned:
- claim: Optional YAML text fields need explicit normalization of nulls before rendering
    decisions; otherwise a present-but-empty key can escape as the literal string
    'None' and create user-visible bogus content.
  evidence:
  - type: review_finding
    finding_id: c36b020adedb5d93
    description: The review reproduced a bare 'advisory_repair_proposal:' YAML key
      loading as null, then being stored as the literal string 'None' and rendered
      into the issue body, demonstrating that optional text fields cannot rely on
      generic parsing if empty values must suppress output.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 records that the null advisory parsing bug was fixed by normalizing
      YAML null optional fields to empty, confirming the mechanism that resolved the
      user-visible bad render was explicit null-to-empty handling.
  - type: file
    path: src/theforge/task/diagnose_prompts.py
    description: This file is where diagnosis output parsing was adjusted, and the
      review notes tie the fix to optional-field normalization there, showing the
      parser layer is the control point for preventing null YAML values from becoming
      rendered text.
