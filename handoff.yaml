        entering VALIDATE."

    - criterion: "Default review_pool is not treated as explicit override"
      status: MET
      notes: "ForgeConfig.review_pool_is_default=True set on the fallback path in parse_config.
        Coordinator checks `not config.review_pool_is_default` before adding review_pool to
