what_changed:
  description: The run changed plan-review stopping so non-convergence is assessed
    from accumulated trajectory history and recorded with a distinct stop reason instead
    of falling through to plain regeneration-counter exhaustion. It also updated audit/state
    handling so the assessment is preserved in run records across the coordinator
    paths involved in plan review.
  approach: The change centralized trajectory assessment in the plan-review flow,
    threaded the resulting disposition and reason through coordinator state and audit
    output, and then adjusted edge-path handling after review feedback exposed cases
    where non-comparable attempts were being counted as if they were assessable review
    evidence.
  files_modified: *id002
what_was_learned:
- claim: When deriving convergence from repeated review attempts, assess the whole
    attempt history rather than only adjacent pairs; otherwise alternating trajectories
    erase earlier evidence and will systematically spend the full retry budget without
    reflecting the actual non-converging trend.
  evidence:
  - type: file
    path: src/theforge/coordinator/plan_trajectory.py
    description: This file is the trajectory-assessment locus for the fix, showing
      that convergence logic had to be expressed over accumulated attempt history
      rather than a single predecessor comparison, which is exactly the mechanism
      needed to stop alternating recurring/fresh patterns from resetting the assessment.
  - type: file
    path: src/theforge/coordinator/plan_flow.py
    description: This file consumes the trajectory disposition to choose whether to
      continue regenerating or take the escalation branch, demonstrating that a history-based
      assessment changes coordinator behavior at the point where spending decisions
      are made.
  - type: review_cycle
    cycle: '1'
    description: Review cycle 1 explicitly approved the run on the basis that accumulated
      plan-review non-convergence is now assessed from history and consumed at runtime,
      confirming that the key reusable lesson from the run is the need for history-based
      rather than consecutive-only assessment.
- claim: Attempts that contain no comparable review structure must not be fed into
    the same non-convergence counter as assessable reviewer findings, because repeated
    empty-attempt paths can manufacture escalation from lack of evidence rather than
    from an observed bad trajectory.
  evidence:
  - type: review_finding
    finding_id: 48c316f9465adfb6
    description: 'The review finding explains the failure mode: human, pending-file,
      and remote review paths were recording empty finding lists, and after enough
      such attempts the system escalated for ''no comparable structure'' even though
      no comparable review evidence existed, showing that unassessable attempts need
      distinct handling.'
  - type: file
    path: src/theforge/coordinator/plan_flow.py
    description: This file contains the review-path orchestration where empty-finding
      attempts were being recorded, so it is the mechanism demonstrating that path-specific
      attempt recording can contaminate trajectory assessment if assessability is
      not preserved.
  - type: review_cycle
    cycle: '2'
    description: Review cycle 2 states that the human-review path leak was resolved
      by marking those attempts appropriately, reinforcing the lesson that coordinator
      paths lacking comparable findings must be excluded or specially marked rather
      than counted as ordinary review evidence.
- claim: Stopping on non-convergence should be represented distinctly from exhausting
    the retry counter, because downstream audit interpretation depends on whether
    the system chose to stop early for trajectory reasons or merely ran out of allowance.
  evidence:
  - type: file
    path: src/theforge/coordinator/audit.py
    description: This file's involvement shows the run carried trajectory-assessment
      outcomes into audit records, which is necessary because the lesson is about
      preserving why the stop happened, not just that stopping occurred.
  - type: file
    path: src/theforge/coordinator/state.py
    description: This file carries coordinator state needed to distinguish disposition
      and reason across phases, demonstrating that stop-cause fidelity requires explicit
      state rather than inference from attempt counts.
  - type: review_cycle
    cycle: '2'
    description: Review cycle 2 highlights that non-convergence stops are now routed
      through a distinct failed-to-converge branch and recorded in audit output, showing
      that preserving a separate stop reason materially affects what future runs and
      operators can infer from the record.
