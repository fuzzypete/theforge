what_changed:
  description: The run corrected dev-phase iteration resolution so API-transport agent
    turn limits are no longer derived from retry attempt counts, and documented the
    intended default behavior for the dev iteration setting. It also updated coordinator
    state/engine wiring and added regression coverage around adaptive iteration resolution
    and dev timeout retry behavior.
  approach: 'The fix separated the two limit paths at the coordinator level: retry-policy
    values continued to control attempt counts, while dev agent-turn limits followed
    the dev-profile/default resolution path used by the runner. The change was verified
    with targeted tests that exercise the previously conflated API dev case and the
    retry interaction.'
  files_modified: *id002
what_was_learned:
- claim: When a system has both per-attempt agent-turn limits and per-phase retry-attempt
    limits, future changes should verify they are resolved through separate code paths
    end-to-end; similarly named 'iterations' settings can be silently conflated at
    coordinator boundaries.
  evidence:
  - type: diff
    ref: 011c2246990ba7d01edfcd1508866a237d827580
    description: This diff changes coordinator logic rather than runner internals
      to stop feeding a retry-derived value into dev iteration resolution, demonstrating
      that the observed failure came from a boundary where two independently named
      iteration controls were being merged.
  - type: file
    path: src/theforge/coordinator/engine.py
    description: Engine changes are part of the fix path, showing the distinction
      had to be enforced where attempt orchestration hands limits into dev execution;
      that is the seam a future run should inspect first when iteration counts look
      wrong.
  - type: review_cycle
    cycle: '1'
    description: The approval explicitly notes that the change 'keeps retry-attempt
      limits separate from API agent-turn limits,' confirming the key reusable lesson
      was the need to preserve separation between those two units throughout orchestration.
- claim: For unset dev iteration settings, future runs should check the default-resolution
    path directly instead of assuming adaptive or retry settings are safe fallbacks,
    especially on API transport.
  evidence:
  - type: file
    path: docs/guides/inputs-reference.md
    description: The documentation update records the intended source of the dev iteration
      default, which is relevant because this incident arose when an unset dev-specific
      setting effectively picked up a value from elsewhere.
  - type: file
    path: src/theforge/coordinator/state.py
    description: State-layer changes indicate that preserving the correct origin of
      the dev iteration value required explicit handling during configuration/state
      resolution, not just a last-mile adjustment at execution time.
  - type: diff
    ref: 5b0058142dd503dfa726e2c340163191edfb91a4
    description: This diff includes the regression-oriented adjustments around retry
      interaction, showing that the bug manifested when fallback/resolution behavior
      crossed concerns; a future run should therefore validate the unset-setting path
      explicitly.
