what_was_learned:
- claim: When multiple durable artifact directories are published by one git-backed
    flow, tests need to exercise each directory independently as well as together,
    because combined fixtures can hide regressions in per-directory dirty-state handling.
  evidence:
  - type: review_finding
    finding_id: 01cf5578ef52e9dc
    description: Review identified that tests writing both artifact types missed the
      summaries-only-dirty branch, showing the need for independent coverage per published
      directory.
  - type: file
    path: tests/test_sprint_audit_publish.py
    description: This test file was expanded during the run to cover publish behavior
      beyond the original combined-artifact setup.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval explicitly noted focused coverage for combined and
      summary-only runs.
- claim: Once a publish flow handles more than one artifact tree, failure reporting
    needs to name the specific artifact being inspected, staged, or committed so publish-state
    diagnostics remain accurate.
  evidence:
  - type: review_finding
    finding_id: f1ec93a4fee5803d
    description: Review found that summary-directory failures were still reported
      as audit failures, demonstrating the need for artifact-specific messaging in
      shared publish logic.
  - type: file
    path: src/theforge/sprint/audit_publish.py
    description: The publish implementation was the place where staging/commit behavior
      and its operator-facing failure messages were adjusted.
  - type: review_cycle
