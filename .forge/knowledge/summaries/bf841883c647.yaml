what_changed:
  description: This run defined and surfaced per-model availability as a timestamped
    three-state result for the configured account and auth mode, and rendered that
    information in `forge check-config`. It also enforced that manually withdrawn
    packaged identities stay unavailable regardless of provider catalog contents.
  approach: The work introduced a resolver contract for availability answers, gathered
    non-generative account catalog data through auth-specific paths, threaded those
    answers into config checking, and updated focused verification around resolver
    behavior, auth labeling, retired identities, and staleness-related identity checks.
  files_modified: *id002
what_was_learned:
- claim: Availability probes that run during `check-config` need explicit failure
    bounds, because unconditional live catalog requests can turn configuration inspection
    into an indefinite hang instead of yielding `unverified`.
  evidence:
  - type: review_finding
    finding_id: 883f5f59eba12c91
    description: The review found that `resolve_model_availability`, called unconditionally
      from `cmd_check_config`, performed live `models.list` requests without a timeout,
      and an unresponsive endpoint stalled `forge check-config` forever; this shows
      future runs must treat provider-catalog probing as bounded preflight work rather
      than assume it will fail fast.
  - type: file
    path: src/theforge/cli/check_config.py
    description: This CLI path is where availability resolution is invoked for config
      inspection, so the finding demonstrates that any network behavior introduced
      here directly affects whether a supposedly diagnostic command remains responsive.
- claim: Auth-mode labeling must be derived from the credentials actually used for
    the catalog request, not from a coarse endpoint classification, because local
    OpenAI-compatible targets can still authenticate with a real API key.
  evidence:
  - type: review_finding
    finding_id: ab798c1f00a8f44b
    description: The review caught a case where a local endpoint with a configured
      API key displayed `local endpoint (no API key)` even though the request was
      sent with that key, showing that endpoint locality and effective auth mode can
      diverge and must be resolved from actual request inputs.
  - type: review_cycle
    cycle: '3'
    description: Cycle 3 approved after this mismatch was fixed, confirming that the
      review considered key-aware auth labeling part of the contract rather than cosmetic
      output.
- claim: Retired or withdrawn identities need to stay in the availability output even
    when identity resolution is incomplete, so enumeration paths must not drop them
    before an unavailable/unverified answer can be produced.
  evidence:
  - type: review_finding
    finding_id: 2436dcce2db5c445
    description: The review found that a direct role override naming a packaged retired
      identity was being carried as an unconfirmed identity and sent through the ordinary
      catalog path as `unverified`, which exposed that identity status and availability
      rendering are coupled in edge cases.
  - type: review_finding
    finding_id: ef9ec1d057a3fc5e
    description: A separate review finding showed that a retired registry key in simple-mode
      `config.models` raised during `resolve_agent_spec` and was skipped entirely
      from the availability section, demonstrating that future runs must preserve
      rows for retired identities across all enumeration paths rather than let resolver
      exceptions erase them.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 notes explicitly called out retired-identity fixes with dedicated
      tests, showing that keeping these identities visible in output was a recurring
      review concern, not an isolated bug.
- claim: Catalog parsing for account-based availability should tolerate duplicate
    entries for the same slug, because strict set-vs-count validation can discard
    an otherwise usable catalog and incorrectly degrade the answer to `unverified`.
  evidence:
  - type: review_finding
    finding_id: 9d29c97694c04b90
    description: The review found that a Codex cache with two entries for the same
      slug caused `_codex_cache_catalog` to reject the entire catalog as having an
      unrecognized entry; this shows future runs should validate catalog shape in
      a way that preserves usable membership information when duplicates appear.
  - type: file
    path: src/theforge/config/auth.py
    description: This is the auth-side catalog resolution path where duplicate-handling
      affected whether availability could be resolved from cached account data at
      all, making the parsing strategy a behaviorally important design point.
- claim: Local OpenAI-compatible availability logic has to distinguish 'local endpoint
    with no key' from 'local endpoint using API-key auth', because those two cases
    differ both in whether a catalog request should be attempted and in the resulting
    availability state.
  evidence:
  - type: review_finding
    finding_id: 71c018c59f821e00
    description: The review identified that when a localhost `base_url` had no `OPENAI_API_KEY`,
      availability resolved to `unverified` and no account-catalog request was made;
      this demonstrates one branch of local-endpoint behavior that future runs must
      preserve explicitly.
  - type: review_finding
    finding_id: ab798c1f00a8f44b
    description: 'A later finding showed the contrasting branch: a local endpoint
      can still send the catalog request with a real configured key, so logic keyed
      only on endpoint locality is insufficient.'
learned_patterns:
- bounded-preflight-networking
- effective-auth-over-endpoint-heuristics
- preserve-retired-identities-in-enumeration
- tolerant-catalog-membership-parsing
