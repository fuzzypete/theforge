what_was_learned:
- claim: A new forge run entry point has to perform the same run-context bootstrap
    as existing entry points, or the spawned agent work becomes invisible to forge's
    own tracking.
  evidence:
  - type: review_finding
    finding_id: 306912926c21fe09
    description: Review identified that baseline-fix invoked the coordinator without
      exporting run context or registering subprocesses, which directly showed that
      adding a CLI path is not enough by itself; the standard bootstrap is required
      for observability and sidecar registration.
  - type: diff
    ref: a070c7f51c89d87a9660520cc3e92fe809a4135e
    description: The follow-up diff is cited in review as resolving this by wiring
      in the same run bootstrap pieces used elsewhere, demonstrating the concrete
      mechanism needed for any future run entry point.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 states that the carried P2 about run bootstrap was resolved,
      confirming that parity with the normal run-context publishing path was the condition
      for acceptance.
- claim: When a command derives work from stored sprint audits, default selection
    must fail closed on multiple candidates rather than silently picking the newest
    file.
  evidence:
  - type: review_finding
    finding_id: 590db58c4b4c8b81
    description: Review showed that the original default effectively treated the latest
      audit as unambiguous in normal cases, creating silent stale-audit selection
      despite operator docs promising ambiguity detection; that demonstrates the planning
      rule to reject ambiguous stored inputs by default.
  - type: diff
    ref: a070c7f51c89d87a9660520cc3e92fe809a4135e
    description: The resolving diff is the evidence that the accepted behavior changed
      to fail closed for multi-audit selection, showing the implementation pattern
      future runs should reuse when selecting from persisted run records.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 explicitly notes resolution of the multi-audit selection
      P2, confirming that ambiguity handling was a meaningful correctness requirement,
      not just a UX preference.
- claim: For workflows that consume sprint audit data, verification should include
    a writer-to-reader round trip using the real audit producer format rather than
    only hand-authored fixtures.
  evidence:
  - type: review_finding
    finding_id: d00e42cbfeaa82ff
    description: Review called out that both new test modules used handcrafted sprint-audit
      YAML, leaving untested the seam where captured baseline-gate fields are serialized
      by the sprint audit writer and later read by the repair path; this exposes a
      verification gap future runs should plan for.
  - type: diff
    ref: a070c7f51c89d87a9660520cc3e92fe809a4135e
    description: The resolving diff is cited in review as fixing the seam-coverage
      issue, which demonstrates that exercising the real producer/consumer boundary
      was necessary to validate the feature path.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 records that the carried P2 about audit serialization coverage
      was resolved, confirming that round-trip verification across the persisted audit
      boundary mattered to completion.
