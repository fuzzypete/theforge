dev_notes: |
  summary: >
    Implemented four targeted changes. (1) Inserted a static preamble into
    build_dev_prompt() immediately before {spec_content} — it tells the dev agent
    that ACs are the definitive checklist, context sections are not requirements,
    and ambiguity should be flagged in dev_notes. The preamble is a blockquote
    inside the ## Spec section so it is visually co-located with the content it
    describes. (2) Extended cmd_init() to create specs/TEMPLATE.md alongside
    forge.yaml, guarded by an existence check to avoid silently overwriting a
    user-customized template. The template constant (_STORY_TEMPLATE) lives near
    the other top-level constants in cli.py. (3) Updated docs/vision.md with a
    new "Upstream Workflow" section (brief → story → plan → dev), updated the
    pipeline diagram block with --until flag examples, and rewrote Principle 4
    from "Specs are the contract" to "Stories are the contract" with the AC-is-
    normative framing. (4) Added test_preamble_appears_before_spec_content to
    TestBuildDevPrompt; it asserts that the preamble text ("acceptance criteria
    are the definitive checklist") appears in the prompt at an index strictly
    before the injected spec content.

  commits:
    - sha: "20e1e11"
      message: "feat(dev-prompt): add AC preamble to build_dev_prompt and story template to forge init"

  acceptance_criteria:
    - criterion: "build_dev_prompt() includes a preamble before spec content that identifies acceptance criteria as the definitive checklist"
      status: MET
      notes: "Preamble inserted as a blockquote inside the ## Spec section of the prompt template in task.py, immediately before {spec_content}."

    - criterion: "Preamble tells the agent: context sections are not requirements, ACs are the checklist, flag ambiguity in handoff notes"
      status: MET
      notes: "Preamble text explicitly states: ACs are definitive checklist, context sections are informational not requirements, flag ambiguity in dev_notes."

    - criterion: "forge init creates specs/TEMPLATE.md alongside forge.yaml with annotated story structure (frontmatter, problem, ACs)"
      status: MET
      notes: "cmd_init() creates specs/ dir (exist_ok=True) and writes TEMPLATE.md if it does not already exist. Template has frontmatter, Problem/context, Acceptance criteria, and Notes sections with inline comments."

    - criterion: "docs/vision.md updated: pipeline diagram shows --until, upstream workflow section (brief → story → plan → dev), story vs spec terminology clarified"
      status: MET
      notes: "Added 'Upstream Workflow' section with brief→story→plan→dev table. Updated pipeline diagram block with --until examples. Principle 4 rewritten to 'Stories are the contract' with AC-normative framing."

    - criterion: "New test verifies the preamble appears in dev prompt output"
      status: MET
      notes: "test_preamble_appears_before_spec_content in TestBuildDevPrompt asserts checklist text present, dev_notes reference present, and preamble index < spec content index."

    - criterion: "Existing tests pass"
      status: MET
      notes: "840 tests passed (pytest -q). Preamble is purely additive; no signature changes."

  spec_deviations: none

  deferred_items: none

  gate_result: PASS
