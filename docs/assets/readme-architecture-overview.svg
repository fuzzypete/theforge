<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TheForge architecture overview</title>
  <desc id="desc">A high-level diagram showing the coordinator controlling lifecycle and state, models producing plans code and reviews, and the repository runtime providing codebase tests and artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="70" x2="1120" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F4EC"/>
      <stop offset="1" stop-color="#EEF1F4"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#374151"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1F2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#FBFCFD"/>
  <rect x="36" y="36" width="1128" height="568" rx="32" fill="url(#bg)"/>

  <text x="80" y="100" fill="#111827" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">TheForge keeps control deterministic</text>
  <text x="80" y="136" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Python owns orchestration, models stay inside bounded artifact-producing roles, and your repo remains gated and inspectable.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="180" width="340" height="330" rx="26" fill="#FFFFFF"/>
    <rect x="80" y="180" width="340" height="72" rx="26" fill="url(#header)"/>
    <text x="112" y="224" fill="#F9FAFB" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Coordinator</text>
    <text x="112" y="286" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Controls</text>
    <text x="112" y="320" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">State machine and phase transitions</text>
    <text x="112" y="352" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Worktree creation and branch isolation</text>
    <text x="112" y="384" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Validation gates and retry limits</text>
    <text x="112" y="416" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Resume points, audits, and logs</text>
    <rect x="112" y="450" width="140" height="36" rx="18" fill="#E5EEF7"/>
    <text x="137" y="473" fill="#1D4ED8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Deterministic</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="180" width="340" height="330" rx="26" fill="#FFFFFF"/>
    <rect x="430" y="180" width="340" height="72" rx="26" fill="#7C2D12"/>
    <text x="462" y="224" fill="#FFF7ED" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Models</text>
    <text x="462" y="286" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Produce</text>
    <text x="462" y="320" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Plans for medium and large stories</text>
    <text x="462" y="352" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Code and tests inside the worktree</text>
    <text x="462" y="384" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Structured review findings and verdicts</text>
    <text x="462" y="416" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Nothing about process control or escalation</text>
    <rect x="462" y="450" width="162" height="36" rx="18" fill="#FDEAD7"/>
    <text x="483" y="473" fill="#C2410C" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Artifact roles only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="180" width="340" height="330" rx="26" fill="#FFFFFF"/>
    <rect x="780" y="180" width="340" height="72" rx="26" fill="#14532D"/>
    <text x="812" y="224" fill="#F0FDF4" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Repo / Runtime</text>
    <text x="812" y="286" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Provides</text>
    <text x="812" y="320" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Source tree and git history</text>
    <text x="812" y="352" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Tests, lints, and gate commands</text>
    <text x="812" y="384" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Audit files, handoff output, and logs</text>
    <text x="812" y="416" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Merge remains explicit and user-controlled</text>
    <rect x="812" y="450" width="170" height="36" rx="18" fill="#DCFCE7"/>
    <text x="836" y="473" fill="#15803D" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Inspectable output</text>
  </g>

  <path d="M420 345H430" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M770 345H780" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="470" y="536" width="260" height="48" rx="24" fill="#111827"/>
  <text x="516" y="566" fill="#F9FAFB" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Gated by validate and review</text>
</svg>
