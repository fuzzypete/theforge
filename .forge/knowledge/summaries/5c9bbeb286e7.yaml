what_changed:
  description: The run carried issue titles through sprint story state and changed
    sprint digest row rendering to use that preserved title instead of repeating the
    issue reference as the final column. It also updated bootstrap, query, manifest,
    runner, audit, and state-writing paths so operator-facing summaries could recover
    titles consistently across active, resumed, and carried stories.
  approach: 'The fix treated the problem as a state-shape issue rather than a formatting-only
    bug: title data was preserved in the serialized story record, helper logic was
    added to recover issue identity and title across lifecycle transitions, and digest/audit
    consumers were aligned to read the richer story state.'
  files_modified: *id002
what_was_learned:
- claim: When operator-facing output depends on intake metadata, preserving that metadata
    in the serialized story state is safer than trying to reconstruct it later from
    identifiers or display-oriented fields.
  evidence:
  - type: review_finding
    finding_id: abc8239bb52b24f6
    description: Review found that rebuilding a carried story's summary row from audit
      data reconstructed path as a literal issue reference, which erased the title
      in digest output even though intake had resolved it; this shows reconstruction
      from fallback fields loses operator-visible metadata.
  - type: file
    path: src/theforge/sprint/story_state.py
    description: This file was introduced to centralize story-state helpers, demonstrating
      that title and issue identity needed a canonical representation in persisted
      story records so later readers would not infer them from path text.
  - type: file
    path: src/theforge/sprint/state_writer.py
    description: Changes here show the state-writing boundary was part of the fix,
      which is evidence that downstream readers could only render correct titles once
      the serialized state itself retained them.
- claim: For resumed or carried sprint stories, issue identity should be derived from
    canonical story-state fields rather than parsed from entry text, because title-bearing
    paths and synthesized records break text-based recovery.
  evidence:
  - type: review_finding
    finding_id: b079c3d423dafe4e
    description: Review caught that a resumed sprint's synthesized run record wrote
      task.github_issue as null once the carried story path held the real title, because
      issue number recovery depended on entry text shape; that failure demonstrates
      text parsing is not stable across lifecycle transitions.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval notes that the P1 was fixed by deriving issue identity
      via story_state.issue_number_for in audit.py, confirming the durable lesson
      was to use canonical helper-based recovery instead of field-shape assumptions.
  - type: file
    path: src/theforge/sprint/audit.py
    description: Audit-path changes were necessary because carried-story reconstruction
      happens there; the file's involvement shows resume/carry flows are where non-canonical
      issue recovery causes state loss and misreporting.
