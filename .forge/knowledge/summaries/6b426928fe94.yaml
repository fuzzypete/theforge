what_changed:
  description: The run made gate verdicts carry more execution context by recording
    the worktree residue present when story and baseline gates ran, and by surfacing
    that context in audit output. It also tightened the gate/profile seam and baseline-gate
    handling around the reproduced broken-baseline scenario.
  approach: The change was shaped as instrumentation around existing gate execution
    and validation recording paths, with focused CLI and coordinator updates plus
    seam-oriented tests that exercised both persisted gate metadata and baseline-gate
    behavior.
  files_modified: *id002
what_was_learned:
- claim: When a bug depends on repository residue such as ignored files, verification
    needs at least one real-git path; stubbed status output alone can miss the behavior
    of the actual command invocation.
  evidence:
  - type: review_finding
    finding_id: 34924f91e3eb60df
    description: Review identified that ignored-path assertions were only checked
      against stubbed git-status text while the real-repository test covered only
      untracked files, showing that residue-sensitive behavior can appear covered
      while the actual ignored-file command path remains unexecuted.
  - type: file
    path: tests/test_sprint_baseline_gate.py
    description: This test file is where baseline residue behavior was exercised,
      and the review issue tied specifically to how its real-repo versus stubbed assertions
      split the coverage, demonstrating the need for a real-git check for ignored-file
      cases.
- claim: For gate verdicts to be reusable by later runs, operator-visible audit views
    must expose any gate-time worktree state that could change the verdict; recording
    metadata without rendering it leaves the original ambiguity intact for humans
    consuming the PASS.
  evidence:
  - type: review_finding
    finding_id: d6b983bfad9145bd
    description: Review noted that audit output still omitted the recorded worktree_state,
      which means a PASS could still be read without the residue context needed to
      interpret whether it was environment-dependent.
  - type: file
    path: src/theforge/cli/audit.py
    description: The audit renderer is the operator-facing surface for recorded validations,
      so its involvement directly shows that verdict transparency depends not just
      on persistence but on making that context visible at read time.
learned_patterns:
