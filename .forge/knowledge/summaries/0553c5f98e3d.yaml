what_changed:
  description: The run changed diagnose output routing so non-bug issues no longer
    get a body-appended Diagnosis section by default, avoiding shape-gate self-blocking
    while keeping diagnosis content available. It also corrected the CLI path so configured
    defaults are not misread as explicit body-section overrides on non-bug issues.
  approach: The change made destination selection format-aware in the diagnosis flow/config
    path, then aligned the CLI handoff with that resolver so only true user overrides
    bypass the format-aware defaulting behavior, with regression checks covering direct
    flow and CLI execution.
  files_modified: *id002
what_was_learned:
- claim: When a flow distinguishes between implicit defaults and explicit user overrides,
    CLI plumbing must preserve that distinction end-to-end; passing a resolved default
    as a non-null argument can silently disable context-sensitive behavior.
  evidence:
  - type: review_finding
    finding_id: 201e601e8ab3be6a
    description: 'The review finding identifies the exact failure mode: the CLI supplied
      the configured default as a non-null output_destination, and the downstream
      resolver therefore treated it as an explicit override, bypassing the non-bug-aware
      default selection.'
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 requested changes specifically because the flow-level logic
      was correct but the real CLI execution path still converted the default into
      an override, showing that context-sensitive defaults must be verified through
      the entrypoint, not only in internal helpers.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approved only after the CLI override regression was fixed
      and non-bug default output landed as a comment, confirming that preserving implicit-versus-explicit
      semantics across layers was the decisive issue.
  - type: file
    path: src/theforge/cli/diagnose.py
    description: This file is where the CLI-to-flow argument handoff lives; its involvement,
      together with the review finding, shows the bug arose at the boundary where
      command-line inputs were translated into diagnosis options.
  - type: file
    path: src/theforge/coordinator/diagnose_flow.py
    description: This file contains the destination resolution behavior that was intended
      to be format-aware, demonstrating that the incorrect result came from how inputs
      reached the resolver rather than from the resolver concept itself.
