what_changed:
  description: The run extended `forge explain` so it can surface routing explanations
    for live and stopped stories by reading unfinished-story records, and updated
    CLI/docs output to distinguish missing records from unreadable ones.
  approach: It added a dedicated live/stopped lookup path alongside the existing explain
    flow, then hardened lookup behavior through review so run-targeted searches only
    treat matching on-disk records as relevant before reporting read failures.
