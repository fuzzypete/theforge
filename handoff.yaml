dev_notes: |
  summary: >
    Replaced .forge/secrets.yaml (yaml.safe_load) with .forge/.env (dotenv_values) as the
    canonical secrets file. Added python-dotenv>=1.0 to pyproject.toml. config.py now loads
    .forge/.env via dotenv_values(), raises ValueError if any key maps to None (malformed),
    and emits a logging.WARNING when secrets.yaml exists without .env (no auto-migrate). The
    ntfy URL block now falls back to secrets.get("NTFY_URL") or os.getenv("NTFY_URL") when
    forge.yaml omits the url field, gated on notif_backend == "ntfy". cli.py constants and
    _generate_secrets_skeleton() updated to .env format; cmd_secrets_init() now writes .forge/.env,
    prints the migration warning when secrets.yaml exists, and guards against overwriting .env.
    .forge/.env.example created (tracked via git add -f due to .forge/ gitignore) with all four
    provider keys plus NTFY_URL. .gitignore entry replaced from .forge/secrets.yaml to .forge/.env.
    Also fixed pre-existing test failures in TestDeepSeekProvider by mocking httpx alongside openai.
    All 861 tests pass.

  commits:
    - sha: "69703cf"
      message: "feat(secrets): migrate secrets from .forge/secrets.yaml to .forge/.env"
    - sha: "6aa7029"
      message: "fix(tests): mock httpx in DeepSeek client tests to avoid missing dependency"

  acceptance_criteria:
    - criterion: "AC-1: Add python-dotenv to pyproject.toml dependencies"
      status: MET
      notes: "Added python-dotenv>=1.0 to dependencies list in pyproject.toml"

    - criterion: "AC-1: Import and use dotenv_values() for loading .forge/.env"
      status: MET
      notes: "dotenv_values imported at module level in config.py; used in load_config()"

    - criterion: "AC-2: load_config() reads .forge/.env via dotenv_values() if the file exists"
      status: MET
      notes: "env_path = project_root / '.forge' / '.env'; dotenv_values(env_path) called when file exists"

    - criterion: "AC-2: ForgeConfig.secrets stores loaded values"
