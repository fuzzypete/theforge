gate_decision: PASS
dev_notes: |
  summary: >
    Implemented the full lifecycle hooks feature: a `hooks` block in forge.yaml parsed
    into a new `HooksConfig` dataclass (config.py), a new `coord_hooks.py` module with
    `run_hook()` (subprocess executor, best-effort, never raises) and four payload
    builders, hook call sites in coordinator.py (pre_run + post_run), coord_phases.py
    (post_merge via run_id threading through the review chain), and sprint.py (post_sprint
    after sprint-audit.yaml). Two reference shell scripts under .forge/hooks/. 16 unit
    tests cover all run_hook() paths and all payload builders. 921 tests pass.

  commits:
    - sha: "c3c5c66"
      message: "feat(hooks): add lifecycle hooks — post_run, post_merge, post_sprint, pre_run"

  acceptance_criteria:
    - criterion: "forge.yaml hooks block parsed into ForgeConfig.hooks"
      status: MET
      notes: >
        HooksConfig dataclass added to config.py; ForgeConfig.hooks field added;
        load_config() parses the hooks key with per-field extraction and defaults.

    - criterion: "post_run fires after every completed run with full payload"
      status: MET
      notes: >
        Called at end of run_task, run_from_dev, run_from_review (all three entry points),
        right before logger._safe_emit("run_end"). Payload built from state and result
        directly — no dependency on generate_audit_log (called by cli.py/sprint.py after
        the coordinator returns). See spec_deviations for rationale.

    - criterion: "post_merge fires after successful auto-merge"
      status: MET
      notes: >
        _finalize_approve in coord_phases.py fires post_merge after merge_info["merged"]
        is True. run_id threaded from _coordinator_loop → _run_review_phase → _finalize_approve.

    - criterion: "post_sprint fires after sprint audit is written"
      status: MET
      notes: >
        sprint.py fires post_sprint after _write_sprint_audit returns. Uses _sprint_run_id
        (already in scope). Stories list built from the results list.

    - criterion: "pre_run fires before WORKSPACE; non-zero exit aborts run"
      status: MET
      notes: >
        Fires in run_task only (before WORKSPACE). Non-zero exit_code returns an ESCALATE
        CoordinatorResult immediately. run_from_dev / run_from_review skip pre_run (they
        skip WORKSPACE too — resume paths).

    - criterion: "All hook payloads include project, slug, run_id at minimum"
      status: MET
      notes: All four payload builders include event, project, slug/sprint, run_id.

    - criterion: "Hook timeout enforced (default 30s); exceeded = warning, not failure"
      status: MET
      notes: >
        subprocess.TimeoutExpired caught in run_hook(); logs warning, returns
        HookResult(success=False, exit_code=-1). Never raises.

    - criterion: "Hook exit non-zero (except pre_run): warning logged, run unaffected"
      status: MET
      notes: >
        run_hook() returns HookResult on any non-zero exit; logs a warning. Only the
        pre_run call site in coordinator.py checks exit_code != 0 to abort. All other
        call sites ignore the result.

    - criterion: "run_hook() unit-tested with mocked subprocess"
      status: MET
      notes: >
        tests/test_coord_hooks.py: 10 run_hook() tests (success, non-zero, timeout,
        exception, missing file, non-executable, system-command bypass, log event on
        success and failure, payload stdin serialization). 6 payload builder tests.

    - criterion: "Reference scripts committed under .forge/hooks/"
      status: MET
      notes: >
        .forge/hooks/post-run-gh-issues.sh and .forge/hooks/post-run-backlog-sync.sh
        committed verbatim from spec. Executable bit set.

    - criterion: "Structured log event emitted for each hook invocation"
      status: MET
      notes: >
        run_hook() calls logger._safe_emit("hook", hook=label, success=..., exit_code=...,
        duration_s=...) unconditionally (when logger is not None). Skipped hooks also emit
        with skipped=True, reason=file_not_found/not_executable.

    - criterion: "All existing tests pass"
      status: MET
      notes: "921 tests pass (905 existing + 16 new)."

  spec_deviations:
    - deviation: >
        post_run fires inside coordinator entry points (before returning), not after
        generate_audit_log in cli.py/_write_audit(). The plan assumed generate_audit_log
        would be callable inside the coordinator, but it is called by cli.py and sprint.py
        after the coordinator returns. The payload is built directly from CoordinatorState
        and CoordinatorResult, which contain all spec-required fields (findings, cycles,
        dev_iterations, gate_decisions, review_pool, costs, duration).
      justification: >
        Plan reviewer P1 note flagged this exact issue and offered this approach as the
        cleaner alternative. All payload fields from the spec are available from state/result.

    - deviation: >
        pre_run fires only in run_task, not in run_from_dev or run_from_review.
      justification: >
        Consistent with plan guidance: "pre_run only fires in run_task (the full path)."
        Resume paths represent in-progress work; pre_run as a gate makes no sense there.

  deferred_items: none

  gate_result: PASS
