# forge.yaml — TheForge developing itself
project: theforge

workspace:
  create_command: "git worktree add .forge/worktrees/{slug} -b feat/{slug}"
  setup_command: "test -d .venv || (python -m venv .venv && .venv/bin/pip install -e '.[all]' pytest -q)"
  path_pattern: ".forge/worktrees/{slug}"
  branch_pattern: "feat/{slug}"
  on_approve: pr
  auto_push: true

validation:
  gate_command: ".venv/bin/python -m pytest tests/ -q"
  handoff_file: ".forge/handoff.yaml"
  gate_decision_key: "gate_decision"

retry:
  max_dev_iterations: 3
  max_review_cycles: 3

# Explicit profiles until adaptive assignment is stable
profiles:
  dev:
    cli: claude
    model: sonnet
    budget_usd: 50.00
    timeout_seconds: 600
    timeout_medium_seconds: 900
    timeout_large_seconds: 1800
  preflight:
    cli: claude
    model: sonnet
    budget_usd: 1.00
    timeout_seconds: 300
  synthesis:
    cli: claude
    model: opus
    budget_usd: 5.00
    timeout_seconds: 600
  review_pool:
    - name: codex-reviewer
      cli: codex
      model: gpt-5.4
      review_role: correctness
      budget_usd: 5.00
      timeout_seconds: 300
      reasoning_effort: high
      max_iterations: 20
    - name: gemini-reviewer
      cli: gemini
      model: gemini-3.1-pro-preview
      review_role: edge-cases
      budget_usd: 2.00
      timeout_seconds: 300
      max_iterations: 30
    - name: opus-reviewer
      cli: claude
      model: opus
      review_role: patterns
      budget_usd: 5.00
      timeout_seconds: 600

# Plan uses opus — deliberate choice
plan:
  enabled: true
  model: claude
  model_name: opus
  budget_usd: 3.00
  timeout: 600
  timeout_medium: 900
  timeout_large: 1800

plan_agent_review:
  enabled: true
  pool:
    - name: codex-plan-reviewer
      cli: codex
      model: gpt-5.4
      budget_usd: 2.00
      timeout_seconds: 600
      reasoning_effort: high
      max_iterations: 20
    - name: deepseek-plan-reviewer
      provider: deepseek
      model: deepseek-chat
      budget_usd: 0.50
      timeout_seconds: 300
      max_iterations: 30

hooks:
  post_run: .forge/hooks/post_run.sh
  timeout_seconds: 30

notifications:
  backend: slack
  slack:
    webhook_url_env: SLACK_WEBHOOK_URL
  human_review_timeout_seconds: 600
