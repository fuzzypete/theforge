what_changed:
  description: The run split shape-gate outcomes into blocking type-shape contradictions
    and non-blocking phrase-level advisories, and threaded that distinction through
    intake, admissibility, sprint gating, rendering, and verdict output. It also added
    refusal messaging that names the contradicting section and preserves machine-readable
    differentiation between refusal and advice.
  approach: The change derived contradiction checks from type/section shape rules,
    then propagated separate refusal and advisory channels through the verdict and
    sprint-intake pipeline rather than treating all heuristics as one severity.
  files_modified: *id002
what_was_learned:
- claim: When introducing advisory and refusal tiers into an existing gate, future
    runs should verify at every publication boundary that blocking reasons and advisory
    notices remain disjoint; otherwise the same condition can be emitted simultaneously
    as 'not blocking' advice and as a refusal.
  evidence:
  - type: review_finding
    finding_id: 31d4b774ab5eeab4
    description: This finding shows the sprint shape gate published an investigation-ready
      bug both in skipped and advisories, proving that adding a second severity is
      not enough unless each output path enforces exclusivity.
  - type: review_finding
    finding_id: 1f514504f47a57c0
    description: This finding demonstrates the same reason code was surfaced as both
      a refusal and a non-blocking advisory, showing the failure mode occurs at reason-code
      publication, not just at prose rendering.
  - type: review_finding
    finding_id: fe5cd65c797adb16
    description: This later finding shows that even after the first duplicate-publication
      fix, phrase-level advice could still leak into blocking skipped reason codes,
      demonstrating that the split must be checked end-to-end across downstream consumers.
  - type: review_cycle
    cycle: '1'
    description: Cycle 1 repeatedly requested changes because the new advisory plumbing
      mislabeled refused issues as non-blocking, showing this was the central integration
      risk introduced by the design.
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 found a second variant of the same leakage after the initial
      fix, showing future runs should expect multiple publication paths to need explicit
      separation checks.
- claim: When a gate selects one machine-readable verdict from several blocking conditions,
    future runs should verify that precedence is applied consistently in both operator-facing
    messages and persisted audit fields; otherwise routing and remediation records
    can disagree about why an issue was refused.
  evidence:
  - type: review_finding
    finding_id: ce06b1eb675aa3c6
    description: This finding shows operator-visible output could select a diagnosis-oriented
      typed verdict for a type-shape contradiction case, demonstrating that verdict
      precedence can drift away from the actual dominant refusal reason.
  - type: review_finding
    finding_id: ba752c4dec11bac2
    description: This finding shows the remediation outcome event stored the first
      blocking reason code even when a later code supplied the selected verdict, proving
      that persisted audit data must be checked separately from UI behavior.
  - type: review_cycle
    cycle: '4'
    description: Cycle 4 notes that type_shape_contradiction was made to outrank needs_diagnosis,
      showing that explicit precedence ordering was required to align machine-readable
      verdict selection with the intended refusal semantics.
- claim: When new typed verdict identifiers are introduced on a documented interface,
    future runs should check the contract documentation and bounded verdict lists
    in the same change; otherwise the code can expand the public surface without the
    ADR or audit contract reflecting it.
  evidence:
  - type: review_finding
    finding_id: 5ad3e5720dbf090b
    description: This finding explicitly states that a new typed verdict was emitted
      and written to the audit substrate while the ADR's bounded verdict list omitted
      it, demonstrating a contract-drift risk whenever verdict vocabularies change.
  - type: file
    path: docs/adr/0001-intake-readiness-workflow.md
    description: The ADR was touched in this run, and the review still reported an
      omitted verdict identifier there, showing that interface-doc updates need explicit
      verification rather than assuming nearby edits keep the contract complete.
