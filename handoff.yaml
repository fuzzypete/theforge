        manifest paths and forge.yaml references in a coordinated follow-on story"
    - criterion: "Sprint manifests use the new key name for listing story files"
      status: MET
      notes: "All 23 sprint YAML manifests updated from specs: to stories:; backward
        compat preserved in load_sprint_manifest (specs: key still accepted)"
    - criterion: "Internal code types and variables reflect the rename"
      status: MET
      notes: "TaskSpec → TaskStory (field spec_path → story_path); spec_validator.py
        → story_validator.py; story_compliance / story_deviations replace old keys;
        TaskSpec / load_spec / parse_spec_frontmatter kept as compat aliases"
    - criterion: "forge init scaffolds with the new naming"
      status: MET
      notes: "cmd_init creates stories/ directory and writes TEMPLATE.md there;
        post-init message references forge run <story-file>"
    - criterion: "forge ideate output uses the new naming"
      status: MET
      notes: "IdeationResult.story_path replaces spec_path; run_ideation uses
