what_changed:
  description: Completed runs now persist the forge version and the resolved runtime
    configuration they actually used, and the explain/read path answers configuration
    queries from that recorded snapshot or reports that no record exists for older
    runs.
  approach: The change threaded resolved configuration provenance through load and
    runtime mutation paths into the audit record, then added a read model that interprets
    recorded values against the reader's schema while preserving absent and uninterpreted
    cases.
  files_modified: *id002
what_was_learned:
- claim: When recording configuration for later cross-version reads, list-indexed
    paths need schema-aware interpretation; otherwise even same-version readers misclassify
    valid entries as uninterpreted.
  evidence:
  - type: review_finding
    finding_id: 88fca90b5361e4de
    description: Review reported that keys like review_pool[0].model and agents[0].model
      were returned as uninterpreted despite being defined by the current ForgeConfig
      shape, showing that flat-path readers must explicitly understand indexed list
      traversal.
  - type: review_finding
    finding_id: bb78851c9408572d
    description: 'A second P1 on known list fields confirmed the failure mode was
      structural rather than field-specific: paths inside list-typed config sections
      need per-segment type interpretation, not generic dotted-key handling.'
  - type: review_cycle
    cycle: '2'
    description: Cycle 2 approval noted the indexed-list lookup findings were fixed
      and that remaining uninterpreted keys were of a different class, demonstrating
      that schema-aware list handling was the necessary correction.
- claim: If runtime configuration can change after initial load, audit capture must
    read from the final coordinator config at the production seam; capturing an earlier
    config object leaves persisted provenance stale.
  evidence:
  - type: review_finding
    finding_id: 7608cd673c2f894f
    description: Review found that after preflight adaptive routing changed config
      values, the audit still emitted load-time values, showing that provenance capture
      tied to pre-mutation state is not reliable.
  - type: review_finding
    finding_id: ccbdcb28042a292d
    description: A later P1 showed the same stale-value problem persisted on the normal
      forge run path, demonstrating that the fix had to be applied where completed-run
      audit records are produced, not only in one helper.
  - type: review_cycle
    cycle: '5'
    description: Final approval states the coordinator now attaches its final runtime
      config to the result and audit generation consumes that value, evidencing that
      the durable fix was to source capture from final runtime state.
- claim: Flattening resolved configuration into dotted leaf paths is not a lossless
    encoding when map keys may contain dots or brackets, so future work on recorded-config
    formats must treat path representation as an actual data-model decision.
  evidence:
  - type: review_finding
    finding_id: 58516edc2c801b57
    description: Review identified concrete recorded keys whose original segments
      cannot be reconstructed because the keys themselves contain path syntax characters,
      showing that a flat dotted-path snapshot can destroy structure.
- claim: Recording full resolved-config snapshots inside per-run audit records can
    become a material storage and rewrite cost, especially when audits are repeatedly
    reserialized.
  evidence:
  - type: review_finding
    finding_id: e235d41bae926908
    description: Review quantified the configuration block at roughly 2250 entries
      and about 214 KB for this repository, and noted it is rewritten into per-run
      audit storage on repeated writes, demonstrating that snapshot size is a first-order
      concern.
- claim: Audit-record construction should keep expensive or failure-prone configuration
    walks behind the same degradation guards as the rest of configuration identity
    capture; otherwise provenance capture can turn a partial-data case into a hard
    failure.
  evidence:
  - type: review_finding
    finding_id: 329ef44554f9f392
    description: Review observed that the code recomputed the flattened snapshot before
      the existing guard, so traversal failures escaped instead of degrading to a
      partial result, showing that guard placement matters as much as guard existence.
- claim: Command defaults that behave like overrides at runtime need distinct provenance
    treatment from explicit CLI flags, or recorded source metadata will overstate
    operator intent.
  evidence:
  - type: review_finding
    finding_id: 5d1f9b7f95d2c1bb
    description: Review found query-mode sprint runs always recorded sprint.max_parallel
      as a cli override even when the value came from an implicit mode default, demonstrating
      that provenance logic must distinguish synthesized defaults from user-supplied
      flags.
learned_patterns:
- schema-aware-path-interpretation
- capture-final-runtime-config
- lossless-provenance-encoding
- guarded-audit-capture
