what_was_learned:
- claim: When free-prose extraction feeds a mechanical checker, future runs should
    preserve partial execution across mixed-quality candidates instead of treating
    one invalid token as grounds to abort the whole check.
  evidence:
  - type: review_cycle
    cycle: '1'
    description: Review approved the change specifically because symbol lookup now
      narrows to resolvable candidate scopes instead of aborting, showing that preserving
      successful sub-checks was the behavior that mattered for this bug class.
  - type: review_cycle
    cycle: '2'
    description: The second review cycle highlighted that the fix preserves evidence
      from resolvable scopes while recording skipped candidates separately, demonstrating
      the reusable principle that mixed valid/invalid inputs should degrade to partial
      results rather than total loss.
  - type: file
    path: src/theforge/triage_backlog_report.py
    description: This is the report logic where citation-derived symbol lookup was
      handled, so changes here are the direct evidence that the run addressed execution
      strategy for heterogeneous extracted inputs rather than only changing presentation.
- claim: Polling or retry loops that gain waiting behavior need per-platform or per-situation
    gating, because an unconditional delay in a failure path becomes user-visible
    cost even when the underlying condition can never resolve.
  evidence:
  - type: review_finding
    finding_id: cad28ba1b9e551c3
    description: Review identified that a newly introduced sleep charged a fixed delay
      on every retry even where enumeration could never succeed, showing the general
      risk of unconditional waits in retry loops.
  - type: review_cycle
    cycle: '2'
    description: The later approval notes that the prior P2 was resolved by making
      the retry delay platform-gated and documented, confirming the lesson that waits
      in retry logic should be conditional rather than universal.
  - type: file
    path: src/theforge/process_group.py
    description: This file contains the retry path discussed in review, tying the
      lesson to process-group membership polling rather than to an abstract style
      preference.
- claim: State-transition logging in poll-based flows should emit the start-of-wait
    signal on the first wait state, not only on later polls, or fast-resolving waits
    can produce completion logs with no matching record that waiting began.
  evidence:
  - type: review_finding
    finding_id: 843d07870d3636b2
    description: Review caught that delaying the 'waiting' announcement until the
      second poll allowed a resolve-on-second-poll case to log resumption without
      any prior wait-start line, exposing a general observability failure mode in
      polling flows.
  - type: review_cycle
    cycle: '2'
    description: The second approval says the prior P2 about inherited-agent waiting
      was resolved, indicating that the review loop treated first-transition visibility
      as necessary for coherent event logs.
  - type: file
    path: src/theforge/sprint/live_stories.py
    description: This file is the live polling flow where the missing initial wait
      log was reviewed, grounding the lesson in poll-driven state transitions.
