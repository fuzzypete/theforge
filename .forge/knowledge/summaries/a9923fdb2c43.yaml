what_changed:
  description: This run defined and wired the semantic readiness contract so that
    semantic evaluation results remain audit evidence until an operator ratifies them
    against a specific revision, and sprint admission consumes that ratified state
    to determine REVIEWED_READY or unevaluated outcomes. It also documented the policy
    and exposed CLI flows for evaluation, ratification, and admission reporting.
  approach: The change separated evaluator output from admission decisions by introducing
    revision-scoped semantic readiness state and storage, then threading that state
    through CLI commands, shape/admission gates, sprint manifest handling, and ready-queue
    reporting while keeping structural verdicts unchanged and recording the policy
    in ADR and reference documentation.
  files_modified: *id002
what_was_learned:
- claim: When semantic gating removes items from sprint execution, forced-run CLI
    output still needs its own reconciliation with the filtered runnable set; otherwise
    status messaging can drift from actual admission behavior.
  evidence:
  - type: review_finding
    finding_id: ac8a5532ae82e684
    description: The review found that `forge sprint --force` reported all issues
      as running even after semantic readiness skips had been removed from the runnable
      set, demonstrating that admission/filtering correctness does not automatically
      keep user-facing force-mode summaries accurate.
  - type: file
    path: src/theforge/cli/sprint.py
    description: The finding is anchored in the sprint CLI path, showing the mismatch
      arose specifically where runnable-set decisions are rendered for operators rather
      than in the underlying readiness policy itself.
learned_patterns:
- ratified-state-not-raw-output
- revision-scoped-readiness
- late-result-supersession
