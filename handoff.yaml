gate_result: PASS
dev_notes: |
  summary: >
    Implemented per-phase cost, duration, and success tracking end-to-end.
    Added four new duration-tracking fields to CoordinatorState
    (preflight_duration_s, plan_durations, plan_review_durations,
    validate_durations) and populated them at the existing timing sites in
    coordinator.py and coord_phases.py. Added _build_phases_block() to
    coord_audit.py which assembles phases + totals sub-dicts from state fields
    and embeds them into every audit log record via **-unpacking. Added
    forge telemetry CLI command to cli.py that reads history.jsonl, filters
    by --since, optionally restricts output to --phase, and prints a run
    table plus per-phase average cost/duration breakdown. Tests cover the
    phases block structure in test_generate_audit_log.py (12 new cases) and
    telemetry CLI aggregation/filters/graceful-handling in test_telemetry.py
    (18 new cases). All 1077 tests pass.

  commits:
    - sha: "70dd6f0"
      message: "feat(telemetry): per-phase cost, duration, and success tracking"

  acceptance_criteria:
    - criterion: "Audit log gains phases block with per-phase cost, duration, outcome"
      status: MET
      notes: "_build_phases_block() builds all six phase entries; embedded via ** in generate_audit_log return dict"
    - criterion: "Per-reviewer cost breakdown in review phase"
      status: MET
      notes: "phases.review.per_reviewer groups review_agent_results by profile (excluding synthesis), cross-refs last_cycle_reviewer_results for verdict"
    - criterion: "forge telemetry CLI command reads history and displays summary table"
      status: MET
      notes: "cmd_telemetry() reads .forge/audits/history.jsonl, prints run table with slug/cost/time/iterations/outcome"
    - criterion: "Phase breakdown shows average cost and duration across runs"
      status: MET
      notes: "Phase breakdown averages cost and duration from phases key across all records with phase data"
    - criterion: "--since date filter"
      status: MET
      notes: "Parses ISO date, filters records by timing.started_at"
    - criterion: "--phase filter to show single phase detail"
      status: MET
      notes: "When --phase is set, run table is suppressed and only that phase row is shown in breakdown"
    - criterion: "Handles missing/partial data gracefully (old runs without phase data)"
      status: MET
      notes: "Records without phases key are counted in run table but skipped for phase averages; prints explanatory message when no phase data exists"
    - criterion: "All existing tests pass"
      status: MET
      notes: "1077 tests pass (1035 pre-existing + 42 new)"
    - criterion: "New tests for telemetry aggregation and CLI output formatting"
      status: MET
      notes: "12 new tests in TestPhasesBlock (test_generate_audit_log.py), 18 new tests in test_telemetry.py"

  spec_deviations:
    - deviation: "forge.log cross-referencing not implemented"
      justification: >
        The spec mentions reading from both history.jsonl AND forge.log cross-referenced
        by run_id. The implementation plan (approved) concluded this was unnecessary:
        phase data is now embedded directly in the audit record, which is simpler and
        more reliable than log parsing. run_id is not a field in audit records, so
        cross-referencing would require additional work with no benefit.

  deferred_items: none
